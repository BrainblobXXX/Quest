  "98":
    title: Глава 98
    text: |-
      Вычти два пункта из своей Оркишности.

      Ты говоришь девушке "Здрасте", но не успеваешь продолжить, как она сама обращается к тебе.

      - Ты... ты похож на орка, но не действуешь так, как они. Кто ты?

      Возможно, ты заработал себе имя.

      Чтобы ответить ей, что ты орк, перейди на [А].

      Чтобы ответить ей, что ты приключенец под маскировкой, перейди на [Б].
