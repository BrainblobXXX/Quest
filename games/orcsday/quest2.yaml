scenes:
  "1":
    title: Глава 1
    text: |-
      Утро. По крайней мере, тебе так кажется. Сложно сказать точнее, находясь в подземелье. Всё, что тебе известно: ты проснулся, скатал в рулон кипу старых кож, сожрал быстрый завтрак (действительно быстрый - ты ловил его целых пятнадцать минут) и спустился сюда.

      Сюда. В комнатёнку десять-на-десять шагов, которую ты охраняешь день изо дня и где ты ждёшь героев, которые могут сюда забрести. Тут есть сундук. Возможно, в нём лежат сокровища. Где-то там, внизу, злой колдун Галрос Бессмертный, которому принадлежат эти подземелья.

      А тут ты. Сидишь весь день напролёт, стареешь, ожидая когда какой-нибудь герой придёт и убьёт тебя...

      Чтобы остаться здесь в ожидании героя, который убьёт тебя, перейди на [А]

      Чтобы пойти в комнату отдыха, перейди на [Б].

      Чтобы открыть сундук, перейди на [В].

      Чтобы убраться подальше отсюда, перейди на [Г].
    mood: tense
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "44"
          letter: А
        - label: Вариант Б
          to: "31"
          letter: Б
        - label: Вариант В
          to: "84"
          letter: В
        - label: Вариант Г
          to: "18"
          letter: Г
  "2":
    title: Глава 2
    text: |-
      - Мортимер держит здесь рабыню, - говорит самый крупный из орков и добавляет с косой ухмылкой. - И мы собираемся с ней позабавиться.

      Ты не уверен, что смог бы отговорить их от этой идеи.

      Чтобы сразиться с сородичами, перейди на [А].

      Чтобы открыть им дверь, перейди на [Б].

      Чтобы просто уйти, перейди на [В].
    mood: tense
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "68"
          letter: А
        - label: Вариант Б
          to: "3"
          letter: Б
        - label: Вариант В
          to: "47"
          letter: В
  "3":
    title: Глава 3
    text: |-
      Вычти один из твоей Оркишности за неподчинение приказам.

      Дверь комнаты, которую ты охранял, оказалась не запертой. Войдя, ты увидел комнатку не только меньше, чем та, в которой был только что, но и гораздо менее удобную. Здесь есть небольшая кровать, умывальник, подушки, ночная ваза - но всё это теряет значение по сравнению с тем, что ты увидел на кровати.

      Человеческая девушка, одетая в скудные одежды одной из рабынь Галроса, села, когда ты вошёл. Её глаза округлились от ужаса.

      Чтобы убить её, перейди на [А].

      Чтобы проделать с ней другие грязные штучки, отправляйся на [Б].

      Чтобы поговорить с ней, перейди на [В], если поблизости нет орков, или на параграф [Г], если они торчат здесь.
    mood: tense
    entry:
      - modify:
          stat: orkishness
          delta: -1
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "28"
          letter: А
        - label: Вариант Б
          to: "67"
          letter: Б
        - label: Вариант В
          to: "98"
          letter: В
        - label: Вариант Г
          to: "40"
          letter: Г
  "4":
    title: Глава 4
    text: |-
      В пылу битвы ты замечаешь, что другие орки решили присоединиться. Увидев тебя в бою, они спешно пришли к тебе на помощь, обрушившись на Мортимера и приключенцев. Битва была скоротечной и кровавой, но вскоре в живых остались только орки.

      Орки обернулись к тебе, и один из них спросил:

      - Кто ты таков, похожий на орка, но дерущийся, как демон? Скажи нам своё имя!
    mood: danger
    interaction:
      type: continue
      to: "8"
  "5":
    title: Глава 5
    text: |-
      - Жульничаешь! Ты жульничаешь! - восклицаешь ты, вставая и указывая на Мортимера.

      - Я? - озадаченно ответил Мортимер, и тут же нашёлся. - Нет, я уверен ты ошибаешься.

      - Нет! - вступается другой орк, прерывая его. - Он прав! Смотрите - у мага больше карт, чем должно быть!

      - Убью! - говорит Мортимер, затем начинает ухмыляться и встаёт. - Что ж... Похоже,это мне только и остаётся - убить вас всех!

      Другие орки: Здоровье 3.

      Вычти два из Атаки и Защиты Мортимера, потому что другие орки помогают тебе.

      Каждый ход кидай кубик, чтобы выяснить, кого атакует Мортимер. Если выпадает 1-2, он атакует других орков; если выпадает 3-6, он атакует тебя. Каждый раз когда он атакует других орков, они теряют единицу Здоровья. Если их Здоровье достигло 0, ты теряешь их помощь.
    mood: danger
    interaction:
      type: continue
      to: "91"
  "6":
    title: Глава 6
    text: |-
      Предположив, что Галрос приглядывает за главным входом, ты решаешь войти через запасной. Уже возле двери, когда ты ухмыляешься, довольный своей хитростью, появляется Галрос собственной персоной, держа свой посох наготове. После недолгого полёта ты падаешь на пол.

      В отчаянном рывке ты пытаешься подняться, но невидимая рука хватает тебя и поднимает перед Галросом.

      - Глупый орк, - произносит он, осматривая тебя с ног до головы. - Неужели ты думал, что сможешь уйти, убив одного из моих учеников?

      Он не даёт тебе времени на ответ. Покачав головой, он добавляет:

      - Так вот, ты ошибся.

      Галрос поднимает руку, и тебя поражает удар молнии.

      Ты умер безымянным орком. Тебя убил не герой, но ты определенно погиб, как орк.
    mood: grief
    ending: true
  "7":
    title: Глава 7
    text: |-
      Когда ваша битва с Мортимером уже подходиит к неизбежному концу, внезапно в комнату входит большая группа. Это люди, одетые в броню и с оружием в руках - приключенцы! Мортимер немедленно воскликнул:

      - Помогите мне! Я почти добил этого ужасного орка!

      Чтобы попробовать блефовать, перейди к параграфу [А].

      Если же собираешься продолжить сражение, перейди на параграф [Б].
    mood: danger
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "90"
          letter: А
        - label: Вариант Б
          to: "46"
          letter: Б
  "8":
    title: Глава 8
    text: |-
      Ты думал, что получить имя будет так просто? Что ж, может быть.

      - Я обычный орк, такой же, как вы, - произносишь ты. - Любой из вас может это, если действительно захочет.

      Это очень не по-орковски, поэтому вычти один из своей Оркишности.

      Орк, с которым ты разговариваешь, выглядит озадаченным, поэтому ты разъясняешь:

      - Я просто орк. Ты можешь быть таким же, как я.

      В глазах орков вокруг тебя появляется огонь, а затем они внезапно склоняют свои головы перед тобой.

      - Да! Мы хотим быть такими же как ты! Веди нас! Мы убьём волшебника, заберём все сокровища себе!

      Проверь свою Смелость и сравни с Оркишностью. Если проверка успешна, ты возглавляешь Великую Оркскую Революцию.
    mood: tense
    entry:
      - modify:
          stat: orkishness
          delta: -1
    interaction:
      type: check
      mode: stat
      stat: guts
      formula: 2d6 + guts >= orkishness
      outcomes:
        success: "26"
        failure: "75"
  "9":
    title: Глава 9
    text: |-
      - Вот! - девушка вытаскивает бутыль с зельем из своей сумки и бросает тебе. В отчаянном выпаде ты ловишь её и, выдернув пробку зубами, быстро глотаешь содержимое.

      Твоё здоровье восстановилось до 5. На этот раз, если твоё здоровье упадёт до нуля, ты умрёшь.
    mood: victory
    entry:
      - modify:
          stat: hp
          delta: 5
    interaction:
      type: continue
      to: "96"
  "10":
    title: Глава 10
    text: |-
      Сделай проверку своих Мышц со сложностью 10. Если успешно, тебе удаётся запугать орков достаточно, чтобы они ушли.

      Если проверка провалилась, с орками придётся драться.
    mood: tense
    interaction:
      type: check
      mode: stat
      stat: muscles
      formula: 2d6 + muscles >= 10
      outcomes:
        success: s10_win
        failure: "68"
  "11":
    title: Глава 11
    text: |-
      Четверым из вас вместе удалось выследить Мортимера в его лаборатории.

      - Что это значит? - спросил он, когда вы вошли, но всё стало очевидно, когда ты напал на него.

      Поскольку с тобой есть другие орки, в бою ты можешь вычесть два из Атаки и Защиты Мортимера.
    mood: danger
    interaction:
      type: continue
      to: "91"
  "12":
    title: Глава 12
    text: |-
      Мда, это явно было не по-орковски. Вычти 2 из своей Оркишности. В то время, пока ты потрошил других орков, Мортимер наблюдал за тобой со стороны. Теперь он зааплодировал и выдал:

      - Отличное шоу! Я подозревал, что эти орки жульничают, поэтому рад, что ты убил их. Знаешь... мне бы пригодился такой орк как ты. Как насчёт должности моего личного телохранителя?
    mood: tense
    entry:
      - modify:
          stat: orkishness
          delta: -2
    interaction:
      type: continue
      to: "58"
  "13":
    title: Глава 13
    text: |-
      Добавь себе единицу Оркишности за стремительный бросок вперёд.

      Вместе с полудюжиной орков позади тебя ты несёшься вглубь подземелья, пытаясь найти апартаменты Галроса, но внезапно ты понимаешь, что не знаешь, где они находятся.

      К счастью, один из орков знает правильный путь.

      - Мы почти на месте! - кричит он. Обрадовавшись, ты вместе с другими орками бросаешься в этом направлении... и попадаешь в большое помещение с единственным жителем и хозяином: зомби-троллем.

      - Ой... разве я забыл упомянуть, что у Галроса есть страж? - произносит один из вас.

      - Ха! Мы не боимся его! - кричат в ответ остальные. - Наш вождь разделается с ним!

      Зомби-тролль: Атака 10, Защита 9, Здоровье 5.

      Остальные орки не помогают тебе до тех пор, пока твоё здоровье не упадёт до 2, ожидая, что их лидер легко победит. Когда они присоединяются, вычти два из атаки и защиты тролля.

      Если нет, ты погиб и Великая Окрская Революция вместе с тобой.
    mood: danger
    entry:
      - modify:
          stat: orkishness
          delta: 1
    interaction:
      type: combat
      mode: contest
      enemies:
        - name: Зомби-тролль
          count: 1
          attack: 10
          defense: 9
          health: 5
      outcomes:
        victory: "83"
  "14":
    title: Глава 14
    text: |-
      В охраняемую тобой комнату входит человек. Ты узнаёшь в нём одного из учеников Галроса, Мортимера Нечихающего (нужно много трудиться, чтобы подняться до Бессмертного).

      - А, ты здесь, - говорит он задиристым тоном. - Идём со мной. У меня есть работка для тебя.

      Чтобы пойти за ним, перейди на [А].

      Чтобы попытаться убить его, сравни свою Удаль с параметром "Оркишность + 5". Если повезло, перейди на [Б]. В обратном случае в тебе ещё слишком много от орка, чтобы восстать против закона.
    mood: tense
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "56"
          letter: А
        - label: Вариант Б
          to: "38"
          letter: Б
  "15":
    title: Глава 15
    text: |-
      Они с радостью дают тебе сесть и присоединиться к игре. Один из орков подвинул к тебе кружку с элем, которую ты радостно опустошаешь - работа охранником изматывает жаждой!

      Ставка - один серебрянный. Ты можешь поставить до пяти серебрянных. Проверь свою Удачу и реши, сколько ставишь.
    mood: calm
    interaction:
      type: continue
      to: "97"
  "16":
    title: Глава 16
    text: |-
      Сделай проверку Мозгов со сложностью 10.

      Если успешно, ты смог убедить орков идти вместе с тобой биться с Мортимером.

      В обратном случае орки нападают на тебя.
    mood: tense
    interaction:
      type: check
      mode: stat
      stat: brains
      formula: 2d6 + brains >= 10
      outcomes:
        success: "11"
        failure: "68"
  "17":
    title: Глава 17
    text: |-
      Орки бросают тебя на пол, а затем переключают внимание на девушку, довольно усмехаясь. Она вжимается в угол, смотря то на тебя, то на них.

      Внезапно она бросается к своей кровати, вытаскивает что-то из-под матраса и бросает тебе.

      Бутыль, содержащая зеленоватую жидкость, летит к тебе. Из последних сил ты хватаешь её, зубами выдергиваешь пробку и выпиваешь. Ты ощущаешь действие целительного зелья и чувствуешь себя здоровым. Твоё здоровье восстановилось до 5. У тебя снова есть шанс. Целительное зелье израсходовано, поэтому если проиграешь, ты умрёшь и не сможешь получить ещё одно зелье от девушки.
    mood: victory
    entry:
      - modify:
          stat: hp
          delta: 5
    interaction:
      type: continue
      to: "40"
  "18":
    title: Глава 18
    text: |-
      Сколько времени минуло с тех пор, как твои братья орки стали работать здесь? - размышлял ты, пока шёл по коридорам. Годы, и осознание этого злит тебя. Тухнуть здесь годами, охраняя сокровища какого-то тупого волшебника. Ведь ты даже никогда не встречал этого Галроса. Может быть, стоит поделиться с ним кусочком своего сознания?

      Пусть узнает, каково это - быть простым орком-работягой. А может...

      Вычти единицу из своей Оркишности.

      Чтобы пойти в комнату отдыха и обдумать всё это, перейди на [А].

      Чтобы продолжить идти вперёд, перейди на [Б].

      Если сдаёшься и решаешь вернуться к своим обязанностям, перейди на [В].
    mood: tense
    entry:
      - modify:
          stat: orkishness
          delta: -1
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "31"
          letter: А
        - label: Вариант Б
          to: "80"
          letter: Б
        - label: Вариант В
          to: "44"
          letter: В
  "19":
    title: Глава 19
    text: |-
      Шутишь, что ли? Четыре приключенца и девушка ополчились против тебя.

      Ты орк, а вовсе не Тёмный Повелитель!

      Сделай проверку Мозги против Оркишности +5. Если бросок успешный, твой разум победит орочью натуру, и вы попытаетесь договориться.

      Если же провалил, что ж...

      Четверо приключенцев? От тебя не осталось ничего, кроме мокрого пятна на полу, формой напоминающего орка.
    mood: danger
    interaction:
      type: check
      mode: stat
      stat: brains
      formula: 2d6 + brains >= orkishness + 5
      outcomes:
        success: "54"
        failure: result
  "20":
    title: Глава 20
    text: |-
      Бродя по коридорам, ты завернул за угол и... видимо, это не твой счастливый день! Опять же, когда у орков бывают счастливые дни? Ты только что столкнулся с учеником Галроса - Мортимером и бандой орков, которая идёт за ним.

      - Что ты делаешь, орк? Ты должен стоять на страже, наглый выскочка!

      Он поднимает руку, и вдруг она загорается, а его глаза начинают светиться.
    mood: danger
    interaction:
      type: continue
      to: "91"
  "21":
    title: Глава 21
    text: |-
      Ты берешь девушку на руки, и волна совсем-не-оркских эмоций накатывает на тебя.

      Это... это человеческое существо дралось на твоей стороне. Возможно, девушка тебе поверила.

      Возможно... Затем она обращается к тебе.

      - У меня... есть целительное зелье.

      Ты кидаешься за ним, но девушка хватает тебя за руку.

      - Нет! Не трать его на меня! Убей Галроса! Умоляю! Меня... меня зовут Бетани.

      Помни меня."

      Можешь ли ты сказать ей своё имя?

      Чтобы использовать зелье для спасения Бетани, перейди на [А].

      Если же позволишь Бетани умереть, перейди на [Б].
    mood: grief
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "92"
          letter: А
        - label: Вариант Б
          to: "64"
          letter: Б
  "22":
    title: Глава 22
    text: |-
      Ты ведёшь орков обратно в свою старую комнату, которую охранял. Там, приложив совместные усилия, вы легко открыли сундук. Внутри ты находишь три предмета:

      - меч с инкрустированной алмазами рукоятью и слабо светящимся лезвием (рейтинг оружия +2)

      - пузырек, наполненный зеленоватым целебным зельем (можно выпить один раз и восстановить три единицы Здоровья)

      - рюкзак, наполненный пятью сотнями золотых слитков.

      Ты понимаешь, что время истекает и надо двигаться вперёд, пока ещё возможно застать Галроса врасплох.
    mood: victory
    entry:
      - grant:
          item: diamond_sword
          count: 1
        once: true
      - grant:
          item: healing_potion
          count: 1
        once: true
      - grant:
          item: gold_bars
          count: 1
        once: true
    interaction:
      type: continue
      to: "86"
  "23":
    title: Глава 23
    text: |-
      Добавь единицу к своей Оркишности за подчинение приказам.

      Ты стоял, наверное, полчаса, ожидая, пока что-нибудь произойдет.

      Дверь отворяется, и ты уже готов выдохнуть с облегчением, решив, что это вернулся Мортимер. Но затем ты видишь зеленый цвет кожи рук и чёрные ногти. Три орка вошли в комнату, благоухая алкогольным перегаром - они пьяны. Они остановились и уставились на тебя, очевидно удивившись увидев тебя здесь.

      Глаза лидера орков расширились.

      - Впусти нас туда, - сказал он, указывая на дверь, которую ты должен охранять.

      Чтобы поговорить с ними, перейди на [А].

      Чтобы атаковать их, перейди на [Б].

      Чтобы открыть им дверь, перейди на [В].
    mood: danger
    entry:
      - modify:
          stat: orkishness
          delta: 1
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "36"
          letter: А
        - label: Вариант Б
          to: "68"
          letter: Б
        - label: Вариант В
          to: "77"
          letter: В
  "24":
    title: Глава 24
    text: |-
      Ты продолжаешь играть, но теперь, когда у тебя появились подозрения, ты наблюдаешь за другими игроками очень пристально. Это требует не-орковского напряжения мозга, поэтому вычти единицу своей Оркишности. Сделай ставку от одного до пяти серебрянников, затем проверку Мозгов сложностью 9, а также Удачи.

      Если твоя Удача 15 или выше, ты возвращаешь свою ставку плюс ещё столько же.

      Если при проверке Удачи выпало от 10 до 15, ты возвращаешь свою ставку.

      Если же Удача была меньше 10, ты теряешь свою ставку.
    mood: calm
    entry:
      - modify:
          stat: orkishness
          delta: -1
    interaction:
      type: gamble
      stat: luck
      stake:
        min: 1
        max: 5
      win: 15
      push: 10
    after:
      type: check
      mode: stat
      stat: brains
      formula: 2d6 + brains >= 9
      outcomes:
        success: "94"
        failure: "41"
  "25":
    title: Глава 25
    text: Прибавь единицу к своей Оркишности. Когда она поняла, с какими силами связалась, глаза девушки округлились. Пока остальные орки входили в комнату, она бросилась к своей кровати, достала оттуда снадобье и выпила его. Она исчезла, а твоё горло сдавило от ужаса. Она невидима? Или телепортировалась? Может, она уже сейчас предупреждает Галроса о твоих планах? Ты спешно раздаёшь приказы оркам, но они не могут найти твоего следа. С дурными предчувствиями на сердце ты отправляешься сразиться с телохранителем Галроса.
    mood: mystery
    entry:
      - modify:
          stat: orkishness
          delta: 1
    interaction:
      type: continue
      to: "74"
  "26":
    title: Глава 26
    text: |-
      - Да! - провозглашаешь ты. - Я поведу вас!

      Вытянув клинок из ножен, ты поднимаешь его вверх.

      - К оружию, мои орки! К оружию!

      Вычти единицу из своей Оркишности. Монологи это не по орковской части.

      - Да, ты наш повелитль! Да! - орки поднимают свои мечи над собой и кричат. Спустя пару мгновений шум стихает, и голос проносится над группой. - Эммм... что значит "к оружию"?

      Выдохнув, ты объясняешь свои слова по-оркски.

      - Мы будем драться! Вот что это значит!

      Снова раздались приветствия, но твои надежды на Великую Оркскую Революцию немного ослабли. Ну ладно, довольно сильно.

      Если решаешь вести своих орков к Галросу, перейди на [А].

      Если хочешь взять небольшую передышку чтобы всё спланировать, сделай проверку Мозгов со сложностью Оркишность + 5. Если успешно, перейди на [Б].
    mood: victory
    entry:
      - modify:
          stat: orkishness
          delta: -1
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "13"
          letter: А
        - label: Вариант Б
          to: "77"
          letter: Б
  "27":
    title: Глава 27
    text: |-
      С помощью приключенцев ты смог быстро одолеть Мортимера. Ты радуешься, и они приступают к грабежу тела Мортимера, потому что так всегда поступают искатели приключений.

      Чтобы присоединиться к приключенцам, перейди на [А].

      Чтобы оставить их, перейди на [Б].
    mood: calm
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "30"
          letter: А
        - label: Вариант Б
          to: "59"
          letter: Б
  "28":
    title: Глава 28
    text: |-
      Добавь одну единицу к своей Оркишности. (Да, даже если ты только что добавил её себе в предыдущем параграфе). Как только ты двинулся в сторону рабыни, она бросилась в твои объятия:

      - Вы должны помочь мне! Вы - моя единственная надежда! Пожалуйста, пожалуйста, умоляю... пощадите меня!

      Чтобы продолжить то, что хотел сделать, перейди на [А].

      А если передумал и захотел поговорить с ней, тебе на [Б].
    mood: tense
    entry:
      - modify:
          stat: orkishness
          delta: 1
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "78"
          letter: А
        - label: Вариант Б
          to: "98"
          letter: Б
  "29":
    title: Глава 29
    text: |-
      Падая замертво от ран, ты видишь, как Мортимер встаёт из-за стола.

      - Вы знаете, он был прав - кое-кто действительно жульничал. Я. - ухмыляясь, он пускает молнию в одного из орков. - Что ж, по-видимому, мне придётся прибраться в этом гадюшнике. Как жаль. Галрос предпочитает живых слуг мёртвым.

      Ты умер безымянным орком. Может, в следующий раз тебе повезёт больше.
    mood: grief
    interaction:
      type: continue
      to: result
  "30":
    title: Глава 30
    text: |-
      Приключенцы с радостью принимают тебя в свою группу и интересуются, как тебя зовут. У тебя есть имя?

      Если есть, перейди на [А]. Иначе тебе необходимо перебороть свою Оркишнсть. Перейди на [Б].
    mood: tense
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "66"
          letter: А
        - label: Вариант Б
          to: s30_check
          letter: Б
  "31":
    title: Глава 31
    text: |-
      Ты заваливаешься в комнату отдыха. Обычно тут играют в карты компания орков, но сегодня это не так: здесь один из учеников Галроса, Мортимер Нечихающий (стать Бессмертным не так-то просто).

      Чтобы напасть на орков, перейди на [А].

      Чтобы сесть и сыграть в карты, перейди на [Б].

      Чтобы напасть на Мортимера, перейди на [В].
    mood: calm
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "73"
          letter: А
        - label: Вариант Б
          to: "15"
          letter: Б
        - label: Вариант В
          to: "91"
          letter: В
  "32":
    title: Глава 32
    text: |-
      Сузив глаза, девушка говорит:

      - Конечно. Я сдамся, а твои орки просто изнасилуют меня и убьют. Нет уж, спасибо.

      Она отступает к своей кровати и пытается что-то достать.

      Чтобы атаковать её, перейди на [А].

      Чтобы попытаться поговорить с ней, проверь свои Мозги и сравни с параметром "Оркишность + 3". Если успешно, перейди на [Б].
    mood: tense
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "25"
          letter: А
        - label: Вариант Б
          to: "51"
          letter: Б
  "33":
    title: Глава 33
    text: |-
      Ты получаешь собственное имя! Выбери имя для своего орка. Запиши его в поле для имени на листе персонажа. Гордись!

      Теперь ты свободен от любых изменений статуса своей Оркишности. И ты больше не обязан делать проверки на Оркишность: если в параграфе потребуется проверка, ты волен выбрать любой путь по своему желанию. Также ты можешь распределить 2 очка по любым из способностей:

      Мышцы / Мозги / Удаль / Удача.

      Кроме того, твое Здоровье восстанавливается до 5. Ты всем повторяешь своё новое имя, а затем возвращаешься к параграфу, с которого перешёл сюда.
    mood: victory
    entry:
      - modify:
          stat: hp
          delta: 5
    ending: true
  "34":
    title: Глава 34
    text: |-
      - Ха! - рявкаешь ты в лицо Мортимера, а затем плюёшь в него. - Магово отродье! Думаешь, я буду служить тебе? У меня есть своя гордость. Я...

      - Ты? ТЫ? - не дав договорить, прерывает тебя Мортимер. - Несчастный кусок оркской слизи думает, что может грубить мне?! Да я поджарю тебя на этом самом месте!

      Сделай проверку своей Удачи со сложностью 9.
    mood: danger
    interaction:
      type: check
      mode: stat
      stat: luck
      formula: 2d6 + luck >= 9
      outcomes:
        success: "5"
        failure: "99"
  "35":
    title: Глава 35
    text: "- Я мог бы убить тебя прямо сейчас, - произносит Мортимер, - но мне не хочется. Ты удивил меня, орк. Поэтому я предлагаю тебе работу - в качестве моего нового телохранителя."
    mood: tense
    interaction:
      type: continue
      to: "58"
  "36":
    title: Глава 36
    text: |-
      Что ты им скажешь?

      - Что вам там нужно? - перейди на [А].

      - Пошли вон, пока я не разозлился! - перейди на [Б].

      - Мы можем сделать кое-что получше - мы можем убить Мортимера! - перейди на [В].
    mood: calm
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "2"
          letter: А
        - label: Вариант Б
          to: "10"
          letter: Б
        - label: Вариант В
          to: "16"
          letter: В
  "37":
    title: Глава 37
    text: |-
      - Я... Я не могу.

      Твои плечи опускаются, ты чувствуешь себя побеждённым.

      - Ох, - разочарование в её взгляде разбивает твоё сердце, хоть ты и не ожидал от себя таких чувств. - Ну... тогда тебе лучше уйти отсюда. Мне бы не хотелось, чтобы у тебя были неприятности.

      Чтобы предпринять последнюю попытку противостоять своей природе.
    mood: grief
    interaction:
      type: check
      mode: stat
      stat: guts
      formula: 2d6 + guts >= orkishness + 5
      outcomes:
        success: "95"
        failure: "69"
  "38":
    title: Глава 38
    text: |-
      Дерись с Мортимером. Если ты раньше уже сражался с ним, используй оставшееся у него значение Здоровья, а не 5. Мортимер Нечихающий: Атака 9, Защита 9, Здоровье 5.

      Когда здоровье одного из вас упадёт до единицы (а это может произойти сразу же, если вы уже сражались раньше!).
    mood: danger
    interaction:
      type: combat
      mode: contest
      enemies:
        - name: Мортимер Нечихающий
          count: 1
          attack: 9
          defense: 9
          health: 5
      options:
        stop_at_one: true
      outcomes:
        victory: "7"
  "39":
    title: Глава 39
    text: Издавая древнеорочий клич "Прочотседа!", ты несёшься словно ветер. Ну ладно, как орк в броне. Проверь свою Удачу со сложностью 10.
    mood: danger
    interaction:
      type: check
      mode: stat
      stat: luck
      formula: 2d6 + luck >= 10
      outcomes:
        success: "80"
        failure: "45"
  "40":
    title: Глава 40
    text: |-
      - Ты чего творишь? - подозрительно спрашивает тебя главный орк, затем хватает тебя за плечо и разворачивает. - Мы здесь не для переговоров. Мы здесь для того, чтобы отбирать!

      С этими словами от толкает тебя к стене и поднимает свой кулак, чтобы ударить тебя, а другие орки радостно хихикают.

      Но прежде, чем он успевает ударить тебя, девчонка хватает свой ночной горшок и разбивает его о голову одного из орков. У тебя есть союзник!

      Орки: Атака 9, Защита 9, Здоровье 6.

      Девушка: Здоровье 3.

      Девушка дерётся на твоей стороне. Её помощь влияет на результаты орков. На каждом ходу ты можешь выбрать, кого атакуют орки: тебя или её. Если здоровье девушки опустится до 0, она погибла и больше не может помогать. Тогда увеличь параметры Атаки и Защиты орков на два очка каждый.
    mood: danger
    interaction:
      type: combat
      mode: contest
      enemies:
        - name: Орки
          count: 1
          attack: 9
          defense: 9
          health: 6
      outcomes:
        victory: "85"
        defeat: "17"
  "41":
    title: Глава 41
    text: |-
      До тебя доходит, что остальные орки сговорились и мухлюют против тебя и Мортимера. Ты подымаешься и бьёшь кулаком по столу.

      - Жулики! Верните мои деньги! - говоришь ты, указывая на орков.

      - Лжец! - крикнул один из орков. - Это ты мухлевал!

      Обнажив мечи, они начали приближаться к тебе.

      Другие орки: Атака 8, Защита 5, Здоровье 5.

      Дерись с орками.
    mood: danger
    interaction:
      type: combat
      mode: contest
      enemies:
        - name: Другие орки
          count: 1
          attack: 8
          defense: 5
          health: 5
      outcomes:
        victory: "12"
        defeat: "29"
  "42":
    title: Глава 42
    text: |-
      Вы с Бетани пробираетесь через подземелье осторожно, чтобы не привлекать внимание. Уже почти у выхода вы наталкиваетесь на патруль, практически буквально.

      - Эй! Ты что это делаешь? - говорит орк, упавший на спину из-за того, что пытался не врезаться в тебя.

      Чтобы драться с ним, перейди на [А].

      Чтобы постараться перехитрить его, проверь свою Оркишность и сравни с показателем "8". В случае неудачи перейди на [Б]. Если преуспеешь, значит, в тебе слишком много от орка - и ты атакуешь его.
    mood: tense
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "53"
          letter: А
        - label: Вариант Б
          to: "62"
          letter: Б
  "43":
    title: Глава 43
    text: |-
      Благодаря помощи орков тебе удаётся обыскать апартаменты Мортимера довольно быстро. Обыск внешней палаты и спальни позволил найти два очень полезных предмета:

      - Волшебную палочку. Ты можешь использовать её три раза, атакуя врагов, используя параметр "Мозги + 3" вместо Мышц.

      - Голубоватую бутылочку с целительным зельем. Ты можешь использовать её в любой момент, чтобы восстановить себе 3 единицы Здоровья, но не превышая лимит в 5 единиц. Использовать зелье можно лишь один раз.

      Продолжая обыск, ты открыл дверь ещё одной комнаты в покоях Мортимера и... обнаружил сюрприз. Человеческую девушку, носящую "одежду" рабынь Галроса. Увидев тебя и толпу орков позади, она сначала теряется от неожиданности, а затем бросается к кровати и достаёт из-под матраса нож.

      - Ты никогда не получишь меня, орк! - кричит она, держа кинжал наготове.

      Чтобы напасть на неё, перейди к параграфу [А].

      Чтобы предложить ей сдаться, перейди на [Б].

      Чтобы сказать ей, что не причинишь ей вреда, сделай проверку Оркишность со сложностью 10. Если проверка провалена, перейди на [В]. Если успешна, тебе придётся выбрать один из предыдущих вариантов.
    mood: mystery
    entry:
      - grant:
          item: magic_wand
          count: 1
        once: true
      - grant:
          item: blue_potion
          count: 1
        once: true
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "25"
          letter: А
        - label: Вариант Б
          to: "32"
          letter: Б
        - label: Вариант В
