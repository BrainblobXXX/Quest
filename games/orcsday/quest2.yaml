  "99":
    title: Глава 99
    text: |-
      Но когда в руке Мортимера начала разгораться молния, чтобы убить тебя, остальные орки набросились на него. Молния все-таки поразила тебя, но ты имел удовольствие лицезреть, как орки повалили Мортимера.

      Твои раны слишком тяжелы, чтобы орки могли их вылечить, но товарищи собрались вокруг тебя.

      - Скажи нам свое имя. Мы сплотимся и убьем Галроса - но нам нужно твое имя, которое станет нашим боевым кличем. Скажи нам его, герой!

      Выбери имя и запиши на своем листке. И хотя ты до этого уже не доживешь, но вдохновленные тобой орки продолжили освободительную борьбу с Галросом. Знай же, что отныне и впредь ты навсегда поселился в Валгалле орков, герой.
    mood: grief
    ending: true
  "100":
    title: Глава 100
    text: |-
      Пока окружающие тебя орки ликуют, чувствуешь, как нечто поднимается внутри тебя. Оркам нужен вожак... а сейчас этот вожак ты. Но хочешь ли ты им быть? Хочешь ли ты стать новым Темным Властелином для орды орков? Остались ли у тебя еще очки Оркишности? Если нет, ты можешь сделать собственный выбор.

      Но что бы ты ни выбрал, а эта история подошла к концу.
    mood: victory
    interaction:
      type: continue
      to: result
  intro:
    title: Введение и правила
    text: |-
      Введение

      В этой книге ты сыграешь роль орка - пятого колеса в колеснице фэнтези. Ты не достоин даже имени, и судьба твоя - умереть от руки героя.

      А может и нет. Тебе решать. Но помни... Ты НЕ герой.

      Игровая система

      В этой книге используется Система С Еще Не Придуманным Названием (TM) - полная, гибкая и легкая для понимания игровая система, которую мы сочинили, пока набирали этот текст. (И это редакторское "мы", если кому-то интересно, откуда оно взялось, если автор указан всего один).

      Персонажи в Системе С Еще Не Придуманным Названием описываются четырьмя способностями:

      Мышцы

      Мозги

      Удаль

      Удача

      Иногда в книге тебя попросят выполнить проверку, основанную на одной из этих способностей. Для этого брось два шестигранника, сложи выпавшие числа и прибавь значение способности. Чтобы проверка удалась, тебе необходимо получить в сумме число равное или превышающее указанную сложность.

      В противном случае, проверка провалилась.

      Снаряжение

      Ты начинаешь с несколькими предметами, которые могут пригодиться тебе в приключении, и можешь добыть еще несколько по ходу книги. Некоторые выборы ты сможешь делать только в том случае, если у тебя есть определенные предметы. Если же предметов у тебя нет, то выбрать эти действия ты не сможешь. Так говорит Книгровая Полиция. Ты можешь нести оружие, надеть один комплект доспехов и нести до пяти других (не относящихся к доспехам) предметов. Если ты получишь больше предметов, что-то придется бросить.

      У некоторых предметов могут быть характеристики оружия или брони. Они вам понадобятся в...

      Битвы

      (Неожиданно, правда?) Иногда тебе придётся сражаться. Ну ладно, скорее всего, часто, ведь ты же орк. Тогда тебе будут даны три характеристики противника, с которым ты дерешься:

      Атака

      Защита

      Здоровье

      Битва проходит по раундам. В каждом раунде первым нападает твой противник, потом ты атакуешь его. (Да, твой противник начинает, всегда. Ведь ты орк. Естественно, ты всегда достаешь короткую соломинку.)

      Когда противник атакует, проверь свои Мозги или Удачу (смотря что выше), добавь рейтинг своей брони и сравни с показателем Атаки противника. Если проверка провалилась, ты теряешь одно очко Здоровья.

      Когда нападаешь ты, проверь силу своих Мышц, добавь рейтинг оружия, которое ты используешь, и сравни с Защитой противника. В случае успеха противник теряет одно очко Здоровья.

      Иногда в битве тебе будут доступны и другие варианты. Не пренебрегай ими.

      Если твое Здоровье упадет до нуля раньше, чем у твоего противника, ты проиграл. Если первым обнулится Здоровье противника, ты выиграл. В любом случае, следуй инструкциям.

      Оркишность

      Каждая книга по Системе С Ещё Не Придуманным Названием (ТМ) дополнена дешёвой уловкой... э-э-э... уникальным расширением базовой игровой системы. В этой книге - это Оркишность.

      Иногда в тексте тебя попросят добавить или отнять очки своей Оркишности. В других случаях тебе, возможно, придётся сравнить уровень своей Оркишности с какими-либо параметрами, чтобы определить, можешь ли ты предпринять определённые действия.

      Создание персонажа

      Для начала тебе нужен орк. Возьми лист бумаги и напиши на нём следующее:

      Имя:

      Оставь это поле пустым. Ты безымянный орк.

      Раса: Орк

      А ты думал будет что-то другое? Да, ты - орк.

      Мышцы / Мозги / Cмелость / Удача:
    mood: calm
    interaction:
      type: continue
      to: create
  create:
    title: Создание персонажа
    text: |-
      У тебя есть десять очков на все способности. Распредели их, как тебе угодно. Главное, чтобы общее количество не превышало десяти.

      Добавить очко к Мышцам [А].

      Добавить очко к Мозгам [Б].

      Добавить очко к Удали [В].

      Добавить очко к Удаче [Г].

      Закончить распределение [Д].
