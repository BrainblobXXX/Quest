            stat:
              id: creation_points
              op: "<="
              value: 0
  create_done:
    title: Начало игры
    text: |-
      Здоровье:

      Уровень твоего Здоровья - 5. Везунчик.

      Снаряжение

      Меч (Сила оружия 0)

      Кольчужная броня и шлем (Сила оружия 0)

      Куриная ножка (без остального цыплёнка)

      Деньги

      Ты начинаешь игру с 20 серебряными монетами

      Оркишность:

      Начальный уровень твоей Оркишности - 6. Меняй его следующим образом:

      Если в любой способности у тебя отрицательное число, отними 1. Орки ничего не знают об отрицательных числах.

      Если твои Мозги круче твоих Мышц, отними 1. Оркам не положено быть умными.

      Если твоя Удача выше 0: -1. Если бы тебе хоть капельку везло, ты не был бы орком.

      Если сильнейшая твоя способность - Мышцы, прибавь 1. Вот это уже орк!

      Если уровень твоей Удали выше уровня твоих Мозгов, прибавь 1. Слишком тупой для побега... это орк, всё верно!

      Если ваша Отвага выше 2: -1. Орки не отличаются большой храбростью.

      Начало игры

      Отлично, теперь ты - орк. Пора приступить к игре!
