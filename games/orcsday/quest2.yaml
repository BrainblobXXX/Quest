        - label: Вариант Б
          to: "57"
          letter: Б
  "93":
    title: Глава 93
    text: |-
      Собрав свою волю в кулак, ты организуешь орков вокруг себя.

      - Мы убьём Галроса. Больше нам не бояться его - мы свободны, если убьём его!

      Внезапно неествественный свет заливает комнату.

      - Орки! - слышишь ты голос, наполненный яростным рёвом. - Думаете, что можете бросить вызов мне?! За это я заберу ваши жизни!

      Галрос атакует, с его рук срываются сверкающие молнии.

      Галрос Бессмертный: Атака 10, Защита 11, Здоровье 8.

      Каждый раз, когда Галрос атакует, кинь кубик чтобы понять, он атакует тебя или другого орка: 1-3 - другой орк, 4-6 - ты. Все остальные орки в сумме имеют 5 единиц Здоровья. Если Галрос снизит его до нуля, он больше не атакует их. Если у тебя есть целительное зелье, ты по своему решению волен отдать его другим оркам.
    mood: danger
    interaction:
      type: combat
      mode: contest
      enemies:
        - name: Галрос Бессмертный
          count: 1
          attack: 10
          defense: 11
          health: 8
      outcomes:
        victory: "100"
        defeat: result
  "94":
    title: Глава 94
    text: |-
      Игра была в самом разгаре, но вдруг ты заметил неуловимый жест левой руки Мортимера - и вот, в его руках на одну карту больше, чем было!

      Чтобы обвинить Мортимера в мошенничестве, перейди на [А].

      Если желаешь покинуть игру и попытаться забыть о произошедшем, тебе на [Б].
    mood: mystery
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "5"
          letter: А
        - label: Вариант Б
          to: "61"
          letter: Б
  "95":
    title: Глава 95
    text: |-
      - Отсюда есть два пути, - говорит девушка. - Длинный путь, более безопасный... Или короткий и быстрый.

      - Почему короткий путь не так безопасен?

      - Он проходит по туннелю через покои Галроса... и надо проскочить мимо зомби-тролля, который их охраняет, - отвечает она.

      Чтобы выбрать короткий путь отсюда, мимо зомби-тролля, перейди на [А].

      Чтобы выбрать длинный путь, перейди на [Б].
    mood: calm
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "57"
          letter: А
        - label: Вариант Б
          to: "42"
          letter: Б
  "96":
    title: Глава 96
    text: |-
      - Да нет же, он орк, - говорит один из приключенцев, сузив глаза. - Я всегда их узнаю. А что до неё - если она пытается защитить его, она, должно быть, воплощение зла. Убить обоих!

      Приключенцы: Атака 10, Защита 8, Здоровье 5.

      Девушка: Здоровье 3.

      Девушка помогает тебе в этой битве. Её помощь засчитывается. На каждом этапе битвы ты можешь выбрать, атакуют ли приключенцы тебя или девушку. Если Здоровье девушки упадет до нуля, она умирает и больше не может помогать. Если это происходит, добавьте по 2 очка к Атаке и Защите приключенцев.
    mood: danger
    interaction:
      type: combat
      mode: contest
      enemies:
