          count: 1
          attack: 10
          defense: 8
          health: 5
      outcomes:
        victory: "85"
        defeat: "9"
  "97":
    title: Глава 97
    text: |-
      Если в итоге у тебя 15 или выше, у тебя получилось! Забери свою ставку плюс ещё столько же.

      Если в итоге у тебя от 12 до 15, у тебя нечет. Забери свою ставку.

      Если же у тебя меньше 12, ты проиграл. Ты потерял поставленные деньги.

      Теперь ты можешь:

      Уйти отсюда и вернуться в комнату, которую должен охранять. Перейди на [А].

      Решить, что орки мухлюют, и начать драку. Перейди на [Б].

      Решить, что Мортимер мухлюет, и наброситься на него. Перейди на [В].

      Продолжить играть. Перейди на [Г].
