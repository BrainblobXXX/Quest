      formula: 2d6 + luck >= 9
      outcomes:
        success: "14"
        failure: "88"
  "45":
    title: Глава 45
    text: |-
      Приключенцы догоняют тебя. Вскоре ты уже мертв. И ограблен, потому что именно так поступают приключенцы с теми, кого убивают. Например, с орками.

      Твоя история подошла к концу. Липкая история.
    mood: grief
    interaction:
      type: continue
      to: result
  "46":
    title: Глава 46
    text: Ты усиливаешь натиск, надеясь, что хотя бы сможешь убить Мортимера раньше, чем умрёшь сам. Сделай проверку Удачи со сложностью 10.
    mood: danger
    interaction:
      type: check
      mode: stat
      stat: luck
      formula: 2d6 + luck >= 10
      outcomes:
        success: "4"
        failure: "60"
  "47":
    title: Глава 47
    text: |-
      Ты покидаешь апартаменты Мортимера в гневе на него и на себя. Как тебя угораздило так влипнуть? Всё это дурно пахнет даже для тебя - а ты орк! Ничто не может дурно пахнуть для орка! Это неправильно!

      Пока ты блуждаешь, погружённый в свои тяжкие мысли, проверь Удачу со сложностью 10.
    mood: tense
    interaction:
      type: check
      mode: stat
      stat: luck
      formula: 2d6 + luck >= 10
      outcomes:
        success: "80"
        failure: "20"
  "48":
    title: Глава 48
    text: |-
      Скажешь правду? Ну, это совсем не по-орковски. Вычти два очка из своей Оркишности.

      - Я... Я - орк. Но, возможно, ты права. Похоже, я больше не чувствую себя орком.

      - Ты поможешь мне сбежать? - спрашивает она.

      Сделай проверку Смелости для сложности Оркишность + 6.
    mood: tense
    entry:
      - modify:
          stat: orkishness
          delta: -2
    interaction:
      type: check
      mode: stat
      stat: guts
      formula: 2d6 + guts >= orkishness + 6
      outcomes:
        success: "95"
        failure: "37"
  "49":
    title: Глава 49
    text: |-
      Туннель круто изгибается вверх. К счастью, вскоре появляются ступеньки, благодаря которым карабкаться становится легче. Кажется, уже больше получаса ты поднимаешься по туннелю, на каждом шагу ожидая атаки Галроса, но в итоге ты всё-таки видишь впереди свет.

      Когда ты вышел из туннеля, то обнаружил на небе полную луну. Спасибо Богам за это, ведь яркое палящее солнце так жестоко к оркским глазам. Остальные орки сначала озираются по сторонам, а потом начинают радоваться.

      - Мы свободны! Теперь мы свободны! Больше не служить Галросу!

      Поздравляем, ты успешно сбежал!
    mood: victory
    interaction:
      type: continue
      to: "100"
  "50":
    title: Глава 50
    text: |-
      На пути отсюда ты встречаешь немало других орков, но никто из них не останавливает тебя. Да и с чего бы? Ты такой же орк, как и они. Ты совсем не примечателен, даже для простого орка.

      Спустя около часа твоего путешествия по подземелью Галроса, ты, наконец, выходишь из него. Снаружи день, и яркий солнечный свет ослепляет твои глаза, но это тебя совсем не беспокоит. Ты отправляешься в большой мир и теперь волен выбирать свой путь как свободный орк.

      Здесь твоя история оканчивается.
    mood: victory
    interaction:
      type: continue
      to: result
  "51":
    title: Глава 51
    text: |-
      Вычти единицу из своей Оркишности.

      - Ты правда не тронешь меня? - она удивлённо моргает, затем кивает и заглядывает в твои глаза. - Я... Я вижу это. Ты не такой как другие орки, да?

      - Его не такой, как мы! Его лидер! Его умный! Его смелый!

      Похоже, что один из орков метит в твои личные помощники по контактам с общественностью. Ты затыкаешь его и обращаешься к девушке.

      - Я ничего не знаю об этом. Но моё обещание твёрдое. Я говорю, тебе не причинят вреда. Ни один орк не будет перечить мне.

      - Эмм... - озадачился один из орков. - Что значит "перечить"?

      Ткнув его, ты произносишь:

      - Я сказал, её не трогать! Вы не трогать её! Понятно?

      Орки немного стушевались и опустили глаза.

      - Да, босс.

      - Отлично! - повернувшись к девушке, ты продолжаешь. - Мы идём убить Галроса, сделать нас свободными орками. Ты поможешь нам?

      В её глазах загорается огонёк, когда она слышит твои слова.

      - Конечно, я помогу вам! Я планировала побег отсюда неделями! У меня кое-что есть... несколько вещей, которые удалось сберечь...

      Из-под матраса девушка достаёт:

      - Какую-то мерзко выглядящую черную микстуру - зелье повелевания зомби!

      - Магический клинок (рейтинг оружия +1).
    mood: tense
    entry:
      - grant:
          item: zombie_potion
          count: 1
        once: true
      - grant:
          item: magic_blade
          count: 1
        once: true
    interaction:
      type: continue
      to: "86"
  "52":
    title: Глава 52
    text: |-
      - Замётано, - произносит Мортимер в ответ на твоё согласие. - А теперь у меня для тебя есть задание.

      Иди за мной.
    mood: calm
    interaction:
      type: continue
      to: "56"
  "53":
    title: Глава 53
    text: |-
      Ты достаешь свой меч и нападаешь на него, уверенный в том, что легко сможешь одолеть одного единственного орка.

      Единственный Орк: Атака 7, Защита 6, Здоровье 3.

      Если он победит тебя, ты мертвец.
    mood: danger
    interaction:
      type: combat
      mode: contest
      enemies:
        - name: Единственный Орк
          count: 1
          attack: 7
          defense: 6
          health: 3
      outcomes:
        victory: "89"
  "54":
    title: Глава 54
    text: |-
      - Я такой же приключенец, как и вы! - заявляешь ты. - Это... Галрос сделал меня похожим на орка! И, увы... я теперь и говорю, как орк!

      Ты сглатываешь, увидев сомнение в их глазах, и готовишься схватиться за меч. Или, возможно, бежать.

      Но тут девушка неожиданно приходит к тебе на помощь:

      - Это правда. Мы вместе пытаемся сбежать. Вы можете нам помочь выбраться отсюда?

      Сравни свою Удачу с показателем "Оркишность + 5".
    mood: tense
    interaction:
      type: check
      mode: stat
      stat: luck
      formula: 2d6 + luck >= orkishness + 5
      outcomes:
        success: "66"
        failure: "96"
  "55":
    title: Глава 55
    text: |-
      Ты достиг момента истины, который решит, привязан ли ты к своей Оркской природе. Сейчас ты будешь бороться со своей Оркишностью.

      Сравни сумму "Удаль + Мозги" с суммой "Мышцы + Оркишность + 5". Каждый раз, когда ты выигрываешь, уменьши свою Оркишность на одно очко. Каждый раз, когда ты терпишь неудачу, снизь свою Удаль на единицу.

      Если твоя Оркишность опустится до нуля первой, ты освободился от своей Оркской природы. Получи три единицы Смелости.

      Если твоя Удаль достигла нуля первой, ты остался рабом своей Оркской природы.
    mood: mystery
    interaction:
      type: check
      mode: stat
      stat: guts
      formula: 2d6 + guts >= orkishness + 5
      outcomes:
        success: "33"
        failure: "69"
  "56":
    title: Глава 56
    text: |-
      Со смешанными чувствами ты следуешь за Мортимером в его аппартаменты. С одной стороны, это явное повышение в иерархии орков. С другой, твоё "повышение" делает тебя прислужником прислужника. И зачем ты родился орком? Неужели это твоя судьба - прожить всю свою жизнь, прислуживая какому-то тёмному властелину или ещё кому-то? Эта череда мыслей была прервана, когда Мортимер обратился к тебе снова:

      - Итак, мы на месте.

      Оглядевшись, ты понимаешь, что пока ты предавался тяжким раздумьям, он привёл тебя в свои личные покои - комнату глубоко в подземелье.

      Если сравнивать с жилищами орков, это место можно назвать настоящим дворцом, с настоящей кроватью, шелковыми подушками, креслами со спинками, письменным столом...

      После, махнув рукой в сторону двери, он продолжил:

      - У меня есть важные дела кое-где ещё. Мне нужно, чтобы ты охранял мои драгоценности, пока меня нет. Ты будешь охранять эту дверь. Тебе нельзя входить и позволять входить кому-то ещё до моего возвращения.

      Даже не спросив, понял ли ты его инструкции, он просто уходит. Когда входная дверь в покои закрывается, тебя берёт злость из-за того, как он тобой манипулирует.

      Чтобы остаться здесь и сторожить дверь, как хороший орк, перейди на [А].

      Чтобы заглянуть в комнату, которую охраняешь, перейди на [Б].

      Чтобы просто уйти, перейди на [В].
    mood: calm
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "23"
          letter: А
        - label: Вариант Б
          to: "3"
          letter: Б
        - label: Вариант В
          to: "47"
          letter: В
  "57":
    title: Глава 57
    text: |-
      - Пойдём коротким путем. Лучше побыстрее выбраться.

      Отними одно очко из своей Оркишности - риск не соответствует Оркишной природе!

      Девушка утвердительно кивает и говорит:

      - Ладно, тогда - сюда!

      Это и правда короткий путь - всего через пару минут вы стоите у двери, за которой, по её словам, зомби-тролль - и выход - позади него. Глубоко вдохнув, ты готовишься к битве.

      Зомби-тролль: Атака 10, Защита 9, Здоровье 6.

      В противном случае ты - мертвец.
    mood: danger
    entry:
      - modify:
          stat: orkishness
          delta: -1
    interaction:
      type: combat
      mode: contest
      enemies:
        - name: Зомби-тролль
          count: 1
          attack: 10
          defense: 9
          health: 6
      outcomes:
        victory: "76"
  "58":
    title: Глава 58
    text: |-
      Ты смог удивить Мортимера, и он предлагает тебе работу своим телохранителем.

      Чтобы принять предложение Мортимера, перейди на [А]

      Чтобы подсказать Мортимеру, куда засунуть своё предложение, перейди на [Б].

      Чтобы попытаться убить его, перейди на [В].
    mood: calm
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "52"
          letter: А
        - label: Вариант Б
          to: "87"
          letter: Б
        - label: Вариант В
          to: "38"
          letter: В
  "59":
    title: Глава 59
    text: |-
      Сказав приключенцам на прощание абью - адуу - пока (прости, орки не умеют произносить французские слова), ты продолжаешь своё путешествие по подземелью.

      Сделай проверку Удачи со сложностью 10.
    mood: tense
    interaction:
      type: check
      mode: stat
      stat: luck
      formula: 2d6 + luck >= 10
      outcomes:
        success: "80"
        failure: "70"
  "60":
    title: Глава 60
    text: Орки вламываются внутрь и атакуют приключенцев. Однако Мортимер не упускает шанса швырнуть в тебя молнией.
    mood: danger
    interaction:
      type: continue
      to: "99"
  "61":
    title: Глава 61
    text: |-
      Ты подумал, что следовало бы разоблачить Мортимера. Это могло бы стать ему хорошей наукой за то, что он обманывал орков. Однако в этом не было ничего нового - злые маги всегда дурят орков. Пожалуй, кто-то должен это исправить...

      Ты не заметил, как твои ноги привели тебя обратно в твою комнату десять-на-десять с сундуком.

      Чтобы присесть и немного поразмышлять, перейди на [А].

      Чтобы попробовать открыть тот сундук, иди на [Б].

      Чтобы уйти, перейди на [В].
    mood: calm
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "14"
          letter: А
        - label: Вариант Б
          to: "84"
          letter: Б
        - label: Вариант В
          to: "18"
          letter: В
  "62":
    title: Глава 62
    text: |-
      - Все путем, - говоришь ты орку, предлагая ему руку помощи. - Вывожу эту рабыню для Галроса.

      Сравни свои Мозги с показателем "Оркишность + 4". В противном случае орк тебе не поверит.
    mood: tense
    interaction:
      type: check
      mode: stat
      stat: brains
      formula: 2d6 + brains >= orkishness + 4
      outcomes:
        success: "82"
        failure: "53"
  "63":
    title: Глава 63
    text: |-
      За время сражения орки сплотились вокруг тебя, и ты понимаешь, что проигравшие заплатили по счетам без видимых возражений. Один из орков подошёл к тебе.

      - Это... Это было самое великое зрелище, которое я только видел! Ты должен вести нас за собой! Скажи нам... как тебя зовут?

      Чтобы назвать своё имя, перейди на [А].

      Чтобы выбраться отсюда, пока никто пострашнее не понял, что ты убил Мортимера, перейди на [Б].
    mood: victory
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "8"
          letter: А
        - label: Вариант Б
          to: "81"
          letter: Б
  "64":
    title: Глава 64
    text: |-
      Она просила тебя сохранить зелье. И ты сделал это. Аккуратно положив тело Бетани, ты понимаешь, что страшно зол. Проклятый Галрос! Если бы не он, ничего этого не случилось бы! Часть тебя хочет убить его, другая - просто выбраться отсюда...

      Чтобы попытаться выбраться из подземелья, перейди на [А].

      Чтобы попытаться найти Галроса, перейди на [Б].
    mood: grief
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "50"
          letter: А
        - label: Вариант Б
          to: "20"
          letter: Б
  "65":
    title: Глава 65
    text: Поздравляем! Если ты читаешь это, значит, у тебя есть шанс получить собственное имя!
    mood: calm
    interaction:
      type: continue
      to: "33"
  "66":
    title: Глава 66
    text: |-
      Ты представляешься группе, они хлопают тебя по спине, делятся своей добычей, и вы впятером углубляетесь в подземелье.

      Что ж, у тебя получилось. Теперь ты герой, но это книга, В Которой Ты Не Герой.
    mood: victory
    interaction:
      type: continue
      to: result
  "67":
    title: Глава 67
    text: |-
      Извини, но это не такая книга-игра. Хотя, судя по твоей реакции, ты - действительно орк! Добавь очко к своей Оркишности.

      Прежде, чем ты успел сделать что-то, кроме как искоса взглянуть на нее, тебя прервали.
    mood: calm
    entry:
      - modify:
          stat: orkishness
          delta: 1
    interaction:
      type: continue
      to: "28"
  "68":
    title: Глава 68
    text: |-
      К счастью для тебя, эти три орка не при исполнении, и у них нет оружия или брони. Но всё же их трое против тебя одного. По крайней мере, у тебя есть меч и доспехи...

      Три орка: Атака 8, Защита 8, Здоровье 4.

      Если орки победят тебя, они убьют тебя, и твоя история подойдет к бесславному концу.
    mood: danger
    interaction:
      type: combat
      mode: contest
      enemies:
        - name: Три орка
          count: 1
          attack: 8
          defense: 8
          health: 4
      outcomes:
        victory: s68_win
  "69":
    title: Глава 69
    text: Утратив Удаль, ты становишься рабом своей Оркской природы. Ещё многое могло бы случиться после этого, но для тебя это конец истории.
    mood: grief
    interaction:
      type: continue
      to: result
  "70":
    title: Глава 70
    text: |-
      К сожалению, в поисках выхода из подземелья ты заблудился. Попытавшись вернуться по своим следам, ты снова встретил приключенцев. Ты, конечно же, попытался убедить их в том, что ты друг, но они не отличат одного орка от другого, поэтому не поверили и убили тебя, а затем ограбили труп.

      Ты мертв и обобран.
    mood: grief
    interaction:
      type: continue
      to: result
  "71":
    title: Глава 71
    text: |-
      Ты - один орк. Они - четверо приключенцев. Ты едва успел пожалеть о своём выборе прежде, чем погибнуть, а к тому времени, как твой дух начал сокрушаться в полной мере, они уже обобрали твоё тело.

      Ты мёртв.
    mood: grief
    interaction:
      type: continue
      to: result
  "72":
    title: Глава 72
    text: |-
      - Я... я приключенец, - говоришь ей, потому что не можешь заставить себя сказать правду.

      Что ж, ложь о своей Оркишной природе перед лицом опасности - это, как ни удивительно, очень по-оркски. Добавь очко к своей Оркишности.

      Лжец.
    mood: tense
    entry:
      - modify:
          stat: orkishness
          delta: 1
    interaction:
      type: continue
      to: "95"
  "73":
    title: Глава 73
    text: Сделай проверку Оркишности со сложностью 12. Если тебе везёт, в тебе ещё слишком много орочьего духа, чтобы напасть на других орков; вернись обратно и выбери другой вариант. В случае провала ты атакуешь.
    mood: danger
    interaction:
      type: check
      mode: stat
      stat: orkishness
      formula: 2d6 + orkishness >= 12
      outcomes:
        success: "31"
        failure: s73_fight
  "74":
    title: Глава 74
    text: |-
      Следуя за теми, кто знает путь, ты добираешься до покоев Галроса, ожидая нападения в любой момент. По мере приближения ты подумываешь, что, возможно, был удачлив, и девушка просто сбежала... но двери открываются, и из них выходит зомби-тролль, размахивая своей дубиной. Галрос стоит позади него, и ты понимаешь, что придётся сначала победить тролля, чтобы сразиться с ним. Ты должен был понимать, что не можешь быть настолько удачливым - в конце концов, ты просто орк.

      Зомби-тролль: Атака 10, Защита 9, Здоровье 6.

      Помощь остальных орков влияет на результаты зомби-тролля.

      * Если тролль побеждает, ты погиб - и Великая Оркская Революция вместе с тобой.
    mood: danger
    interaction:
      type: combat
      mode: contest
      enemies:
        - name: Зомби-тролль
          count: 1
          attack: 10
          defense: 9
          health: 6
      outcomes:
        victory: "93"
        defeat: result
  "75":
    title: Глава 75
    text: |-
      - Я... Я не могу... - начинаешь ты и осекаешься. Глубоко внутри ты понимаешь, что хочешь это сделать. Если бы ты только мог...

      Сделай последнюю попытку победить свою природу.
    mood: tense
    interaction:
      type: check
      mode: stat
      stat: guts
      formula: 2d6 + guts >= orkishness + 5
      outcomes:
        success: "26"
        failure: "69"
  "76":
    title: Глава 76
    text: |-
      Как только с зомби-троллем было покончено, вы с девушкой направились к потайному тоннелю Галроса.

      Он круто поднимается вверх, вскоре превращаясь в лестницу, и выводит вас на поверхность - под звёздное небо и полную луну.

      Внезапно девушка обнимает и целует тебя.

      - Как тебя зовут? - спрашивает она.

      Если у тебя есть имя, ты говоришь его ей. Если имени нет, а твоя Оркишность равняется нулю или ниже, ты можешь сейчас взять себе имя.

      Независимо от того, есть ли у тебя имя, твоё путешествие подошло к концу.
    mood: victory
    interaction:
      type: continue
      to: result
  "77":
    title: Глава 77
    text: |-
      Планирование? Да какой ты орк?! Вычти единицу из твоей Оркишности.

      Несколько орков уже направились было к выходу из комнаты, но ты останавливаешь их возгласом "Стойте!". Они остановились и посмотрели на тебя удивлённо.

      Аккуратно подбирая слова из своего орского словарного запаса, ты говоришь:

      - Галрос сильный. Галрос умный. Мы сильнее... но если мы будем умнее, мы точно победим!

      Согласный шепот прокатывается среди орков, большинство кивает, но один решает сказать.

      - Мы орки! Мы не умные!

      Выступив вперёд, ты хлопаешь орка, который это сказал и отвечаешь:

      - Ни один орк не умён сам... но если мы думаем вместе, мы умнее!

      Прежде, чем кто-либо успевает оспорить твою мудрость, ты спрашиваешь:

      - Кто знает, где апартаменты Галроса?

      Несколько орков поднимают свои руки.

      - Хорошо! - ты подзываешь их к себе. - У Галроса есть охранники?

      - Да, - отвечает один, - большой-большой троль. Не живой и не мертвый. У него когти вот такущие!

      - Нужно найти больше таких же, как мы, - говоришь ты.

      - Я приведу ещё! Я скажу оркам, что у нас теперь есть лидер! - один из орков уходит в бараки и возвращается через несколько минут с отрядом.

      - Отлично! Просто замечательно! - восклицаешь ты, - Нас так много! У всех есть оружие?

      В ответ орки подняли свои мечи.

      - Кто-нибудь знает что-то еще, что может нам помочь?

      Орки замолкают, почесывая свои головы и впадая в раздумья.

      Ты понимаешь, что время ограничено, и Галрос может вот-вот обнаружить ваше собрание. У тебя есть время, чтобы сделать что-то одно:

      Если решишь поискать что-нибудь полезное в сундуке, который ты охранял, перейди на [А].

      Если решишь искать покои Мортимера, отправляйся на [Б].

      Либо иди вперед, чтобы сразиться с троллем на [В].
    mood: calm
    entry:
      - modify:
          stat: orkishness
          delta: -1
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "22"
          letter: А
        - label: Вариант Б
          to: "43"
          letter: Б
        - label: Вариант В
          to: "86"
          letter: В
  "78":
    title: Глава 78
    text: |-
      И тут в комнатёнку вламывается группа из четырёх приключенцев. Заметив твои намерения напасть на рабыню, они бросаются в атаку с воплями "Руки прочь от дамы!"

      Чтобы попытаться обмануть приключенцев, объяснив, что они неправильно поняли происходящее, перейди на [А].

      Чтобы сразиться с приключенцами, перейди на [Б].
    mood: danger
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "54"
          letter: А
        - label: Вариант Б
          to: "19"
          letter: Б
  "79":
    title: Глава 79
    text: |-
      Ты кричишь так, как может кричать только орк, встретившийся лицом к лицу с четырьмя приключенцами. Мгновение спустя прибегает ученик Галроса Мортимер, мечущий руками молнии, вместе с ним другие орки.

      Вместе вы быстро справляетесь с приключенцами. Стряхивая пыль с рук, Мортимер смотрит на тебя.

      - Похоже, ты из ответственных орков. У меня есть для тебя работенка, пошли.

      Чтобы пойти за ним, перейди на [А].

      Чтобы убить его, проверь свою Удаль и сравни с показателем "Оркишность + 5". Если преуспеешь, перейди на [Б]. Если провалишься, значит, в тебе всё ещё слишком много от орка, чтобы взбунтоваться против порядка.
    mood: danger
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "56"
          letter: А
        - label: Вариант Б
          to: "38"
          letter: Б
  "80":
    title: Глава 80
    text: |-
      Поворачивая за угол, ты чуть не врезаешься в кого-то. Уже начинав обычное Оркишное приветствие (в переводе: "Прочь с дороги, шваль!"), ты понимаешь, что это не орк. Совсем не орк. Это молодая человеческая девушка, одетая, эм-м, в "одежду", если это можно так назвать, в которой Галрос любит видеть своих рабынь.

      Чтобы убить её, перейди на [А].

      Чтобы сделать с ней другие мерзости, перейди на [Б].

      Чтобы поговорить с ней, перейди на [В].
    mood: tense
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "28"
          letter: А
        - label: Вариант Б
          to: "67"
          letter: Б
        - label: Вариант В
          to: "98"
          letter: В
  "81":
    title: Глава 81
    text: |-
      Ты бежишь так быстро, как только можешь, стараясь выбраться из этого места раньше, чем Галрос поймёт, что его ученик Мортимер мёртв. Кажется, пока всё в порядке - ты на правильном пути, и никто не поднял тревогу.

      Сделай проверку Мозгов или Удачи (смотря что выше) со сложностью 10.
    mood: danger
    interaction:
      type: check
      mode: stat
      stat: brains
      formula: 2d6 + brains >= 10
      outcomes:
        success: "80"
        failure: "6"
  "82":
    title: Глава 82
    text: |-
      Несколько минут спустя вы с Бетани выходите из подземелья под звёздное небо с полной луной. Вы убегаете от подземелья подальше и через десять минут бега чувствуете, наконец, что уже безопасно для небольшой передышки.

      - Мы сделали это! - говорит она. - Поверить не могу! О, спасибо... мой герой!

      Поздравляем! Если ты еще не заработал имя, сейчас оно у тебя появляется. А теперь твоя сказка окончена... пока... но ты - герой!
    mood: victory
    interaction:
      type: continue
      to: result
  "83":
    title: Глава 83
    text: |-
      Одержав победу над троллем, вы замечаете, что отсюда есть две двери.

      - Куда ведут эти двери? - спрашиваешь ты орков, и один отвечает тебе:

      - Одна ведёт к Галросу. А другая - секретный спасательный тоннель, ведущий из подземелья.

      Чтобы идти в комнату Галроса, перейди на [А].

      Чтобы пойти в секретный тоннель, перейди на [Б].
    mood: mystery
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "93"
          letter: А
        - label: Вариант Б
          to: "49"
          letter: Б
  "84":
    title: Глава 84
    text: |-
      Вычти один из своей Оркишности. Сундук, конечно же, закрыт. Неужели ты думаешь, что маг доверил бы орку сокровища? Ты пробуешь вскрыть замок, но не знаешь как. Пока возишься, ты слышишь шум и оборачиваешься. Ой-Ой. Приключенцы. Их четверо. И ты... единственный... да, ты один.

      Чтобы убежать, перейди на [А].

      Чтобы позвать на помощь, перейди на [Б].

      Чтобы сразиться с приключенцами, перейди на [В].
    mood: danger
    entry:
      - modify:
          stat: orkishness
          delta: -1
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "39"
          letter: А
        - label: Вариант Б
          to: "79"
          letter: Б
        - label: Вариант В
          to: "71"
          letter: В
  "85":
    title: Глава 85
    text: |-
      Когда противники повержены, девушка обнимает тебя и целует в щёку.

      - Спасибо, что спас меня! - произносит она и тут же осекается, как будто что-то вспомнив. - Ой! Да ты же ранен! Она хватает повязки и целительное снадобье.

      Её забота возвращает тебе три единицы Здоровья, но оно не может стать выше 5.
    mood: victory
    entry:
      - modify:
          stat: hp
          delta: 3
    interaction:
      type: continue
      to: "98"
  "86":
    title: Глава 86
    text: |-
      Спланировав свои действия заранее, первыми ты отправляешь орков, которые знают, где находятся покои Галроса, чтобы они указывали дорогу. Помня о тролле-охраннике, ты останавливаешься перед дверью в его комнату, чтобы проинструктировать своих орков.

      - Мы будем умными там! Не тупыми! - говоришь ты. - Все орки дерутся - все побеждают! Вы со мной?

      - Да! - отвечают они все вместе.

      Встав во главе отряда, ты пинком открываешь дверь и, узрев зомби-тролля, вместе вы кидаетесь в атаку.

      Зомби-тролль: Атака 8, Защита 7, Здоровье 6.

      Остальные орки помогают тебе, что влияет на результаты противника.

      Если у тебя есть зелье управления зомби, ты можешь применить его сейчас. Проверь свои Мозги сравни с параметром "Оркишность + 8" (орки слабы в магии!). Если у тебя получилось, ты теперь контролируешь зомби. Ты автоматически побеждаешь его, а в дальнейшем вычитай 3 из атаки и защиты любых встреченных противников, ведь он теперь тебе помогает. Если ты провалился, зелье не возымело действия.

      Если нет, ты погиб и Великая Оркская Революция вместе с тобой.
    mood: danger
    interaction:
      type: combat
      mode: contest
      enemies:
        - name: Зомби-тролль
          count: 1
          attack: 8
          defense: 7
          health: 6
      outcomes:
        victory: "83"
  "87":
    title: Глава 87
    text: Сравни свою Смелости с суммой "Оркишность + Мозги. Вне зависимости от результата вычти единицу из своей Оркишности за попытку перечить ему.
    mood: tense
    entry:
      - modify:
          stat: orkishness
          delta: -1
    interaction:
      type: check
      mode: stat
      stat: guts
      formula: 2d6 + guts >= orkishness + brains
      outcomes:
        success: "34"
        failure: "52"
  "88":
    title: Глава 88
    text: |-
      Ну, вот ты и получил то, чего ожидал. Приключенцы. Четверо. Трое из них в доспехах и с оружием. Четвёртый гость должно быть маг, поскольку она без брони и оружия.

      По личному опыту... эх, кого мы пытаемся обмануть? Ты же орк. Если бы ты раньше встречал приключенцев, ты уже был бы мёртв, ну, или нежитью, в зависимости от их нанимателя. В любом случае, тебе совершенно ясно, что ты серьёзно влип.

      Чтобы убежать, перейди на [А].

      Чтобы позвать на помощь, перейди на [Б].

      Чтобы сразиться с приключенцами, перейди на [В].
    mood: danger
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "39"
          letter: А
        - label: Вариант Б
          to: "79"
          letter: Б
        - label: Вариант В
          to: "71"
          letter: В
  "89":
    title: Глава 89
    text: |-
      Стоя над трупом часового, ты чувствуешь прилив триумфа - но он схлынул сразу же, как только ты услышал голос у себя за спиной.

      - Дерзкий орк! Ты думал, что можешь украсть у меня одну из моих рабынь и сбежать с ней?

      Ты оборачиваешься и видишь Галроса с перекошенным от ярости лицом и хрустящими от напряжения руками. Галрос Бессмертный: Атака 10, Защита 11, Здоровье 8.

      Каждый раз, когда нападает Галрос, проверь, надпадает ли он на тебя или на девушку: 1-3 - на девушку, 4-6 - на тебя. У девушки уровень Здоровья 3. Если Галрос отнимет всё её Здоровье, он больше не будет на неё нападать. Если девушка ещё не давала тебе целительное снадобье, тогда в любой момент битвы ты можешь использовать его для восстановления трёх очков Здоровья своего или девушки. Ты можешь сделать это лишь раз.

      Если Галрос победит тебя, вы с девушкой мертвы. Если Здоровье девушки падает до нуля, а ты не используешь целительное снадобье, она мертва. Независимо от исхода битвы, для тебя это конец истории.
    mood: danger
    interaction:
      type: combat
      mode: contest
      enemies:
        - name: Галрос Бессмертный
          count: 1
          attack: 10
          defense: 11
          health: 8
      outcomes:
        victory: result
        defeat: result
  "90":
    title: Глава 90
    text: |-
      - Не слушайте его! Он ученик Галроса! Он превратил меня в это существо! - кричишь ты им.

      Приключенцы удивлённо мотают головой. Сравни свою Удачу или Мозги (смотря что выше) с параметром "Оркишность + 5".
    mood: tense
    interaction:
      type: check
      mode: stat
      stat: luck
      formula: 2d6 + luck >= orkishness + 5
      outcomes:
        success: "27"
        failure: "46"
  "91":
    title: Глава 91
    text: |-
      Ого-го, атаковать ученика злого колдуна... похоже, ты решил кое-что основательно изменить. Вычти один из своей Оркишности, а затем дерись с Мортимером:

      Мортимер Нечихающий: Атака 10, Защита 10, Здоровье 6.
    mood: danger
    entry:
      - modify:
          stat: orkishness
          delta: -1
    interaction:
      type: combat
      mode: contest
      enemies:
        - name: Мортимер Нечихающий
          count: 1
          attack: 10
          defense: 10
          health: 6
      outcomes:
        victory: "63"
        defeat: "35"
  "92":
    title: Глава 92
    text: |-
      Вычти два из своей Оркишности.

      - Ты... Ты спас меня! Ты мог бы воспользоваться возможностью, чтобы уйти, но не сделал этого...

      Неожиданно Бетани села и поцеловала тебя. Пораженный этим, ты попытался проделать с её губами такую же штуку, но, похоже, орочьи губы совсем не приспособлены для таких упражнений.

      Потом она прервала поцелуй и воскликнула:

      - Ой! Нам нужно убираться отсюда, пока кто-нибудь не заметил моего отсутствия! Идём!

      Взяв за руку, она повела тебя прочь, объясняя на ходу, куда идти.

      - Есть два пути, чтобы убраться отсюда. Можно попытаться прорваться через основной выход, но добираться до него слишком долго. Есть и запасной, более короткий вариант, но это личный потайной ход Галроса, который ведёт через его жилые комнаты и охраняется Зомби-троллем. Хотя у меня есть зелье, которое могло бы помочь нам справиться с ним. Как ты думаешь, какой путь нам лучше выбрать?

      Чтобы отправиться по длинному пути к основному выходу, перейди на [А].

      или выбрать короткий путь, охраняемый Зомби-троллем [Б]?
    mood: victory
    entry:
      - modify:
          stat: orkishness
          delta: -2
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "42"
