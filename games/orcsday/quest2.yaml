          letter: В
  "44":
    title: Глава 44
    text: Хорошее случается с теми, кто умеет ждать. Но только, если это не орки. Прибавь 1 к своей Оркишности, а затем проверь Удачу со сложностью 9.
    mood: tense
    entry:
      - modify:
          stat: orkishness
          delta: 1
    interaction:
      type: check
      mode: stat
