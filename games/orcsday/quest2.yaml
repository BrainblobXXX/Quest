  result:
    title: Подсчёт результата
    text: |-
      Что ж, ты дошел до конца... хотя бы своего. Посмотрим, насколько ты был хорош.

      За каждое из следующих достижений запиши себе одно очко:

      Ты еще жив

      Обрел имя

