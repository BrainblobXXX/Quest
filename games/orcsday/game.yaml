    - if: stat d_bm <= 0 and stat d_mg >= 0 and stat d_ml >= 0
      stat:
        orkishness: 1
    - if: stat d_gb > 0
      stat:
        orkishness: 1
    - if: stat guts > 2
      stat:
        orkishness: -1
