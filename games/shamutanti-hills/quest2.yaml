    text: Вы теряете 2 очка Выносливости из-за того, что шли всю ночь без отдыха. Незадолго до восхода солнца вы ненадолго останавливаетесь, чтобы осмотреться при утреннем свете.
    entry:
    - modify:
        stat: stamina
        delta: -2
    interaction:
      type: continue
      to: '148'
    mood: calm
  '225':
    title: Параграф 225
    text: 'Вы передаете ему деньги, и он начинает рассказ: «Нижняя тропа ведет через Долину Эльвинов, если вы не подготовлены к встрече с эльвинами, а это зловредный и волшебный народец, вам лучше избегать этого пути. Верхняя тропа ведет через холмы мимо шахты Шанкера». Он смеется и продолжает: «Но вы там должны не терять головы. Дальше лежит Кристатанти, вы доберетесь туда за день или два. Кристатанти одна из немногих деревень в Холмах Шамутанти, где привечают путешественников, по крайней мере, там вы найдете хорошую еду и ночлег. Берегитесь черных лотосов, они сладко пахнут, но их аромат — это яд». Вы благодарите его и идете дальше.'
    interaction:
      type: continue
      to: '81'
    mood: danger
  '226':
    title: Параграф 226
    text: Вы покидаете деревню. У стены на выезде из селения сидит слепой нищий, когда вы проходите мимо, он просит у вас милостыню. Он выглядит довольно жалким - худой и плохо одетый. Его глаза покрыты темной краской в знак того, что он слеп. Вы раздумываете, не бросить ли ему золотой, когда на дороге появляется запряженная волами телега. Возница предлагает подвезти вас. Примете предложение [А] или откажетесь и бросите золотой слепому [Б]?
    interaction:
      type: choices
      options:
      - label: Вариант А
        to: '129'
        letter: А
      - label: Вариант Б
        to: '244'
        letter: Б
    mood: danger
  '227':
    title: Параграф 227
    text: |-
      Выхватив оружие, вы вступаете в бой. Если вы перед этим наложили на мантикору заклинание неуклюжести, то в первых четырех раундах боя уменьшайте ее Мастерство вдвое. Если зверь уже был ранен, не забудьте вычесть урон из ее Выносливости.

      Мантикора

      Мастерство 12 Выносливость 18

      Если существо ранит вас, бросьте кубик. Если выпадет 5 или 6, она ранит вас своим ядовитым хвостом, и вы теряете 6 очков Выносливости. Чтобы снизить урон до 2 очков, можете проверять Удачу. Если выпадет 1-4, урон обычный. Если убьете чудовище.
    interaction:
      type: combat
      mode: pool
      enemies:
      - name: Мантикора
        count: 1
        attack: 2
        health: 18
      outcomes:
        victory: '456'
    mood: danger
  '228':
    title: Параграф 228
    text: Вы тараните дверь изо всех сил, но хватит ли их вам. Бросьте три кубика. Если результат меньше вашего Мастерства, вы серьезно ушибли плечо (теряете 1 очко Мастерства), но выломали дверь – [А]. Если больше или равен, дверь не поддается, и ваш единственный шанс, это воззвать о помощи к Либре – [Б]. Если не можете призвать на помощь богиню, вы обречены.
    entry:
    - modify:
