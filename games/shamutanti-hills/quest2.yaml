  '178':
    title: Параграф 178
    text: |-
      Тропа вьется мимо заброшенных покрытых дикими зарослями полей. Сельская местность пустынна, и жуткую тишину нарушает только карканье случайной вороны. Птицы, кажется, поднимаются в воздух, только чтобы осмотреть вас, пока они пролетают мимо, и вы чувствуете себя весьма неуютно под их взглядами. Вы переваливаете через небольшой холмик, с вершины которого видно, как тропа спускается вниз к маленькому поселению у подножия Холмов Шамутанти. Следуя по тропе, вы приближаетесь к деревне, шум и движения указывают на то, что она обитаема. Поскольку путь лежит сквозь нее, у вас нет другого выбора, кроме как войти в деревню.

      Стены круглых хижин сложены из обожженных до блеска глиняных кирпичей и покрыты соломой. Когда вы проходите мимо, из темных дверных проемов на вас пялятся глаза, которые следят за всеми вашими движениями. Внезапно из одного из жилищ выходит человек и преграждает вам путь. Он ростом в пять футов с толстыми руками и бедрами и одет лишь в драные штаны. У него дикие глаза, а длинные рыжие волосы и всклоченная борода почти совсем закрывают его лицо. «Стой, незнакомец! - командует он. – по какому делу вы прибыли в Кантопани?» Что вы ответите?

      Скажете, что вы торговец – [А]

      Что просто идете мимо – [Б]

      Что вы голодны и нуждаетесь в еде – [В]
    interaction:
      type: choices
      options:
      - label: Вариант А
        to: '264'
        letter: А
      - label: Вариант Б
        to: '33'
        letter: Б
