      Рев позади заставляет вас насторожиться. Стены прохода начинают дрожать и рушиться, и вы вынуждены идти дальше вглубь лабиринта навстречу реву, чтобы не попасть под обломки, который блокируют вам путь назад к выходу. Впереди вы видите узкий луч света, который дает вам повод для надежды. Может быть там другой выход? Рев становится громче, когда проход превращается в большую пещеру. Задыхаясь от ужаса, вы заслоняете ребенка, когда видите обитателя пещеры.

      На четырех лапах перед вами стоит огромная мантикора – чудовищный гибрид с телом льва и хвостом как у скорпиона. Ее морда похожа на лицо старика, и при виде вас она расправляет свои огромные крылья. Будете сражаться [А] или примените магию?
    interaction:
