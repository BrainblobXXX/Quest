    text: Вы садитесь и начинаете разговор. Похоже, эти люди местные старейшины, и вам повезло повстречать их, восстановите 2 очка Удачи. Они предлагают вам перекусить, еда восстанавливает вам 1 очко Выносливости. По мере того, как разговор становится все более легкомысленным, вы в шутку обращаетесь к воспоминаниям «о придурках из Кристатанти». Увы, этот не очень удачный комментарий, который весьма разозлил одного из ваших хозяев, который оказался родом из этой деревни. В гневе он встает и бросает вам вызов. Поскольку находитесь на его территории, вы решаете, что будет мудрым решением не принимать вызов, а стремительно отступить. Он в бешенстве гонится за вами через всю деревню и отстает только на окраине Дампуса. Вы идете дальше по тропе и только тут вспоминаете, что ваше оружие осталось позади. Если у вас есть резервное оружие, можете достать его из рюкзака, если другого оружия нет, вам придется во всех следующих боях понижать ваше Мастерство на 4 очка, пока не добудете себе новое оружие.
