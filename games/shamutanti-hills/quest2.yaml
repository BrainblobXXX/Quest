  '187':
    title: Параграф 187
    text: Он просит пощады и получает ее. Ваш противник чрезвычайно удивлен и благодарен вам. Перевязывая свои раны, он представляется как Фланкер – наемный убийца и вор. Он всегда нападает на путников для боевой практики и думал, что вы будете легкой добычей. Он тоже направляется в Кхар, в благодарность за ваше милосердие он обещает, стать вашим другом. Он может вам весьма пригодиться в этом городе. Сейчас он не может вас сопровождать, но когда вы прибудете в Кхар, то можете встретиться с ним снова, и он обещает, помочь вам. Обратитесь во втором томе, чтобы узнать, как он может помочь вам. Вы обзавелись ценным знакомством, восстановите 2 очка Удачи. Фланкер исчезает в лесу, а вы продолжаете путь.
