  '183':
    title: Параграф 183
    text: |-
      Пока обдумываете, по какому пути идти, вы различаете слабые крики о помощи с большого дерева впереди. Осторожно, вы подходите и видите старика, сидящего на одной из нижних ветвей, видимо он боится спрыгнуть на землю, что неудивительно, учитывая его возраст. Он умоляет вас о помощи, и вы спускаете его вниз. Оказывается, он путешествовал из Дампуса в Форпостный Городок. Все было хорошо, пока он не попал в засаду эльвинов, его застали врасплох, ограбили и оставили сидеть на дереве. В награду на вашу доброту он рассказывает то, что, по его мнению, может вам помочь.

      Того, кто не видит тебя найди

      У кого пелена с глаз не сходит.

      Дни, когда он был стражем, уже позади

      Но остался ключ к свободе

      Он не уверен, что именно означает эта рифма, но он знает, что эльвины очень заинтересованы в поисках ключа, о котором идет речь. Он также дарит вам единственную оставшуюся у него ценную вещь – это страница из книги заклинаний (номер страницы – [А]). К сожалению, текст заклинания на нем не полный, рассмотрев его, вам кажется, что это какое-то успокаивающее заклинание. Затем старик прощается с вами и ковыляет в сторону Кантопани.

