  '204':
    title: Параграф 204
    text: Если у вас нет пропуска, вы отдаете 3 золотых, а взамен получаете кусок ткани, чтобы использовать в качестве полотенца. Вместе с двумя другими посетителями - и, конечно, вместе с минимитом Жаном - вы раздеваетесь и становитесь под струи водопада. Холодная вода освежает и бодрит, а ваша кожа аж начинает светиться. Вы купаетесь и просто смываете все свои раны и ушибы. Вода водопада обладает волшебными лечебными свойствами, восстановите свою Выносливость, Мастерство и Удачу до начального уровня, вода также исцелит вас от любых болезней, которые вы могли подцепить, но не от проклятий. Вы возвращаетесь в деревню и идете на постоялый двор.
