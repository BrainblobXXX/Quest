  '218':
    title: Параграф 218
    text: |-
      Они хватают ваш рюкзак и перебирают вещи в нем, беря себе любые предметы, которые пожелают. Покончив с этим, и считая вас вполне безобидным, они решают отпустить вас.

      Чтобы узнать, какие предметы они забрали, пройдитесь по всем предметам в вашем снаряжении один за другим (золотые монеты и запасы пищи считаются как один предмет). Чтобы узнать понравилась им вещь или нет, проверьте Удачу, если повезет – она остается у вас, не повезет – ее забирают (уменьшать текущий показатель Удачи во время этих проверок не надо). Если они заберут у вас все оружие, то во всех последующих схватках, пока не найдете себе новое оружие, уменьшайте свое Мастерство на 4 очка.

      Когда они заканчивают грабеж, вас развязывают и отпускают.
    interaction:
      type: continue
      to: '196'
    mood: victory
  '219':
    title: Параграф 219
    text: Она спрашивает, нет ли у вас каких-либо предметов «магической природы». Вы, естественно, слегка настораживаетесь и стараетесь переменить тему. В конце концов, она вас выпроваживает, и вы продолжаете свой путь.
    interaction:
      type: continue
      to: '232'
    mood: tense
  '220':
    title: Параграф 220
    text: 'Продолжая путь вниз по склонам холмов, вы делаете остановку и отдыхаете. Вы забираетесь на валун, чтобы рассмотреть, что ждет вас впереди. Тропа продолжает спускаться в долину. Между тремя холмами впереди лежит деревня – и довольно большая. Солнце уже садится, быстро темнеет, а вы решаете отправиться к этому поселению. Нависающая над тропой ветка касается вашего лица, и вы слышите веселый щебет. Зависнув над вашим плечом, рядом с вами парит маленькое существо размером не больше вашего большого пальца. Оно похоже на крошечного ребенка, у него зеленая кожа и тонкие прозрачные крылья. Кажется, что оно довольно дружелюбно, а исходящее от него свечение касается вашего плеча. Попробуете заговорить с ним – [А]. Или попытаетесь избавиться от него с помощью заклинания:'
    interaction:
      type: choices
      options:
      - label: Вариант А
        to: '171'
        letter: А
      - label: Заклинание SIX
        to: '387'
        if:
          flag: spell_six
      - label: Заклинание WIK
        to: '336'
      - label: Заклинание HOP
        to: '451'
      - label: Заклинание GAK
        to: '300'
        if:
          flag: spell_gak
      - label: Заклинание WAL
        to: '306'
        if:
          flag: spell_wal
    mood: danger
    image: assets/220.jpg
  '221':
    title: Параграф 221
    text: 'Пещера неглубокая и кажется пустая. Щебень, в основном мелкая галька, покрывает пол, где валяется несколько крупных предметов: огромный сломанный стул, сеть с очень широкими ячейками и череп, похожий на человеческий, но слишком большой. Внезапно вас осеняет, здесь обитали великаны! Вы можете взять с собой что-нибудь - или любую часть чего-либо – лежащего на полу, но если возьмете стул, то из-за его размеров не сможете нести больше ничего другого, поэтому вам придется оставить здесь все свои вещи, кроме оружия. Теперь вы зайдете в соседнюю пещеру [А] или пойдете дальше по тропе [Б]?'
    interaction:
      type: choices
      options:
      - label: Вариант А
        to: '207'
        letter: А
      - label: Вариант Б
        to: '250'
        letter: Б
    mood: danger
  '222':
    title: Параграф 222
    text: |-
      Через час после рассвета вы слышите шум снаружи. Дверь открывается, и входят пять свиннов во главе с седым стариком в разноцветной мантии. Он представляется, как Просеус староста свиннов, и извиняется за то, что приказал схватить вас. Вам дают хлеба и молока. Эта пища восстанавливает вам 2 очка Выносливости.

      Староста объясняет, что на вас возлагают миссию огромного значения. Его юная дочь, его единственная наследница была похищена бандой мародеров, которые собираются принести ее в жертву могущественному пещерному демону. Несколько его людей пытались спасти девушку, но потерпели неудачу. «Мой народ в отчаянии, - объясняет староста. – Нам нужен герой, чтобы спасти ее. Если вам это удастся, вы можете сами выбрать любую награду».

      Понятно, что, несмотря на кажущуюся доброту старосты, ваше мнение в этом вопросе его не интересует. Вас выводят из деревни и по извилистой тропинке ведут по склону холма. На его вершине есть дыра в земле, свинны собираются спустить вас в корзине в этот секретный вход в пещеру демона. Попытаетесь сбежать [А] или вы уже думаете только о богатстве и сокровищах, которые получите за победу над демоном [Б]?
    interaction:
      type: choices
      options:
      - label: Вариант А
        to: '215'
        letter: А
      - label: Вариант Б
        to: '100'
        letter: Б
    mood: danger
  '223':
    title: Параграф 223
    text: Вы пытаетесь обойти существо, но оно снова преграждает вам путь, злобно оскалив зубы. Придется сражаться.
