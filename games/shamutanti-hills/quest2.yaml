    text: Вы стоите окруженный мертвыми змеями. Вам повезло, но этого недостаточно. Вам нужно выбраться из ямы обратно в проход, но вы не видите никакого способа сделать это. Вы можете некоторое время поддерживать свою жизнь, питаясь убитыми змеями, но все равно рано или поздно, умрете от голода. Ваш единственный шанс на спасение – это воззвать к Либре (если еще этого не делали).
    interaction:
      type: continue
      to: '273'
    mood: danger
  '207':
    title: Параграф 207
    text: |-
      Войдя в пещеру, вы слышите слабый свист, который становится тем громче, чем глубже заходите в пещеру. Пройдя еще немного дальше, вы спотыкаетесь и падаете, а свист немедленно прекращается. С ужасом вы видите перед собой огромные ноги. Великан спросонья протирает глаза и видит вас! Он берет в руки дубину и медленно надвигается на вас.

