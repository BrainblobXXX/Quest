    text: Маленькие человечки поднимают вас, и вскоре вы прибываете в лагерь охотников за головами. Когда вас вносят в центр поселения, поднимается большой гвалт и суматоха, несколько дикарей поспешно наполняют большой котел водой и разводят под ним огонь – вряд ли для того, чтобы приготовить торжественный обед в вашу честь! Тем временем вас сажают в бамбуковую клетку, которую охраняют сильнейшие воины. Если хотите призвать на помощь Либру – [А], если нет – [Б].
