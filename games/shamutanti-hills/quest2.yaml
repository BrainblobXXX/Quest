  '119':
    title: Параграф 119
    text: Хижина тщательно прибрана, чувствуется привередливая женская рука. Стулья аккуратно расставлены вокруг стола, в одном углу лежит матрас, а большая кухонная зона указывает на то, что тот, кто здесь живет, любит готовить. Вы слышите крик из угла, скрытого большим шкафом, и, подойдя к нему, видите большую клетку, в которой заперта молодая женщина - и довольно симпатичная. «Добрый незнакомец, - умоляет она, - выпустите меня из клетки. Я здесь уже два дня из-за проказ этих несносных эльвинов. Вы ведь поможете мне?» Поможете ей [А], спросите, что она даст вам за это [Б], или осмотрите хорошенько хижину, чтобы спереть что-нибудь ценное [В]?
