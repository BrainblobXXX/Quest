    text: Вы продолжаете путь по тропе вдоль берега ручья и идете уже несколько часов, пока не подходите к широкой излучине. В центре излучины впереди вы видите скопление крытых соломой и ветками хижин. Дым поднимается в воздух от горящего посреди хижин костра, но со стороны селения не доносится ни звука. Войдете в деревню [А] или сойдете с тропы и поднимитесь на холмы, чтобы попытаться обойти ее [Б]?
