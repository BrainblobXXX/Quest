    text: «Ты не сможешь убежать от Духа Мананка, - кричит лицо. – И твоя миссия проклята!» После этих слов дым втягивается обратно в коробку и исчезает. Вы неприятно удивлены, но мало что можете сделать. Пока вы не найдете способ избавиться от проклятия, ваша Выносливость будет под угрозой. В будущем если вы теряете очки Выносливости по любой причине, кроме наложения заклинаний, то должны дополнительно потерять еще 1 очко. Таким образом, пока не избавитесь от проклятия, вы будете более уязвимы. Вы покидаете хижину и продолжаете свое путешествие.
