  '279':
    title: Параграф 279
    text: |-
      Когда приходите в себя, то обнаруживаете, что лежите в хижине со связанными руками. Увидев, что вы зашевелились, существо у двери вскакивает на ноги. А точнее подпрыгивает и зависает в воздухе, внимательно следя за вами. Ваш страж худой маленький гуманоид. Вы в плену у эльвинов.

      Эльвины маленький проказливый народец, скорее озорники, чем злодеи. Они любят шутки и розыгрыши. Вскоре еще несколько из них собираются в комнате. Они спрашивают, не волшебником ли вы, и, если да, то не покажете ли им какие-нибудь трюки. Если вы будете выполнять для них трюки – [А]. Если нет – [Б].
