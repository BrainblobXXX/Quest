      - label: Вариант Б
        to: '275'
        letter: Б
    mood: tense
  '242':
    title: Параграф 242
    text: Немного погодя два охотника за головами вытаскивают вас из клетки. Они волокут вас к котлу, вода в котором уже закипает. Затем вы получаете удар по голове и теряете сознание. В себя вы уже не придете. Племя дикарей сегодня вкусно поужинает.
    ending: true
    mood: grief
  '243':
    title: Параграф 243
    text: Старуха ведет вас в дом и приглашает садиться. Она очень одинока в этом лесу и потому ценит общество других людей. Она предлагает вам угощение и заваривает на кухне чай, а затем возвращается с двумя большими чашками, для себя и для вас. Жану она кажется подозрительной, о чем он и сообщает. Старуха пристально смотрит на него и открыто выражает свое отвращение к расе минимитов. Она возвращается на кухню, а вы думаете, не поменять ли местами чашки с чаем? Сделаете это [А] или выпьете из поданной вам чашки [Б]?
    interaction:
      type: choices
      options:
      - label: Вариант А
        to: '48'
        letter: А
      - label: Вариант Б
        to: '146'
        letter: Б
    mood: tense
    image: assets/243.jpg
  '244':
    title: Параграф 244
    text: Вы бросаете ему золотой. «Благодарю за доброту, путешественник», - говорит нищий. Он ощупывает монету. «Так ведь это же золотой! – восклицает он. - Вы слишком щедры к бедному слепому. Щедрость такого рода не должна остаться без награды!» Он достает из кармана медный ключ и настаивает, чтобы вы его взяли. «Много лет назад я жил в Кхаре, - говорит он. - Кхар был моим домом, и я был надзирателем в тюрьме. Но Кхар это злое место, его населяют самые разные существа. Остерегайтесь Красных Глаз, или моя судьба постигнет и вас, и вам тоже придется стать слепым попрошайкой. В Кхаре также опасаются незнакомцев, но этот ключ поможет вам в случае, если вас поймает городская стража». На ключе выгравировано число 206. Вы берете его, благодарите нищего и отправляетесь в путь.
    interaction:
      type: continue
      to: '58'
    mood: victory
  '245':
    title: Параграф 245
    text: Вы незамеченным минуете хижину.
    interaction:
      type: continue
      to: '237'
    mood: tense
  '246':
    title: Параграф 246
    text: На рассвете второго дня вашего путешествия вы продолжаете идти вперед. Утренний воздух прохладен и чист, вы успеваете до наступления полудня подняться еще на несколько сотен футов. Вы переваливаете через гребень очередного холма и останавливаетесь. Слева от вас видна поляна, на которой установлено множество кольев. А на вершины кольев насажены головы – некоторые здесь недавно, некоторые полуразложившиеся – видны человеческие головы, головы гоблинов, несколько голов принадлежат существам, которых вы не смогли опознать, и у всех зашиты глаза и рты. Большой косой крест нарисован на большом дереве впереди, очевидно это предупреждение – пути дальше нет. Тропа впереди раздваивается, но вы не уверены, по какому пути вас предупреждают не идти! Пойдете по правой тропе [А] или по левой, которая сворачивает вниз по склону холма [Б]?
    interaction:
      type: choices
      options:
      - label: Вариант А
        to: '68'
        letter: А
      - label: Вариант Б
        to: '40'
        letter: Б
    mood: danger
  '247':
    title: Параграф 247
    text: Эта шапочка была украдена у жреца из Дадду-Лей. Она не имеет никаких магических свойств, но может пригодиться при наложении заклинаний.
    interaction:
      type: continue
      to: '75'
    mood: tense
  '248':
    title: Параграф 248
    text: Она дает вам маленькую шкатулку. Внутри крошечный пузырек с клеем, пара странно выглядящих затычек для носа и четыре маленьких камешка-голыша – это все может пригодиться для наложения заклинаний.
    interaction:
      type: continue
      to: '87'
    mood: danger
  '249':
    title: Параграф 249
    text: Эта дудочка сделана из бамбука, точнее это не дудочка, а флейта. Подув в нее, вы извлекаете несколько нот. Вы решаете взять ее с собой.
    interaction:
      type: continue
      to: '126'
    mood: danger
  '250':
    title: Параграф 250
    text: Вы покидаете Леа-Ки владение великанов и идете дальше. Ближе к вечеру вы снова оказываетесь на развилке, можете выбрать тропу ведущую вниз по склону холма [А] или тропу,бегущую по гребню холма [Б].
    interaction:
      type: choices
      options:
      - label: Вариант А
        to: '176'
        letter: А
      - label: Вариант Б
        to: '188'
        letter: Б
    mood: danger
  '251':
    title: Параграф 251
    text: |-
      Коробка пуста. Но когда вы заглядываете внутрь, оттуда начинает струиться дым. Дым поднимается все выше перед вами и медленно трансформируется в худое лицо с эльфийскими чертами. Вы заворожено смотрите на него, а затем внезапно его глаза распахиваются. Пристальный взгляд, кажется, пронзает вас насквозь, и вы не можете даже пошевелиться. «Незнакомец, - открывает оно уста, - ты вмешиваешься в деяния сил, о которых ничего не знаешь. Я в курсе твоих поисков. Ты никогда не добьешься успеха».

      Вы можете применить магию:

      Или выбежите из комнаты – [А].
    interaction:
      type: choices
      options:
      - label: Заклинание FOG
        to: '455'
        if:
          flag: spell_fog
      - label: Заклинание MAG
        to: '403'
        if:
          flag: spell_mag
      - label: Заклинание RIS
        to: '293'
      - label: Заклинание RAN
        to: '377'
      - label: Заклинание GAK
        to: '354'
        if:
          flag: spell_gak
      - label: Вариант А
        to: '124'
        letter: А
    mood: danger
  '252':
    title: Параграф 252
    text: Будете сражаться с помощью оружия [А] или примените магию [Б]?
    interaction:
      type: choices
      options:
      - label: Вариант А
        to: '20'
        letter: А
      - label: Вариант Б
        to: '166'
        letter: Б
    mood: danger
  '253':
    title: Параграф 253
    text: Это неправильный ответ. Горбун делает плавное движение рукой, и все ваше тело пронзает боль. Теряете 2 очка Выносливости и 1 очко Удачи. Вам не пройти по этому мосту, поэтому вы спускаетесь по тропе в долину.
    entry:
    - modify:
        stat: stamina
        delta: -2
    interaction:
      type: continue
      to: '38'
    mood: victory
  '254':
    title: Параграф 254
    text: Вы бежите через лес на случай, если шум привлечет других враждебных существ. После получаса бега вы останавливаетесь передохнуть, и только сейчас понимаете, что безнадежно заблудились. В каком направлении нужно двигаться? Бросьте кубик. Если выпадет 1 или 2, вы идете верх по склону, пока не выйдете на тропу – [А]. Если выпадет 3 или 4, вы просто пойдете прямо, пока не выйдите на тропу – [Б]. Если выпадет 5 или 6, вы спуститесь вниз по склону, пока не выйдите на проторенный путь – [В].
    interaction:
      type: roll
      formula: 1d6
      outcomes:
      - min: 1
        max: 2
        to: '68'
      - min: 3
        max: 4
        to: '13'
      - min: 5
        max: 6
        to: '98'
    mood: tense
  '255':
    title: Параграф 255
    text: Дверь не заперта. За ней находится квадратная комната грязная и закопченная от пыли из шахт, в противоположной стене есть еще одна дверь. За импровизированным столом сидит большой грязный гоблин, который поднимает голову и принюхивается. Его лицо черное от копоти, он ничего не видит. «У тебя странный запах, нарушитель – бросает он. – Таким как ты здесь не место!» Сразитесь с ним [А] или уйдете [Б]?
    interaction:
      type: choices
      options:
      - label: Вариант А
        to: '47'
        letter: А
      - label: Вариант Б
        to: '120'
        letter: Б
    mood: danger
    image: assets/255.jpg
  '256':
    title: Параграф 256
    text: Существо ревет и хватает вас. Вы не в силах сопротивляться и прочно зажаты между его большим пальцем и ладонью. Боль чудовищная, хватка все крепче. Великан медленно, но верно выдавливает из вас жизнь.
    ending: true
    mood: grief
  '257':
    title: Параграф 257
    text: Постоялый двор предлагает горячие блюда на продажу, и если вы хотите остановиться и поесть, плата будет 1 золотой. Хлеб и козий сыр также можно купить и унести с собой, две порции еды стоят 2 золотых. Если хотите, можете купить припасы в дорогу и заплатить 2 золотых. Если хотите присесть и поесть – [А]. Или, если не хотите терять времени, можете сразу отправиться дальше – [Б].
    interaction:
      type: choices
      options:
      - label: Вариант А
        to: '116'
        letter: А
      - label: Вариант Б
        to: '131'
        letter: Б
    mood: danger
  '258':
    title: Параграф 258
    text: Вы откидываете крышку коробки и сразу же отскакиваете назад. Внутри лежат 5 золотых и ключ, но их сторожит ядовитый скорпион. Вы можете попытаться выхватить из коробки понравившуюся вещь – но только один предмет за раз, или ключ или золото. Для этого нужно проверить Удачу. Если повезло, вы благополучно достали предмет, если хотите, можете попробовать достать и второй. Если не повезет, скорпион ужалит вас, теряете половину очков из текущей Выносливости. Если вы достали ключ – [А]. Закончив с коробкой, вы можете открыть второй ящик [Б] или покинуть деревню [В].
    interaction:
      type: choices
      options:
      - label: Вариант А
        to: '199'
        letter: А
      - label: Вариант Б
        to: '251'
        letter: Б
      - label: Вариант В
        to: '196'
        letter: В
    mood: danger
    entry:
    - modify:
        stat: money
        delta: 5
    - grant:
        item: key
        count: 1
      once: true
  '259':
    title: Параграф 259
    text: Вам удается избежать встречи с гоблинами, вы покидаете шахту и спускаетесь через лес к тропе.
    interaction:
      type: continue
      to: '202'
    mood: danger
  '260':
    title: Параграф 260
    text: Вместе с водой вы поднимаетесь к потолку, но Либра не покинула вас и вокруг вашей головы образуется воздушный карман. Пока барахтаетесь в воде, вы можете спокойно дышать. Вы даже немного расслабляетесь и отдыхаете, зная, что находитесь в полной безопасности (даже вещи не промокли). Однако вы больше не сможете воззвать о помощи к Либре в этой части приключения. Через несколько минут вода начинает вытекать, и вы опускаетесь на пол. Стена, блокирующая выход, снова опускается вниз, и вы возвращаетесь в пещеру, из которой начали путь по подземному лабиринту. Пойдете в правый проход [А] или в левый [Б]?
    interaction:
      type: choices
      options:
      - label: Вариант А
        to: '3'
        letter: А
      - label: Вариант Б
        to: '16'
        letter: Б
    mood: calm
  '261':
    title: Параграф 261
    text: Когда вы снимаете с плеч рюкзак, один из бандитов вырывает его у вас из рук, а другой прыгает на вас и бьет рукоятью своего меча. Оглушенный вы падаете на землю, а они начинают делить ваши вещи. Теряете 2 очка Выносливости. Когда вы приходите в себя, то выясняете, что потеряли все ваше имущество, включая золото и еду, у вас остался только меч. Вы встаете и продолжаете путешествие.
    entry:
    - modify:
        stat: stamina
        delta: -2
    interaction:
      type: continue
      to: '131'
    mood: victory
  '262':
    title: Параграф 262
    text: |-
      Это правильный ответ. Горбун шагает в сторону, дает вам пройти и желает вам всего наилучшего. Вы быстро идете по мосту, опасаясь какой-нибудь хитрости или ловушки. Но вместо этого старое существо окликает вас и дает подсказку, которая может оказаться полезной.

      Берегись лабиринта, где пещерный демон живет

      С ловушками опасней Медузы взгляда

      Каждая неудачливых путников ждет

      Не знающих, что направо идти не надо

      Запомните эти слова, даже если не поняли их полностью. Вы пересекаете долину, можете восстановить 2 очка Удачи, ведь все кончилось благополучно. По ту сторону моста обе тропы снова объединяются в одну, и вы идете по ней до конца дня.
    interaction:
      type: continue
      to: '220'
    mood: danger
  '263':
    title: Параграф 263
    text: Вы завершили работу вовремя, и хозяин платит вам 3 золотых. С первыми лучами солнца вы покидаете Дампус.
    interaction:
      type: continue
      to: '208'
    mood: victory
    entry:
    - modify:
        stat: money
        delta: 3
  '264':
    title: Параграф 264
    text: |-
      Он хмыкает и просит вас следовать за ним. Вы идете через деревню к большому зданию. Внутри вы обнаруживаете целый склад различных вещей и толстого кладовщика, сидящего за столом. Ваш проводник объясняет, по какому делу вы прибыли и уходит, оставляя вас с толстяком, который предлагает вам присаживаться. Он предлагает вам множество товаров на продажу, некоторые из них вас заинтересовали.

      Травяной настой – [А]

      Меч с острым как бритва лезвием – [Б]

      Дудочка – [В]

      Покрытый странной резьбой топор – [Г]

      Сумка полная зубов – [Д]

      Сверкающий драгоценный камень – [Е]

      Если вас ничего не заинтересовало – [Ж].
    interaction:
      type: choices
      options:
      - label: Вариант А
        to: '107'
        letter: А
      - label: Вариант Б
        to: '214'
        letter: Б
      - label: Вариант В
        to: '22'
        letter: В
      - label: Вариант Г
        to: '141'
        letter: Г
      - label: Вариант Д
        to: '5'
        letter: Д
      - label: Вариант Е
        to: '60'
        letter: Е
      - label: Вариант Ж
        to: '163'
        letter: Ж
    mood: danger
  '265':
    title: Параграф 265
    text: Немного передохнув после схватки, вы обыскиваете труп великана и его жилище. Вы находите 8 золотых и если хотите, можете взять себе какую-то часть существа. Кроме того, вы находите огромную буханку, она слишком велика, с собой не унесешь, но можете откусить от нее, если хотите – [А]. Если просто хотите уйти – [Б].
    interaction:
      type: choices
      options:
      - label: Вариант А
        to: '284'
        letter: А
      - label: Вариант Б
        to: '250'
        letter: Б
    mood: danger
    entry:
    - modify:
        stat: money
        delta: 8
  '266':
    title: Параграф 266
    text: Вы находите пивную и идете туда. Изнутри доносятся грубые голоса, но когда вы входите, посетители начинают подозрительно наблюдать за вами, и шум стихает. Хозяин говорит вам, что вы находитесь в Кристатанти и что кружка эля стоит здесь 1 золотой. Если не хотите или можете позволить себе такие траты, то сразу уходите – [А]. В противном случае вы платите ему, забираете свою выпивку и садитесь за стол. Сядете рядом с морщинистым стариком [Б] или рядом с юношей с острыми чертами лица [В]?
    interaction:
      type: choices
      options:
      - label: Вариант А
        to: '62'
        letter: А
      - label: Вариант Б
        to: '192'
        letter: Б
      - label: Вариант В
        to: '96'
        letter: В
    mood: danger
    image: assets/266.jpg
  '267':
    title: Параграф 267
    text: Горячая еда здесь стоит 3 золотых, можете заказать ужин или перекусить едой из своих припасов. Если вы еще не ели сегодня, пища восстановит вам 2 очка Выносливости, если ели, то только 1 очко. Кровать на ночь стоит здесь 5 золотых. Если заночуете здесь – [А]. Если покинете деревню и заночуете под открытым небом – [Б].
    interaction:
      type: choices
      options:
      - label: Вариант А
        to: '8'
        letter: А
      - label: Вариант Б
        to: '35'
        letter: Б
    mood: danger
  '268':
    title: Параграф 268
    text: Дверь заперта. Вы можете попытаться выбить ее [А] или применить заклинания.
    interaction:
      type: choices
      options:
      - label: Вариант А
        to: '93'
        letter: А
      - label: Заклинание DOM
        to: '351'
      - label: Заклинание PAP
        to: '311'
      - label: Заклинание HUF
        to: '374'
      - label: Заклинание HOW
        to: '449'
        if:
          flag: spell_how
      - label: Заклинание DOP
        to: '291'
        if:
          flag: spell_dop
    mood: tense
  '269':
    title: Параграф 269
    text: Теперь она вопит не на вас, а что-то громко выкрикивает прямо в воздух. Треск слева заставляет вас обернуться, как раз вовремя, чтобы увидеть, как сломанное дерево падает прямо на вас. Проверьте свою Удачу. Если повезет, вы вовремя отпрыгиваете в сторону. Если не повезет, вы тоже уворачиваетесь, но дерево расплющивает вашего миниатюрного компаньона. В любом случае.
    interaction:
      type: continue
      to: '276'
    mood: victory
  '270':
    title: Параграф 270
    text: |-
      Пчелы роятся вокруг вас, пока вы лезете на дерево, но они не в силах защитить свой дом. Вы стряхиваете улей на землю и спрыгиваете вслед за ним. Бросьте кубик. Если выпадет 1-4, вычтите результат из вашей Выносливости, это последствие пчелиных укусов. Если выпадет 5-6, вам повезло, пчелы ни разу вас не ужалили.

      Вскрыв улей, вы получаете немного пчелиного воска и меда. Если будете использовать воск для наложения заклинаний, его хватит на два применения. Мед — это эквивалент одной порции пищи.
    interaction:
      type: continue
      to: '9'
    mood: victory
    entry:
    - grant:
        item: wax
        count: 2
      once: true
    - grant:
        item: honey
        count: 1
      once: true
  '271':
    title: Параграф 271
    text: 'Вы стучитесь в другую дверь. Через некоторое время раздается голос: «Кто там?». И вы входите.'
    interaction:
      type: continue
      to: '158'
    mood: tense
  '272':
    title: Параграф 272
    text: Когда вы едите, то чувствуете резкую боль в ноге. Обернувшись, вы видите на дереве неподалеку дикаря из племени охотников за головами, его черное лицо ухмыляется, когда он отнимает от губ духовую трубку. У вас кружится голова, яд действует почти мгновенно. Ваша насаженная на кол голова будет выставлена на ближайшей развилке в назидание другим путешественникам.
    ending: true
    mood: grief
  '273':
    title: Параграф 273
    text: У вас на глазах тела змей образуют лестницу, уходящую вверх. Когда она окончательно формируется, вы взбираетесь по ней и через некоторое время снова оказываетесь в той же пещере, из которой начали свой путь по подземному лабиринту. Запомните, теперь вы сможете снова воззвать к Либре только в следующей части вашего приключения. Выйдете через правый проход [А] или через левый [Б]?
    interaction:
      type: choices
      options:
      - label: Вариант А
        to: '3'
        letter: А
      - label: Вариант Б
        to: '16'
        letter: Б
    mood: danger
  '274':
    title: Параграф 274
    text: Вы открываете бутылку с зельем и принюхиваетесь. Фу! Резкий запах сока Блимберри ни с чем не перепутаешь. Блимберри это странный фрукт, который которые обычно не употребляют в пище ни люди, ни животные (из-за его гнусного запаха). Но его лечебные свойства хорошо известны и постоянно используется в народной медицине. Вы можете выпить зелье в любой момент, но не во время боя, и оно восстановит вам 3 очка Выносливости. Или вы можете использовать его для колдовства, но зелья хватит только на однократное применение.
    interaction:
      type: continue
      to: '126'
    mood: danger
  '275':
    title: Параграф 275
    text: |-
      Вы рывком пытаетесь освободить свою руку, трава перед вами шевелится, раздается угрожающее шипение, и прямо перед вами материализуется тело огромного двухвостого змея. Один из его хвостов обвивается вокруг вашей руки. Какое заклинание примените?

      Если не знаете этих заклинаний или не хотите их применять, беритесь за оружие – [А].
    interaction:
      type: choices
      options:
      - label: Заклинание KIL
        to: '314'
      - label: Заклинание SUN
        to: '404'
        if:
          flag: spell_sun
      - label: Заклинание GOP
        to: '334'
      - label: Заклинание LAW
        to: '355'
        if:
          flag: spell_law
      - label: Заклинание HOW
        to: '426'
        if:
          flag: spell_how
      - label: Вариант А
        to: '2'
        letter: А
    mood: tense
  '276':
    title: Параграф 276
    text: |-
      Когда вы поднимаетесь на ноги, старуха оказывается стоящей перед вами. «Ты не можешь игнорировать приглашение Газы Мун!» – говорит она и тычет в вас пальцем. Голубая искра с треском проскакивает между ее ладоней, и она бросает молнию в вашу сторону. Если вы воин, спасения нет. Если маг, можете использовать следующие заклинания:

      Если вы не знаете этих заклинаний, молния поражает вас и ваши обугленные останки падают на землю. Никто не игнорирует приглашение от Газы Мун.
    interaction:
      type: choices
      options:
      - label: Заклинание ZIP
        to: '322'
        if:
          flag: spell_zip
      - label: Заклинание GUM
        to: '434'
        if:
          flag: spell_gum
      - label: Заклинание LAM
        to: '418'
      - label: Заклинание FIL
        to: '304'
      - label: Заклинание SUS
        to: '392'
        if:
          flag: spell_sus
