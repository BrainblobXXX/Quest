    text: Вы идете по петляющей вокруг холмов тропинке большую часть утра. Можете остановиться перекусить, еда восстановит вам 2 очка Выносливости. Около полудня вы видите, что тропа впереди раздваивается. Одна тропа спускается в неглубокую долину, а потом снова поднимается вверх на противоположной стороне. Вторая тропа ведет на подвесной мост, который соединяет склоны холмов напрямую. Вы пойдете по мосту [А] или спуститесь вниз [Б]?
