  '203':
    title: Параграф 203
    text: |-
      Почувствовав вашу враждебность, существо выхватывает из-за пояса короткий меч. Он резко пикирует вниз и вонзает свое оружие вам в руку. Его скорость поразительна, вы не успеваете среагировать и теряете 1 очко Выносливости, прежде чем поймете, что произошло. Вам придется сразиться с маленьким эльвином, но из-за того, что он такой шустрый, вам придется понижать вашу силу атаки в этом бою на 2 очка.

