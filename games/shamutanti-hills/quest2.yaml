  '232':
    title: Параграф 232
    text: |-
      Сейчас уже поздний вечер. Вы переваливаете через гребень очередного холма и видите впереди деревню. Тропа спускается к ней, и вы вслед за ней входите в Торрепани.

      Торрепани населяют Свинны, раса полуорков с угрожающей внешностью. Но войдя в деревню, вы чувствуете атмосферу безысходности, нависшую над этим местом. Свинны не обращают на вас внимания, и вы садитесь на пень в центре деревни, рассматривая чем-то расстроенных существ. Пойдете на постоялый двор, чтобы устроиться на ночлег [А], или попытаетесь вступить в контакт с местными жителями [Б]?
    interaction:
      type: choices
      options:
      - label: Вариант А
        to: '267'
        letter: А
      - label: Вариант Б
        to: '282'
        letter: Б
    mood: calm
  '233':
    title: Параграф 233
    text: Глаза старика вспыхивают от радости, когда вы протягиваете ему топор. «Как он попал к вам?» - восклицает он. Вы рассказываете ему свою историю и дарите топор. Он страшно обрадован и потчует вас выпивкой и закуской (восстановите 2 очка Выносливости, но это не считается полноценной трапезой) и дает вам всевозможные полезные советы и знания. «Первым делом, - говорит он, - вам нужно посетить Хрустальный Водопад, его воды исцеляют и успокаивают. Вот возьмите пропуск, он позволит вам окунуться в водопад бесплатно. Когда покинете Бирританти, чтобы попасть в Кхар, вам придется пройти через Торрепани. Там обитают Свинны, без сомнения их староста, будет пытаться убедить вас помочь найти его дочь. Ее похитили мародеры и собираются принести в жертву чудовищной мантикоре, которая сторожит темную пещеру. Не соглашайтесь на это! Миновав Торрепани, вы за день доберетесь до Кхара. У меня есть хорошие связи там. Если у вас в Кхаре будут какие-либо проблемы, просто обратитесь к моему другу Вику,
      который имеет там власть и влияние». В Кхаре в некоторых случаях при выборе заклинаний вам будет предоставлена возможность применить VIK. Если вам предоставляется такая возможность, вы можете выбрать ее, чтобы воспользоваться помощью друга Гландрагора. В обмен на топор трактирщик также предлагает вам взять у него меч – хорошее, но обычное оружие. На прощание он желает вам всего наилучшего. Восстановите 3 очка Удачи за эту встречу. Теперь вы пойдете к водопаду [А] или на постоялый двор [Б]?
    entry:
    - modify:
        stat: stamina
        delta: 2
    - modify:
        stat: luck
        delta: 3
    - grant:
        item: pass
        count: 1
      once: true
    interaction:
      type: choices
      options:
      - label: Вариант А
        to: '102'
        letter: А
      - label: Вариант Б
        to: '92'
        letter: Б
    mood: danger
  '234':
    title: Параграф 234
    text: |-
      Ворота открыты, но вы опасаетесь идти вперед. Ворота как ворота, но они в два или три раза выше обычных. Но единственный путь вперед лежит через них, так что, соблюдая все меры предосторожности, вы продолжаете свой путь.

      Справа от вас холм круто поднимается вверх и видны входы в две пещеры. Войдете в правую пещеру [А], левую [Б] или продолжите путь по тропе [В]?
    interaction:
