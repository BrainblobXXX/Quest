  '282':
    title: Параграф 282
    text: |-
      Вы подсаживаетесь к группе свиннов, погруженных в серьезную беседу. Они обсуждают своего друга, который, по-видимому, пал ночью от клинка наемного убийцы. Постепенно вам удается вступить в разговор, и вскоре вы узнаете причину депрессии, повисшей над деревней. Банда мародеров похитила дочь местного старосты и принесла ее в жертву могущественному пещерному демону. По словам древнего пророчества, ужасное бедствие обрушится на деревню, если пресечется род старосты – а его дочь была единственной наследницей.

      Вы рассказываете им о своих собственных путешествиях и встречах с различными существами. Они понимают, что имеют дело с настоящим искателем приключений и проявляют к вам большой интерес. Внезапно один из них прыгает на вас, а другой бежит к домам и зовет подмогу. Вас крепко держат, а поскольку противников становится все больше, вы прекращаете сопротивляться. Они отводят вас в хижину на окраине деревни.
