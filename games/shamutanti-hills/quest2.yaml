  '114':
    title: Параграф 114
    text: «Четыре дня назад меня посетил такой же путешественник, как и вы, - объясняет она. - Мошенник листал мою книгу, когда я застала его и бросила ему вызов, но он убежал, забрав эту страницу. Должно быть, он был какой-никакой, а волшебник, учитывая с какой скоростью он исчез. Я послала ему вдогонку заклинание старения, но, должно быть, оно не сработало». Она благодарит вас за то, что вы вернули ей ее имущество, и предлагает показать вам, насколько полезно это заклинание. Она избавит вас от назойливого минимита, если пожелаете. Если вы хотите избавиться от Жана и восстановить способность использовать заклинания, сложите номер страницы, которая у вас была, с номером страницы, на которой должно быть написано продолжение заклинания, и перейдите на параграф с тем же номером, что и результат. Если не хотите расставаться с Жаном или у вас не получилось правильно сложить числа, вы прощаетесь со старухой и отправляетесь в путь – [А].
    interaction:
      type: choices
      options:
      - label: Сложить номера страниц (205)
        to: '205'
        if:
          has_item:
            id: spellbook_page
