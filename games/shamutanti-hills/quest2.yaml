    text: Вы продолжаете путь по тропе, огибая холмы и потихоньку зверея от непрекращающейся болтовни минимита. Вы проходите мимо небольшой деревянной хижины, на пороге которой сидит старая женщина. Она окликает вас и приглашает зайти. Узнаете, что она хочет [А] или проигнорируете ее и пойдете дальше [Б]?
