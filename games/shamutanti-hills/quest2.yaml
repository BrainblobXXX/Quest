  '456':
    title: Параграф 456
    text: |-
      Вы покидаете логово мантикоры и по узкому пути бредете к источнику света. Как вы и надеялись, это выход из пещеры. Протиснувшись наружу, вы оказываетесь на склоне холма. Вы находите тропу и вместе с девочкой возвращаетесь в Торрепани. Староста свиннов безумно счастлив, его дочь спасена, радость охватывает всю деревню и начинается стихийный праздник, проклятие, угрожавшее поселению, снято. Вы свободны и можете покинуть деревню, но решаете задержаться здесь на денек, чтобы залечить свои раны. Местный жрец-целитель полностью исцеляет вас от всех ран, болезней и проклятий, которые могли у вас быть. Восстановите свое Мастерство, Выносливость и Удачу до начальных показателей. Жрец также избавляет вас от назойливого минимита, если он до сих пор вас сопровождает.

      Вы крепко спите всю ночь, а следующим утром отправляетесь дальше. Прежде чем вы уйдете, староста вручает вам два подарка: кошелек с 10 золотыми и большой ключ. «Я знаю, вы идете в Кхар, - говорит староста, - но это злой город, и вы должны быть осторожны. Два года назад путешественник пришел сюда из Кхара и дал мне этот ключ, сказав, что он никогда не вернется назад. Это ключ от городских ворот и с его помощью вы сможете войти в город незамеченным». В следующей части приключения, когда подойдете к южным воротам Кхара, вы можете использовать этот ключ.

      Вы благодарите его и покидаете Торрепани. Вы с честью преодолели первую часть приключения и можете повысить свой текущий и начальный показатель Удачи на 1 очко. Тропа покидает пределы Холмов Шамутанти, и вы спускаетесь по ней мимо рисовых полей к большому опоясанному стенами городу – негласной столице Кахабада Кхару – это следующая ступень на пути к вашей цели. PENGUIN BOOKS
    ending: true
    mood: victory
