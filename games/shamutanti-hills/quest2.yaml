  '194':
    title: Параграф 194
    text: Особая форма лезвия у этого клинка позволяет наносить более тяжелые раны, с каждым ударом он будет наносить не 2, а 3 очка урона. К сожалению, вы не сможете взять этот меч, если у вас уже есть один, торговец заметит его и потребует в качестве доплаты, оставить здесь ваш старый меч. Если считаете, что новый клинок не лучше оставленного, вы можете потребовать вернуть деньги. Испытайте Удачу, если повезет, он вернет вам плату.
