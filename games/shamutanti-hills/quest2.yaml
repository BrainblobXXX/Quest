scenes:
  '1':
    title: Параграф 1
    text: |-
      Вы просыпаетесь на рассвете. Одевшись и позавтракав хлебом и козьим молоком, вы собираете свои вещи. Снаружи живет своей жизнью Форпостный Городок: женское население моет, стирает и готовит пищу, а дневная стража заступает на посты.

      Множество глаз следит за вами, когда вы выходите наружу и идете к Шамутантской Стене. Пограничный народ знает о вашей миссии, и небольшая толпа доброжелателей следует за вами на некотором расстоянии.

      И вот вы стоите перед Кантопанскими Вратами. Их постоянно стерегут Старшие Дозорные, воины, представители древней расы выбранные для этого за свойственное их народу отличное зрение, врата — это последняя черта разделяющая Аналэнд и Кахабад. Вы еще раз проверяете свой рюкзак.

      Завершив ваши приготовления, вы киваете командиру дозора. Сержант в последний раз обводит взглядом местность со смотровой вышки над воротами и отдает приказ отодвинуть засовы. Ворота открыты, и вы делаете первый шаг к подножью Холмов Шамутанти начальному этапу вашего путешествия.

      Сержант спускается вниз и пожимает вам руку: «Я не буду желать вам безопасного пути, дорога впереди небезопасна. Кахабад это коварная земля, населенная настоящими дьяволами. Но это вы итак уже знаете».

      «Тропа перед вами ведет в небольшое торговое поселение Кантопани - большинство ее жителей жулье и ворюги - вы должны добраться туда в течение часа. От Кантопани и далее есть три маршрута через деревню Бирританти к Кхару. Это большой город на реке Джабаджи и негласная столица Кахабада. Затем вы должны пересечь Бакланд, земли, про которые мне ничего неизвестно. Но говорят, что день и ночь в Бакланде контролируются не солнцем, а сверхъестественными силами, также имейте в виду, что, после того как вы покинете Кхар, за вами наверняка будут следить».

      Его предупреждения мало вдохновляют и не внушают вам уверенности. Он продолжает: «Но я наблюдал за вашими тренировками, и вы действительно достойный защитник и поборник правого дела. Я желаю вам удачи и успеха в вашей миссии. Мои мысли и добрые пожелания, как и всего народа Аналэнда будут с вами. Да пребудет с вами Либра, пусть она сохранит вам жизнь и поможет снять проклятие, павшее на наше королевство».

      Вы пожимаете ему руку в ответ и благодарите за добрые слова. Решительно шагнув за ворота, вы проходите сквозь арку. Лица наблюдающих за вами людей преисполнены надежды, которую они возлагают на вас и на успех вашей миссии.

      Помахав рукой на прощание, вы поворачиваетесь лицом к холмам. Свежий утренний воздух чист, а восходящее солнце окрашивает холмы прекрасными цветами, но вся эта красота скрывает притаившиеся впереди опасности и чертовщину.

      Вы решительно шагаете по тропе. Ваше приключение началось!
    interaction:
      type: continue
      to: '178'
    mood: danger
    image: assets/1.jpg
  '2':
    title: Параграф 2
    text: |-
      Выхватив оружие, вы слышите шипение, и прямо перед вами материализуется тело огромного двухвостого змея. Один из его хвостов обвивается вокруг вашей руки, одним рывком, могучее существо швыряет вас в кусты. Потеряйте 1 очко Выносливости. Вы вскакиваете и снова оказываетесь лицом к лицу со змеем.

      Змей

      Мастерство 7 Выносливость 8

      Если победите, то продолжаете идти вперед до тех пор, пока заросли не редеют и становятся просто высокой травой.
    entry:
    - modify:
        stat: stamina
        delta: -1
    interaction:
      type: combat
      mode: pool
      enemies:
      - name: Змей
        count: 1
        attack: 2
        health: 8
      outcomes:
        victory: '105'
    mood: danger
    image: assets/2.jpg
  '3':
    title: Параграф 3
    text: Следуя по проходу, вы оказываетесь на развилке. Повернете налево [А] или направо [Б]?
    interaction:
      type: choices
      options:
      - label: Вариант А
        to: '63'
        letter: А
      - label: Вариант Б
        to: '26'
        letter: Б
    mood: tense
  '4':
    title: Параграф 4
    text: |-
      Клетка надежно заперта. Если у вас есть ключ, можете попробовать его, для этого вам нужно вычесть 10 из выгравированного на нем числа и перейти на параграф с тем же номером. Или применить заклинание:

      Или вы можете попытаться сломать замок – [А].
    interaction:
      type: choices
      options:
      - label: Использовать ключ (44)
        to: '44'
        if:
          has_item:
            id: key
      - label: Сломать замок (142)
        to: '142'
      - label: Заклинание GOP
        to: '443'
      - label: Заклинание DOP
        to: '409'
        if:
          flag: spell_dop
      - label: Заклинание BAM
        to: '320'
      - label: Заклинание PEP
        to: '429'
        if:
          flag: spell_pep
      - label: Заклинание RAZ
        to: '360'
        if:
          flag: spell_raz
    mood: tense
  '5':
    title: Параграф 5
    text: Вы спрашиваете, что за зубы хранятся в сумке, но продавец только говорит, что «разные», и он, конечно, не хочет заранее показать вам содержимое сумки. Сумка стоит 3 золотых, можете купить ее, если хотите – [А].
    interaction:
      type: choices
      options:
      - label: Купить сумку с зубами за 3 золотых (190)
        to: '190'
        effects:
        - modify:
            stat: money
            delta: -3
        - grant:
            item: teeth_bag
            count: 1
        - grant:
            item: goblin_tooth
            count: 4
        - grant:
            item: giant_tooth
            count: 1
      - label: Не покупать (280)
        to: '280'
    mood: victory
  '6':
    title: Параграф 6
    text: Пыль падает на вас с низкого потолка, пока вы осторожно продвигаетесь по проходу. Ненадежные деревянные балки поддерживают стены, и вы спотыкаетесь о них на каждом шагу и ругаетесь сквозь зубы. Внезапно перед вами с потолка падает груда щебня, и треск дерева заставляет вас остановиться. Крыша рушится! Повернетесь и побежите назад к двери [А] или броситесь вперед, чтобы проскочить под падающими камнями [Б]?
    interaction:
      type: choices
      options:
      - label: Вариант А
        to: '66'
        letter: А
      - label: Вариант Б
        to: '128'
        letter: Б
    mood: tense
  '7':
    title: Параграф 7
    text: В конце концов, вам удается спастись бегством от противных маленьких существ. До конца дня вы идете по тропе, пока не увидите впереди деревню на холме. Туда вы и направляетесь.
    interaction:
      type: continue
      to: '28'
    mood: tense
  '8':
    title: Параграф 8
    text: Вы устраиваетесь на кровати и отдыхаете. Снаружи доносится какой-то шум, а затем несколько свиннов врываются в вашу комнату и хватают вас. Прежде чем вы успеваете среагировать, вас уже крепко держат, а поскольку противников становится все больше, вы прекращаете сопротивляться. Они отводят вас в хижину на окраине деревни.
    interaction:
      type: continue
      to: '71'
    mood: danger
  '9':
    title: Параграф 9
    text: 'Вы должны продолжить свое путешествие и выбрать: или тропу ведущую вниз в долину [А], или тропу ведущую в холмы [Б].'
    interaction:
      type: choices
      options:
      - label: Вариант А
        to: '164'
        letter: А
      - label: Вариант Б
        to: '157'
        letter: Б
    mood: tense
  '10':
    title: Параграф 10
    text: В итоге тропа заводит вас в лес и исчезает. Прямо перед вами указатель с надписью «Алианна». Углубитесь в лес [А] или вернетесь на развилку и повернете на север [Б]?
    interaction:
      type: choices
      options:
      - label: Вариант А
        to: '150'
        letter: А
      - label: Вариант Б
        to: '46'
        letter: Б
    mood: danger
  '11':
    title: Параграф 11
    text: Вы достаете бамбуковую флейту и начинаете играть. Каким-то образом невидимые музыканты адаптируют свою мелодию к вашему звучанию, и вы вместе весело играете полчаса или около того. Восстановите 3 очка Выносливости и 1 очко Удачи. Затем вы встаете и покидаете хижину и деревню.
    entry:
    - modify:
        stat: stamina
        delta: 3
    - grant:
        item: flute
        count: 1
      once: true
    interaction:
      type: continue
      to: '196'
    mood: calm
  '12':
    title: Параграф 12
    text: Когда существа видят вас, они все указывают в вашу сторону и взволнованно болтают друг с другом. Один из них поднимается в воздух и, облетев вокруг, зависает над вами, чтобы рассмотреть поближе. Попытаетесь поговорить с ним [А] или будете стоять на месте и подготовитесь к оборонительным действиям [Б]?
    interaction:
      type: choices
      options:
      - label: Вариант А
        to: '113'
        letter: А
      - label: Вариант Б
        to: '203'
        letter: Б
    mood: tense
  '13':
    title: Параграф 13
    text: Вы идете по тропе, которая круто спускается в узкую долину. Вы пересекаете речку по деревянному мосту и начинаете подъем на следующий холм. На половине пути вы слышите, как в кустах трещат ветки и внезапно большое похожее на медведя существо появляется перед вами. У него черно-белый мех и длинный пушистый хвост, который тянется за ним. Животное преграждает вам путь и угрожающе рычит. Сразитесь с ним [А] или попытаетесь разойтись с ним мирно [Б]?
    interaction:
      type: choices
      options:
      - label: Вариант А
        to: '252'
        letter: А
      - label: Вариант Б
        to: '236'
        letter: Б
    mood: tense
    image: assets/13.jpg
  '14':
    title: Параграф 14
    text: Оставив деревню позади, вы входите в лес. Вы находите подходящее защищенное от непогоды место недалеко от тропы. Разобьете здесь лагерь [А] или будете идти вперед всю ночь [Б]?
    interaction:
      type: choices
      options:
      - label: Вариант А
        to: '108'
        letter: А
      - label: Вариант Б
        to: '49'
        letter: Б
    mood: victory
  '15':
    title: Параграф 15
    text: Умирающий огр делает последний вздох, а вы осматриваете комнату. Вы догадываетесь, что огр дробил руду в поисках содержащихся внутри драгоценных камней. Вы тоже пытаетесь размолоть несколько булыжников, как это делало существо, но вам не хватает силы повернуть ручку. Однако на столе среди перемолотой руды вы находите два драгоценных камня. Каждый стоит 10 золотых, но если вы захотите купить что-нибудь на них, вам придется целиком обменять их на какой-то один предмет. Другими словами, вам возможно придется потратить целый драгоценный камень, например, на покупку предмета стоимостью всего в 2 золотых (но остановившись на постоялом дворе, можете одним камнем оплатить и еду и ночлег). Вы выходите из комнаты и возвращаетесь на развилку.
    interaction:
      type: continue
      to: '144'
    mood: calm
  '16':
    title: Параграф 16
    text: Этот проход ведет под наклоном вниз, и вы скоро добираетесь до развилки. Повернете направо [А] или налево [Б]?
    interaction:
      type: choices
      options:
      - label: Вариант А
        to: '174'
        letter: А
      - label: Вариант Б
        to: '151'
        letter: Б
    mood: tense
  '17':
    title: Параграф 17
    text: «В этом лесу я собрала много различных магических артефактов, - говорит она. - Освободите меня из клетки, и я дам вам три полезных предмета». Теперь поможете ей [А] или предпочитаете пошарить по дому без спросу [Б]?
    interaction:
      type: choices
      options:
      - label: Вариант А
        to: '4'
        letter: А
      - label: Вариант Б
        to: '213'
        letter: Б
    mood: tense
  '18':
    title: Параграф 18
    text: Вы садитесь и перекусываете, не упуская возможность полюбоваться прекрасным видом на холмы. Если вы уже ели сегодня после того, как покинули Аналэнд, то восстанавливаете только 1 очко Выносливости, если это первая трапеза после завтрака, то восстанавливаете 2 очка. Вы снова встаете и продолжаете путь.
    interaction:
      type: continue
      to: '168'
    mood: tense
  '19':
    title: Параграф 19
    text: Тропа вьется по склону холма, и поднявшись на вершину, вы в восхищении останавливаетесь перед полосой травы, за которой растут самые прекрасные и изящные цветы из виденных вами.
    interaction:
      type: continue
      to: '40'
    mood: tense
  '20':
    title: Параграф 20
    text: |-
      Этот зверь скунсомедведь, он задирает хвост и выпускает вонючую струю. Запах тошнотворный, но вам все равно придется сражаться.

      Скунсомедведь

      Мастерство 7 Выносливость 5

      Из-за чудовищного запаха вам придется снижать в этом бою свою силу атаки на 2 очка. Если одолеете зверя.
    interaction:
      type: combat
      mode: pool
      enemies:
      - name: Скунсомедведь
        count: 1
        attack: 2
        health: 5
      outcomes:
        victory: '193'
    mood: danger
  '21':
    title: Параграф 21
    text: Вы находите подходящее место для отдыха в стороне от деревни. Вдалеке от шумного фестиваля вы сможете неплохо выспаться. Минимит сворачивается клубочком рядом с вами. Можете поесть, если хотите. Пища восстановит вам 2 очка Выносливости, если уже ели сегодня, то только 1 очко. Ночной отдых восстанавливает вам еще 3 очка Выносливости.
    interaction:
      type: continue
      to: '67'
    mood: danger
  '22':
