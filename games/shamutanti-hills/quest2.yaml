    text: Она громко кричит вам вслед и приказывает вернуться. Кажется, она очень возмущена тем, что вы игнорируете ее, и предупреждает вас, что это не останется безнаказанным. Жану становится любопытно, и он предлагает вам вернуться. Если решили передумать и посмотреть, чего она хочет – [А]. Если продолжаете путь – [Б].
    interaction:
