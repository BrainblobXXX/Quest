    text: У одного из торговцев есть друг, которому нужно выкопать новую выгребную яму на заднем дворе. Это займет у вас большую часть ночи, но вас накормят и заплатят. Если вас заинтересовало это предложение – [А], если нет, то идете на постоялый двор – [Б].
    interaction:
      type: choices
      options:
      - label: Вариант А
        to: '201'
        letter: А
      - label: Вариант Б
        to: '134'
        letter: Б
    mood: tense
  '230':
    title: Параграф 230
    text: Вы входите в таверну и зовете владельца. Гландрагор выходит вам навстречу, он добрый малый и всегда рад поговорить с незнакомцем. Но он не только гостеприимный хозяин, но и бизнесмен, если хотите, чтобы он уделил вам время, купите кружку пива за 2 золотых. Если закажете выпивку и завяжете разговор – [А]. Если хотите вместо денег сделать ему подарок – [Б]. Если не будете пить здесь, а пойдете на постоялый двор – [В].
    interaction:
      type: choices
      options:
      - label: Вариант А
        to: '191'
        letter: А
      - label: Вариант Б
        to: '182'
        letter: Б
      - label: Вариант В
        to: '92'
        letter: В
    mood: victory
  '231':
    title: Параграф 231
    text: |-
      Далее на реке еще один мост, через который и ведет тропа. Вы пересекаете мост и начинаете подъем в холмы. Тропа петляет в стороны и плавно ведет все выше и выше. Внезапно вам в голову попадает желудь, и вы слышите хихиканье с верхушек деревьев. Подняв голову, вы видите крошечные фигуры, перелетающие с ветки на ветку. В вас попадает еще один желудь, а затем еще и еще. Эльвины наверху совсем распоясались. Вы должны применить заклинание для своей защиты.

      Если не будете применять магию – [А].
    interaction:
