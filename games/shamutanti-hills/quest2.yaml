    text: |-
      Он шагает вперед, говоря, что чуть дальше справа вы найдете деревенский постоялый двор.

      Сделав этот выбор, вы обнаружили одно из правил игры, которое в противном случае стало бы известным вам только методом проб и ошибок. Приключение делится на дни, и каждый день вам нужно будет хотя бы один раз поесть, иначе вы будете терять очки Выносливости из-за недоедания. В течение дня вам будут предложены варианты: или съесть порцию еды из вашего рюкзака, или купить еду в местных постоялых дворах. Если вы проведете день без еды, вы будете страдать от голода. Когда наступит ночь, вам будет предоставлен выбор - лечь спать или продолжать идти вперед всю ночь. Так же как и с едой, отсутствие отдыха и сна будет утомлять вас, а ночной отдых обычно будет восстанавливать силы. Но вам придется каждый раз с осторожностью выбирать время для еды и сна, так как иногда место для отдыха и приема пищи, которое кажется безопасным, может таить скрытые опасности.

      Вы идете вперед туда, куда вам указал местный житель.
    interaction:
      type: continue
      to: '257'
    mood: calm
  '199':
