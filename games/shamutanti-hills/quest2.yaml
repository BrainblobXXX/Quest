    text: Вы продолжаете подъем на гребень холма. Подъем крутой, но к середине дня вы добираетесь до вершины. Вы продолжаете свой путь по пологим спускам с другой стороны гряды до конца дня.
    interaction:
      type: continue
      to: '220'
    mood: danger
  '238':
