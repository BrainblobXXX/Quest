    text: |-
      Вы присаживаетесь и начинаете беседу с комментария о состоянии дорог в это время года. Старик хмыкает в знак согласия. В конце концов, тишина в пивной снова сменяется шумной болтовней, а вы завязываете разговор со стариком. Его ферма находится на окраине деревни, он повидал многих из тех, кто приходил и уходил из Кристатанти. Он слышал о пропаже Короны Королей, но его мало интересует дела внешнего мира. Вы немного рассказываете о себе, и вскоре вы оба от души смеетесь, обмениваясь шутками о гоблинах. В конце концов, он встает и прощается. «Из Кристатанти ведут две дороги, незнакомец, - говорит он. – Первая ведет мимо дома Алианны, и вам понадобится вся ваша смекалка, если повстречаете ее. Вторая тропа ведет через холмы в Леа-Ки, владение великанов. Я желаю вам удачи, пусть Синдла благословит ваш путь. Возможно, это поможет вам». Он дает вам похожий на яблоко фрукт, который он вырастил на своей ферме. Это Бома, он очень питательный, и если вы съедите его вместе с обычной едой, он удвоит полученное вами количество очков Выносливости. Вы благодарите его и желаете доброй ночи.

