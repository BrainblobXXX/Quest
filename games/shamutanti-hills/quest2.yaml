    text: Она проклинает вас, пока вы шарите по ее хижине. Это проклятие не просто слова, отныне вы должны уменьшить на 2 очка ваше Мастерство, пока не найдете способа снять проклятие. Вы наскоро осматриваете ящики и шкафы, но находите только сумку с мягким коричневым песком (на 1 применение) и 2 золотых. Можете взять их, если хотите, затем вы покидаете дом и возвращаетесь на развилку.
