  '240':
    title: Параграф 240
    text: «В моем доме хранится повязка Рагнара Владыки Клинков, которую я с радостью отдам вам, если вы меня освободите», - обещает она. Постараетесь освободить ее [А] или решите обокрасть дом [Б]?
    interaction:
