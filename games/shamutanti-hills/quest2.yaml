  '216':
    title: Параграф 216
    text: Вы присоединяетесь к компании Эльвинов – это озорной народец, маленькие полулюди, любящие проказы и шалости. Они живут в деревне недалеко от реки и ведут вас туда. Время от времени они исчезают, а когда вы нервно оглядываетесь, внезапно появляются перед вами, заставляя вас подпрыгивать от неожиданности. Они могут по своему желанию заставлять свою кожу светиться и гаснуть, и другое их любимое развлечение - гасить свечение и падать вам под ноги. Чаще всего это приводит к тому, что вы спотыкаетесь, к большому удовольствию всей честной компании, за вашим исключением. Тем не менее, вы сдерживаетесь. Но, кажется, вы замедляете их продвижение, и через час или около того они устают от вас и исчезают в лесу рядом с рекой. Вы напрасно ждете их возвращения и, в конце концов, решаете найти себе другое укрытие на ночь. Вы снова просыпаетесь на рассвете и продолжаете путь по тропе.
    interaction:
      type: continue
      to: '148'
    mood: danger
  '217':
    title: Параграф 217
    text: |-
      Вы натыкаетесь на группу из трех гоблинов, которые атакуют вас, размахивая своими кирками.

      Первый гоблин

      Мастерство 5 Выносливость 4

      Второй гоблин

