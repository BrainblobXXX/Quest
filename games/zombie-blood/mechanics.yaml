# Бои. Движок MVP ведёт полный бой для всех 39 сцен.
# Параметры, которых книга не называет, взяты из правил во «Введении»:
# у зомби 1 очко Выносливости, каждый выживший снимает 1 очко Выносливости за раунд.
# Для продолжений после гранаты/первого залпа используется preDamage (тот же бросок
# разыгрывается в начале боя), для Конга — threshold, для §375 — preStamina.
# lose в книге не указан: при нуле Выносливости показывается общий экран поражения.

