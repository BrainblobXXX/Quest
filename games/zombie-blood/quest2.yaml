  '214':
    title: Параграф 214
    text: Ученые застигнуты врасплох, когда вы врываетесь в двери и наставляете на них оружие. Они немедленно поднимают руки, чтобы сдаться. Вы говорите им, следовать мимо лифта и войти в первую камеру за ним. Когда проходите мимо лифта, ученый с бритой головой, как бы случайно, роняет свой планшет. Он наклоняется, чтобы поднять его, а потом резко выпрямляется и пытается всадить в вас шприц с зараженной кровью. Бросьте кубик. Если выпадет 1-3. Если выпадет 4-6.
