  '296':
    title: Параграф 296
    text: 'В верхнем ящике вы находите ручки, бумагу, линейку, карманный калькулятор, степлер, дырокол и зарядное устройство для телефона. В следующем ящике вы находите несколько открыток с изображением замка. На одной из них есть короткое поздравление с днем рождения, но нет адреса. Там просто написано: «Счастливого 30-тилетия Загор», и подпись Юрра внизу. Вы спрашиваете Эми, не знает ли она, кто такой Загор, но она лишь озадаченно качает головой. В нижнем ящике нет ничего, кроме блокнота с надписью «Важная информация» на обложке. Вы листаете блокнот и читаете две записи, которые могут быть полезны. Первый – «Имя пользователя – Белый Кролик». Вторая – «Розник должен получить 100 долларов за кровь». Эми говорит, что профессор Розник главный ученый Юрра и что он очень опасный человек. Вы вырываете эти две страницы из блокнота и спрашиваете Эми, не знает ли она, куда ведет задняя дверь. «Это личный кабинет Гингрича Юрра», - отвечает она. Вы не ждете приглашения, чтобы открыть дверь.'
    mood: calm
    interaction:
      type: continue
      to: '238'
  '297':
    title: Параграф 297
    text: 'Вы открываете множество коробок, но не находите внутри ничего, кроме игр. Однако в стене вы видите дверцу небольшого сейфа, который раньше был спрятан за коробками с играми. На лицевой стороне сейфа написано: «Используйте латунный ключ», - очевидно, напоминание владельцу. Если у вас есть латунный ключ, обратитесь к параграфу с тем же номером, что и число на ключе. Если у вас нет латунного ключа, можете попытаться взломать сейф. Если у вас есть лом - [А]. Если вам нечем открыть сейф, вам придется выйти из комнаты и пойти дальше по коридору - [Б]. Если у вас есть латунный ключ — [В].'
    mood: calm
    interaction:
      type: choices
      options:
      - label: Вариант А
        to: '362'
        letter: А
        if:
          has_item:
            id: crowbar
      - label: Вариант Б
        to: '129'
        letter: Б
      - label: Вариант В
        to: '111'
        letter: В
        if:
          has_item:
            id: brass_key
    prop:
      image: assets/furniture/crates/crate-worn-empty.png
  '298':
    title: Параграф 298
    text: Вы осматриваете сцену кровавой бойни в комнате. Вы почти чувствуете жалость к зомби, эти беспомощные потерянные души были когда-то человеческими существами, прежде чем быть преобразованными Гингричем Юрром и его злыми слугами. В левой стене комнаты есть еще одна железная дверь, тоже запертая на висячий замок и засов. С помощью пронумерованных ключей вы открываете и ее. Вы снова оказываетесь в мрачном коридоре. Вход в лабораторию находится слева от вас, а за ним распашные двери. Справа вы видите, что коридор продолжает вести вперед на некоторое расстояние. Вы решаете повернуть направо, идя по коридору туда, где он заканчивается у пожарной двери. Идти больше некуда, поэтому вы открываете эту дверь.
    mood: calm
    interaction:
      type: continue
      to: '172'
  '299':
    title: Параграф 299
    text: Скованный кандалами и ослабевший от голода, вы не можете поднять ноги достаточно высоко в воздух. Отто легко парирует ваш удар. «Ты заплатишь за это», - говорит он глубоким хриплым голосом, в гневе опрокидывая вашу миску с едой. Все еще разъяренный, он несколько раз со злостью пинает вас под ребра. Боль ужасная, и вы теряете сознание. Когда приходите в себя, вы не можете поверить своим глазам. Вы находитесь в большой комнате без окон, освещенной неоновыми лампами. Вы прикованы к гладкой каменной плите, окруженной визжащими зомби. Они становятся очень оживленными, когда видят, как открываются ваши глаза. Они придвигаются ближе, чтобы посмотреть, как высокий худой человек в очках в длинном белом лабораторном халате и резиновых перчатках впрыскивает вам в шею кровь зомби. Ученый хихикает, когда говорит вам, что вы вот-вот станете новобранцем в армии зомби Гингрича Юрра. Ваше приключение закончилось.
    mood: grief
    ending: true
  '300':
    title: Параграф 300
    text: Вы роетесь в своей сумке, ища что-нибудь, что могло бы помочь открыть раздвижные двери. Если у вас есть ножовка -[А]. Если ее у вас нет - [Б].
