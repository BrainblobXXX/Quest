    text: Вы выглядываете из окна спальни и видите, что двор находится примерно в двадцати метрах ниже. В отчаянии вы выбрасываете из окна подушки, постельное белье и матрас, надеясь приземлиться на них, чтобы смягчить падение. Вы привязываете к оконной раме простыню, вылезаете наружу и опускаетесь по ней вниз, насколько это возможно. Вы делаете глубокий вдох и разжимаете руки. Вы падаете на усыпанный гравием двор. К несчастью, вы приземляетесь на голову и ломаете шею. Ваше приключение закончилось.
    mood: grief
    ending: true
  '164':
    title: Параграф 164
    text: Слева вы видите распашные двери, а справа еще одну железную дверь в правой стене. За дверью коридор продолжается идти вперед еще на некоторое расстояние. Вы пытаетесь открыть железную дверь, но обнаруживаете, что она заперта и снаружи нет замочной скважины. Вы идете по коридору туда, где он заканчивается у пожарной двери. Идти больше некуда, поэтому вы открываете эту дверь.
    mood: calm
    interaction:
      type: continue
      to: '172'
  '165':
    title: Параграф 165
    text: Вы не смогли убить всех зомби в замке Горай. Вскоре после того, как вы сбежали, уцелевшие зомби вырвались через главные ворота, которые остались открытыми. Теперь они бесчинствуют в округе, кусая и заражая всех, с кем сталкиваются. В конце концов, ночью они добираются до Мелиса, где заражают всех в деревне, пока те спят, включая вас. К рассвету вы будете бежать рядом с ними, еще один безмозглый зомби в армии нежити. Ваше приключение закончилось.
    mood: grief
    ending: true
  '166':
    title: Параграф 166
    text: Как только вы вводите имя, экран сразу же гаснет и ноутбук выключается. Вы с разочарованием захлопываете его. Эми пытается успокоить вас, говоря, что не воспользоваться сейчас ноутбуком это еще не конец света.
    mood: calm
    interaction:
      type: continue
      to: '158'
  '167':
    title: Параграф 167
    text: Дротик пролетает мимо и вонзается в книгу на одной из полок позади вас. Повезло! Вы внимательно изучаете переключатель и видите, что он может находиться в трех положениях. В центре, где он был, когда вы вошли, положение «вниз», которое активирует ловушку, и положение «вверх». Если теперь хотите перевести тумблер вверх - [А]. Если не хотите рисковать и предпочитаете немедленно покинуть библиотеку - [Б].
    mood: tense
    interaction:
      type: choices
      options:
      - label: Вариант А
        to: '41'
        letter: А
      - label: Вариант Б
        to: '160'
        letter: Б
  '168':
    title: Параграф 168
    text: Зрелище бойни не останавливает следующую волну зомби, по призыву сирены они вбегают во двор. Они карабкаются по телам своих павших товарищей, каждый из них отчаянно хочет добраться до вас первым. Вы вставляете еще одну ленту в патронник крупнокалиберного пулемета. Вы уже готовы стрелять, когда слышите, как позади вас распахиваются балконные двери. Двое ученых, один из них с лысой головой и повязкой на глазу, выскакивают на балкон, размахивая топорами. Их серые лица покрыты открытыми ранами и кровоточащими язвами. Они оба превратились в зомби! У вас нет времени, чтобы схватить оружие, и вам придется сражаться с ними голыми руками (1d6-3). Зомби с топором атакуют первыми, каждый из них наносит 2 очка урона. Уменьшите свою Выносливость на 4 очка.
    mood: danger
    image: assets/images/168-1.jpg
    interaction:
      type: combat
      mode: pool
      enemies:
      - name: Зомби с оружием
        count: 2
        attack: 2
        health: 1
      restrictions:
