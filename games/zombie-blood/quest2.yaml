    text: Вы все время повторяете Эми, что все будет хорошо, но не можете убедить ее. Она умоляет вас отправиться вместе с ней на поиски помощи, утверждая, что было бы лучше, если бы власти послали сюда армию, чтобы разобраться с зомби. Вы отвечаете, что к тому времени, когда прибудет армия, может быть уже слишком поздно. Вы говорите, что вам пора возвращаться в замок, и предлагаете ей, идти вдоль опушки леса, следуя по дороге, но стараясь, чтобы никто ее не увидел. Вы машете рукой на прощание, говоря, что скоро увидитесь. Вам не потребуется много времени, чтобы вернуться в замок, где, к вашему великому удивлению, вы видите, что главные ворота все еще не заперты. Вы открываете одну из створок и незаметно проскальзываете внутрь, закрывая ее за собой. Вы поворачиваете налево, идете по южному крылу, а затем на север по западному к лестнице на стыке с северным крылом. Вы собираетесь спуститься по лестнице в подвал, когда замечаете телескоп, установленный на столе впереди.
