  '368':
    title: Параграф 368
    text: Прикрыв рукой лицо, вы врезаетесь в циферблат часов, окончательно разбивая стекло. Вы падаете, как камень, махая руками и ногами в воздухе, пытаясь удержаться в вертикальном положении. Когда приземляетесь, вы делаете кувырок в попытке смягчить падение. Но двенадцать метров это слишком много при приземлении на твердую крышу. Бросьте два кубика и вычтите результат из вашей Выносливости. Над вами происходит мощный взрыв, кровля часовой башни разлетается в стороны. Сверху на вас падает мусор - осколки камня, дерева, детали часов и даже нога зомби. Если все еще живы.
