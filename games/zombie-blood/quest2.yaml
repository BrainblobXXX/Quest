  '326':
    title: Параграф 326
    text: Вы подбегаете к двери, но обнаруживаете, что она заперта. В замке есть ключ, но вы не успеваете его повернуть, вас настигают собаки. Передние трое прыгают на вас, разинув пасти и рыча. Вы должны защищать себя с помощью любого оружия, которое у вас есть под рукой. Вас атакует 17 собак, у каждой 1 очко Выносливости и каждая наносит 1 очко урона.
    mood: danger
