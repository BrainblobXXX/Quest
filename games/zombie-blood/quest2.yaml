  '47':
    title: Параграф 47
    text: 'На лестничной площадке постелен ковер, а стены оклеены яркими узорчатыми обоями. На стенах висят натюрморты, зеркала и гравюры, но ничего полезного для вас. Вы идете дальше, пока не дойдете до угла, где коридор резко поворачивает направо. За углом вы видите белую дверь в левой стене примерно в двадцати метрах впереди. Вы подходите к ней и видите вывеску, нарисованную на ней черными буквами, которая гласит: «Ночной игровой клуб». Если хотите открыть дверь - [А]. Если предпочитаете идти дальше - [Б].'
