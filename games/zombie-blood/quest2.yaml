              id: grenade
    encounter:
      id: zombie-horde-17
      name: Зомби без оружия
      count: 27
      item: grenade
  '340':
    title: Параграф 340
    text: Граната отскакивает от пола в вашу сторону, и почти сразу же раздается оглушительный взрыв, который громким эхом разносится по коридору. Взрывная волна сбивает вас с ног и с силой швыряет к стене. К счастью для вас, бронежилет принимает на себя основную тяжесть удара. Единственная травма, которую вы получаете, - это маленький осколок, который застрял в вашей ноге. Потеряйте 3 очка Выносливости. Зомби не так удачлив. Он лежит неподвижно на каменном полу, разорванный взрывом. Вы не теряете времени и спешите дальше по коридору, пока не натыкаетесь на дверь в левой стене. Когда подходите к ней, вы слышите громкий лай, доносящийся с другой стороны двери. Если хотите открыть дверь - [А]. Если предпочитаете двигаться дальше - [Б].
    mood: danger
    entry:
    - modify:
        stat: stamina
        delta: -3
    interaction:
      type: choices
      options:
      - label: Вариант А
        to: '26'
        letter: А
      - label: Вариант Б
        to: '276'
        letter: Б
  '341':
    title: Параграф 341
    text: Вскоре вы подходите к рядам камер, расположенных по обе стороны коридора. В передней части каждой камеры железные решетки от пола до потолка со встроенными дверями. Все они открыты. Из клеток исходит ужасная вонь, вы узнаете гнилостное зловоние зомби. Но их нигде не видно. Может быть, их выпустил Борис? Вы идете дальше и приходите к лестнице, ведущей наверх. Вы поднимаетесь по ней и оказываетесь на первом этаже северного здания замка рядом с тем местом, где к нему примыкает западное крыло. Вы находитесь в одном конце длинного коридора, который поворачивает направо в дальнем конце, а рядом с вами слева поворот в западное крыло. В середине коридора есть две двери, расположенные друг напротив друга. Та, что справа, кажется, выходит во внутренний двор. На столе рядом с этой дверью установлен телескоп. Внезапно из-за угла в дальнем конце коридора появляется молодая блондинка в джинсах и белой футболке, с небольшой сумкой на плече. Она бежит, то и дело оглядываясь, как будто кто-то ее
      преследует. Прежде чем вы успеваете окликнуть ее, она открывает дверь слева от вас, как раз в тот момент, когда из-за угла появляется стая зомби, преследующая ее по горячим следам. Девушка быстро закрывает за собой дверь. Зомби начинают биться в нее, и вы слышите, как девушка кричит. У вас нет выбора, кроме как прийти к ней на помощь и сразиться с зомби, все их семнадцать.
    mood: danger
    image: assets/images/341-1.jpg
    interaction:
      type: combat
      mode: pool
      enemies:
      - name: Зомби без оружия
        count: 17
        attack: 1
        health: 1
      outcomes:
        victory: '245'
  '342':
    title: Параграф 342
    text: Дверь ведет в ярко освещенную комнату, оборудованную тренажерами по последнему слову техники. Здесь есть беговые тренажеры, гребные тренажеры, беговые дорожки, велотренажеры, гири и скамейки. Но на полу много мусора, и все оборудование выглядит так, как будто оно не использовалось в течение длительного времени. В дальнем углу комнаты стоит кулер с водой, его бумажные стаканчики вырваны из держателя и разбросаны по блестящему черному полу. Если вы хотите взять чашку и выпить воды - [А]. Если предпочитаете закрыть дверь и идти дальше - [Б].
    mood: calm
    interaction:
