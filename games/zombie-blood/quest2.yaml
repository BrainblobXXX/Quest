  '289':
    title: Параграф 289
    text: Человек, стреляющий в вас, один из ученых, работающий на Юрра. На таком расстоянии ему будет трудно во второй раз промахнуться по вам из автомата. Он осыпает коридор градом пуль, и вы с Эми погибаете под шквалом свинца. Ваше приключение закончилось.
    mood: grief
