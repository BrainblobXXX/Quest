  '376':
    title: Параграф 376
    text: Вы очень хотите пить и глотаете жидкость, которая на вкус гораздо лучше, чем пахнет. К сожалению, в ней содержится смертельный яд - цианид! Яд действует быстро, и вы падаете на колени, схватившись за живот. Вы теряете сознание и никогда не придете в себя. Ваше приключение закончилось.
