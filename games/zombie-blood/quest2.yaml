        letter: В
  '323':
    title: Параграф 323
    text: |-
      Вы поднимаете трубку и пытаетесь позвонить, но телефонная линия не подключена к внешнему миру. Все, что вы можете сделать, это звонить по дополнительным номерам внутри замка. Если вы знаете номер Гингрича Юрра и хотите набрать его, обратитесь к параграфу с тем же номером. Если вы не знаете номер и хотите включить ноутбук.

      Набрать добавочный номер Юрра (121) — [А]. Набрать число 333 — [Б]. Включить ноутбук — [В].
