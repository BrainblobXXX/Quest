  '118':
    title: Параграф 118
    text: Несмотря на то, что он пытался убить вас, вы опечалены смертью Бориса. Он был просто жертвой безумного плана Гингрича Юрра; он не знал, что его превратили в зомби, и не осознавал, что делает. Мысленно извинившись перед Борисом, вы быстро обыскиваете его карманы и обнаруживаете маленький фонарик. Вы встаете и клянетесь выследить Юрра, чтобы отомстить за беднягу Бориса. Если хотите открыть стальную дверь - [А]. Если хотите пройти мимо двери - [Б].
