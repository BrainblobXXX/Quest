  '195':
    title: Параграф 195
    text: Вы ошеломлены ударом, но сумели удержаться на ногах. Вы поворачиваетесь, стреляете в ударившего вас зомби и смотрите, как он падает. Голова идет кругом, вы натыкаетесь на стену и нечаянно задеваете выключатель. Комната сразу же освещается рядами неоновых ламп, закрепленных на низком потолке. Здесь нет никакой мебели. На цоколе посередине стоит лишь окровавленная плита из полированного камня, к каждому углу которой прикреплены кандалы и цепи. Девять зомби лежат мертвыми на полу, а еще девятнадцать остались в живых, они замерли, прикрывая глаза от слишком яркого света. Вы используете свой шанс и начинаете стрелять.
