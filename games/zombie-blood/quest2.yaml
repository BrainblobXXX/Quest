    text: Большинство шкафчиков пусты, за исключением одного, в котором вы находите кожаный бумажник. В нем несколько квитанций, две клубные членские карточки, кредитка, 4 доллара и листок бумаги с числом 333, нацарапанным карандашом. Вы кладете в карман бумажник и листок бумаги, прежде чем выйти из комнаты.
