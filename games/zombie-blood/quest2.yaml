  '219':
    title: Параграф 219
    text: Кто-то стреляет в вас через маленькое, похожее на амбразуру окошко в стене позади вас. Это один из ученых приспешников Юрра. С такого близкого расстояния промахнуться невозможно. Две пули попадают вам в спину. Эми истерически кричит, когда вы падаете на пол. Она пытается помочь вам, применив аптечку, но уже слишком поздно. Ваше приключение закончилось.
    mood: grief
    ending: true
  '220':
    title: Параграф 220
    text: Вы продолжаете идти по коридору, поворачиваете налево и вскоре оказываетесь на перекрестке. Слева от вас есть еще один коридор, он ведет туда, откуда вы только что пришли. Прямо впереди коридор через некоторое расстояние резко поворачивает налево. Справа от вас широкая устланная ковром лестница, на этот раз ведущая вниз. Снизу раздается громкий стук и крики. Вы решаете выяснить, что это, держите оружие в руках и готовитесь к бою.
    mood: calm
    interaction:
      type: continue
      to: '176'
  '221':
    title: Параграф 221
    text: 'Спальня большая и роскошно оформленная, с бордовыми обоями из флока. Огромная кровать сделана из темного дуба, ее толстые угловые стойки украшены резьбой в виде переплетающихся змей. На двух прикроватных тумбочках, также сделанных из дуба, стоят современные лампы с оранжевыми абажурами. Комната представляет собой собрание изысканного антиквариата: туалетный столик, стулья, шкаф, письменный стол с кожаной столешницей, подставка для растений, большое вращающееся зеркало, красивый комод XVIII века и несколько изящных статуэток на полке над мраморным камином. Вы смотрите в окно, вниз, во внутренний двор, и видите множество зомби, толпящихся вокруг, выглядящих сердитыми и растерянными. Гингрича Юрра нигде не видно. Есть большая дверь в стене спальни с левой стороны от кровати и двойные распашные двери в стене справа от кровати. Если вы хотите обыскать комнату - [А]. Если хотите пройти через двойные двери - [Б]. Если хотите открыть большую дверь - [В].'
    mood: danger
    interaction:
      type: choices
      options:
      - label: Вариант А
        to: '137'
        letter: А
      - label: Вариант Б
        to: '76'
        letter: Б
      - label: Вариант В
        to: '183'
        letter: В
    prop:
      image: assets/furniture/closets/closet-wood-closed.png
  '222':
    title: Параграф 222
    text: Вы входите в маленькую ванную комнату. Ничто не бросается в глаза, кроме маленького шкафчика с зеркальной дверцей, прикрепленной к стене над раковиной. Вы открываете его и с удовольствием находите несколько бинтов и аптечку. Вы возвращаетесь в спальню и замечаете, что ящик прикроватной тумбочки слегка приоткрыт. Ваше любопытство берет вверх, и вы открываете ящик. Если вы его еще не осматривали, то находите заряженный пистолет (1d6+2), расческу, пустой кошелек, несколько писем, ручку и дневник. Все письма адресованы девушке по имени Эми Флетчер. Они были написаны ее тетей Хелен из Нью-Йорка. В ранних письмах она писала о своем неодобрении по поводу того, что Эми собирается работать кухаркой у человека сомнительной репутации в замке в отдаленной части Румынии. Она спрашивает, хорошо ли устроилась Эми и когда она вернется домой в Нью-Йорк. Более поздние письма уже умоляют ее вернуться домой. По мере того как проходят месяцы, ее письма становятся все более паническими, тетя Хелен «ужасно
      беспокоится» о том, что Эми написала ей, например, о том, что видела «людей в белых халатах» и Гингрича Юрра, ведущих себя «очень странно», и слышала «ужасные крики», доносящиеся из подвала. Вы кладете письма на стол и уже собираетесь взять дневник, как вдруг слышите шум снаружи. Это звук шагов, идущих по коридору. Если вы хотите выяснить, кто это - [А]. Если хотите закрыть и запереть дверь спальни - [Б].
