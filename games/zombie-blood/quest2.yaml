  '229':
    title: Параграф 229
    text: 'После того как передадите деньги Борису, он рассказывает вам, что Гингрич Юрр - безумный мегаломаньяк, одержимый идеей мирового господства. В своем извращенном уме он считает, что единственный способ сделать это -возглавить армию зомби, чтобы завоевать человечество. Юрр презирает всех людей, терпит только своих ученых и нескольких слуг и то по необходимости. Ученые помогают ему в осуществлении его коварного плана. Они годами экспериментировали в его подземной лаборатории, разрабатывая мутаген. Они обнаружили, что могут превращать физически слабых людей в безмозглых зомби, вводя им кровь, зараженную этим мутагеном. За последний год приспешники Юрра похитили сотни жертв, которых держали взаперти и морили голодом, пока они не ослабели настолько, чтобы стать материалом для армии зомби. Зомби содержатся под землей в полутьме, запертые в огромных подвалах. Некоторым из них иногда позволяется побродить по замку для развлечения Юрра. Ему нравится смотреть, как они сходят с ума от ярости
      и жаждут крови. Борис уверен, что однажды Гингрич впрыснет и себе зараженную кровь, чтобы повести свою армию зомби против всего мира. «Неудивительно, что мы хотим убраться отсюда до наступления этого дня, - хмурится Борис. - Мы заработали здесь приличные деньги, но нам не разрешают уехать, так что все это немного бессмысленно. Мы с Грегором надеемся подкупить одного из ученых, чтобы он вытащил нас из этой дыры как можно скорее. Это будет настоящий Армагеддон, когда Юрр выпустит своих зомби наружу. Но, может быть, вы хотите остановить его? Это трудная задача, но не невозможная. Вам придется убить его зомби, каждого из них. Вы должны убить их всех. Если не убьете всех, мы все обречены. И вы тоже». Невероятные слова Бориса эхом звенят у вас в голове. То, что он рассказал о Юрре, кажется безумием, но, может быть, это правда? Может быть, это зомби толкали вас во дворе, когда вы приехали? Нашли ли вы, по иронии судьбы, мифологических существ, которых так долго искали? Или они вот-вот найдут
      вас? Вы улыбаетесь Борису и говорите ему, что вам нечего терять и что сделаете это - или умрете, пытаясь. Оба мужчины громко хвалят вас за храбрость и в знак благодарности хлопают по спине. «Один совет: прежде чем начнете убивать зомби, незнакомец, - говорит Борис, глядя на ваши запястья. -Смотрите, чтобы на открытые раны не попала кровь зомби, иначе вы тоже заразитесь. Вирус зомби очень заразен». Если хотите спросить Бориса, есть ли в кладовой что-нибудь полезное для вас - [А]. Если хотите поблагодарить его за совет, попрощаться и немедленно пойти к двери в дальней стене - [Б].'
    mood: mystery
    interaction:
      type: choices
      options:
      - label: Вариант А
        to: '329'
        letter: А
      - label: Вариант Б
        to: '157'
        letter: Б
  '230':
    title: Параграф 230
    text: Пригнувшись, чтобы вас не заметили зомби во дворе, вы на цыпочках идете по коридору, чтобы добраться до телескопа. Направив его на балкон на втором этаже восточного крыла, вы всматриваетесь в объектив, фокусируя его на крупнокалиберном пулемете, установленном там. Вы узнаете браунинг 30-го калибра, безумно мощный скорострельный пулемет. Если бы только вы могли добраться до него, чтобы выкосить из него зомби во дворе. Французское окно на балконе внезапно распахивается. Появляется знакомая фигура Гингрича Юрра. Он подходит к краю, держа шприц с кровью в одной руке и стакан с кровью в другой. Он как безумный кричит на своих зомби внизу. Все оборачиваются и смотрят вверх. Юрр перестает кричать. Несколько мгновений он стоит, молча, совершенно неподвижно, потом делает себе укол шприцем в шею и выпивает стакан крови. Ваши худшие опасения вскоре оправдываются, когда Юрр начинает превращаться в зомби. Его кожа становится серой и покрывается язвами и волдырями. Его покрасневшие глаза становятся
      молочно-белыми, глубоко западая в глазницы. Его губы трескаются и начинают кровоточить. Он сминает стакан в руке, сильно порезав пальцы, но, кажется, ему все равно, не обращая внимания на рану, он ревет в небеса. Он больше не человек, он одержимый, плюющийся кровью, он призывает своих собратьев нежить уничтожить мир. Преследуемый оглушительным ревом зомби, звенящим в ушах, вы бросаетесь назад по коридору, чтобы сбежать вниз по лестнице.
    mood: calm
    image: assets/images/230-1.jpg
    interaction:
      type: continue
      to: '57'
  '231':
