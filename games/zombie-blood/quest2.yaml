    text: Двигаясь как можно незаметнее и все время оглядываясь по сторонам, вы проходите по уже знакомым вам комнатам замка. В западном крыле вы находите только трупы зомби, тут нет никаких признаков Юрра. Дверца небольшого стенного шкафа распахнута настежь. Вы заглядываете внутрь и находите аптечку. Внезапно вы слышите звук автомобильного двигателя. Вы смотрите в окно и видите, что двери гаража в восточном крыле открыты. С пистолетом в руке вы бежите во двор и направляетесь к гаражу.
