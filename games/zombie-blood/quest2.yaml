    text: Каким-то чудом большая часть осколков не задевает вас, за исключением одного маленького осколка, который застрял в вашей ноге. Потеряйте 3 очка Выносливости. Зомби не так удачлив. Он лежит неподвижно на каменном полу, разорванный взрывом. Вы не теряете времени и спешите дальше по коридору, пока не натыкаетесь на дверь в левой стене. Когда подходите к ней, вы слышите громкий лай, доносящийся с другой стороны двери. Если хотите открыть дверь - [А]. Если предпочитаете двигаться дальше - [Б].
