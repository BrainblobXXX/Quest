  '278':
    title: Параграф 278
    text: Тоннель заканчивается, дальше вода течет через канализационную трубу в кирпичной стене. Труба слишком узкая, чтобы в нее можно было влезть, да вы и не хотите! Нет другого выхода, кроме как вернуться к шахте, мимо которой прошли, и выбраться из канализации.
