    text: Надев белый лабораторный халат, вы смело проходите через двери и представляетесь ученым, говоря, что Гингрич Юрр послал вас присоединиться к ним. Зловещего вида ученый с бритой головой холодным тоном представляется профессором Розником. Он подозрительно смотрит на вас и спрашивает, принесли ли вы 100 долларов, которые Юрр должен ему за последнюю партию зараженной крови. Если у вас есть 100 долларов, и вы хотите заплатить Рознику - [А]. Если у вас нет 100 долларов или вы не хотите платить - [Б].
