        max: 6
        to: '79'
      - min: 1
        max: 3
        to: '352'
  '185':
    title: Параграф 185
    text: Чтобы открыть двери, не требуется особых усилий. Вы раздвигаете их и оказываетесь в холодном коридоре, освещенном потолочными светильниками с квадратными матовыми стеклянными плафонами. Потолок выкрашен в невеселый горчичный цвет. Стены того же цвета, выше пояса полоса темно-зеленых плиток, многие из которых отсутствуют. Краска на стенах старая, потрескавшаяся и в нескольких местах заляпанная кровью. Вы принюхиваетесь и замечаете очень неприятный химический запах. Внезапно вы слышите звук шагов, идущих по коридору слева от вас. Справа, примерно в двадцати метрах от вас, через коридор находятся распашные двери из вулканизированной резины. Если вы хотите узнать, кто идет по коридору - [А]. Если хотите пройти через двери - [Б].
    mood: calm
    interaction:
      type: choices
      options:
      - label: Вариант А
        to: '45'
        letter: А
      - label: Вариант Б
        to: '31'
        letter: Б
  '186':
    title: Параграф 186
    text: Кто бы ни был на крыше, он очень силен и без труда поднимет вас, держа за горло. Вы хватаете ртом воздух, дергая ногами, пытаясь освободиться от железной хватки на горле. Но вы не в состоянии разжать гигантские пальцы зомби, и вскоре ваше тело обмякает. Ваше приключение закончилось.
    mood: grief
    ending: true
  '187':
    title: Параграф 187
    text: Вы видите, что в ведре нет ничего, кроме дохлых крыс. Однако вы также видите золотой медальон на золотой цепочке, которая висит на фиолетовой шее одного из зомби. К счастью, зомби упал на дорожку, и вы можете снять медальон с его шеи. Вы открываете его, внутри фотография симпатичной светловолосой девушки лет восемнадцати или девятнадцати. На другой стороне медальона выгравировано имя «Эми Флетчер». Вы кладете его в карман и идете дальше, в конце концов, подходите к другой вертикальной шахте, похожей на ту, по которой вы спустились сюда. Впереди вы видите, что туннель перекрыт железной решеткой, мешающей вам идти дальше по дорожке. Если у вас есть ножовка и вы хотите попробовать перепилить железные прутья - [А]. Если предпочитаете вылезти из канализации - [Б].
    mood: calm
    entry:
    - grant:
        item: gold_locket
        count: 1
      once: true
    interaction:
      type: choices
      options:
      - label: Вариант А
        to: '18'
        letter: А
        if:
          has_item:
            id: hacksaw
      - label: Вариант Б
        to: '173'
        letter: Б
        if:
          not:
            has_item:
              id: hacksaw
  '188':
