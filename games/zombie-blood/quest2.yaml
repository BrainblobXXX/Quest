  '182':
    title: Параграф 182
    text: Сверху доносится пронзительный вой сирены воздушной тревоги времен второй мировой войны. Вы смотрите на крышу и видите Гингрича Юрра, теперь полностью превратившегося в зомби, стоящего внутри небольшой наблюдательной башни над главными воротами в южном крыле. Он маниакально крутит ручку сирены воздушной тревоги обеими руками, крича во весь голос. Вторая волна нежити хлынула во двор со всех сторон, всего в ней двадцать шесть зомби. Они бегут к лестнице, пока вы отчаянно стараетесь подать еще одну ленту патронов в патронник крупнокалиберного пулемета. Вы отпускаете предохранитель, взводите ручку и стреляете в приближающихся зомби. Они начинают падать, исчезая в облаке пыли, поднятой ударами пуль по гравию. Скорострельный браунинг наносит 2d6+15 урона. Если убьете всех зомби в первом раунде - [А]. Если вам это не удастся - [Б].
    mood: tense
    interaction:
      type: choices
      options:
      - label: Вариант А
        to: '168'
        letter: А
      - label: Вариант Б
        to: '22'
        letter: Б
  '183':
    title: Параграф 183
    text: Вы оказываетесь в конце узкого коридора. Справа от вас окно, которое выходит во внутренний двор. Вы видите несколько зомби, бесцельно бродящих внизу. Пол в коридоре покрыт плюшевым ковром, а стены оклеены обоями с богатым цветочным рисунком. За дверью спальни стоит большая плетеная корзина. Если вы хотите поднять крышку корзины -[А]. Если предпочитаете идти дальше по коридору - [Б].
