  '211':
    title: Параграф 211
    text: Карабкаться по водосточной трубе совсем непросто. У Гингрича Юрра достаточно времени, чтобы успокоиться и хорошенько прицелиться. Во второй раз он уже не промахнется. Раздается выстрел, и вас окутывает тьма. Вы отпускаете водосточную трубу и падаете вниз головой в толпу беснующихся зомби. Ваше приключение закончилось.
