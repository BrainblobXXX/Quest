  '181':
    title: Параграф 181
    text: 'Вы вводите цифры, написанные на бумаге, и удовлетворенно улыбаетесь, когда дверца распахивается. Внутри сейфа вы находите 44 доллара, две коробки патронов, три коробки патронов для дробовика, гранату (2d6+1) и записную книжку. Вы листаете блокнот. Все страницы пусты, за исключением одной, на которой печатными буквами написано: «Напоминание - пароль: моя машина». Вы вырываете страницу из блокнота и прячете в карман. Довольный своей добычей, вы поднимаетесь обратно по лестнице в библиотеку и выходите обратно в коридор.'
