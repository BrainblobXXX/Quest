  '275':
    title: Параграф 275
    text: Бронежилет принимает на себя большую часть осколков, летящих в вашу сторону. В вас попадает только небольшой осколок, который задевает вам ногу, уменьшая вашу Выносливость на 2 очка. Но зомби, который держал гранату, не был так удачлив, как и его товарищи. Они принимают на себя всю силу взрыва, и многие из них разорваны на куски. Уменьшите их число на 2d6+1. Вы встаете, чтобы сразиться с оставшимися зомби.
