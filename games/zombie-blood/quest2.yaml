    text: Реакция Отто замедленна, и ваше быстрое движение застает его врасплох. Вы ухитряетесь обхватить его ногами за живот и повалить на землю. Он пытается высвободиться, но вы цепляетесь за него и обматываете одну из своих цепей вокруг его шеи. Он задыхается и бьет вас локтем в лицо, но не причиняет никакого вреда. Вы продолжаете держать его и сильнее затягиваете цепь, пока он не теряет сознание. Он падает на вас сверху, вы едва успеваете дотянуться до его пояса. Ваши пальцы нащупывают ключ, прикрепленный к тонкой цепочке на поясе. Цепь достаточно длинная, чтобы вы могли вставить ключ в замок своих кандалов. Он подходит, и замок открывается, к вашему большому облегчению. Вы отпираете второй наручник и защелкиваете его на запястье лежащего без сознания бандита. Обыск его карманов не дает ничего, кроме фотографии полной женщины средних лет, которую вы бросаете на пол. Вы растираете свои поврежденные запястья и думаете о том, что делать дальше. Вы босиком и одеты в ту же футболку и шорты,
