    text: Зомби, которые выжили под градом пуль, поднимаются по лестнице на балкон. Уменьшите свою Выносливость на количество зомби, оставшихся в живых. Если все еще живы, вы должны продолжить бой с ними, используя любое другое ваше оружие креме пулемета Браунинга.
