  '241':
    title: Параграф 241
    text: Без чего-либо способного защитить вас, взрыв гранаты в тесном пространстве лифта — это верная смерть. Ваше приключение закончилось.
    mood: grief
    ending: true
  '242':
    title: Параграф 242
    text: Вы нажимаете на спусковой крючок, с такого близкого расстояния промахнуться невозможно. Зомби падает навзничь, кувыркаясь вниз головой по лестнице. Внезапно снизу раздается мощный взрыв. Ударная волна сбивает вас с ног, и вы бьетесь головой о колокол. Потеряйте 2 очка Выносливости. Снизу поднимается дым, но, по крайней мере, башня с часами устояла. Лестница завалена обломками, по ней уже не спуститься, придется покинуть вершину башни другим путем. Вы поднимаете с пола кирпич и швыряете его в стеклянный циферблат часов. Он разлетается вдребезги, осыпая дождем из тысяч осколков стекла крышу примерно в двенадцати метрах внизу. Если у вас есть альпинистская веревка с крюком - [А]. Если у вас нет веревки - [Б].
    mood: calm
    entry:
    - modify:
