        to: '236'
        letter: В
      - label: Вариант Г
        to: '16'
        letter: Г
  '225':
    title: Параграф 225
    text: На следующее утро Эми просыпается рано от пения птиц за окном. Солнце светит, и все тихо и мирно в живописной деревне Мелис. Она раздвигает шторы и смотрит на деревенскую площадь. Люди заняты установкой рыночных прилавков, не подозревая, что вы предотвратили апокалипсис нежити. Однако вы в своей крохотной спальне на чердаке провели тревожную ночь. Вы все время вспоминали события предыдущего дня, снова и снова прокручивая их в голове. Вы уверены, что проверили все комнаты, но что-то все еще беспокоит вас. Вдруг вас осеняет – большой контейнер для вывоза мусора во дворе! Вы не заглянули под брезент. Вы пытаетесь убедить себя, что очень маловероятно, что там прятались зомби. Вскоре вам удается отбросить эту идею. Вы спускаетесь вниз, чтобы встретиться с Эми за завтраком. Она взволнованно говорит о возвращении в Нью-Йорк, а вы обсуждаете, как долго, по вашему мнению, полиция заставит вас оставаться в Мелисе. Как оказалось, недолго. В дело вмешивается политика, позже утром полицейские
      говорит вам, что они все-таки не верят в вашу историю. Не желая отпугивать туристов нелепыми слухами о зомби, они решают не проводить расследование, а вместо этого вызывают вам такси, чтобы отвезти вас на вокзал - немедленно. Несмотря на ваши протесты, вас отправляют восвояси. На следующий день Эми вылетает в Нью-Йорк. Вернувшись в колледж в Англию, вы постепенно входите в привычный ритм, и ваша жизнь возвращается в нормальное русло. В конечном итоге вы заканчиваете высшую школу с самыми высокими оценками за вашу диссертацию.
    mood: victory
    ending: true
  '226':
    title: Параграф 226
    text: Дойдя до развилки, вы смотрите налево и видите, что коридор заканчивается у двери примерно в двадцати метрах впереди. Посмотрев направо, вы видите, что коридор также заканчивается дверью. Дубовый сундук старинный, и замок на нем тоже древний и хлипкий. Если хотите пойти налево по коридору и открыть дверь - [А]. Если хотите пойти направо и открыть другую дверь - [Б]. Если хотите взломать замок на сундуке - [В].
