    text: Быстрый поиск в гардеробе дает вам смену одежды и лабораторный халат, который вы запихиваете в свою сумку. Вы также находите 3 доллара и увеличительное стекло в ящике туалетного столика, которые можете оставить себе. Если хотите пройти через распашные двери - [А]. Если хотите открыть большую дверь - [Б].
