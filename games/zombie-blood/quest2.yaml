    text: 'Вы обыскиваете гараж сверху донизу, но не находите ключей от фургона. Вы не хотите оставаться в замке ни на минуту дольше, чем это необходимо - вам не терпится покинуть это ужасное место и встретиться с Эми в деревне, куда она направляется. В задней части гаража есть старый велосипед, и вы решаете, что он достаточно хорош, чтобы добраться на нем в деревню до наступления темноты. Вы подкатываете его к главным воротам, открываете их и выезжаете наружу. Вы едете на велосипеде так быстро, как только можете, по дороге через лес. Примерно через час вы видите впереди идущую по дороге девушку. Даже издали видно, что у нее длинные светлые волосы, и она одета в джинсы и футболку, так что вы сразу узнаете Эми. Вы окликаете ее по имени, а она оборачивается и отчаянно машет рукой, подпрыгивая от возбуждения. Вы подъезжаете к ней и останавливаетесь. «Почему ты так долго?» - спрашивает она, улыбаясь. Вы саркастически отвечаете, что остановились выпить кофе, и предлагаете ей сесть на раму. Она
