        letter: Б
  '329':
    title: Параграф 329
    text: «На данный момент у нас не так много запасов, но вы можете воспользоваться тем, что есть. Извините, но мне придется обвинить вас в краже. Если какой-нибудь предмет пропадет и Юрр узнает об этом, нас тут же превратят в зомби». Борис смотрит на свой планшет и читает, что у него есть на продажу. «Здесь все стоит доллар. У нас есть резиновые перчатки, мизинчиковые батарейки, ножовки, отвертки, карандаши, стальные шкивы, увеличительные стекла, магниты, шнурки, рыболовные крючки, солнцезащитные очки, точилки для ножей, клей, упаковочная лента и ножницы. Немного смешанный набор, но вот все, что у нас здесь. Что бы вы хотели купить?» Купите, что хотите, и заплатите 1 доллар за каждый предмет. Если хотите спросить Бориса, есть ли у него провизия - [А]. Если хотите поблагодарить его за помощь, попрощаться и немедленно пойти к двери в дальней стене - [Б].
    mood: grief
    interaction:
      type: shop
      offers:
      - item: pulley
        price: 1
      - item: hacksaw
        price: 1
      - item: rubber_gloves
        price: 1
      currency_item: money
      currency: долларов
      title: ЛАВКА БОРИСА
    after:
      type: choices
      options:
      - label: Вариант А
        to: '28'
        letter: А
      - label: Вариант Б
        to: '157'
        letter: Б
  '330':
    title: Параграф 330
    text: Старый лифт медленно спускается, грохоча и содрогаясь, прежде чем остановиться на втором этаже. Вы снова нажимаете кнопку «П», но ничего не происходит. Двери лифта раздвигаются, открывая еще один длинный коридор, похожий на тот, что был на третьем этаже, заканчивающийся окном, выходящим во внутренний двор. В дальнем конце коридора справа есть дверь. Если хотите пройти по коридору, чтобы открыть дверь - [А]. Если вы предпочитаете оставаться в лифте, можете нажать кнопку «1» [Б] или кнопку «П» [В].
    mood: calm
