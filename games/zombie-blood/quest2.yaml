  '306':
    title: Параграф 306
    text: Вы нажимаете на кран с холодной водой и наполняете свою чашку. Вода ледяная и освежающая, и вы с наслаждением пьете, сколько влезет. Вы даже не представляли, как сильно хотели пить, и чувствуете себя намного лучше. Добавьте 2 очка Выносливости. Быстрый обыск в тренажерном зале не дает ничего интересного, поэтому возвращаетесь в коридор и идете дальше.
    mood: calm
    entry:
    - modify:
        stat: stamina
        delta: 2
    interaction:
      type: continue
      to: '12'
  '307':
    title: Параграф 307
    text: Не желая рисковать, вы бросаете вторую гранату в коридор. Вы готовитесь к взрыву, но с ужасом видите, как гранату бросают обратно через дверной проем, и она приземляется на кровать. Гремит мощный взрыв, и вы принимаете на себя всю его силу. Лежа на полу тяжело раненный и неспособный двигаться, вы можете только наблюдать, как дверь распахивается и в комнату вторгается орда зомби. Среди них человек в оранжевом комбинезоне, чье лицо вы узнаете, хотя сейчас оно покрыто открытыми ранами и кровоточащими язвами. Борис превратился в зомби, и скоро и вы станете таким как он. Ваше приключение закончилось.
    mood: grief
    ending: true
  '308':
    title: Параграф 308
    text: К несчастью для вас, пуля попадает вам в бедро. Вы падаете на пол, схватившись за ногу. Эми приходит в себя и потрясена, увидев, как вы корчитесь на полу в агонии. Потеряйте 4 очка Выносливости. Если вы все еще живы.
    mood: calm
    entry:
    - modify:
        stat: stamina
        delta: -4
    interaction:
      type: continue
      to: '260'
  '309':
    title: Параграф 309
    text: Ключ поворачивается в замке, и вы снова оказываетесь в широком коридоре, который ведет налево и направо. Вы запираете за собой дверь и думаете, в какую сторону идти. Впрочем, решение принято за вас. Кто-то идет вдоль правой стороны коридора.
    mood: calm
    interaction:
      type: continue
      to: '109'
  '310':
    title: Параграф 310
    text: Пока зомби приближаются, вы отчаянно шарите в темноте в поисках выключателя и, наконец, находите его высоко и справа от дверного проема. Вы щелкаете выключателем, и комната немедленно освещается рядами неоновых ламп на низком потолке. В комнате нет никакой мебели. На цоколе посередине стоит лишь заляпанная кровью плита из полированного камня, к каждому углу которой прикреплены кандалы и цепи. Зомби стонут и рыдают, прикрывая руками глаза от яркого света. Всего вы насчитали их двадцать восемь. Если у вас есть гранаты, вы можете использовать одну, пока зомби все еще ослеплены неоновыми светом. Если хотите бросить гранату в медленно движущихся зомби - [А]. Если у вас нет гранаты или не хотите ее использовать - [Б].
    mood: tense
    interaction:
      type: choices
      options:
      - label: Вариант А
        to: '209'
        letter: А
        if:
          has_item:
            id: grenade
        effects:
        - consume:
            item: grenade
      - label: Вариант Б
        to: '262'
        letter: Б
        if:
          not:
            has_item:
              id: grenade
  '311':
    title: Параграф 311
    text: Коридор снова поворачивает направо, и вы огибаете угол, подходя к широкой покрытой ковром лестнице слева от вас, которая ведет наверх. Коридор продолжается и дальше за лестницей. Внезапно вы слышите шум с верхней площадки и готовитесь защищаться.
    mood: calm
    interaction:
      type: continue
      to: '148'
  '312':
    title: Параграф 312
    text: Как только вы произносите имя Эми, крики прекращаются. Вы слышите приближающиеся шаги и отступаете назад, когда открывается дверь. Из-за двери появляется голова молодой девушки. На ее лице застыло выражение ужаса, а по щекам текут слезы. Она зовет вас в комнату и снова запирает дверь. Вы замечаете, что в правой руке она держит пистолет. «Откуда ты знаешь мое имя?» - спрашивает она. Если ответите, что это была просто случайная догадка - [А]. Если ответите, что прочитали ее дневник и предположили, что это она - [Б].
    mood: calm
    image: assets/images/312-1.jpg
    interaction:
      type: choices
      options:
      - label: Вариант А
        to: '72'
        letter: А
      - label: Вариант Б
        to: '193'
        letter: Б
  '313':
    title: Параграф 313
    text: Вы стоите неподвижно в душе, ваше сердце бешено колотится. Вы слышите, как кто-то входит в ванную, громко фыркая, как свинья. Затем слышите, как с треском отрывают шкафчик со стены. Но вы не видите, как зомби швыряет его в занавеску для душа! Бросьте кубик. Если выпадет 1-3. Если выпадет 4-6.
    mood: calm
    interaction:
      type: roll
