  '176':
    title: Параграф 176
    text: Лестница ведет вниз в широкий коридор с известняковым полом. Вскоре вы видите, откуда доносится шум и суматоха. Примерно в двадцати метрах впереди группа зомби сражается за тушу собаки. Они все пытаются схватить тушу, чтобы откусить от нее кусочек, не обращая внимания на то, что она кишит личинками. Драка становится очень жестокой и бесконтрольной, некоторые зомби кусают друг друга за руки и ноги, а двое пытаются выколоть друг другу глаза. Но когда голодные зомби видят вас, они перестают драться и бросаются к вам, вытянув руки, пуская слюни и алча крови. Перед вами шестнадцать зомби, и вы должны сразиться с ними.
    mood: danger
    image: assets/images/176-1.jpg
    interaction:
      type: combat
      mode: pool
      enemies:
      - name: Зомби без оружия
        count: 16
        attack: 1
        health: 1
      outcomes:
        victory: '6'
  '177':
    title: Параграф 177
    text: Вы идете по коридору к двери. Она абсолютно белая с посеребренной ручкой. Вы прижимаетесь к ней ухом, но не слышите никакого шума с другой стороны. Вооружившись и приготовившись к бою, вы медленно поворачиваете ручку, открываете дверь и осматриваете комнату. Это еще одна спальня, похожая по размерам на ту, что этажом выше. Центральное место занимает роскошная кровать с плюшевым матрасом и белым изголовьем. Рядом с ней прикроватная тумбочка, на которой стоит пластиковая настольная лампа с ярко-желтым абажуром. В спальне также есть белый шкаф и комод. В дальней стене выкрашенные в белый цвет распашные двери, которые, как вы предполагаете, ведут в ванную комнату. Вы выглядываете из окна и видите множество бесцельно бродящих вокруг зомби. Если хотите осмотреть мебель в спальне - [А]. Если хотите пройти через двери напротив - [Б].
    mood: calm
    interaction:
      type: choices
