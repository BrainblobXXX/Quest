    text: «Я бы на вашем месте этого не делал, - говорит Борис, когда вы делаете шаг ему навстречу. - Уверяю вас, я вполне способен постоять за себя». Если вы все еще хотите напасть на него - [А]. Если хотите отступить и направиться к двери - [Б].
