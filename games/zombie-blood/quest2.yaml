  '271':
    title: Параграф 271
    text: Внезапно в дальнем конце коридора появляется человек, он бежит к вам так быстро, как только позволяет его кроткие ноги, и кричит во весь голос. Он выглядит как обычный человек, и уж точно не похож на зомби, с которыми вам приходилось сталкиваться. «Помогите! Помогите! Они идут! Помогите!» -кричит он испуганным голосом. Когда он приближается, вы узнаете бритую голову, оранжевый комбинезон и черные армейские ботинки. Это Борис, один из тех, кого вы встретили в кладовой. За его спиной вы видите стаю зомби, которые, спотыкаясь, бегут по коридору. Они сражаются друг с другом, чтобы вырваться вперед. Борясь за свою жизнь, измученный и запыхавшийся, Борис вдруг спотыкается и падает на пол метрах в десяти от вас. Вы должны быстро решить, что делать. Если хотите вернуться в спальню и оставить Бориса на произвол судьбы - [А]. Если хотите сразиться с зомби - [Б].
    mood: calm
    image: assets/images/271-1.jpg
    interaction:
      type: choices
      options:
      - label: Вариант А
        to: '37'
        letter: А
      - label: Вариант Б
        to: '339'
        letter: Б
  '272':
    title: Параграф 272
    text: Вы открываете защелки на кофре и поднимаете крышку. Вы очень рады, найдя внутри бронежилет и аптечку. Если вы еще не делали этого, можете открыть футляр для виолончели -[А]. Если вы предпочитаете выйти из комнаты и продолжить путь по коридору - [Б].
