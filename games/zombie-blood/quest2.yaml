  '172':
    title: Параграф 172
    text: После открытия пожарной двери начинает мигать красная лампа и звучит сигнал тревоги. Вы находитесь в нижней части шахты пожарной лестницы, несколько пролетов железной лестницы ведут наверх к другой пожарной двери. Если хотите бежать вверх по лестнице - [А]. Если хотите остаться на месте, чтобы увидеть, не придет ли кто-то на шум - [Б].
    mood: tense
