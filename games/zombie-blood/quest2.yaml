    text: Вы испытываете сильную боль, но берете себя в руки и осматриваетесь по сторонам. Вы стоите на плоской крыше западного крыла замка, высоко над усыпанным гравием внутренним двором. Четырехугольник двора образован внутренними стенами зданий из песчаника, составляющих замок. Внезапно через главные ворота в южном крыле во двор, визжа шинами по гравию, въезжает сине-кремовая спортивная машина. Резко развернувшись, машина останавливается в облаке пыли перед дверью гаража в восточном крыле. Водитель, мужчина с длинными волосами и необычно большой головой, выскакивает из машины и отпирает гараж. Он запрыгивает обратно на водительское сиденье, резко заводит машину и, сделав крутой разворот, въезжает в гараж. Это должен быть не кто иной, как сам Гингрич Юрр! Зомби хлынули во двор, но человек больше не появляется. Двое зомби внизу поворачивают головы и смотрят вверх. Они показывают на вас пальцем и начинают кричать, привлекая внимание остальных. Вам нужно действовать быстро. В крыше, метрах
      в двадцати впереди вас, есть открытый световой люк. Вдоль западного крыла, от основания часовой башни до самого внутреннего двора, тянется водосточная труба. Если вы хотите быстро пройти к окну в потолке - [А]. Если хотите спуститься по водосточной трубе - [Б].
