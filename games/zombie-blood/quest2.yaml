    text: Это не займет много времени, перепилить металлическую защелку, удерживающую раздвижные двери закрытыми. Вы раздвигаете их и оказываетесь в холодном коридоре, освещенном потолочными светильниками с квадратными матовыми стеклянными плафонами. Потолок выкрашен в невеселый горчичный цвет. Стены того же цвета, выше пояса полоса темно-зеленых плиток, многие из которых отсутствуют. Краска на стенах старая, потрескавшаяся и в нескольких местах заляпанная кровью. Вы принюхиваетесь и замечаете очень неприятный химический запах. Внезапно вы слышите звук шагов, идущих по коридору слева от вас. Справа, примерно в двадцати метрах от вас, через коридор находятся распашные двери из вулканизированной резины. Если вы хотите узнать, кто идет по коридору - [А]. Если хотите пройти через двери – [Б].
