    text: Когда солнце медленно опускается за горизонт, вы прибываете в маленькую деревню Мелис. Вы идете прямо в полицейский участок и сообщаете об ужасных событиях, которые произошли в замке Горай. В деревне всего два полицейских. Оба недоверчиво смотрят на вас, когда вы рассказываете свою невероятную историю. Сначала они угрожают арестовать вас, но, в конце концов, соглашаются отправиться в замок утром, чтобы провести расследование. Они говорят вам идти в местную гостиницу и не покидать деревню, так как им нужно будет поговорить с вами утром. Вы снимаете комнаты в небольшой гостинице и после столь необходимого вам душа встречаетесь с Эми внизу за ужином. Вы оба не очень голодны, и можете лишь бесконечно говорить о Гингриче Юрре. «Так ты думаешь, что убил всех зомби?» - с тревогой спрашивает Эми. Вы отвечаете, что, похоже, что да, во всяком случае, очень на это надеетесь. Вы вспоминаете все схватки и подсчитываете количество убитых вами зомби. Когда закончите подсчеты, обратитесь к параграфу
      с тем же номером, что и результат. Если текст параграфа не имеет смысла.
