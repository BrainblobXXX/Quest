    text: Ученые застигнуты врасплох, когда вы наставляете на них оружие. Они немедленно поднимают руки, чтобы сдаться. Вы говорите им, следовать мимо лифта и войти в первую камеру за ним. Когда проходите мимо лифта, Розник, как бы случайно, роняет свой планшет. Он наклоняется, чтобы поднять его, а потом резко выпрямляется и пытается всадить в вас шприц с зараженной кровью. Бросьте кубик. Если выпадет 1-3. Если выпадет 4-6.
