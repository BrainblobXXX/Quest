  '215':
    title: Параграф 215
    text: Вы мгновение осматриваете бойню в коридоре, прежде чем встать на колени, чтобы помочь Борису, который лежит лицом вниз и стонет от боли. Вы видите, что он очень тяжело ранен. Вы переворачиваете его и видите, как у него из уголка рта сочится кровь. Он протягивает руку и хватает вас за рукав, крепко сжимая ладонь. Он смотрит на вас умоляющими глазами. «Незнакомец, теперь все зависит от тебя, - медленно шепчет он, кашляя и сплевывая кровь. - Отто мертв. Грегор мертв. Восстание зомби началось. Вы должны остановить Гингрича Юрра. Вы должны убить его зомби. Ты должен убить их всех!» Борис медленно выдыхает и закрывает глаза. Он ослабляет хватку и падает на спину, его голова склоняется набок. Похоже, вы ему уже ничем не поможете. Вы встаете и медленно идете по коридору, пробираясь сквозь груду трупов.
    mood: calm
    interaction:
      type: continue
      to: '7'
  '216':
    title: Параграф 216
    text: Вы падаете через люк и разбиваетесь о каменный пол внизу. Ваши ноги сломаны в нескольких местах, и вы теряете сознание от боли. Когда приходите в себя, вы не можете поверить своим глазам. Вы находитесь в большой комнате без окон, освещенной неоновыми лампами. Вы прикованы к гладкой каменной плите, окруженной визжащими зомби. Они становятся очень оживленными, когда видят, как открываются ваши глаза. Они придвигаются ближе, чтобы посмотреть, как высокий худой человек в очках в длинном белом лабораторном халате и резиновых перчатках впрыскивает вам в шею кровь зомби. Ученый хихикает, когда говорит вам, что вы вот-вот станете новобранцем в армии зомби Гингрича Юрра. Ваше приключение закончилось.
    mood: grief
    ending: true
  '217':
    title: Параграф 217
    text: Вы роетесь в карманах, находите ключи, открываете дверь фургона, прыгаете на водительское сиденье и поворачиваете ключ в замке зажигания. Стартер чихает, кажется, целую вечность, прежде чем двигатель, наконец, оживает и изрыгает густой черный дым из выхлопной трубы. Вы переключаете передачу и жмете на педаль газа. Фургон выезжает во двор, но тут двигатель дает осечку. Раздается громкий хлопок, что-то приземлилось на крышу кабины. Отвратительное лицо, прижатое к ветровому стеклу, появляется перед вами. Зомби спрыгнул со второго этажа на крышу фургона через окно над гаражом. Он начинает стучать по ветровому стеклу. Вы берете пистолет и стреляете через крышу. Зомби визжит от боли и скатывается на землю. В зеркале заднего вида вы видите, как он снова пытается встать. Вы останавливаете фургон и выходите, оставив двигатель включенным. Окровавленный зомби ковыляет к вам, раскинув руки и произнося «Враг» низким скрипучим голосом. Вы стреляете и смотрите, как он падает лицом вниз на землю,
      на этот раз он уже не встанет. Вы осторожно подходите к телу и медленно переворачиваете его ногой. Его куртка распахивается, и вы видите бирку, пришитую к внутреннему карману, с именем Хигсон. Все еще настороже, смотрите по сторонам, но не видите других зомби. Вы прыгаете обратно в фургон и подъезжаете к главным воротам и, открыв их, выезжаете наружу. Вы мчитесь через лес и минут через десять видите впереди идущую по дороге девушку. Даже издали видно, что у нее длинные светлые волосы, и она одета в джинсы и футболку, так что вы сразу узнаете Эми. Вы нажимаете на гудок и смотрите, как она поворачивается и отчаянно машет рукой, подпрыгивая от возбуждения. Вы подъезжаете к ней и останавливаетесь. «Хорошая машина, где взял?» - говорит она, смеясь. Вы испытываете облегчение, видя, что она в безопасности, и говорите ей, что вообще-то не берете попутчиков, но готовы сделать исключение для такой симпатичной девушки. Вы едете дальше, ругая ее за то, что она шла вдоль дороги. Она отметает ваши
      нравоучения взмахом руки, все, что она хочет слышать - это ваш рассказ о битве с Гингричем Юрром и его армией зомби.
    mood: tense
    image: assets/images/217-1.jpg
    interaction:
      type: continue
      to: '400'
  '218':
    title: Параграф 218
    text: Если вам когда-нибудь была нужна аптечка, то именно сейчас, если ее у вас нет, вы истечете кровью и умрете. Если у вас есть аптечка, вы делаете все возможное, чтобы перевязать себя и остановить кровотечение, но состояние ваших ран вызывает беспокойство. Вычеркните использованную аптечку из снаряжения, но не восстанавливайте потерянные очки Выносливости. Но, по крайней мере, вы живы. Зомби не так удачлив. Он лежит неподвижно на каменном полу, разорванный взрывом. Вы не теряете времени и спешите дальше по коридору, пока не натыкаетесь на дверь в левой стене. Когда подходите к ней, вы слышите громкий лай, доносящийся с другой стороны двери. Если хотите открыть дверь - [А]. Если предпочитаете двигаться дальше - [Б].
