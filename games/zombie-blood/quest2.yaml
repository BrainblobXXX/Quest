    text: Юрр отличный стрелок, он не промахнется. Ваша голова склоняется набок, струйка крови стекает по лицу из маленькой раны над виском. Ваши руки отпускают водосточную трубу, и вы падаете в беснующуюся толпу зомби внизу. Ваше приключение закончилось.
