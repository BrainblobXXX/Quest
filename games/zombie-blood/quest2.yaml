  '206':
    title: Параграф 206
    text: Книга представляет собой иллюстрированный справочник по зомби, дающий очень подробные описания их истории и поведения. В книге утверждается, что зомби были впервые созданы колдунами на островах Карибского моря. На одном маленьком острове численность зомби росла бесконтрольно, и их приходилось выслеживать и убивать. Но прежде чем все их тела были сожжены, кровь убитых зомби собрали и продали недобросовестным торговцам. Они продавали ее злым мегаломаньякам, которые хотели экспериментировать с превращением людей в зомби. Любой человек, вступивший в контакт с кровью зомби, сам в него превратится. Книга дает суровое предупреждение быть очень осторожным, вступая в контакт с зомби. Вы мысленно записываете этот совет, прежде чем решить, что делать дальше. Если хотите щелкнуть латунным выключателем - [А]. Если хотите выйти из библиотеки и идти дальше - [Б].
    mood: danger
    interaction:
      type: choices
      options:
      - label: Вариант А
        to: '324'
        letter: А
      - label: Вариант Б
        to: '160'
        letter: Б
  '207':
    title: Параграф 207
    text: Вы бежите по коридору северного крыла, мимо дверей в середине, к лестнице, по которой недавно покинули подвал. Вы испытываете искушение вернуться вниз, чтобы прикончить всех зомби в подвале, но решаете, что это может подождать, пока не поможете Эми сбежать из замка. В конце коридора вы поворачиваете налево в западное крыло, бежите до самого конца, затем снова поворачиваете налево уже в южное крыло и оказываетесь у двери справа с табличкой «Кладовая». Еще через двадцать метров коридор заканчивается стеклянной дверью, ведущей к главным воротам замка. Если хотите зайти в кладовую - [А]. Если хотите пройти к двери впереди - [Б].
