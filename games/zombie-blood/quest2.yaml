  '327':
    title: Параграф 327
    text: Удары по двери продолжаются, и она медленно начинает открываться. Объединив силы, обезумевшие зомби отталкивают тяжелую баррикаду из мебели. Серая тощая рука, покрытая гноящимися ранами, протискивается в дверной проем, за ней немедленно просовываются еще две. Теперь зомби уже не остановить. Если вы хотите выпрыгнуть из окна во двор - [А]. Если у вас есть граната - [Б].
    mood: danger
    interaction:
      type: choices
      options:
