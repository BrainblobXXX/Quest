  '302':
    title: Параграф 302
    text: Корзина полна грязного белья, полотенец, простыней и наволочек. Вы высыпаете содержимое на пол и с удивлением обнаруживаете картонную коробку на дне корзины. Вы снимаете крышку и находите внутри коробки три ручные гранаты (2d6+1). Убедившись, что чеки надежно закреплены, вы кладете гранаты в сумку, и довольный находкой идете дальше по коридору.
