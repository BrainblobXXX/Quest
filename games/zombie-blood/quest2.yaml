  '286':
    title: Параграф 286
    text: Прежде чем зомби доберется до вершины лестницы, вы захлопываете люк у него над головой и закрываете задвижку. Внезапно раздается мощный взрыв, и вас сбивает с ног. Люк под вами разлетается вдребезги, как и вся часовая башня. Нет никакого способа пережить такой ужасный взрыв. Ваше приключение закончилось.
    mood: grief
    ending: true
  '287':
    title: Параграф 287
    text: Вы хватаете Эми за руку и бежите под прикрытие леса. Вы слышите автоматные очереди, но не останавливаетесь, чтобы оглянуться, пока пробираетесь между высокими деревьями. После десяти минут напряженного бега вы останавливаетесь и в изнеможении садитесь на ствол упавшего дерева. «И что теперь?» - спрашивает Эми, тяжело дыша. Если хотите предложить, вместе отправиться дальше, чтобы предупредить власти - [А]. Если хотите предложить, чтобы Эми пошла дальше одна, а вы вернетесь в замок, чтобы перебить всех зомби - [Б].
    mood: danger
    interaction:
      type: choices
      options:
      - label: Вариант А
        to: '85'
        letter: А
      - label: Вариант Б
        to: '338'
        letter: Б
  '288':
