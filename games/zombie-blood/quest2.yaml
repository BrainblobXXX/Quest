        letter: В
  '333':
    title: Параграф 333
    text: Эми пристально смотрит на вас, когда вы называете общее число убитых вами зомби. Уверенный, что обыскали все внутри замка и не оставили там ни одного зомби, вы заявляете, что убили их всех. «Очень на это надеюсь, - отвечает она, улыбаясь. – Но если нет, то Мелис будет первой деревней, в которую придут зомби, и они нападут ночью. Если я проснусь завтра утром, я буду знать, что ты убил их всех!».
    mood: danger
    interaction:
      type: continue
      to: '225'
  '334':
    title: Параграф 334
    text: Рядом с упавшим зомби вы находите на полу пятидолларовую купюру, засунутую в бейсболку, которую он носил. Все инструменты разбиты вдребезги, но в глубине комнаты вы видите футляр для виолончели и большой черный транспортный кофр для усилителя, покрытый наклейками авиакомпаний. Если вы хотите открыть футляр - [А]. Если хотите открыть кофр - [Б]. Если предпочитаете продолжить путь по коридору - [В].
