  '184':
    title: Параграф 184
    text: Один из зомби протягивает руку и ловит гранату в воздухе. Он смотрит на нее с любопытством, но продолжает идти к вам. Бросьте кубик. Если выпадет 1-3. Если выпадет 4-6.
