    text: Вы пытаетесь открыть дверь, через которую прошла девушка, но она заперта. Вы стучите в дверь, но девушка истерически кричит, требуя, чтобы вы ушли. Вы говорите ей, что можете помочь ей сбежать, но она продолжает кричать во весь голос. Если вы хотите окликнуть ее по имени - [А]. Если хотите выйти во двор - [Б].
    mood: calm
