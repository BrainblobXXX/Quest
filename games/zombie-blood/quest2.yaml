    text: Большой висячий замок на двери сделан из закаленной стали. Нет никакого способа, взломать его, даже ломом. Если у вас есть связка ключей с номерами от 1 до 8, и вы хотите попробовать открыть ими дверь - [А]. Если у вас нет этих ключей или не хотите пытаться открыть дверь, вы должны вернуться в коридор - [Б].
