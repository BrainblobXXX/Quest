    text: Вы прижимаетесь ухом к двери и слышите, как шаги за ней замирают. Затем вы слышите слишком хорошо знакомое ворчание зомби. Если хотите выстрелить через дверь - [А]. Если хотите молчать и оставаться на месте - [Б].
