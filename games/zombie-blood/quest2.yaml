  '123':
    title: Параграф 123
    text: 'Вы берете дневник и видите, что он был начат в этом году, а последняя запись сделана всего неделю назад. Еще в январе Эми пишет о том, как она рада попасть в Румынию и как она наслаждается жизнью повара в замке. Сейчас очень холодно, но она любит красоту заснеженных холмов и суровой сельской местности. В феврале снега больше, и холоднее, но жизнь прекрасна. Ее настроение начинает меняться в марте, когда она слышит дурные слухи о Гингриче Юрре. В апреле она пишет, что обеспокоена прибытием ученых в белых халатах. Две недели спустя ее тревога превращается в страх, когда она узнает, что ученые проводят эксперименты на людях! Она слышит ужасные вопли и крики о помощи, доносящиеся из подвала, хотя и пишет, что у нее не хватает смелости спуститься туда и выяснить, что происходит. Месяц спустя она пишет о постоянном потоке пленников, прибывающих в замок и уводимых в подвалы, чтобы никогда больше не вернуться. На одной из страниц она нацарапала большими заглавными буквами: «Я боюсь до
      смерти». В конце июля есть запись, в которой говорится: «О, мой бог, в подвале зомби!!!» Она много раз спрашивала Гингрича Юрра, можно ли ей уйти, но он не разрешал. 27 июля она пытается бежать ночью, но ее ловят и возвращают обратно. Ее последняя запись гласит: «Сегодня ночью я снова попытаюсь сбежать. Я умру, если останусь здесь. Гингрич Юрр сумасшедший. Он создает армию зомби и намерен захватить весь мир. Его надо остановить». Все это имеет смысл. Но где сейчас Эми? Удалось ли ей сбежать? В конце дневника есть запись, которая гласит: «Примечание для себя. Кнопки старого лифта неисправны. Чтобы спуститься на 1 этаж, нужно нажать «3» и «1» одновременно. Для подвала нужно нажать «3» и «П» одновременно – но я туда никогда не спущусь!» Вы откладываете дневник и идете обратно к лифту, размышляя о судьбе Эми Флетчер. Если хотите одновременно нажать кнопки «3» и «1», чтобы попасть на первый этаж - [А]. Если хотите нажать кнопки «3» и «П», чтобы спуститься в подвал - [Б].'
    mood: tense
    interaction:
      type: choices
      options:
      - label: Вариант А
