  '224':
    title: Параграф 224
    text: Вы прыгаете с балкона, приземляясь целым и невредимым на груду тел, которая смягчает ваше падение. Над головой раздается мощный взрыв, снаряд из базуки разносит балкон на куски. Вы откатываетесь в сторону, чтобы избежать попадания обломков и мусора. Вы вскакиваете и бежите через двор к дверям северного крыла, прежде чем Гингрич Юрр успевает выстрелить еще раз. В коридоре царит мертвая тишина, но вы знаете, что Юрр будет отчаянно охотиться за вами. Вы вдруг с ужасом вспоминаете, что ваша сумка осталась на балконе. Все, что было внутри, теперь потеряно. Все, что у вас осталось, это пистолет за поясом и мелкие предметы в карманах, этого должно хватить, чтобы разделаться с Юрром и оставшимися зомби. Вы должны решить, какое крыло замка обыскать в первую очередь. Если хотите обыскать северное крыло, где вы сейчас находитесь - [А]. Если хотите обыскать западное крыло - [Б]. Если хотите обыскать южное крыло - [В]. Если хотите обыскать восточное крыло - [Г].
    mood: tense
    interaction:
      type: choices
