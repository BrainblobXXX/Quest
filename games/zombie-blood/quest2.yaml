  '331':
    title: Параграф 331
    text: Выдергиваете чеку и бросаете гранату вниз по лестнице. Вы слышите, как она грохочет по ступенькам, и через несколько секунд раздается мощный взрыв, который громким эхом отдается внутри бетонной шахты пожарной лестницы. Двадцать четыре зомби уменьшаются в числе на (2d6+1). Те, кто остался, обезумев от ярости, в поисках мести бегут вверх по лестнице так быстро, как только могут. Вы отступаете от двери и готовитесь встретить натиск зомби. Мгновение спустя они вываливаются на крышу.
