    text: 'Дверь ведет в комнату без окон, в центре которой стоит круглый стол и шесть стульев. Все стены от пола до потолка уставлены полками, на которых полным-полно настольных игр, компьютерных игр, книг и даже 25 номеров старого игрового журнала со странным названием «Сова и ласка». На одной полке стоит ряд книг с характерными зелеными корешками и фантастически звучащими названиями вроде «Колдун Огненной горы», но на большинстве полок ряд за рядом стоят настольные игры. На высокой полке, между стопкой настольных игр и коробкой с надписью «Новости ночных игр», вы видите серебряный кубок с двумя ручками. Вы поднимаете трофей и видите, что на нем написано: «Кубок пагоды». На обратной стороне чашки в течение 27 лет были выгравированы шесть имен. Если вы хотите открыть некоторые из коробок с играми -[А]. Если предпочитаете выйти из комнаты и пройти дальше по коридору - [Б].'
