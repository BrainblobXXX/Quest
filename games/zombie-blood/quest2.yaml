  '192':
    title: Параграф 192
    text: Когда вы пытаетесь открыть замок, лом соскальзывает, больно прижимая ваши пальцы к двери. Потеряйте 1 очко Выносливости. Вы пытаетесь снова, и на этот раз вам это удается. Замок отлетает, и дверь распахивается, за ней большая тускло освещенная комната без окон, которая выглядит так, будто когда-то была общей спальней. Вдоль стен стоят шесть деревянных двухъярусных кроватей, грязные матрасы разорваны и лежат на полу. Тайна шуршащих звуков раскрыта. Группа разъяренных зомби, некоторые с отсутствующими конечностями, другие с зияющими ранами на лицах и телах, сражаются друг с другом внутри комнаты. Увидев вас, они перестают драться. Теперь у них есть общий враг - человек! Вы насчитываете семнадцать врагов, когда они бросаются к вам с распростертыми объятиями. Если у вас есть ручная граната, то сейчас самое время ее использовать - [А]. Если у вас нет гранат, вам нужно будет использовать другое оружие - [Б].
