    text: 'На одной из полок, прикрепленных к торцевой стене между двумя книжными шкафами, стоит огромная книга в кожаном переплете. Она называется «Живые мертвецы: мир зомби». Снимая книгу с полки, вы замечаете маленькую медную пластинку на стене позади нее. В середине пластины находится выключатель. Если хотите почитать книгу - [А]. Если предпочитаете щелкнуть выключателем - [Б]. Если хотите выйти из библиотеки и идти дальше - [В].'
