  '204':
    title: Параграф 204
    text: Вы медленно открываете дверь и заглядываете внутрь, чтобы посмотреть, кто так плохо играет на барабанах. Комната сплошные руины – разбитые гитары, тромбон, согнутый пополам, расплющенный саксофон и пианино на боку со всеми вырванными и разбросанными по полу клавишами и струнами. Среди груды сломанных инструментов и разорванных нотных страниц вы видите зомби, сидящего на табурете и колотящего по барабанам флейтой и молотком вместо барабанных палочек. Зомби, кажется, находится в трансе, его пустые глаза смотрят прямо сквозь вас, не обращая внимания ни на что. Внезапно обшивка малого барабана лопается, не выдержав удара молотка. Это заставляет зомби впадать в ярость, он громко вопит. Выйдя из транса, он замечает вас и тут же бросает в вас молоток. Бросьте кубик. Если выпадет 1-3. Если 4-6.
