  '257':
    title: Параграф 257
    text: Старый лифт, дребезжа, медленно спускается, пока не останавливается на первом этаже, его двери медленно открываются. Вы этого не ожидали, но вас встречают. Вы видите, стоящего за щитом из четырех орущих зомби, самого чокнутого хозяина замка Гингрича Юрра, который безумно смеется и грозит вам кулаком. Один из зомби держит в руке гранату. Вы пытаетесь закрыть дверь лифта, нажимая кнопки «3» и «П» несколько раз, одновременно стреляя в зомби. Все четверо падают под градом пуль, но Юрр приседает позади зомби и остается невредимым. Он толкает зомби, держащего гранату, в спину, и она катится к лифту, пока двери закрываются. Граната попадает в лифт, как раз в тот момент, когда он начинает медленно спускаться в подвал. Происходит мощный взрыв, от которого нет спасения. Если вы носите бронежилет -[А]. Если не носите бронежилет - [Б].
    mood: calm
