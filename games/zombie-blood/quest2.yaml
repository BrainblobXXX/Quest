  '379':
    title: Параграф 379
    text: Спускаясь по железным перекладинам, вы чуть не задыхаетесь от едкой вони, поднимающейся снизу. На дне шахты вы обнаруживаете, что стоите на краю открытой канализации. Из кирпичной стены слева от вас торчит конец большой трубы, из которой выливается весьма неприятное содержимое в канализационный сток, вдоль которого проходит красная кирпичная дорожка – вы как раз на ней стоите. Круглый туннель тускло освещен маленькими лампочками, прикрепленными к свисающему кабелю, подвешенному к кирпичному потолку. Они слишком далеко друг от друга, чтобы вы могли видеть, что находится вдали. Капли воды падают с потолка, издавая жуткий шлепающий звук, когда они попадают в медленно текущую канализационную воду. Вдруг вы слышите писк. Вы всматриваетесь в темноту и видите не зомби, а стаю огромных серых крыс, несущихся к вам. Канализационные крысы мутировали из-за зараженной канализации, они в четыре раза больше обычных. У них выпученные красные глаза, длинные острые зубы и когти. Всего их пятнадцать.
      У каждой 1 очко Выносливости и каждая наносит 1 очко Урона. Вы должны выбрать оружие, чтобы сразиться с ними.
