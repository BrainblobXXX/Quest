  '21':
    title: Параграф 21
    text: 'Вы предоставляете Отто выбор: либо он расскажет вам о Гингриче Юрре, либо дадите ему очень сильный пинок под ребра. Он быстро соглашается рассказать вам все, что знает. Он утверждает, что никогда не встречался с Юрром. Его привезли в замок двое мужчин, которые завербовали его в его родном городе, пообещав работу тюремного сторожа. Они предложили хорошую плату, слишком хорошую, чтобы отказаться. Это было два года назад. В итоге он сам стал здесь пленником, так как ему не позволено покидать тюремные помещения, он может только присматривать за новыми заключенными. Только горстка людей когда-либо разговаривала с ним. И лучше не задавать вопросов о том, почему людей похищают и привозят в замок. Он знает, что Гингрич Юрр - ужасный человек. От старика, который приносил ему еду, он узнал, что Юрр замышляет нечто невыразимо ужасное! Что-то связанное с пленниками. Но он понятия не имеет, что это может быть, так как его задача просто охранять новых пленников, пока их не уведут в другую часть
      замка. Отто замолкает, тупо уставившись в пол. Нельзя терять время, вы должны бежать.'
    mood: calm
    interaction:
      type: continue
      to: '73'
