    text: Бедняжка Эми терзается чувством вины и снова и снова извиняется за то, что случайно выстрелила в вас. Она достает из сумки маленькую аптечку и помогает перевязать рану. Она понимает, что вы действительно пытаетесь ей помочь. Вы отвечаете, что это была ваша собственная вина и, учитывая обстоятельства, надо было сразу сказать, что читали ее дневник.
