    text: На крышке люка есть ручка, и вы поднимаете его довольно легко. Вас тут же окутывает ужасное зловоние, настолько сильное, что вас начинает тошнить. Это отвратительный запах сырых сточных вод. Тут есть узкая шахта, которая спускается вертикально вниз к открытому канализационному туннелю внизу. По всей высоте шахты к стене прикреплены железные перекладины. Вы бросаете камень вниз и слышите, как он приземляется с глухим шлепком в сточные воды внизу. Если хотите спуститься по шахте - [А]. Если предпочитаете закрыть крышку люка и продолжить путь по коридору - [Б].
