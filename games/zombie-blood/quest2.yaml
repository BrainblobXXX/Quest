  '178':
    title: Параграф 178
    text: В коробке лежит маленький перочинный ножик (1d6-2), 15 долларов и короткий кусок веревки. Вы берете то, что хотите, кладете вещи в сумку и перекидываете ее через плечо, прежде чем выйти из комнаты и направиться дальше по коридору.
