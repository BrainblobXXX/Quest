  '254':
    title: Параграф 254
    text: Вы решаете просунуть голову в дыру в двери, чтобы показать девушке, что вы не зомби. Пока вы это делаете, высокий человек с необычно большой головой, вооруженный винтовкой, молча, идет к вам по коридору. Гингрич Юрр смотрит на вас, занятого переговорами с девушкой за дверью, и тихо смеется про себя. Он начинает стрелять и не останавливается, пока не кончатся патроны. Ваше приключение закончилось.
    mood: grief
    ending: true
  '255':
    title: Параграф 255
    text: Когда вы подходите к двери, сильный запах горячей пищи наполняет ваши ноздри и пробуждает голод. Поглощенный мыслями о еде, вы вбегаете в маленькую, плохо освещенную комнату, это жилище Отто. Грязные простыни покрывают тонкий матрас на кованой железной кровати в углу, а у дальней стены стоит старая газовая плита, на которой кипит кастрюля с картошкой. Над плитой несколько плохо выкрашенных зеленых полок, прикрепленных к стене. Одна полка заставлена кухонными принадлежностями и посудой, а другая мешками с овощами, большинство из которых гнилые. На полу вы видите ярко-красную сумку, на которой витиеватыми буквами выведено слово «Хендрикс». Вы открываете сумку и обнаруживаете, что в ней нет ничего, кроме игральных костей, трех карандашей, нескольких монет, книги, в которой недостает половины страниц, и журнала об аккордеонах. Ничто из этого не представляет для вас интерес, и вы высыпаете содержимое на пол, но оставляете себе сумку. В середине комнаты стоит шаткий стол с белой пластиковой
      столешницей, на котором лежит книга в мягкой обложке и тарелка с недоеденным мясным рулетом и картошкой. Если вы хотите доесть трапезу Отто - [А]. Если предпочитаете выйти из комнаты и направиться дальше по коридору – [Б].
