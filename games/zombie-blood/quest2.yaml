  '249':
    title: Параграф 249
    text: Вы поворачиваетесь и бежите, стреляя на ходу в окно, из которого торчит ствол винтовки. Юрр ныряет в укрытие, и вы пробегаете через двойные двери и успеваете запереть их за собой, прежде чем зомби ворвутся следом. Вы прижимаетесь ухом к двери напротив и слышите, что девушка все еще кричит в истерике. Вы решаете помочь ей и зовете ее по имени.
    mood: danger
