  '170':
    title: Параграф 170
    text: Это грязная работа, и вскоре вы весь покрываетесь угольной пылью. Вы как раз собираетесь бросить это дело, когда лопата натыкается на что-то твердое. Вы откидываете уголь в сторону, чтобы обнаружить старый пластиковый мешок, перевязанный нейлоновой бечевкой. Вы развязываете мешок и находите крюк-кошку, прикрепленный к длинной альпинистской веревки. Вы кладете его в сумку, думая, что он может понадобиться позже, и идете к двери, чтобы попытаться открыть ее ключом, висящим на крючке.
    mood: calm
    entry:
    - grant:
        item: climbing_rope
        count: 1
      once: true
    interaction:
      type: continue
      to: '321'
  '171':
    title: Параграф 171
    text: Слегка ошибившись в расчетах, вы тяжело приземляетесь на край матраса и падаете с кровати. Ваша голова ударяется о мраморный пол, как результат сильная боль и головокружение. Потеряйте 2 очка Выносливости. Вы трясете головой, пытаясь сосредоточиться, но головокружение продолжается. Вы слегка контужены, и во время вашего следующего боя должны вычитать 4 из вашего урона. Ваша голова все еще кружится, когда вы встаете, чтобы оглядеться.
