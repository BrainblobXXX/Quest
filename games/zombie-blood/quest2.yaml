  '193':
    title: Параграф 193
    text: Страх и тоска на лице Эми, медленно исчезают, и она с облегчением выдыхает и говорит, что все еще не может до конца поверить, что вы здесь, чтобы помочь ей сбежать. Вы рассказываете ей о том, как были похищены и привезены в замок для превращения в зомби. Вы объясняете, как вам удалось сбежать, и как пробирались по замку, убивая зомби на каждом шагу. «Гингрича Юрра надо остановить! Единственный способ — это убить всех его зомби», - настойчиво говорит Эми. Вы отвечаете, что она не первая, кто это говорит, и рассказываете историю бедного Бориса. Вы говорите ей, чтобы она не волновалась, и обещаете вытащить ее из замка живой -и все еще человеком! Эми удается слегка улыбнуться, она говорит, что нужно спешить, так как сегодняшняя заваруха наверняка спровоцирует извращенный ум Гингрича Юрра на решение превратить себя в зомби и натравить свою армию нежити на мир. Вы оглядываете комнату и видите, что это офис, который, по словам Эми, используется Юрром. На дальней стене несколько полок,
      заполненных коробками с папками и книгами. В середине этой стены есть дверь, а перед ней письменный стол и офисное кресло. В центре комнаты стоит стол для совещаний с восемью стульями. Если хотите заглянуть в ящики письменного стола - [А]. Если хотите открыть дверь в задней части офиса - [Б].
    mood: tense
