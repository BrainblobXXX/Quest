        to: '377'
        letter: А
      - label: Вариант Б
        to: '8'
        letter: Б
  '173':
    title: Параграф 173
    text: Вы поднимаетесь по железным перекладинам, пока не упираетесь в крышку люка в верхней части шахты. Вы нажимаете на нее и с облегчением видите, что она поднимается. Вылезаете из шахты и оказываетесь в маленькой комнате с голыми выкрашенными в белый цвет стенами. В одной стене белая дверь с ключом в замке. Ключ поворачивается, и дверь открывается в широкий коридор, точно такой же, как тот по которому вы шли, прежде чем спуститься в канализацию. Движение налево приведет вас туда, где вы уже были, поэтому решаете, пойти направо к лестничному пролету.
    mood: calm
    interaction:
      type: continue
      to: '250'
  '174':
    title: Параграф 174
    text: На таком близком расстоянии такой превосходный стрелок, как Юрр, не промахнется мимо такой легкой цели. Пуля попадает вам в голову, и вы умираете, прежде чем упадете на землю. Ваше приключение закончилось.
    mood: grief
    ending: true
  '175':
    title: Параграф 175
    text: Угол шкафа бьет вас по лбу, и вы кричите от боли. Вы падаете на пол душа ошеломленный и растерянный, кровь течет по вашему лицу. Потеряйте 4 очка Выносливости. Если вы все еще живы.
