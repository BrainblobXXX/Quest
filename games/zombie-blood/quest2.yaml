        effects:
        - consume:
            item: grenade
  '328':
    title: Параграф 328
    text: 'Имя пользователя указано правильно, но теперь вас просят ввести пароль. Вы обсуждаете с Эми возможные варианты и соглашаетесь, что это должно быть связано с любимой игрушкой Юрра – его автомобилем. Вы выбираете два варианта: прозвище машины - «моя кошка» или марка и модель. Если хотите ввести «моя кошка» - [А]. Если хотите ввести марку и модель автомобиля - [Б].'
    mood: calm
    interaction:
      type: choices
      options:
