  '324':
    title: Параграф 324
    text: Когда опускаете выключатель вниз, вы слышите слабый щелчок. Вы активировали ловушку. Без предупреждения из незаметного отверстия в стене под выключателем вылетает маленький дротик. Бросьте кубик. Если выпадет 1-3. Если 4-6.
