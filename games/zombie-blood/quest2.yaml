  '301':
    title: Параграф 301
    text: Дверь не заперта и открывается в большую комнату, которая заставлена рядами книжных шкафов, в воздухе стоит затхлый запах, исходящий от старых томов в кожаных переплетах, которые сгнили здесь с течением времени, стоя непрочитанными на полках. Без предупреждения два зомби выскакивают из-за одного из книжных шкафов, чтобы напасть на вас.
    mood: danger
