        max: 6
        to: '127'
      - min: 1
        max: 3
        to: '175'
  '314':
    title: Параграф 314
    text: Вы быстро прикрепляете крюк к задней части часов и бросаете веревку через дыру в циферблате. Пока зомби идет к вам с динамитом в руке, вы прыгаете через отверстие и спускаетесь вниз по стене часовой башни. Веревка недостаточно длинная, и вы должны отпустить ее, чтобы спрыгнуть на крышу внизу. Приземляясь, вы сильно подворачиваете лодыжку. Потеряйте 1 очко Выносливости. Над вами происходит мощный взрыв, кровля часовой башни разлетается в стороны. Сверху на вас падает мусор - осколки камня, дерева, детали часов и даже нога зомби.
    mood: danger
    entry:
    - modify:
        stat: stamina
        delta: -1
    interaction:
      type: continue
      to: '359'
  '315':
    title: Параграф 315
    text: Все больше и больше зомби собираются внизу. Держась одной рукой за водосточную трубу, вы роетесь в сумке в поисках гранаты. Вытаскиваете чеку зубами и роняете гранату на зомби внизу. Раздается громкий взрыв, уничтожающий зомби под вами, но привлекающий еще больше зомби. Перебравшись через груду тел, они хватаются за водосточную трубу и начинают отчаянно дергать ее. Она трясется и дрожит, вы с трудом цепляетесь за нее, а потом труба отрывается от стены. Вы падаете прямо в лапы зомби внизу. Вы растерзаны ими и вскоре станете одним из них. Ваше приключение закончилось.
    mood: grief
    ending: true
  '316':
    title: Параграф 316
    text: 'Вы перешагиваете через убитых зомби, чтобы попасть в лифт. Вы видите, что внутри есть четыре кнопки, которые можете нажать: «3», «2», «1» и «П», которые, как предполагаете, означают этажи и подвал. Вы находитесь на третьем этаже. Нажмете на кнопку «2» [А], кнопку «1» [Б] или кнопку «П» [В]?'
    mood: calm
    interaction:
      type: choices
      options:
      - label: Вариант А
        to: '159'
        letter: А
      - label: Вариант Б
        to: '116'
        letter: Б
      - label: Вариант В
