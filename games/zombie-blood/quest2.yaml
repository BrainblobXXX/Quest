format: quest/2
id: zombie-blood
title: Кровь зомби
profile: fighting-fantasy
status: release
author: Ян Ливингстон
genre: ужасы
annotation: Безумный мегаломаньяк Гингрич Юрр готовится выпустить на волю армию чудовищных зомби и обрушить ее на весь мир. Он должен быть остановлен и его орда нежити побеждена. В этом приключении на грани жизни или смерти принятые решения определят судьбу всего мира.
language: ru
source: Книга-игра Кровь зомби.pdf
cover: assets/cover.jpg
moods:
  calm: music/bloodzombies - calm.mp3
  tense: music/bloodzombies - tense.mp3
  danger: music/bloodzombies - danger.mp3
  victory: music/bloodzombies - calm.mp3
  mystery: music/bloodzombies - tense.mp3
  grief: music/bloodzombies - calm.mp3
features:
- choices
- combat.pool
- shop
- roll
- initial-roll
effects:
  concussion:
    title: Контузия
    kind: debuff
    icon: concussion
    description: −4 к урону в следующем бою
    duration: next_combat
    stacking: refresh
    modifiers:
      player_damage: -4
stats:
  stamina:
    vital: true
    title: Выносливость
    initial: 20
    min: 0
    max: 32
    roll: 2d6
items:
  penknife:
    title: Перочинный ножик
    description: Маленький ножик из коробки в §178, урон 1d6-2.
    damage: 1d6-2
  baseball_bat:
    title: Бейсбольная бита
    description: Бейсбольная бита из спортивной сумки в §291, урон 1d6.
    damage: 1d6
  axe:
    title: Топор
    description: Топор из руки однорукого зомби в §373, урон 1d6.
    damage: 1d6
  short_rope:
    title: Короткий кусок веревки
    description: Короткая веревка из коробки в §178; нужна, чтобы держаться за трос.
  sword:
    title: Меч
    description: Меч из латных рукавиц доспеха, урон 1d6.
    damage: 1d6
  chainsaw:
    title: Бензопила
    description: Бензопила зомби, урон 2d6+3; тяжёлая — при взятии теряется 1 Выносливости.
    damage: 2d6+3
  crowbar:
    title: Лом
    description: Лом из котельной, урон 1d6; также инструмент для замков и дверей.
    damage: 1d6
  pistol:
    title: Пистолет
    description: Заряженный пистолет из прикроватной тумбочки, урон 1d6+2.
    damage: 1d6+2
    ammo: ammo
  sawed_off:
    title: Обрез дробовика
    description: Обрез из шкафчика в §236, урон 1d6+4.
    damage: 1d6+4
    ammo: shotgun_ammo
  shotgun:
    title: Дробовик
    description: Дробовик из шкафа за картиной, урон 1d6+5.
    damage: 1d6+5
    ammo: shotgun_ammo
  submachine:
    title: Пистолет-пулемет
    description: Пистолет-пулемет из футляра для виолончели, урон 2d6+5.
    damage: 2d6+5
    ammo: ammo
  ammo:
    title: Коробки патронов
    description: Обычные патроны для пистолета и пистолета-пулемёта. Единица инвентаря = одна коробка; по правилам расход не считается.
  shotgun_ammo:
    title: Коробки дробовых патронов
    description: Патроны для дробовика и обреза. Единица инвентаря = одна коробка; по правилам расход не считается.
    countable: true
  grenade:
    title: Граната
    description: Ручная граната, уничтожает 2d6+1 зомби.
    damage: 2d6+1
    countable: true
    consumable: true
  medkit:
    title: Аптечка
    description: Восстанавливает Выносливость до начального уровня, но не выше; используется один раз.
    countable: true
    consumable: true
    restore: stamina
  climbing_rope:
    title: Альпинистская веревка с крюком
    description: Крюк-кошка на длинной веревке из мешка в угольном складе.
  pulley:
    title: Стальной шкив
    description: Продаётся у Бориса за 1 доллар; нужен, чтобы съехать по тросу.
  hacksaw:
    title: Ножовка
    description: Продаётся у Бориса за 1 доллар; пилит решётки и двери.
  rubber_gloves:
    title: Резиновые перчатки
    description: Продаются у Бориса за 1 доллар; защищают от заражённой крови.
  lab_coat:
    title: Лабораторный халат
    description: 'Халат из гардероба: можно выдать себя за лаборанта.'
  note_paper:
    title: Лист желтой бумаги
    description: 'Записка из бутылки: «кодовый замок номер: 181».'
  note121:
    title: 'Запись «Юрр: доб. 121»'
    description: Добавочный номер Юрра из записной книжки.
  code161:
    title: Код 161
    description: Код потайной двери из документа Юрра.
  note333:
    title: Листок с числом 333
    description: Листок с числом 333 из бумажника.
  gold_locket:
    title: Золотой медальон на цепочке
    description: Медальон Эми Флетчер с её фотографией; отдаётся Эми.
  plate_armor:
    title: Латные доспехи
    description: 'Доспехи с постамента в коридоре: тяжёлые, но защищают от собак и ударов.'
  body_armor:
    title: Бронежилет
    description: 'Бронежилет из кофра: принимает на себя взрыв и осколки.'
  brass_key:
    title: Большой латунный ключ
    description: Ключ от главных ворот замка, с числом на бородке.
  keyring:
    title: Связка ключей 1–8
    description: Восемь ключей с номерами от 1 до 8.
  number9_key:
    title: Ключик с цифрой 9
    description: Маленький ключик с цифрой 9 из мешочка.
  number111_key:
    title: Медный ключ с числом 111
    description: Медный ключ из одежды зомби, на нём выбито 111.
  car_keys:
    title: Ключи от машины
    description: Набор ключей от машины из сейфа.
  money:
    title: Доллары
    kind: misc
    countable: true
start: prolog
scenes:
  '1':
    title: Параграф 1
    text: Вы пинаете тараканов и стараетесь дотянуться до хлеба ногами. Вы подтягиваете его к себе и хватаете рукой. Вы отламываете маленькие кусочки, бросая их по одному в рот. Вы даете себе глупое обещание, что однажды покажете этот трюк своим друзьям, если доживете до того, чтобы рассказать эту историю. Вы вдыхаете, прежде чем потянуться еще дальше на этот раз, чтобы добраться до миски. Боль становится невыносимой, когда кандалы еще глубже впиваются в ваши израненные запястья, заставляя свежую кровь стекать по рукам. Еще несколько недель назад вы и представить себе не могли, что будете испытывать столько мучений только ради того, чтобы съесть миску старого тушеного мяса, но теперь голод гонит вас вперед. С последним мучительным усилием вам удается обхватить миску обеими ногами, осторожно приподнять ее и передать в скованные руки. Вы опрокидываете содержимое миски в рот, глотая вонючие помои. Вкус так ужасен, что на мгновение вам кажется, что вас сейчас стошнит, но вы так голодны, что
      проглатываете каждый кусочек, хрящ и все остальное. Но нескольких кусков гнилого мяса недостаточно, чтобы сохранить жизнь даже паршивой собаке, не говоря уже о голодном пленнике. Нужно что-то делать, прежде чем вы умрете с голоду. И если это правда, что Гингрич Юрр собирается убить вас, то нечего терять время. Вам придется попытаться сбежать из своей тюремной камеры. Если хотите позвать Отто - [А]. Если предпочитаете подождать, чтобы поговорить с ним, когда он в следующий раз войдет в вашу камеру - [Б].
    mood: mystery
    image: assets/images/1-1.jpg
    interaction:
      type: choices
      options:
      - label: Вариант А
        to: '59'
        letter: А
      - label: Вариант Б
        to: '194'
        letter: Б
  '2':
    title: Параграф 2
    text: Вы приземляетесь на пол в коридоре, сильно повредив плечо. Потеряйте 3 очка Выносливости. Огромный зомби, который напал на вас, лежит неподвижно рядом на груде трупов. Некоторые из ящиков и чемоданов также упали с чердака вместе с вами. Если хотите осмотреть их - [А]. Если предпочитаете пройти к лифту в конце коридора - [Б].
    mood: calm
    entry:
    - modify:
        stat: stamina
        delta: -3
    interaction:
      type: choices
      options:
      - label: Вариант А
        to: '336'
        letter: А
      - label: Вариант Б
        to: '367'
        letter: Б
    prop:
      image: assets/furniture/crates/crate-worn-closed.png
  '3':
    title: Параграф 3
    text: Шальная пуля пролетает мимо вашего уха и попадает в стену позади вас. Эми вдруг приходит в себя и понимает, что вы действительно пытаетесь ей помочь. Она мучается чувством вины из-за того, что чуть не застрелила вас, и снова и снова извиняется. Вы отвечаете, что это была ваша собственная вина, учитывая обстоятельства, надо было сразу сказать, что читали ее дневник.
    mood: mystery
    interaction:
      type: continue
      to: '193'
  '4':
    title: Параграф 4
    text: Вы подходите к краю крыши и хватаетесь за водосточную трубу, чтобы спуститься вниз. Когда начинаете спуск, зомби во дворе становятся чрезвычайно взволнованными. Они начинают громко визжать, охваченные неконтролируемой яростью. Вы начинаете сомневаться, что спуск во двор был такой уж хорошей идеей, и в этот момент видите, как Гингрич Юрр выходит из гаража, держа в руках винтовку с оптическим прицелом. Он очень раздосадован тем, что вы сбежали из своей камеры. Он прицеливается и стреляет. Бросьте кубик. Если выпадет 1-3. Если выпадет 4-6.
    mood: danger
    interaction:
      type: roll
      formula: 1d6
      outcomes:
      - min: 4
        max: 6
        to: '58'
      - min: 1
        max: 3
        to: '389'
  '5':
    title: Параграф 5
    text: Вы осторожно пробираетесь между висящими тушами, направляясь в заднюю часть комнаты. Вы можете видеть, как ваше собственное дыхание замерзает в ледяном воздухе. Без предупреждения одна из висящих свиных туш качается в вашу сторону, подталкиваемая невидимой рукой. Вы на мгновение теряете равновесие, и в этот момент молодая женщина-зомби, одетая в рваный бежевый джемпер и рваные черные леггинсы, выскакивает из-за говяжьей туши, размахивая бензопилой. Может быть, это Эми? У вас нет времени думать об этом, зомби запускает свою бензопилу и нападает. Инициатива принадлежит ей. Бросьте кубик. Если выпадет 1-3. Если выпадет 4-6.
    mood: danger
    image: assets/images/5-1.jpg
    interaction:
      type: roll
      formula: 1d6
      outcomes:
      - min: 4
        max: 6
        to: '98'
      - min: 1
        max: 3
        to: '130'
  '6':
    title: Параграф 6
    text: Быстрый обыск карманов зомби не дает ничего полезного. Впереди в нише в правой стене стоит большой желтый мусорный бак на колесиках. На крышке кровавые отпечатки рук, а с передней стороны капает свежая кровь. Если хотите поднять крышку, чтобы заглянуть внутрь - [А]. Если хотите продолжить путь вперед - [Б].
    mood: calm
    interaction:
      type: choices
      options:
      - label: Вариант А
        to: '397'
        letter: А
      - label: Вариант Б
        to: '155'
        letter: Б
  '7':
    title: Параграф 7
    text: На полпути по коридору вы замечаете длинный деревянный шест, прикрепленный к кронштейну на стене. На одном конце у него маленький латунный крючок. Посмотрев вверх, вы видите люк в потолке. В конце коридора находится лифт с полированными металлическими дверями. Если хотите открыть люк с помощью шеста - [А]. Если хотите воспользоваться лифтом - [Б].
    mood: calm
    interaction:
      type: choices
      options:
      - label: Вариант А
        to: '146'
        letter: А
      - label: Вариант Б
        to: '367'
        letter: Б
  '8':
    title: Параграф 8
    text: Большая группа зомби появляется из темноты и бежит к вам на большой скорости. Их очень много - двадцать четыре. Есть время использовать гранату, если она у вас есть, это уменьшит их количество на (2d6+1), прежде чем начать стрелять в оставшуюся часть приближающейся толпы.
    mood: danger
    interaction:
      type: combat
      mode: pool
      enemies:
      - name: Зомби без оружия
        count: 24
        attack: 1
        health: 1
      options:
        pre_damage: 2d6+1
        pre_damage_kind: grenade
        pre_damage_item: grenade
        pre_damage_optional: true
      outcomes:
        victory: '382'
  '9':
    title: Параграф 9
    text: К вашему большому удовлетворению, ключ поворачивается в замке. Со скрипом тяжелая дверь открывается, она ведет в старый угольный склад. На куче угля лежит лопата, но больше ничего интересного здесь нет. В дальней стене еще одна черная железная дверь, а рядом на крючке висит ключ. Если вы хотите порыться в куче угля с помощью лопаты - [А]. Если предпочитаете открыть дверь ключом, висящим на крючке - [Б].
    mood: tense
    interaction:
      type: choices
      options:
      - label: Вариант А
        to: '170'
        letter: А
      - label: Вариант Б
        to: '321'
        letter: Б
  '10':
    title: Параграф 10
    text: С оружием в руках вы слегка приоткрываете дверь. Зомби тут же бросаются в атаку, распахивая дверь и отбрасывая вас назад. Вы стреляете в них, когда они врываются в комнату, но они продолжают наступать. Продолжаете стрелять, пока не кончаются патроны, перезарядить вы уже не успеваете. Вы отшатываетесь и прижимаетесь к стене, а зомби приближаются к вам, пуская слюни. Среди них человек в оранжевом комбинезоне, чье лицо вы узнаете, хотя сейчас оно покрыто открытыми ранами и кровоточащими язвами. Борис превратился в зомби, и скоро и вы станете таким как он. Ваше приключение закончилось.
    mood: grief
    ending: true
  '11':
    title: Параграф 11
    text: Вы бежите, спасая свою жизнь, к дверям, а на вас несется автомобиль, громко ревя клаксоном. Юрр нетерпеливо давит на акселератор, стараясь ехать еще быстрее. Машина почти на полной скорости врезается вам в спину, подбрасывая в воздух. Юрр продолжает разъезжать по двору, торжествующе ударяя кулаком по воздуху и махая невидимой толпе, словно на арене в древности. Ваше приключение закончилось.
    mood: grief
    ending: true
  '12':
    title: Параграф 12
    text: 'Вскоре вы подходите к другой двери в правой стене, снова выкрашенной в белый цвет. На ней красными буквами написано: «Раздевалки». Если хотите войти - [А]. Если предпочитаете идти дальше - [Б].'
    mood: calm
    interaction:
      type: choices
      options:
      - label: Вариант А
        to: '54'
        letter: А
      - label: Вариант Б
        to: '220'
        letter: Б
  '13':
    title: Параграф 13
    text: Без предупреждения двойные двери шкафа распахиваются. Два полуживых человекоподобных существа в разорванной одежде выскакивают наружу и пытаются схватить вас своими кровоточащими покрытыми волдырями руками. У одного сломанные пальцы торчат под странными углами. Кожа у них серая и бледная, покрытая открытыми ранами и гноящимися язвами. У них тонкие сальные волосы, а в разинутых ртах видны сломанные почерневшие зубы. Их запавшие налитые кровью глаза сочатся желтой слизью. Ужасный булькающий звук вырывается у них из горла, когда они приближаются к вам. Они – зомби! Вы должны сражаться с ними голыми руками или оружием, если оно у вас есть.
    mood: danger
    image: assets/images/13-1.jpg
    interaction:
      type: combat
      mode: pool
      enemies:
      - name: Зомби без оружия
        count: 2
        attack: 1
        health: 1
      outcomes:
        victory: '235'
  '14':
    title: Параграф 14
    text: Вы подходите к двери и обнаруживаете, что она не заперта. Вы выходите на посыпанный гравием вход во внутренний двор. За входом, прямо напротив вас, есть еще одна дверь, которая ведет в коридор с другой стороны южного крыла. Справа от вас - главные ворота замка; огромные деревянные двойные створки под высокой каменной аркой. Они заперты на висячий замок. Зомби во дворе замечают вас, и все вместе двигаются к вам. Они ускоряются по мере приближения, некоторые в спешке спотыкаются и падают и еще больше новых зомби выходят во двор. Их так много, что сосчитать невозможно. Вы должны быстро решить, что делать. Если хотите сразиться с ними - [А]. Если хотите попробовать открыть висячий замок на главных воротах - [Б].
    mood: calm
    interaction:
      type: choices
      options:
      - label: Вариант А
        to: '107'
        letter: А
      - label: Вариант Б
        to: '350'
        letter: Б
  '15':
    title: Параграф 15
    text: Голова зомби высовывается из люка, он шарит глазами по комнате. Вы должны действовать быстро. Вы поднимаете с пола кирпич и швыряете его в стеклянный циферблат часов. Он разлетается вдребезги, осыпая дождем из тысяч осколков стекла крышу примерно в двенадцати метрах внизу. Если у вас есть альпинистская веревка с крюком - [А]. Если у вас нет веревки - [Б].
    mood: calm
    interaction:
      type: choices
      options:
      - label: Вариант А
        to: '314'
        letter: А
        if:
          has_item:
            id: climbing_rope
      - label: Вариант Б
        to: '91'
        letter: Б
        if:
          not:
            has_item:
              id: climbing_rope
  '16':
    title: Параграф 16
