    text: Лестница ведет вниз, в бетонный туннель. Впереди слышны громкие голоса, и кто-то или что-то дребезжит дверцей металлической клетки. Вы медленно идете по туннелю туда, откуда доносится шум. Он заканчивается у решетки большой тюремной камеры, полной визжащих зомби. Увидев вас, они впадают в бешенство - в слепой ярости они бросаются на железные прутья. Внезапно замок на двери слетает, и зомби высыпают наружу, раскинув руки, отчаянно желая съесть вас заживо. Всего их девятнадцать, и вы должны сражаться с ними.
