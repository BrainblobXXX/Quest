  '295':
    title: Параграф 295
    text: Дверь ведет в маленькую ванную комнату. На раковине лежат наручные часы и очки для чтения, которые, должно быть, кто-то забыл здесь. Вы пользуетесь возможностью впервые за несколько дней хорошенько умыться, и в результате чувствуете себя намного лучше. Вы также делаете большой глоток воды из-под крана. Добавьте 2 очка Выносливости. Вы можете взять часы и очки, прежде чем уйти и пойти дальше по коридору.
