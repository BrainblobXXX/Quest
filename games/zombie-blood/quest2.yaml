  '305':
    title: Параграф 305
    text: Зомби поднимаются по лестнице и начинают биться в пожарную дверь. Она содрогается под их натиском, и пройдет совсем немного времени, прежде чем они ее сломают. Если хотите принять бой с зомби - [А]. Если хотите посмотреть вниз во двор - [Б].
    mood: calm
