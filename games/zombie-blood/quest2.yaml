  '253':
    title: Параграф 253
    text: Один из зомби протягивает руку и пытается схватить гранату, когда она пролетает у него над головой. Но он хватает лишь воздух. Через несколько секунд граната взрывается в гуще плотно стоящих зомби, которые принимают на себя всю силу взрыва, многих из них разорваны на куски. Уменьшите их число на 2d6+1. Вы вскакиваете, чтобы сразиться с теми, кто еще остался.
