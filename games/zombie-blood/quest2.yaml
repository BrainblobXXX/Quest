        to: '309'
        letter: Б
  '322':
    title: Параграф 322
    text: Вы быстро поднимаетесь по ступенькам. Вы находитесь примерно на полпути вверх, когда слышите шум снизу. Кто-то еще поднимается по лестнице позади вас. Вы торопитесь вверх по лестнице, пока не доберетесь до люка в деревянном полу над вами. Он не заперт, и вы открываете его и оказываетесь в квадратной комнате на вершине часовой башни. С потолка свисает огромный бронзовый колокол. На каждой из четырех стен, обращенных к внешнему миру, висят четверо больших механических часов, все они громко тикают. Глядя сквозь прозрачные циферблаты часов, вы видите вдали леса и горы и жаждете вырваться на свободу. Но сейчас у вас есть другие, более неотложные дела; шаги на лестнице становятся все громче. Кто бы это ни был, его, похоже, не волнует, что вы можете услышать его приближение. Вы слышите хихиканье, но это не совсем человеческий голос. Вы хватаете оружие, готовый сразиться с кем бы то ни было. Хихиканье прекращается, и вы слышите повторяющийся щелкающий звук, который напоминает вам о щелканье
      зажигалки. Вы смотрите вниз через люк и видите здоровенного зомби, стоящего на лестнице с тремя динамитными шашками в одной руке, их горящие фитили громко шипят. Если вы вооружены огнестрельным оружием и хотите застрелить зомби - [А]. Если предпочитаете захлопнуть люк - [Б]. Если хотите разбить стеклянный циферблат часов, попытаться выбраться наружу и спуститься с часовой башни - [В].
    mood: calm
    image: assets/images/322-1.jpg
    interaction:
      type: choices
      options:
