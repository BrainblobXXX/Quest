    text: 'Коридор заканчивается дверью. Вы можете услышать звук шагов за ней. Нет другого выхода, кроме как открыть дверь и встретиться лицом к лицу с кем бы то ни было. Вы глубоко вдыхаете, пинком открываете дверь и бросаетесь внутрь, чтобы обнаружить, что стоите в большой кладовой. Мужчина делает пометки в блокноте, осматривает тянущиеся от пола до потолка полки, которые в основном пусты. Ему около 30 лет, он довольно коренастый, с бритой головой, в оранжевом комбинезоне и черных ботинках. Похоже, его не беспокоит ваше неожиданное вторжение. «А, вы, должно быть, новый пленник. Я не ожидал увидеть вас здесь, - говорит он как бы между прочим. - Ни одно тело еще не сбежало из темницы Отто. Может быть, вы назовете мне хоть одну причину, по которой я не должен поднимать тревогу?» Прежде чем вы успеваете заговорить, мужчина улыбается и говорит: «Ответ, мой друг, - деньги. Покажи мне деньги! Кстати, меня зовут Борис». «А я Грегор», - произносит низкий голос слева. Вы оборачиваетесь и видите
      гораздо более пожилого мужчину с морщинистым лицом. На нем коричневая куртка и грязные старые кроссовки. По какой-то причине его макушка обмотана грязными бинтами. В стене напротив той, через которую вы вошли, есть дверь. Если вы хотите сделать рывок к этой двери - [А]. Если хотите остаться и поговорить с мужчинами - [Б].'
