  '304':
    title: Параграф 304
    text: Дверь открывается, и вы видите узкий шкаф, встроенный в стену. Внутри шкафа вы с радостью находите идеальный оружие против зомби - дробовик (1d6+5), четыре коробки патронов к нему и две коробки обычных патронов. Вы забираете все и быстро закрываете дверь, возвращая картину в исходное положение. Если хотите пойти налево по коридору - [А]. Если хотите пройти направо по коридору - [Б].
    mood: calm
