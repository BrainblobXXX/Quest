  '317':
    title: Параграф 317
    text: Даже если мясной рулет не является вашим любимым блюдом, прямо сейчас он кажется лучшей пищей, которую вы когда-либо пробовали в своей жизни. Вы уплетаете его с картошкой, удовлетворенно похлопываете себя по полному животу и громко рыгаете. Восстановите 2 очка Выносливости. Вы уже собираетесь выйти из комнаты, когда замечаете маленькую металлическую коробку, спрятанную под плитой. Если хотите открыть коробку - [А]. Если предпочитаете выйти из комнаты и пойти по коридору - [Б].
    mood: calm
