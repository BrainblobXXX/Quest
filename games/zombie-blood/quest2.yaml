  '290':
    title: Параграф 290
    text: Дверь не заперта и открывается в гостиную, которая полностью разгромлена. Светло-серый диван лежит вверх ногами, его льняное покрытие и подушки разорваны, наполнитель рассыпан по всему полу. Два кресла находятся в таком же состоянии, а белый пластиковый кофейный столик растоптан и расплющен. Все картины сорваны со стен, их рамы разбиты вдребезги и лежат на полу среди осколков стекла и керамики. Красный пластиковый радиоприемник засунут в цветочный горшок. Он все еще работает, на полную громкость вещая какую-то драму. Телевизор лежит на боку у дальней стены, из разбитого экрана торчит зонтик. Рядом с ним на кованой подставке стоит огромный прямоугольный аквариум, в передней стеклянной панели которого проделано отверстие, из которого все еще льется вода. Зомби подхватывает прыгающих по полу рыб и запихивает их в разинутую пасть. Вы как раз собираетесь напасть на зомби, когда второй, который прятался за дверью, прыгает вам на спину и пытается укусить за шею. Бросьте кубик. Если выпадет
      1-3. Если выпадет 4-6.
    mood: calm
    image: assets/images/290-1.jpg
    interaction:
      type: roll
      formula: 1d6
      outcomes:
      - min: 4
        max: 6
        to: '363'
      - min: 1
        max: 3
        to: '191'
  '291':
    title: Параграф 291
    text: Вы расстегиваете молнию на сумке и находите какую-то старую спортивную одежду - пару серых спортивных штанов, футболку и пару кроссовок. Все, кажется, вашего размера, можете надеть, если хотите. Но самое интересное, что находите в сумке, - это бейсбольная бита (1d6), которая может служить очень полезным оружием. Внезапно вы слышите скребущие звуки, доносящиеся из шкафа.
