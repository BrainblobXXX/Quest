  '240':
    title: Параграф 240
    text: 'На лестничной площадке постелен ковер, а стены оклеены яркими узорчатыми обоями. На стенах висят натюрморты и зеркала, но ничего ценного для вас. Вы идете дальше, пока не дойдете до угла, где коридор резко поворачивает налево. За углом вы видите белую дверь в правой стене метрах в двадцати впереди. Вы подходите к двери и видите вывеску, написанную красными буквами: «Гимнастический зал». Если хотите открыть дверь - [А]. Если предпочитаете идти дальше - [Б].'
