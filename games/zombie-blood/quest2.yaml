    text: Вы придвигаете тяжелую кровать с балдахином к двери и наваливаете на нее всю остальную мебель из спальни. Шум снаружи становится все громче, поскольку прибывает все больше зомби, привлеченных суматохой. Они продолжают колотить в дверь, и вы видите, что косяк начинает отходить от стены, замок ломается. Если вы хотите остаться в спальне - [А]. Если хотите выпрыгнуть из окна во двор - [Б].
