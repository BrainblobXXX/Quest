  '194':
    title: Параграф 194
    text: Проходит много часов, прежде чем вы снова слышите звук отодвигающегося засова. Несмотря на то, что вы стали бояться сапога Отто, шум также сигнализирует о прибытии еды, хотя и отвратительной. Как это часто бывает, Отто пьян и с нетерпением ждет, чтобы сыграть в свою обычную игру, поставить миску с холодным рагу вне вашей досягаемости, прежде чем дать вам хороший пинок. Но на этот раз его ждет сюрприз. Чтобы отвлечь его, вы говорите ему, что он пахнет хуже, чем мешок мертвых лягушек, что приводит его в слепую ярость. Но вы готовы, и решив действовать по принципу «все или ничего», рассчитываете время, чтобы ударить его ногами и прижать к земле. Когда он отводит ногу назад, чтобы ударить вас, вы ловите момент и наносите удар. Держась за цепи, вы выбрасываете ноги вверх, чтобы застать врасплох толстого тюремщика. Если хотите рискнуть попробовать нанести удар в голову - [А]. Если хотите нанести удар в корпус - [Б].
    mood: calm
    interaction:
      type: choices
