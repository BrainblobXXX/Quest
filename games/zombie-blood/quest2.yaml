  '235':
    title: Параграф 235
    text: Расправиться с двумя медлительными зомби было достаточно легко, но вы знаете, что если не найдете себе серьезное оружие, у вас не будет никаких шансов против орды живых мертвецов. Вы перешагиваете через тела, чтобы заглянуть в шкаф. Внутри вы находите небольшую металлическую коробку с зеленым крестом на крышке - это аптечка. Есть также две картонные коробки с патронами, которые вы кладете в сумку вместе с аптечкой. По крайней мере, теперь у вас есть боеприпасы, но нет огнестрельного оружия. Другого выхода из комнаты нет, поэтому вы возвращаетесь тем же путем, каким пришли.
