        letter: А
        if:
          has_item:
            id: gold_locket
      - label: Вариант Б
        to: '52'
        letter: Б
        if:
          not:
            has_item:
              id: gold_locket
  '339':
    title: Параграф 339
    text: С оружием наготове вы делаете шаг вперед, чтобы защитить Бориса. Ваше сердце бешено колотится, когда вы подсчитываете количество визжащей нежити, несущейся по коридору к вам. Всего здесь двадцать семь зомби. Если у вас есть гранаты, можете использовать одну - [А]. Если у вас нет гранат - [Б].
    mood: calm
    interaction:
      type: choices
