    text: Вы приземляетесь на пол в коридоре и снова подворачиваете лодыжку. Потеряйте 1 очко Выносливости. Огромный зомби, который напал на вас, лежит неподвижно рядом на груде трупов. Некоторые из ящиков и чемоданов также упали с чердака вместе с вами. Если хотите осмотреть их - [А]. Если предпочитаете пройти к лифту в конце коридора - [Б].
