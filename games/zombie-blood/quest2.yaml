  '179':
    title: Параграф 179
    text: Здесь слишком темно, чтобы вы могли видеть, сколько зомби находится в комнате, поэтому стреляете в приближающуюся толпу наугад. Они продолжают продвигаться вперед, не останавливаясь, даже, несмотря на то, что многие из них срезаны вашими пулями. Внезапно вы получаете удар по голове куском камня от зомби, который выпрыгивает из тени слева от вас. Потеряйте 3 очка Выносливости. Если вы еще живы, бросьте кубик. Если выпадет 1-3. Если выпадет 4-6.
