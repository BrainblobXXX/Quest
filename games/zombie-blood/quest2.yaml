  '252':
    title: Параграф 252
    text: Повернув за угол, вы скоро оказываетесь на перекрестке. Справа от вас есть еще один коридор, ведущий туда, откуда вы только что пришли. Прямо впереди коридор ведет дальше, прежде чем резко повернуть направо. Слева от вас широкая лестница с ковровым покрытием, на этот раз ведущая вниз. Снизу доносится громкий стук и крики. Вы решаете выяснить, что это, держа оружие в руках и готовый к бою.
    mood: calm
