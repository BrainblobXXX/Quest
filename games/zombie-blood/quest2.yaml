    text: Ученый бросается на вас, но вы успеваете вовремя отпрыгнуть в сторону. Шприц мелькает в воздухе, едва не задевая вашу шею. Вы стреляете в потолок и кричите, чтобы он бросил шприц на пол и раздавил его ногами. Он повинуется, хотя и неохотно. Вы указываете стволом ученым, чтобы они шли дальше, пока не дойдут до первой открытой камеры, в которую велите войти. Вы закрываете за ними дверь и запираете ее, достаете ключ из замка и кладете в карман. Ученые начинают кричать, говоря, что когда они освободятся из клетки, они превратят вас в зомби. Вы машете им на прощание, обещая, что скоро в замке не останется никаких зомби. Вы проходите обратно через распашные двери и подходите к двери в правой стене. Она не заперта, и вы ее открываете.
