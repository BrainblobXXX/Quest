        allowed_items: []
      options:
        pre_stamina: 4
      outcomes:
        victory: '360'
  '169':
    title: Параграф 169
    text: Если хотите вернуться в спальню, чтобы прочитать дневник - [А]. Если хотите обыскать карманы одежды зомби -[Б].
