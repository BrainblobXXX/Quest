  '223':
    title: Параграф 223
    text: Вы проходите мимо резного стола красного дерева, на котором стоит большая расписная ваза и две маленькие фарфоровые статуэтки. У вазы поразительный узор из переплетенных синих цветов, нарисованных на ней. Вы заглядываете в нее, но она пуста. В столе есть небольшой ящик. Вы открываете его и находите рулетку, очки для чтения, карманный румыно-английский словарь и калькулятор. Берете, что хотите, и идете дальше. Коридор резко поворачивает направо, и вскоре вы подходите к двери в правой стене, на который привинчена нарисованная от руки вывеска с надписью «Уборщики». Если хотите открыть дверь - [А]. Если предпочитаете идти дальше - [Б].
