    text: 'Вскоре становится ясно, кто идет по коридору. Стая из девятнадцати зомби направляется к вам, а впереди идет кто-то, кого вы узнаете. Это мужчина с лысой головой в оранжевом комбинезоне и черных армейских ботинках. Это Борис, но не такой, каким вы его помните. Он больше не человек. У него мокнущие волдыри и открытые язвы на голове. Его глаза налиты кровью и выпучены из потемневших глазниц. Его верхняя губа оторвана, обнажая кровоточащие десны и сломанные зубы. Борис превратился в зомби. Он кидается к вам, размахивая пистолетом, по-видимому, не подозревая, что это оружие. Он призывает зомби позади него напасть на вас, хотя они не то чтобы нуждались в этих указаниях, крича во весь голос: «Надо убить их всех! Надо убить их всех!» - снова и снова. У вас нет выбора, кроме как сражаться с ним и другими девятнадцатью зомби.'
