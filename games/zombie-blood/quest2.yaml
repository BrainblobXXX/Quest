    text: Вы бежите вверх по лестнице так быстро, как только можете. Сигнал тревоги замолкает, когда вы находитесь на полпути вверх, его сменяют новые звуки, идущие снизу - шаги и слишком хорошо знакомый вам вой и визг зомби. Вы продолжаете бежать по лестнице, надеясь, что пожарная дверь наверху не заперта. Тяжело дыша, вы добираетесь до двери и толкаете ее. Дверь не заперта, она выходит на плоскую часть крыши западного крыла, где вы несколько секунд стоите и переводите дух в ярком солнечном свете. Если вы хотите заблокировать пожарную лестницу, чтобы остановить преследующих вас зомби, и не дать им выбраться на крышу -[А]. Если хотите подготовиться к бою с зомби - [Б].
