    text: Каким-то образом вы пережили натиск зомби и теперь перешагиваете через дергающиеся тела, чтобы заглянуть внутрь камеры. У одного из зомби из верхнего кармана окровавленной рубашки торчит серебряная фляжка. Вы берете фляжку и встряхиваете ее. Внутри жидкость. Вы откручиваете крышку, чтобы понюхать. Она имеет странный запах, напоминает вам горький миндаль. Если хотите сделать глоток -[А]. Если предпочитаете вылить жидкость - [Б].
    mood: calm
