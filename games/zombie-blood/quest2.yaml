    text: Треск пламени горящей машины заглушает звук шагов по гравию позади вас. Внезапно вы слышите мучительный крик, и кто-то прыгает вам на спину. Это Юрр, его лицо почернело и покрылось волдырями от огня, но он еще жив. Несмотря на то, что он был застрелен, обожжен и получил множество травм в автокатастрофе, немертвый безумец все еще не побежден. Он крепко обхватывает вас за шею и прижимает к земле, вынуждая выронить оружие. Вы должны бороться с ним за свою жизнь голыми руками (1d6-3). У Юрра 7 очков Выносливости и он также сражается голыми руками (1d6-3).
