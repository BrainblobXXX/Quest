  '250':
    title: Параграф 250
    text: Шаткая лестница ведет на первый этаж замка. Вы испытываете облегчение, вернувшись к дневному свету после стольких дней заточения в почти полной темноте. Ваши глаза слезятся, пока привыкают к яркому солнечному свету, льющемуся через окно высоко в стене напротив вершины лестницы. На ярко украшенных стенах висят несколько портретов в натуральную величину. Ярко-красный ковер стелется по центру коридора с каменным полом по обе стороны от лестницы. Если вы хотите осмотреть картины - [А]. Если хотите пойти налево по коридору - [Б]. Если хотите пройти направо по коридору - [В].
