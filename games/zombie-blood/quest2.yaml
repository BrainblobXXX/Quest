  '390':
    title: Параграф 390
    text: Пока спортивный автомобиль приближается к вам на большой скорости, вы видите, что Юрр улыбается в предвкушении того мига, когда он вас собьет. Вы стреляете в приближающуюся машину, не подозревая, что у нее пуленепробиваемое лобовое стекло. Уродливая ухмылка Юрра становится шире, пока он мчится на вас, в то время как ученый продолжает стрелять из автомата. У вас нет никаких шансов выжить, вас либо застрелят, либо задавят. Ваше приключение закончилось.
