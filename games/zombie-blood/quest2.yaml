  '247':
    title: Параграф 247
    text: Вы слышите, как в гараже громко ревет двигатель автомобиля. Вы выглядываете из-за двери и видите Гингрича Юрра, сидящего за рулем своего «Остина-Хили», форсирующего двигатель и безумно смеющегося. Рядом с остином припаркован старый ржавый фургон. Находясь так близко к Юрру, вы видите, насколько он отвратителен, его врожденная порочность стала только более очевидной после его превращения в зомби. Он внезапно замечает вас и заводит двигатель еще громче, но кажется смущенным, когда пытается включить передачу. Из-за своей трансформации он практически забыл, как водить машину, и его разочарование быстро превращается в гнев. Он яростно дергает и толкает рычаг переключения скоростей вперед и назад, пока внезапно машина не рванется вперед, заставляя вас отпрыгнуть в сторону. Он выезжает из гаража на большой скорости, неуправляемо кружит по двору, пытаясь задавить вас. Если хотите бежать к открытым дверям в северном крыле - [А]. Если хотите развернуться и выстрелить в Юрра - [Б].
