    text: Вы бежите вниз по лестнице и дальше по мрачному коридору подвала, минуя открытые камеры и лифт, прежде чем подойти вулканизированным резиновым распашным дверям. В них есть маленькие стеклянные панели, через которые вы заглядываете и видите группу из четырех человек, стоящих рядом. Все они одеты в забрызганные кровью белые лабораторные халаты и, похоже, горячо спорят. Один особенно зловещего вида тип, кажется, очень раздражен чем-то и стучит по своему планшету, крича на других мужчин. У него бритая голова, повязка на левом глазу и глубокий шрам на левой стороне лица. На нагрудном кармане у него висит значок с именем Розник. Остальные трое - Гобер, Стин и Ланге. Но даже если это злодеи ученые, ответственны за создание зомби Юрра, вы знаете, что не можете просто вбежать и застрелить их. Если хотите попытаться арестовать их и запереть в камерах - [А]. Если у вас есть лабораторный халат, и вы хотите поговорить с ними, притворяясь новым, недавно нанятым лаборантом - [Б].
