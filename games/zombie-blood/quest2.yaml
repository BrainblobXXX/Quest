  '374':
    title: Параграф 374
    text: Вы слышите шум сверху, смотрите туда и видите злобное лицо Гингрича Юрра, смотрящего на вас через отверстие в полу взорванного лифта. Он роняет вниз маленькую бутылочку, которая разбивается, ударившись об пол шахты. В ней содержится усыпляющий газ, и вы вскоре теряете сознание. Когда приходите в себя, вы не можете поверить своим глазам. Вы находитесь в большой комнате без окон, освещенной неоновыми лампами. Вы прикованы к гладкой каменной плите, окруженной визжащими зомби. Они становятся очень оживленными, когда видят, как открываются ваши глаза. Они придвигаются ближе, чтобы посмотреть, как высокий худой человек в очках в длинном белом лабораторном халате и резиновых перчатках впрыскивает вам в шею кровь зомби. Ученый хихикает, когда говорит вам, что вы вот-вот станете новобранцем в армии зомби Гингрича Юрра. Ваше приключение закончилось.
