  '279':
    title: Параграф 279
    text: Все письма адресованы девушке по имени Эми Флетчер. Они были написаны ее тетей Хелен из Нью-Йорка. В ранних письмах она писала о своем неодобрении по поводу того, что Эми собирается работать кухаркой у человека сомнительной репутации в замке в отдаленной части Румынии. Она спрашивает, хорошо ли устроилась Эми и когда она вернется домой в Нью-Йорк. Более поздние письма уже умоляют ее вернуться домой. По мере того как проходят месяцы, ее письма становятся все более паническими, тетя Хелен «ужасно беспокоится» о том, что Эми написала ей, например, о том, что видела «людей в белых халатах» и Гингрича Юрра, ведущих себя «очень странно», и слышала «ужасные крики», доносящиеся из подвала. Вы кладете письма на стол и уже собираетесь взять дневник, как вдруг слышите шум снаружи. Это звук шагов, идущих по коридору. Если вы хотите выяснить, кто это - [А]. Если хотите закрыть и запереть дверь спальни -[Б].
    mood: calm
    interaction:
      type: choices
      options:
      - label: Вариант А
        to: '303'
        letter: А
      - label: Вариант Б
        to: '258'
        letter: Б
  '280':
    title: Параграф 280
    text: Столкнув мертвых зомби с балкона, вы прыгаете за пулемет Браунинга и проверяете наличие боеприпасов. Есть несколько ящиков уже снаряженных пулеметных лент, этого, безусловно, достаточно для предстоящего боя. Вы снимаете с плеча сумку, чтобы она не мешала вам, и поводите тяжелым стволом в стороны, проверяя сектора обстрела. Держа палец на спусковом крючке, вы снимаете пулемет с предохранителя, взводите ручку и целитесь в зомби внизу. Всего в первой волне атаки их двадцать четыре. Они устремляются к лестнице, борясь друг с другом, чтобы взобраться на нее первыми. Вы нажимаете спуск и даете очередь в орду нежити. Смертоносная огневая мощь пулемета Браунинга наносит урон (2d6+15). Если вы убьете всех зомби в первом раунде - [А]. Если вам это не удастся - [Б].
    mood: calm
    image: assets/images/280-1.jpg
