  '285':
    title: Параграф 285
    text: Вы говорите Эми, чтобы она не волновалась и шутливо хвастаетесь, что теперь стали настоящим экспертов в истреблении зомби и легко расправитесь с оставшимися. Это немного приободрило ее. Вы говорите Эми, что ей пора идти, и предлагаете ей, выбравшись наружу, идти вдоль опушки леса, следуя по дороге, но стараясь, чтобы никто ее не увидел. Вы машете рукой на прощание, говоря, что скоро увидитесь. Эми уходит, а вы закрываете потайную дверь. Вы выходите из кладовой, поворачиваете налево, а затем идете на север по западному крылу к лестнице на стыке с северным крылом. Вы собираетесь спуститься по лестнице в подвал, когда замечаете телескоп, установленный на столе впереди.
