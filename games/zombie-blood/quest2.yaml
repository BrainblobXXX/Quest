  '372':
    title: Параграф 372
    text: Вы достаете из кармана и отдаете Эми золотой медальон и цепочку. «Мой медальон! Где вы его нашли?» - спрашивает она, внезапно снова повеселев. «Тебе лучше этого не знать!» -отвечаете вы, ухмыляясь. «Спасибо. Спасибо. Спасибо», -радостно говорит она, улыбаясь в первый раз с тех пор, как вы ее встретили. Вы говорите Эми, что ей пора идти, и предлагаете ей, выбравшись наружу, идти вдоль опушки леса, следуя по дороге, но стараясь, чтобы никто ее не увидел. Вы машете рукой на прощание, говоря, что скоро увидитесь. Эми уходит, а вы закрываете потайную дверь. Вы выходите из кладовой, поворачиваете налево, а затем идете на север по западному крылу к лестнице на стыке с северным крылом. Вы собираетесь спуститься по лестнице в подвал, когда замечаете телескоп, установленный на столе впереди.
    mood: victory
