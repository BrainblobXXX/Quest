  rules:
    title: Введение и правила боя
    text: |-
      Кровь зомби - это Fighting Fantasy книга-игра, интерактивное приключение, в котором ВЫ герой! Вы можете победить, только выбрав правильный путь, найдя необходимое снаряжение, избегая ловушек и выжив в боях. Ниже есть лист персонажа, чтобы вы могли вести учет боевых действий и всего, что обнаружите по пути, например, информация, еда, деньги, оружие и полезные предметы снаряжения. Очень важно составить карту по ходу движения и держать в уме общее количество всех убитых зомби, иначе вы пожалеете!

      Сражения

      Бой представляет последовательность раундов. Большинство врагов, с которыми вы столкнетесь, - зомби. Они обычно медлительны и безоружны и позволяют вам атаковать первым. Бой включает в себя бросание кубиков, которые влияют на два атрибута - Выносливость и Урон.

      Выносливость показывает, насколько вы сильны. Чем выше ваш показатель Выносливости, тем лучше. Чтобы определить свою начальную Выносливость, бросьте два кубика и добавьте 20 к результату броска, запишите сумму в ячейку Выносливость на листе персонажа. Уровень Выносливости будет расти и опускаться во время приключения. В частности, вы начинаете приключение голодным и ослабевшим, поэтому еда и питье, которые сможете найти, восстановят ваши силы и ваша Выносливость может даже превысить начальный уровень. Но в основном вы будете восстанавливать потерянные очки Выносливости при использовании аптечек (каждую можно использовать только один раз), применение лекарств из аптечки восстановит вашу Выносливость до начального уровня, но не выше. Кроме того, вы будете терять очки Выносливости из-за травм и ранений. Если ваша Выносливость упадет до нуля, вы умрете, и ваше приключение закончится. Обратите внимание, что каждый зомби имеют только 1 очко Выносливости.

      Урон снижает Выносливость. При сражении с врагами урон рассчитывается броском кубика плюс модификатор в зависимости от типа оружия. Результат броска определяет количество убитых зомби (или других врагов), так как у каждого из них есть только 1 очко Выносливости. Они могут быть легко убиты, но зомби часто атакуют в большом количестве, что делает трудной победу всего в одном раунде боя. Перед началом боя вы должны решить, какое оружие собираетесь использовать. Кинжал наносит урон 1d6 (d6 -это шестигранный кубик), то есть, сражаясь кинжалом, вы за раунд можете убить от 1 до 6 зомби. Автоматическое оружие наносит урон 2d6+5, то есть вы можете убить за раунд от 7 до 17 зомби. Не забудьте записать урон от оружия на листе персонажа. После вашей первой атаки все выжившие зомби уменьшат вашу Выносливость на 1 очко каждый, затем будет следующий раунд. Вооруженные зомби могут нанести более 1 очка урона. Раунды следуют друг за другом, пока вы не победите всех своих врагов или не умрете.

      Пример: вы входите в комнату, где сталкиваетесь со стаей из 14 зомби. Ваша текущая Выносливость 15. Вы вооружены дробовиком, который наносит урон (1d6+5), и начинаете первый раунд боя. Вы бросаете кубик, выпадает 3, и добавляете 5, в результате - 8 зомби убиты. Вы теряете 6 очков Выносливости (1 очко урона от каждого из 6 еще живых зомби), ваша текущая Выносливость уменьшается до 9 очков. Вы автоматически убиваете оставшихся 6 зомби во втором раунде, потому что минимальный урон дробовика 6 очков (1d6+5). Обратите внимание, что вы должны найти боеприпасы, прежде чем сможете использовать огнестрельное оружие, но как только найдете их, можете пользоваться оружием без ограничений.

      Надеюсь, вы победите орды зомби, с которыми вам предстоит столкнуться, и сбежите из замка, чтобы рассказать свою историю! Удачи вам - она вам понадобится в бою. Если у вас нет оружия, вы должны сражаться голыми руками (1d6-3), то есть будете убивать за раунд от 0 до 3 зомби.
    mood: calm
    interaction:
      type: continue
      to: prolog
  prolog:
    title: ПРОЛОГ · 1/8. КАНДАЛЫ
    text: Вас разбудила боль от холодных железных кандалов, впившихся в кровоточащие запястья, или ужасный голод в животе? Это не имеет значения. Вы просыпаетесь, по меньшей мере, в десятый раз за сегодняшний вечер, если сейчас действительно ночь. В любом случае нелегко спать на холодном полу, но, когда ваши запястья прикованы к стене, это практически невозможно. Мрачная камера, в которой вы сидите, была бы совершенно темной, если бы не голая лампочка, прикрепленная к потолку над вами; маленький шар бледного мерцающего света. Тараканы снуют по полу, но вам все равно. Как долго вы пробыли в плену? Прошло пять или шесть дней с тех пор, как вас бросили в камеру? Это уже невозможно определить. Время идет медленно.
    mood: tense
    image: assets/prologue/episode-01-chains.webp
    interaction:
      type: continue
      to: prolog_02
  prolog_02:
    title: ПРОЛОГ · 2/8. ОТТО
    text: Единственное, что нарушает ваше одиночество это скрежещущий звук отодвигаемого засова на тяжелой стальной двери. Это сигнал о появлении коренастого тюремщика, который, шатаясь, входит в камеру, хромая от старой раны и нового опьянения. Если повезет, он приносит маленькую миску отвратительного на вкус тушеного мяса, которое выплескивается через край, пока он несет ее, пошатываясь. Если очень повезет, он также принесет кусок черствого хлеба и кружку мутного кофе, приготовленного из отбросов. Он всегда ставит еду на пол так, чтобы вы не могли до нее дотянуться, и его жестокое рябое лицо на мгновение расплывается в улыбке, он наслаждается моментом. Он знает, что вам придется потянуться вперед, чтобы коснуться миски ногами, заставляя кандалы глубоко впиваться в ваши кровоточащие запястья. Он никогда не говорит, но всегда сильно пинает вас под ребра, прежде чем захлопнуть за собой дверь и запереть засов. Кажется, ему все равно, живы вы или нет.
    mood: danger
    image: assets/prologue/episode-02-otto.webp
    interaction:
      type: continue
      to: prolog_03
  prolog_03:
    title: ПРОЛОГ · 3/8. ПОИСКИ ЧУДОВИЩ
    text: Трудно было смириться с тем, что вы пленник. Вы изучали мифологию на втором курсе в Болингброк-колледже, было прекрасное лето. Вы провели шесть недель отпуска, путешествуя по Южной Европе и пытаясь найти следы легендарных зверей. Вы начали свои поиски с полета на Крит в поисках костей минотавра и пещеры циклопа, увы, безрезультатно. Оттуда вы отплыли на Сицилию в поисках доказательств существования оборотней, и снова безуспешно. Затем вы путешествовали на корабле и поезде в Венгрию, где искали призраков и привидений в тени туманных кладбищ и разрушенных замков. К вашему большому разочарованию, ни один из них не материализовался.
    mood: mystery
    interaction:
      type: continue
      to: prolog_04
    image: assets/prologue/episode-03-monsters.webp
  prolog_04:
    title: ПРОЛОГ · 4/8. СКЛЕП
    text: Путешествуя автостопом на грузовике с открытым верхом, вы оказались в Румынии, в той части, которая когда-то была известна как Трансильвания, где граф Влад, печально известный вампир, по слухам, пил кровь своих многочисленных жертв. В течение недели, потраченной на расспросы местных жителей, знают ли они что-нибудь о существовании вампиров, вы встречали только пустые взгляды и качание головами, пока не столкнулись с морщинистым стариком, который был готов поговорить с вами, если купите ему новую шляпу. Он привел вас к каменному склепу примерно в трех километрах к северу от своей деревни, вход в который зарос кустами ежевики и плющом и был практически невидим. Пока вы срезали растения, покрывавшие ступени, ведущие к входу, старик, не говоря ни слова, исчез. Дверь склепа была заперта, но дерево прогнило, и вы открыли ее ударом ноги. Вы посветили фонариком вниз по каменной лестнице и медленно спустились в сырую комнату.
    mood: mystery
    interaction:
      type: continue
      to: prolog_05
    image: assets/prologue/episode-04-crypt.webp
  prolog_05:
    title: ПРОЛОГ · 5/8. ГРОБ
    text: Смахнув густую паутину, вы увидели древний покрытый пылью гроб, стоящий на каменном постаменте в глубине комнаты. С колотящимся сердцем вы прокрались вперед и подняли крышку. Но в гробу лежал только скелет с желтыми костями, а не спящий вампир, которого вы надеялись найти.
    mood: mystery
    interaction:
      type: continue
      to: prolog_06
    image: assets/prologue/episode-05-coffin.webp
  prolog_06:
    title: ПРОЛОГ · 6/8. ПОХИЩЕНИЕ
    text: Выйдя на улицу, вы обнаружили, что вас поджидают трое здоровенных головорезов. Вооруженные дубинками, они набросились на вас, когда вы попытались убежать. Вы боролись, но с голыми руками это было безнадежно. На вас надели наручники и заткнули рот кляпом, а потом запихнули на заднее сиденье старой черной машины и несколько миль везли по узкой дороге, которая вела через густой лес к холмам. Там вы увидели зловещего вида замок, построенный из темного камня, расположенный в долине между двумя холмами. Головорезы ухмыльнулись друг другу, соглашаясь, что в замке за вас дадут хорошую цену. Вы поняли, что находитесь в смертельной опасности; вас не только похитили, но и собирались продать современному работорговцу или, возможно, еще хуже.
    mood: danger
    interaction:
      type: continue
      to: prolog_07
    image: assets/prologue/episode-06-kidnapping.webp
  prolog_07:
    title: ПРОЛОГ · 7/8. ЗАМОК ГОРАЙ
    text: Машина помчалась вверх по холму, пока не достигла замка с высокими стенами, где с визгом остановилась у арки входа. Бандиты вытащили вас из машины, когда ворота замка медленно со скрипом открылись во внутренний двор, где толпились какие-то люди. Вам завязали глаза и передали невидимому человеку, который ввел вас во двор. Вы слышали вокруг себя стонущие голоса. Собаки терлись о ваши ноги, с любопытством принюхиваясь. Кто-то налетел на вас. Странные булькающие звуки, вырывавшиеся из его горла, не были похожи ни на что, что вы слышали раньше. Вас толкали и толкали, пока щелчок кнута и повелительный голос не прогнали неуправляемую толпу. К вашему великому облегчению, вас отвели в дом, подальше от палящего солнца, и повели по длинному коридору. Двери открывались и захлопывались за вами, и становилось заметно прохладнее, когда вас вели вниз по нескольким лестницам. Вас тащили по другим коридорам, вы спотыкались о стены и бились головой о низкие дверные косяки, пока, наконец, вам не приказали
      остановиться.
    mood: danger
    interaction:
      type: continue
      to: prolog_08
    image: assets/prologue/episode-07-goray-castle.webp
  prolog_08:
    title: ПРОЛОГ · 8/8. КАМЕРА
    text: 'И тут вы впервые услышали знакомый скрежет открывающегося стального засова вашей тюремной камеры. Вас втолкнули внутрь, сняли наручники и заменили их тяжелыми кандалами, прикованными к стене. С ваших глаз сняли повязку, и вы впервые увидели толстую харю вашего тюремщика. Его пузо напряглось под грязной белой футболкой, когда он ударил тебя ногой в армейском ботинке по ребрам, как будет делать это много раз в течение следующих нескольких дней. Потея и задыхаясь от усилий, пиная вас, он сказал всего несколько слов насмешливым голосом: «Добро пожаловать в замок Горай. Меня зовут Отто. Мой хозяин Гингрич Юрр. Он собирается убить тебя». Не обращая внимания на ваши мольбы и вопросы, он вышел из камеры, заливаясь хохотом. Это был единственный раз, когда он заговорил. Кто такой Гингрич Юрр? Почему он хочет убить вас? Вы беспомощно дергаете цепи в гневе, пытаясь освободиться. В конце концов, вы сдаетесь и сосредотачиваетесь на том, чтобы добраться до мяса и хлеба раньше тараканов.'
    mood: grief
    interaction:
      type: continue
      to: '1'
    image: assets/prologue/episode-08-cell.webp
  218_death:
    title: Смерть от кровопотери
    text: Вы истекаете кровью. Аптечки у вас нет, и остановить кровотечение нечем. Ваше приключение закончилось.
    mood: grief
    ending: true
