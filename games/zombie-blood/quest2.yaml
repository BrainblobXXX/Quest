  '332':
    title: Параграф 332
    text: Лестничная площадка устлана ковром, а стены оклеены яркими узорчатыми обоями. На стенах висят натюрморты и зеркала, но ничего полезного для вас. Вы идете прямо вперед, пока не натыкаетесь на две белых двери напротив друг друга. Вы прижимаетесь ухом к ним, но ничего не слышите. Если хотите войти в дверь слева - [А]. Если хотите открыть дверь справа - [Б]. Если предпочитаете идти до конца коридора - [В].
