  '243':
    title: Параграф 243
    text: Вы начинаете стрелять в висячий замок на воротах, пока орда зомби приближается к вам. Но замок сделан из прочной стали, и пули просто рикошетят от него. Вы поворачиваетесь, чтобы открыть огонь по зомби и проживаете еще несколько минут, прежде чем вас опрокинут и растопчут. Вскоре вы покрыты кровью зомби и тоже заражаетесь. В считанные минуты вы превращаетесь в зомби и теперь преследуете бедную Эми, которая убегает, крича от ужаса. Ваше приключение закончилось.
    mood: grief
    ending: true
  '244':
    title: Параграф 244
    text: Медленно продвигаясь по узкому проходу, вы видите вдалеке полоску света. Вы также чуете очень неприятный запах в воздухе, что-то похожее на тухлые яйца. Продолжаете идти вперед как можно тише и, наконец, подходите к концу прохода и видите, что он ведет в помещение, похожее на старую мастерскую. В левой стене находится заброшенный кузнечный горн, а перед ним стоит наковальня. Вдоль правой стены стоит верстак с закрепленными на нем тисками и лежащими сверху старыми сломанными инструментами. Потрепанная оранжевая пластиковая занавеска тянется вдоль противоположной стены. Когда вы входите в комнату, занавески внезапно раздвигаются, и рычащие полумертвые люди в разорванной одежде бросаются на вас, вытянув руки, пытаясь растерзать вас длинными сломанными ногтями. Кожа у них серая, испещренная открытыми ранами и гноящимися язвами. У них длинные растрепанные волосы, в почерневших ртах не хватает зубов, распухшие языки заполняют открытые рты, а пустые запавшие в глазницах глаза молочно-белые
      с красными ободками. Они визжат и булькают в предвкушении, когда бросаются на вас. Это зомби, всего их восемь! Вы должны сражаться с ними голыми руками или оружием, если оно у вас есть.
    mood: danger
    image: assets/images/244-1.jpg
    interaction:
      type: combat
      mode: pool
      enemies:
