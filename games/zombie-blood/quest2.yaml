  '335':
    title: Параграф 335
    text: Шальная пуля пролетает мимо вашей головы, пробивая резиновую дверь.
    mood: calm
    interaction:
      type: continue
      to: '45'
  '336':
    title: Параграф 336
    text: В ящиках нет ничего, кроме журналов, книг и старых фотографий. На одной фотографии интеллигентного вида женщина с длинными темными волосами стоит перед частным самолетом. На обратной стороне фотографии написано имя – Тереза Кларк. Вы задаетесь вопросом, кто она такая и не превратилась ли она в зомби. Чемоданы пусты, но в одном находятся костюмы и реквизит, которые, должно быть, использовались для переодевания детьми, наверное, они уже давно повзрослели и покинули замок. Здесь есть клоунский костюм, ковбойская шляпа, полицейский шлем, костюм сказочной принцессы, шлем космонавта, матросская форма, несколько париков, накладные бороды и усы. Если вы хотите взять что-нибудь, берите. Торопясь покинуть место побоища, вы спешите к лифту в конце коридора.
    mood: calm
    interaction:
      type: continue
      to: '367'
    prop:
      image: assets/furniture/bags/bag-worn-empty.png
  '337':
    title: Параграф 337
    text: Вы идете по длинному темному коридору, пока не оказываетесь у белой двери в правой стене. Вы дергаете за ручку, но дверь заперта. Вы смотрите в замочную скважину и видите, что внутри замка есть ключ. Впереди вы видите лестницу, идущую вверх, по-видимому, она является лучшим способом выбраться из подземных коридоров.
    mood: calm
    interaction:
      type: continue
      to: '250'
  '338':
    title: Параграф 338
    text: Эми умоляюще смотрит на вас и просит не возвращаться в замок. Вы отвечаете, что должны остановить Юрра, прежде чем он выпустит своих зомби наружу. Вы заверяете ее, что это не займет много времени, справиться с оставшимися зомби, и что догоните ее в кратчайшие сроки. Она смотрит в землю, по ее щеке катится слеза. Если у вас есть золотой медальон на золотой цепочке - [А]. Если его у вас нет - [Б].
    mood: calm
