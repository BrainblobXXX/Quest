    text: Выдергиваете чеку и бросаете гранату через щель за дверь. Через несколько секунд раздается громкий взрыв. Удары по двери немедленно прекращаются, и все, что вы можете услышать, это стоны и скулеж. Если у вас есть еще граната, и вы хотите бросить ее в коридор - [А]. Если предпочитаете отодвинуть мебель от двери, чтобы открыть ее - [Б].
