  '238':
    title: Параграф 238
    text: Вы входите в шикарный кабинет, в центре которого стоит огромный ореховый письменный стол и черное кожаное кресло с высокой спинкой. На письменном столе установлен портативный компьютер и телефон. Здесь есть библиотека, занимающая одну из стен, и подробные рисунки мифологических существ, покрывающие все остальное доступное пространство на стенах. Здесь есть рисунки оборотней, вампиров, демонов, упырей, призраков, духов и других отвратительных тварей, некоторых из них вы даже не узнаете, что удивительно, так как являетесь экспертом в этой области. Тем не менее, почетное место принадлежит зомби, которым посвящена целая стена, с сотнями ужасных фотографий из замка, прикрепленных к ней. Эми говорит вам, чтобы вы перестали рассматривать зомби и вернулись к работе над планом побега. Если вы хотите воспользоваться телефоном - [А]. Если хотите включить ноутбук - [Б].
