    text: Вы дергаете за шнур, и мотор бензопилы с ревом оживает. Вы вонзаете лезвие в деревянную дверь, прорезая круглое отверстие в дубовой панели, пила пробивает дверь как горячий нож масло. Но девушка, которой вы пытаетесь помочь, впадает в истерику, считая вас зомби. У нее есть пистолет, и она начинает беспорядочно стрелять в дверь, ошибочно полагая, что вы пытаетесь убить ее. Бросьте кубик. Если выпадет 1-3. Если выпадет 4-6.
