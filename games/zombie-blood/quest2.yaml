  '251':
    title: Параграф 251
    text: Дверь ведет в ярко освещенную лабораторию, где на столах из нержавеющей стали расставлены микроскопы, колбы, бутылки, банки, пипетки, термометры, весы и стеклянные емкости с пузырящимися жидкостями. Вдоль стен стоят стеклянные шкафы, а внутри одного из них три больших стеклянных емкости с красной жидкостью, скорее всего кровью, зараженной зомби-вирусом. В дальнем конце лаборатории находится блестящий черный шкаф с раздвижными дверцами. В задней части лаборатории слева есть еще одна железная дверь, запертая на висячий замок и засов. Если вы хотите разбить банки с красной жидкостью - [А]. Если хотите попробовать открыть железную дверь - [Б].
