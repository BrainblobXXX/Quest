    text: Некоторые из чемоданов содержат старую одежду и обувь, часть ее вашего размера, можете переодеться, если хотите. В другом - сломанная старая крикетная бита и несколько заплесневелых крикетных мячей. Еще один чемодан на нижней полке полон пластиковых солдат, моделей танков и декораций. Фигурки красиво раскрашены вручную, но покрыты пылью и давно забыты теми, кто когда-то играл ими в военные игры. Последний чемодан, который вы открываете, содержит что-то более полезное. Это аптечка. Вы берете аптечку и закрываешь дверь чулана. Если еще не делали этого, вы можете открыть дверь напротив - [А]. Если предпочитаете идти до конца коридора - [Б].
