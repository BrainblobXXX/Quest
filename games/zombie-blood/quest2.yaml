  '283':
    title: Параграф 283
    text: |-
      Дверь не заперта, и вы входите в небольшую комнату, заставленную шкафами и полками, заполненными ящиками с инструментами, банками с краской, тряпками, щетками, чистящими средствами, старым садовым оборудованием, лопатами, совками, мешками для компоста, шлангами, садовыми перчатками, мешками и другими предметами домашнего обихода, которые были брошены здесь и забыты. Единственное, что бросается в глаза, - это большой латунный ключ, висящий на крючке сбоку от двери. «Главные ворота» написано на стене черным маркером над крючком. Вы решаете взять ключ и кладете его в сумку. «Эй, посмотри сюда, -возбужденно говорит Эми. - Я нашла электронную панель на стене». Вы видите цифровую сенсорную панель под дисплеем на стене. Если знаете код для этой панели, обратитесь к параграфу с тем же номером. Если не знаете кода, то вам не остается ничего другого, как выйти из кладовой и повернуть направо, чтобы открыть дверь в конце коридора.

      Ввести код 161 — [А]. Выйти из кладовой — [Б].
