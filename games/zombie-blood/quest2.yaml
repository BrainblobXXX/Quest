        letter: Б
  '248':
    title: Параграф 248
    text: Коридор снова резко поворачивает налево. Вы поворачиваете за угол и идете к двери в конце коридора. Внезапно вы слышите позади себя громкий лай. Из-за угла выбегает, капая слюной, большая стая злобных собак с дикими глазами. Разъяренные животные бегут к вам на полной скорости. Вы решаете бежать к двери. Если носите доспехи - [А]. Если вы не носите доспехи - [Б].
    mood: calm
