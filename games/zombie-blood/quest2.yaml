  '63':
    title: Параграф 63
    text: 'Не желая прикасаться к стокам, вы находите на дорожке палку, которой выбрасываете бутылку из воды. Она врезается в стену туннеля, разлетаясь на мелкие кусочки, внутри кусок смятой желтой бумаги. Вы разворачиваете листок, чтобы прочитать: «кодовый замок номер: 181». Вы кладете листок бумаги в карман и идете дальше.'
