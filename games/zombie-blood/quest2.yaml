  '321':
    title: Параграф 321
    text: Ключ отпирает дверь, которая открывается в котельную, где находятся четыре больших грохочущих котла, из клапанов которых с шипением вырывается пар. Булькающие трубы с горячей водой ведут вверх от котлов, исчезая в низком потолке. В потолке есть большое металлическое вентиляционное отверстие, но в комнате все равно очень жарко. В дальнем конце комнаты есть еще одна железная дверь, а рядом на крючке висит ключ. Если вы хотите обыскать котельную - [А]. Если предпочитаете попытаться открыть дверь в дальней стене с ключом, висящим на крючке - [Б].
    mood: calm
    interaction:
      type: choices
      options:
      - label: Вариант А
        to: '69'
        letter: А
