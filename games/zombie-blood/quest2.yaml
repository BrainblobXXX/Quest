  '122':
    title: Параграф 122
    text: Вонючая канализация, населенная крысами, - это не то место, где вы обычно обитаете, и требуется некоторое время, чтобы привыкнуть к отвратительному запаху. Вы идете дальше, пока вас не останавливает вид двух темных фигур впереди, шлепающих по грязи. В поле зрения появляются двое мужчин в рваной одежде, медленно пробирающихся сквозь темную вонючую грязь. Один из них жует крысу, а другой несет ведро. Они очень оживляются при виде вас, показывают на вас пальцем и воют от ярости. Они зомби! Вы должны сражаться с ними любым оружием, которое у вас есть.
