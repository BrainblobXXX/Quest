    text: Вы опорожняете фляжку и кладете ее в задний карман. Вы быстро обыскиваете изодранную одежду других зомби и находите в общей сложности 7 долларов и пару серебряных запонок в форме лягушек. Вы не находите ничего интересного и возвращаетесь к лестнице. Вы уже готовы подняться наверх, когда замечаете что-то под лестницей. Это большой чугунный сейф, зацементированный в полу. На дверце есть кодовый замок. Вы пробуете несколько случайных комбинаций, увы, без успеха. Вы понимаете, что сейф слишком прочный, вскрывать его силой или стрелять по нему бесполезно, и задаетесь вопросом, есть ли у вас что-нибудь еще, что можно использовать, чтобы открыть его. Если у вас есть лист желтой бумаги для заметок - [А]. Если у вас его нет, вы ничего не можете сделать, кроме как подняться обратно по лестнице в библиотеку. Вы раздражены тем, что не можете открыть сейф, но стараетесь убедить себя, что он, вероятно, пуст или заминирован. Вы решаете больше не терять время в библиотеке и выходите в коридор
      - [Б].
