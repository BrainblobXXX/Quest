  '40':
    title: Параграф 40
    text: Вы смотрите вниз, во двор, где множество разъяренных зомби топчутся вокруг. Единственный способ, которым вы могли бы победить такую огромную толпу - это использовать пулемет Браунинга, установленный на балконе второго этажа восточного крыла на противоположной стороне двора. Гингрича Юрра нигде не видно, а крупнокалиберный пулемет, похоже, заряжен и находится в полной готовности. К крыше рядом с тем местом, где вы стоите, прикреплен проволочный трос, которая тянется до крыши восточного крыла. К стене восточного крыла прикреплена металлическая лестница, которая спускается с крыши на землю, проходя рядом с балконом. Еще один способ попасть на балкон, спуститься по водосточной трубе и, пробежав через двор, взобраться по металлической лестнице. Если у вас есть стальной шкив и короткая верёвка, и вы хотите закрепить его на тросе, чтобы скользнуть по нему к восточному крылу - [А]. Если у вас нет шкива или короткой верёвки, или вы предпочитаете спуститься по водосточной трубе - [Б].
