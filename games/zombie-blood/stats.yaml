# Выносливость — единственная характеристика, которую книга считает числом.
# Стартовое значение: «бросьте два кубика и добавьте 20» — 2d6+20, то есть 22…32.
# initial = 20 — база; roll = 2d6 — бросок, который движок предлагает сделать
# перед первой сценой новой игры. Итог: 20 + 2…12 = 22…32.
# Потеря и восстановление очков в сценах перенесены эффектами stat (32 сцены).

stats:
  stamina:
    title: Выносливость
    initial: 20
    min: 0
    max: 32
    roll: "2d6"
  money:
    title: Доллары
    initial: 0
    min: 0
