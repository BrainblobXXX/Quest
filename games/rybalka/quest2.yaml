scenes:
  intro:
    title: "Глава 1. Перед рыбалкой"
    text: |-
      Раннее утро. Над рекой ещё стоит туман, вода кажется неподвижной, а в воздухе пахнет тиной и свежей травой. Вы приехали сюда на весь день — с удочкой, старой корзинкой и твёрдым намерением вернуться домой с уловом.

      Рыбалка — дело неспешное, но не простое. Здесь важно выбрать наживку, дождаться поклёва и вовремя подсечь. Иногда придётся рисковать, иногда — ждать. День пролетит незаметно, а река сама решит, кто сегодня окажется удачливее.

      ПРАВИЛА

      У вас есть 500 рублей. В начале рыбалки купите наживку в лавке: разную рыбу привлекает разное угощение.

      Наживка расходуется при забросе. Следите за усталостью: если она станет слишком большой, можно задремать и пропустить поклёв.

      Пойманная рыба отправляется в садок. Некоторые решения — отпустить рыбу, сделать из неё живца или продолжить ловлю — могут изменить ход рыбалки.

      ВАША ЦЕЛЬ

      Провести день на реке и вернуться с уловом. Слушайте реку, не спешите и помните: у каждой рыбы свой характер.

      Первая глава закончилась. Пора выйти на берег.
    interaction:
      type: continue
      to: "1"
  "1":
    title: "Глава 1. Наживка"
    text: |-
      Купите наживку.

      Червь, «Деньги» -2, «Червь» +1 — [А]
      Мотыль, «Мотыль» +10, «Деньги» -15 — [Б]
      Опарыш, «Опарыш» +1, «Деньги» -4 — [В]
      Хлеб, «Хлеб» +10, «Деньги» -15 — [Г]
      Кукуруза, «Кукуруза» +10, «Деньги» -7 — [Д]
      Тесто, «Деньги» -25, «Тесто» +10 — [Е]
      Подсака, «Деньги» -100, «Подсака» +1 — [Ж]
      На рыбалку — [З]
      Итог — [И]
    mood: calm
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "1"
          letter: А
          if:
            stat:
              id: money
              op: ">="
              value: 2
          effects:
            - grant:
                item: worm
                count: 1
            - modify:
                stat: money
                delta: -2
        - label: Вариант Б
          to: "1"
          letter: Б
          if:
            stat:
              id: money
              op: ">="
              value: 15
          effects:
            - grant:
                item: moth
                count: 10
            - modify:
                stat: money
                delta: -15
        - label: Вариант В
          to: "1"
          letter: В
          if:
            stat:
              id: money
              op: ">="
              value: 4
          effects:
            - grant:
                item: maggot
                count: 1
            - modify:
                stat: money
                delta: -4
        - label: Вариант Г
          to: "1"
          letter: Г
          if:
            stat:
              id: money
              op: ">="
              value: 15
          effects:
            - grant:
                item: bread
                count: 10
            - modify:
                stat: money
                delta: -15
        - label: Вариант Д
          to: "1"
          letter: Д
          if:
            stat:
              id: money
              op: ">="
              value: 7
          effects:
            - grant:
                item: corn
                count: 10
            - modify:
                stat: money
                delta: -7
        - label: Вариант Е
          to: "1"
          letter: Е
          if:
            stat:
              id: money
              op: ">="
              value: 25
          effects:
            - grant:
                item: dough
                count: 10
            - modify:
                stat: money
                delta: -25
        - label: Вариант Ж
          to: "1"
          letter: Ж
          if:
            all:
              - stat:
                  id: money
                  op: ">="
                  value: 100
              - not:
                  has_item:
                    id: net
          effects:
            - grant:
                item: net
                count: 1
            - modify:
                stat: money
                delta: -100
        - label: Вариант З
          to: "11"
          letter: З
        - label: Вариант И
          to: "15"
          letter: И
          if:
            stat:
              id: money
              op: "<"
              value: 1
