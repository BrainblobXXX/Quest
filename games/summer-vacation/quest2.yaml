  "32":
    title: Глава 32
    text: |-
      Я: -Выпей сначала сам.

      И: -Что? Зачем, котёнок?

      Я: -Просто. Сделай глоток.

      И: -Ты серьёзно думаешь, что я хочу тебя отравить?

      Я: -Нет, но я не хочу оказаться на месте той девушки, которую из-за тебя госпитализировали.

      И: -Что? О чём ты... Гера! Я убью этого чёртового придурка!

      Я: -Зачем ты делаешь это?

      И: -Господи, Настя! Я бы никогда не сделал ничего подобного! Я был тем человеком, который вызвал скорую той ночью. Я был тем человеком, который спас ты девочку, понимаешь?

      Я: -Не особо...

      И: -Я подрабатываю барменом в клубе. Недавно я заметил, что один мужчина приходит каждые выходные и каждый раз с новой девушкой. На следующее утро руководство находит этих девушек без сознания в приватной комнате. Я решил провести собственное расследование. Я продублировал ключ, открывающий дверь той комнаты. В последний раз, когда он увёл очередную "жертву" в неё, я ворвался к ним с электрошокером. Но я увидел, что у той девушки после очередного коктейля началась судорога. Я подбежал к ней, чтобы помочь, и в это время преступник скрылся.

      Я: -Но почему ты не позвонил в полицию?

      И: -Потому что, фактически, коктейли готовлю я. А значит я - первый подозреваемый. Наш город очень маленький, но уровень преступности очень высок. Полиции некогда было бы расследовать это дело и искать виновника, поэтому осудили бы меня.

      Я: -Ох... Илья, прости, что я обвинила тебя. Ты и вправду здесь не при чём. Мне так стыдно...

      И: -Ничего, всё в порядке. Теперь ты знаешь почему я так злился на Геру. Он не слушает меня и думает, что это всё моих рук дело.

      Я: -Слушай, может быть я поговорю с ним? Мне он должен поверить.

      И: -Ты, конечно, можешь попробовать, но он ужасно упрям.

      Я: -В любом случае.

      Вернуться к остальным
