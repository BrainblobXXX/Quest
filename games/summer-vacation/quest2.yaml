    text: |-
      Слова Геры меня заинтересовали и я решила прояснить утренний инцидент в его комнате.

      Когда я вошла, он лежал на кровати. Парень повернул голову в мою сторону.

      Г: -По-твоему нормально входить в чужую комнату без стука?

      Я: -Я.. э..

      Г: -Чего ты хочешь?

      Я: -Я хотела узнать, что произошло сегодня утром.

      Г: -Любопытной Варваре...

      Я: -Пожалуйста, я правда хочу знать!

      Г: -Я просто узнал об Илье то, что он тщательно скрывал. А его это взбесило и он решил показать, какой он альфа-самец. Эх, если бы не ты, он бы мне даже вмазал. Но, увы и ах!

      Я: -Если бы не я?

      Г: -Да, ты очень вовремя полезла куда не надо и тебя заметил Кирилл. Илье важен свой авторитет и при тебе он не стал меня бить.

      Я: -То есть он уже бил тебя когда-то?

      Гера приподнял рубашку. На груди было видно несколько синяков.

      Я: -Хм... И что же он так злостно скрывал?

      Г: -Он мудак. Каждые выходные он цепляет девушек в клубе, а потом спит с ними. И всё бы ничего, но он предварительно усыпляет их, подкидывая снотворное в коктейль. Совсем недавно одну из них увезли в больницу из-за передоза. Слава Богу, всё обошлось. Он поступает отвратительно мерзко - это я пытался ему донести. Но, как видишь, он довольно упрям.

      Я: -Звучит пугающе. Даже... даже не знаю, что и сказать. Ладно, я лучше вернусь в свою комнату. Спасибо, что рассказал.

      Вернуться в комнату
