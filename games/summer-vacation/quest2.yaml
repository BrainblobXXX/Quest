scenes:
  "1":
    title: Глава 1
    text: |-
      Меня зовут Настя, мне 17 лет и сейчас я еду в дом, к совершенно незнакомым мне людям. Всё, что я знаю: там живёт семейная пара с 5 сыновьями. То есть, я еду жить к 5 парням... Звучит наверное абсурдно.

      Вообще, причина, по которой я еду туда - это то, что у моего отца сейчас большие трудности с бизнесом. Поэтому он не может "как следует обо мне позаботиться". К слову, семья, к которой я еду - его давние друзья. Так что будем надеяться, я найду с ними общий язык.

      Приехали. Я небрежно прощаюсь с личным водителем отца и выхожу из машины. Передо мной двухэтажный дом, отделанный кирпичом. За ним виднеется сад. Я звоню в звонок, дверь открыта, поэтому я захожу в дом, и меня встречает семейная пара: Николай Андреевич и Мария Константиновна.

      М.К.: Ох, Настенька, наконец-то ты доехала! Мы уже давно тебя ждём.

      Н.А.: Пацаны на кухне.

      Я с осторожностью иду на кухню. Как только я захожу, то чувствую 5 пар глаз замерших на мне. Неловко. Я огляделась: все они выглядят одногодками, но как такое может быть?

      По середине кухни стоит большой прямоугольный стол. Кто-то стоит позади него, кто-то сидит.

      -Садись, не стесняйся, - сказал высокий парень атлетичного телосложения. У него были каштановые волосы средней длины, образовывающие чёлку. Глаза были карие, нос прямой. Он учтиво отодвинул стул между двумя сидящими парнями. Я заметила, что одного из них это напрягло.

      Сесть — [А]
      Вежливо отказаться — [Б]
    mood: calm
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "5"
          letter: А
        - label: Вариант Б
          to: "27"
          letter: Б
  "2":
    title: Глава 2
    text: |-
      Если у кого-то и узнавать, что произошло, то у Кирилла. Я постучала в его дверь.

      К: -Кого там опять принесло?! - послышалось в глубине комнаты. - А, это ты. Что-то важное?

      Я: -Ну, я хотела кое-что спросить...

      К: -Ок, заходи.

      Я: -Я по поводу произошедшего сегодня утром.

      К: -Странно, что тебя это волнует. Ну, ты привыкай, они часто так собачатся.

      Я: -Но почему?

      К: -Да, по-разному. То один другом пару ласковых выскажет, то другой начнёт лезть куда не просят. В общем, не обращай внимание. Лучше расскажи мне о себе. Надолго ты к нам?

      Я: -До конца лета. Вообще я из ... *долгий рассказ о жизни*

      К: -Неплохо. Ты прости, но сейчас мне нужно идти.

      Я: -Да, конечно... Я тогда пойду.

      Я вышла из комнаты и увидела Влада.

      Сделать вид, что не заметила и идти в комнату — [А]
      Поздороваться — [Б]
    mood: mystery
    entry:
      - set_flag: kirill_question
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "45"
          letter: А
        - label: Вариант Б
          to: "4"
          letter: Б
  "3":
    title: Глава 3
    text: |-
      Я: -Знаешь, после того, что ты сделал... Думаю, что нет.

      И: -Поэтому я это и сделал... Ты мне небезразлична, поэтому я отпущу тебя...

      Концовка: одиночка
    mood: grief
    interaction:
      type: continue
      to: "14"
  "4":
    title: Глава 4
    text: |-
      Я: -Привет!

      В: -О, приветик! Зайди ко мне на секунду.

      Я: -Хорошо...

      Мы зашли в комнату Влада. Она была такой же серой, как Влад.

      В: -Я вижу, что ты уже подружилась с парнями.

      Я: -Я не уверена, что это можно назвать дружбой... Но мы общались.

      В: - Я случайно подслушал ваш разговор с Герой на кухне. Думаю, ты считаешь его странным, но это не так. Тебе просто нужно узнать его получше.

      Я: -Эээ... Ладно...

      В: -Это всё, что я хотел сказать, ты можешь вернуться к себе.

      Вернуться в комнату
    mood: mystery
    entry:
      - set_flag: vlad_talk
    interaction:
      type: continue
      to: "45"
  "5":
    title: Глава 5
    text: |-
      Я незамедлительно села.

      -Я Илья, мне 18. Остальные пусть сами представятся. - сказал парень предложивший присесть.

      -Кирилл, 18. - сказал юноша, стоящий рядом с Ильёй. Он, кстати, был светлее, но глаза такие же - карие.

      -Арсений, 17. - представился голубоглазый блондин. По телосложению он был худее Кирилла с Ильёй. И те двое были ростом примерно метр девяносто, а этот сантиметров на 15 ниже. Также он был в очках.

      Не представились лишь те, кто сидел рядом со мной. Я решила проявить инициативу.

      -Настя, 17 лет.

      Я приветливо улыбнулась и по привычке решила пожать им руки. Неожиданно парень, что сидел слева отдёрнул от меня руку и холодно сказал:

      -Не смей ко мне прикасаться.

      -Господи, Георгий, она же наша гостья! - возмутился парень справа, который всё ещё держал мою руку - Не обращай внимание на этого придурка. Я Влад, мне 18.

      Влад смотрел мне в глаза. Его большие глаза были серыми, волосы тоже какими-то пепельными. Вдруг он встал из-за стола и поднял меня:

      -Я покажу тебе дом.

      Пойти на экскурсию по дому
    mood: calm
    interaction:
      type: continue
      to: "25"
  "6":
    title: Глава 6
    text: |-
      Я: -Может быть ты расскажешь мне о себе?

      К: -Эм... Хорошо. С детства я достаточно скрытный и нелюдимый человек, можно сказать интроверт. Я не люблю, когда люди лезут туда, куда их не просят, и беспокоят меня по пустякам. Я играю в команде по баскетболу нашего города. Илья, кстати, наш капитан. Вообще, я играю с ним на одном уровне, но Илья прирождённый лидер. Боюсь представить, что будет с тем, кто встанет у него на пути. Многие недолюбливают его, но он не плохой парень, каким кажется. Возможно, иногда он чересчур вспыльчив, но он мой единственный родной брат.

      *?! Я должна была догадаться, что они не все родные братья...*

      Я: -Но подожди, насколько я помню вам обоим 18...

      К: -Мы близнецы.

      Я: -Ого, никогда бы не подумала.

      К: -Близнецы не всегда похожи друг на друга.

      Мы ещё немного поговорили и легли спать развернувшись друг к другу спинами.

      Я: -Спокойной ночи.

      К: -Угу. И тебе.

      Концовка: одиночка
    mood: calm
    interaction:
      type: continue
      to: "14"
  "7":
    title: Глава 7
    text: |-
      Я пойду с Арсением! Он производит хорошее впечатление.

      Я: -Арсений, ты не против пойти со мной?

      А: -Да, конечно.

      Всю дорогу Арсений рассказывал мне о лесе. Похоже он и вправду много всего знает.

      Меня удивило то, что я внимательно слушала его. Он не был похож на зануду.

      А: -Ну вот, мы собрали достаточно грибов. Теперь можно вернуться.

      Погулять ещё — [А]
      Вернуться к остальным — [Б]
    mood: calm
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "39"
          letter: А
          if:
            flag: ars_walk
        - label: Вариант Б
          to: "46"
          letter: Б
  "8":
    title: Глава 8
    text: |-
      Я: -И что будем делать?

      Г: -Спать. И постарайся меня особо не трогать, хорошо? - Гера лёг и развернулся ко мне спиной.

      *Какой недотрога*

      Я отвернулась и вскоре уснула.

      Концовка: одиночка
    mood: calm
    interaction:
      type: continue
      to: "14"
  "9":
    title: Глава 9
    text: |-
      Я вспомнила о рассказе Геры. Этого не может быть. Илья хочет меня усыпить и...

      Я: ГЕРА!!! -закричала я изо всех сил и отключилась.

      Я очнулась на руках у Геры. Он спал. *Сколько часов я была в отключке?* Я погладила Геру по плечу, чтобы разбудить. Подействовало.

      Г: -О Боже, ты проснулась! Как хорошо.

      Я: -Да, я...

      Г: -Ты в порядке? Что-нибудь болит? Хочешь я вызову доктора?

      Я: -Нет-нет, всё в норме. Я всё ещё немного сонная, но в остальном всё как всегда.

      Г: -Теперь ты понимаешь, почему я просил держаться тебя от него подальше?

      Я: -Д-да... Но он показался мне хорошим и я...

      Г: -О, поверь, он умеет заговаривать девушкам зубы. Главное, что сейчас ты в безопасности.

      Я: -А где он сам?

      Г: -Я отправил его домой. Думаю, что мне всё-таки придётся сообщить о нём полиции. Я больше не хочу, чтобы кто-то пострадал.

      Я: -Хорошо...

      Концовка: одиночка — [А]
      Концовка: Да ты Шерлок! — [Б]
    mood: danger
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "14"
          letter: А
        - label: Вариант Б
          to: "20"
          letter: Б
          if:
            all:
              - flag: ilya_truth
              - flag: gera_kiss
  "10":
    title: Глава 10
    text: |-
      Я: -Итак, на чём мы остановились?

      К: -Ну, я страстно целовал тебя, а когда ты уже умоляла меня остановиться, чтобы подышать, я...

      Я: -Ха-ха-ха, Кирилл! Кажется, в моей вселенной всё было немного по-другому.

      К: -Хорошо, тогда расскажи мне, что между нами?

      Я: -Ну, ты красивый, милый, весёлый и сексуальный парень. Мы близко общаемся последние несколько дней, а сегодня спим в одной палатке. Что же происходит?

      К: -Знаешь, у меня было не так много опыта в отношениях, но я в них абсолютный педант. К тому же, я достаточно ревнив. Я уже чувствую напряжение в воздухе, когда тебе приходится выбирать между мной и моими братьями. Ты уверена, что хочешь быть со мной?

      Я: -Да. Если бы нет, то меня бы здесь сейчас не было.

      К: -Это то, что я хотел услышать.

      Кирилл притянул меня к себе и поцеловал. Он целовал моё лицо, шею, уши. С моих губ сорвался еле слышимый стон.

      К: -Думаю, мне стоит остановиться сейчас, иначе потом это будет невозможно.

      Я: -Как бы я этого не хотела, но ты прав.

      К: -Тогда, давай ложиться спать.

      Мы расправили импровизированную кровать и укрылись одеялом. Кирилл погасил фонарь и обнял меня. С ним мне было спокойно. Я не хотела, да и просто не могла думать о чём-то другом. Все проблемы казались никчёмными по сравнению с нашими чувствами.

      Вскоре, я уснула в его объятиях.

      Концовка: Кирилл
    mood: calm
    interaction:
      type: continue
      to: "51"
  "11":
    title: Глава 11
    text: |-
      Утром мы проснулись почти в одно время.

      А: -Я рад, что это был не сон. - Арсений заправил локон за моё ухо и улыбнулся.

      Мы собрались и вернулись домой. Все каникулы я провела, как во сне. Арсений стал мне по-настоящему близким человеком. Теперь я не могу представить свою жизнь без него.

      Спасибо за прочтение!
    mood: victory
    image: assets/illustrations/11.jpg
    ending: true
  "12":
    title: Глава 12
    text: |-
      Я: -Кирилл, но вчера утром в комнате ты сказал...

      К: -Так, идём.

      Кирилл поспешно схватил меня за руку и пошёл в лес.

      И: -Что?

      В: -В смысле вчера утром?

      А: -Когда вы успели...

      Мы ушли достаточно далеко, чтобы не слышать их голоса.

      К: -Слушай, им необязательно знать то, что ты была у меня утром.

      Я: -А что в этом такого?

      К: -Кхм, понимаешь... Обычно я никого не пускаю в свою комнату.

      Я: -Но ты же впустил меня...

      К: -Просто... Я... Ты... И... В общем...

      Я: -Ладно, давай уже грибы собирать, а не лясы точить.

      Мы стали собирать грибы. Мы искали их, поставив корзину на небольшой пенёк. Не знаю, как это произошло, но вскоре это всё переросло в игру. Мы начали считать каждый гриб и соревноваться, кто соберёт больше. Когда я побежала за очередным подберёзовиком, то не заметила, что Кирилл тоже положил на него глаз. Я хотела срезать гриб, но рука Кирилла легла на мою. Я повернула голову. Его лицо было очень близко.

      Поцеловать Кирилла — [А]
      Вернуться — [Б]
    mood: calm
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "48"
          letter: А
          if:
            flag: kirill_question
        - label: Вариант Б
          to: "46"
          letter: Б
  "13":
    title: Глава 13
    text: |-
      Я: -Так на чём мы остановились? - я заигрывающе улыбнулась Гере.

      Г: -Ну, я случайно упал на тебя, а потом ты...

      Я не дала ему закончить и поцеловала. Мои руки обвили его шею. Сначала мы сидели, потом он аккуратно повалил меня на спину и встал на колени. Он целовал моё лицо, шею, уши. Мне стало невыносимо жарко, дыхание сбилось.

      Я: -Гера...

      Я: -Послушай...

      Я: -Мне кажется...

      Я: - Надо остановиться, пока не слишком поздно.

      Гера оторвался от меня на секунду.

      Г: -Не знаю, могу ли я остановиться.

      Я: -Просто, мне кажется, что это не самое подходящее место для того, чтобы уединиться...

      Г: -Да, пожалуй ты права. Но помни: я ещё с тобой не закончил.

      Мы стали укладываться спать. Гера погасил лампу и обнял меня за талию.

      Г: -Спокойной ночи, Настя.

      Я: -Спокойной ночи, Гера.

      Концовка: Гера
    mood: calm
    interaction:
      type: continue
      to: "36"
  "14":
    title: Глава 14
    text: |-
      Я вышла на поляну. Все уже собирали вещи. Мы вернулись домой.

      Все оставшиеся каникулы я провела занятая собой и своими мыслями. Конечно, я общалась с парнями, но не более, чем как с друзьями.

      Спасибо за прочтение!
    mood: grief
    image: assets/illustrations/14.jpg
    ending: true
  "15":
    title: Глава 15
    text: |-
      Я: -Нет, спасибо. Я тоже взяла с собой. - я достала из корзины бутылку с водой.

      И: -Как хочешь.

      Вернуться
    mood: calm
    interaction:
      type: continue
      to: "46"
  "16":
    title: Глава 16
    text: |-
      Я: -Спасибо за такой чудесный день. Я хорошо провела время с тобой.

      Арс: -Не за что. Я тоже хорошо провёл время. - Арсений смущённо улыбнулся.

      Вернуться в комнату
    mood: calm
    interaction:
      type: continue
      to: "45"
  "17":
    title: Глава 17
    text: |-
      Я: -Нет, я не хочу пить.

      И: -О, нет... Я так старался и готовил этот чай, специально для тебя... А ты не сделаешь даже глоток? - Илья сделал жалобное лицо и щенячьи глазки. Мне показалось, что он сейчас заплачет.

      Выпить — [А]
      Не пить — [Б]
    mood: tense
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "52"
          letter: А
        - label: Вариант Б
          to: "57"
          letter: Б
  "18":
    title: Глава 18
    text: |-
      Я: -Я буду ночевать с Владом!

      В: -Хорошо, идём.

      Я зашла в палатку. То, что я увидела меня поразило. Посередине стояла лампа, излучавшая тёплый неяркий свет. Рядом стояла тарелка с фруктами и два бокала.

      В: -Не откажешь мне в бокальчике шампанского?

      Я: -Это что, свидание?

      В: -Называй это как хочешь. Ну так что? Составишь мне компанию?

      Да! — [А]
      Нет... — [Б]
    mood: calm
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "40"
          letter: А
          if:
            flag: vlad_kiss
        - label: Вариант Б
          to: "34"
          letter: Б
  "19":
    title: Глава 19
    text: |-
      Я: -Нет. Я провела здесь всего пару дней. Конечно, есть те, с кем мне приятнее общаться, но не то, чтобы мне кто-то нравился.

      В: -Понятно... Ладно, думаю нам пора вернуться.

      Вернуться на поляну
    mood: calm
    interaction:
      type: continue
      to: "46"
  "20":
    title: Глава 20
    text: |-
      Я: -Кхм, я хотела сказать тебе спасибо. Прости, что не послушала тебя. Я до последнего верила, что Илья хороший парень, но, похоже, я ошибалась.

      Г: -Все совершают ошибки, главное, что ты в безопасности. На самом деле, я был наготове, когда понял, что ты выбрала Илью. Особенно после того, что произошло в лесу...

      Я: -Ты не представляешь, как я тебе благодарна! Знаешь, возможно, я смогу выразить свою благодарность.

      Я приблизилась к лицу Геры.

      Я: -Ты ведь не против?

      Г: -Я только мечтаю об этом.

      Я целую его. Страстно, горячо, долго. Его пальцы скользят сквозь мои волосы.

      Я: -Я бы продолжила, но мы не в лучшем месте для этого.

      Г: -Да, ты права. К тому же тебе нужно отдохнуть.

      Он лёг рядом со мной и обнял.

      Г: -Спокойной ночи, Шерлок.

      Я: -Спокойной ночи, Ватсон.

      Спасибо за прочтение!
