      Он нежно положил руку на мою щёку. Я одобрительно кивнула. Он медленно приблизился и поцеловал меня. Его губы были мягкими и влажными. Это было волшебно. Когда он отстранился, я смущённо закусила нижнюю губу.

      В: -Думаю, нам нужно идти, иначе другие нас потеряют.

      Я: -Да, идём.

