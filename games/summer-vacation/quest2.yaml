    text: |-
      Недолго думая, я целую его. Его губы такие же горячие, как и он сам. Мы целуемся сначала робко и нежно, а потом более страстно.

      Г: -Когда я падал, то не думал, что это обернётся мне таким наслаждением. Но, нам пора, кроме того, долго лежать на мокрой траве - небезопасно.

      Он поднимается сам и поднимает меня. Я смущенно улыбаюсь ему. Мы заканчиваем с поиском грибов и возвращаемся на поляну.

      Вернуться к остальным
