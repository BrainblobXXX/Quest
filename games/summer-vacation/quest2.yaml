  "40":
    title: Глава 40
    text: |-
      Я: -Конечно!

      Влад открыл бутылку шампанского и налил в бокалы. Я выпила пару бокалов. Вообще, я не пью, но ситуация располагала.

      В: -Кхм, думаю, что тебе хватит на сегодня. - Влад взял бокал из моих рук.

      Я: -Ха, да, ты прав. Обычно я не пью, но с тобой я не против.

      В: -Лестно-лестно.

      Я подсела ближе к Владу и прислонилась губами к его уху.

      Я: -Влад, ты мне нравишься. И я говорю это сейчас, не потому что пьяна, а потому что это правда. Я хотела сказать это ещё в лесу, когда ты поцеловал меня. - шепчу я ему.

      Влад медленно поворачивается ко мне и смотрит на меня с улыбкой. В его глазах столько добра и заботы, что я, сама того не понимая, таю в них.

      В: -Я бы не хотел пользоваться тем, что ты не совсем трезва...

      Я целую его. Мне сейчас так хорошо и спокойно. Я бы хотела, чтобы этот момент длился вечно. После мы ложимся спать. Влад целует меня в лоб и поглаживает по голове.

      В: -Спи, Настя.

      Я засыпаю.

      Концовка: Влад
    mood: calm
    interaction:
      type: continue
      to: "35"
  "41":
    title: Глава 41
    text: |-
      Несомненно я иду с Герой. Только с ним я чувствую себя спокойно.

      Мы шли по лесу. Недавно прошёл ураган и некоторые деревья лежали на земле. Так что весь наш путь превратился в настоящий лабиринт. Кроме того, от утренней росы стволы деревьев были мокрыми и скользкими, поэтому перебираться через них нужно было крайне осторожно.

      Вот перед нами лежало дерево. Оно упало на другое, поэтому находилось под углом. Пролезть под ним было невозможно и не очень-то хотелось лазить в мокрой траве.

      Г: -Давай я тебя подсажу и ты перелезешь, а потом я?

      Я: -Ну, давай попробуем. Думаю, что других вариантов у нас нет.

      Гера аккуратно берёт меня за талию и поднимает. Я чувствую тепло его рук через свою тонкую майку. Он садит меня на ствол дерева. Я с лёгкостью разворачиваюсь и спрыгиваю на другую сторону.

      Г: -Так, ну, а теперь я.

      Гера разбегается и отталкивается руками от бревна, поджав ноги, чтобы перепрыгнуть через него. Но бревно было сырым и скользким, поэтому его рука соскальзывает и он падает прямо на меня.

      Я: -Ай!

      Гера лежит прямо на мне. Я чувствую его дыхание. *Почему он не встаёт?!* Его лицо совсем рядом. Он смотрит мне в глаза, а потом бросает мимолётный взгляд на губы.

      Что я должна сделать?

