  "23":
    title: Глава 23
    text: |-
      Взвесив все "за" и "против", я направилась в комнату Ильи. Мне было жутко интересно, что же они не поделили с Герой. Я постучалась, Илья открыл дверь.

      И: -А, это ты, котёнок? Проходи, не стесняйся.

      *Котёнок?!* Я вошла. Его комната была больше моей в два раза. Всё было обставлено в красно-белых тонах.

      И: -Что привело тебя в мою скромную обитель?

      Я: -Я хотела узнать, что произошло сегодня утром?

      И: -А, так ты про это недоразумение? Ничего серьёзного. Просто Георгий сделал то, чего не следовало. Надеюсь, я тебя не напугал, принцесса?

      Я: -Нет, всё в порядке. И часто между вами случаются такие "недоразумения"?

      И: -Понимаешь, мы очень разные и нам сложно избегать конфликтов. Но не волнуйся, сладкая, тебя это некоим образом не коснётся.

      Я: -Хорошо... Спасибо, что рассказал, я пожалуй пойду.

      И: -Жду тебя в любое время дня и ночи.

      Вернуться в комнату
    mood: mystery
    interaction:
      type: continue
      to: "45"
  "24":
