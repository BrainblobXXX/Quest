      Я: -Ну, да.

      В: -Ну, вот и всё. Короче, одевайся, собирайся, мы идём в поход!

      Я: -Чего?! Какой ещё поход? Который час?

      В: -Уже без пятнадцати 10. Поторопись! - сказал Влад и вышел из комнаты.

      Ещё толком не проснувшись, я начала собираться. Я нашла и кое-как натянула на себя джинсовые шорты и майку. До конца взбодрилась я, лишь придя на кухню. У меня дежавю. На меня опять смотрят 5 парней. Одновременно неловко и приятно.

      К: -Ну наконец-то! Идём уже.

      Мы вышли из дома. С собой я взяла только тёплую кофту и бутылку воды.

      Шли мы где-то минут 40. Мы успели пройти лес, речку, обрыв и какую-то заброшенную деревню. Оказавшись на поляне парни принялись ставить палатки. Мне поручили собирать ветки для костра. Я сбегала до небольшой рощи и набрала достаточное количество. Возвращаясь, я увидела, что парни о чём-то спорили.

      И: -С чего ты взял, что это будешь ты? Ты себя в зеркало-то видел?

      Г: -В отличие от некоторых, я хотя бы общаюсь с вменяемыми девушками.

