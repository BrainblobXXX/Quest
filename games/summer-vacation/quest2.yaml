    text: |-
      Утром я проснулась раньше Влада. Я посмотрела на него. Он был очарователен. Я поцеловала его, чтобы разбудить. Он улыбнулся и открыл глаза.

      В: -Доброе утро.

      Я: -Доброе. Как спалось?

      В: -Неплохо. С тобой очень приятно соседствовать.

      Я: -Хах, да, с тобой тоже. Кстати, я не знала, что ты романтик.

      В: -Ты ещё много что обо мне узнаешь. - Влад многозначительно улыбнулся.

