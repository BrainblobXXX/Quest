  "39":
    title: Глава 39
    text: |-
      Я: -Вчера мы так хорошо погуляли. Мне очень понравилось. Ты не против ещё одной прогулки.

      Арсений приятно удивился и поправил очки.

      А: -Да, конечно.

      Теперь Арсений молчал. Он лишь изредка поддакивал мне и задавал вопросы. Я видела, что он о чём-то задумался.

      Я: -О чём думаешь?

      А: -Кхм... О тебе.

      Я резко остановилась и посмотрела на него. Его глаза нервно бегали по моему лицу. Я медленно подошла к нему. Мы были достаточно близко, чтобы я чувствовала его тепло.

      Я: -Какова вероятность того, что человек может влюбиться за 2 дня?

      А: -Примерно 2%. В большинстве случаев люди путают это с симпатией, либо со страстью.

      Я: -Ну, а что насчёт исключений?

      А: -Без них никуда.

      Я: -Ни слова больше.

      Я аккуратно сняла его очки и поцеловала. Поцелуй был совсем недолгим, но очень чувственным.

      Я: -Думаю, я определилась с соседом по палатке сегодня.

      Мы оба рассмеялись.

      А: -Давай вернёмся и сообщим это остальным. Предвкушаю выражения их лиц!

      Вернуться
