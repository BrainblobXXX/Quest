      Илья удивлённо поднял на меня глаза.

      И: -Ты... Ты это сейчас серьёзно? Ты даёшь мне второй шанс?

      Я: -Каждый его заслуживает.

      Илья бросился ко мне в объятия. На секунду мне показалось, что он плачет. А может и не показалось.

