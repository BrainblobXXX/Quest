  "37":
    title: Глава 37
    text: |-
      Мне совершенно не интересно, что там у них сегодня произошло. Меня это не касается. К тому же сегодня отличная погода.

      Я захватила телефон и ключи. Вышла на улицу, не забыв закрыть комнату. Сад на заднем дворе был очень красивый. На небольшой территории, огороженной непроглядной живой изгородью, стояла круглая беседка, напротив которой стоял раскидистый дуб. На одной из его ветвей весели качели. Под дубом сидел Арсений и читал. Он заметил меня и жестом позвал к себе. Я подошла.

      Арс: -Куда собралась?

      Я: -Просто хотела прогуляться и осмотреть окрестности.

      Арс: -Опасно отпускать тебя одну. Если ты позволишь, я пойду с тобой.

      Я: -Ну, ладно...

      Арсений не спеша поднялся и направился к воротам. Он с открыл замок и пропустил меня вперёд.

      Мы гуляли по узким садовым улочкам, затем вышли на широкий перекрёсток. После него начались городские дома. Количество людей заметно увеличивалось. Пока мы гуляли Арсений рассказывал о своём детстве, о братьях и об этом городе. Потом мы зашли в кофейню, и он угостил меня кофе с круассаном.

      Домой мы вернулись часа в три. Я решила поблагодарить Арсения. Что мне сделать?

      Сказать спасибо — [А]
      Обнять — [Б]
