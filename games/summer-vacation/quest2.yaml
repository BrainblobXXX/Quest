  "25":
    title: Глава 25
    text: |-
      Дом представлял собой весьма интересное сооружение. Планировка здания напоминала отель: прямой коридор и множество комнат. Но, честно говоря, было мрачновато. Во всём коридоре висело всего 6 бра, которых было явно мало. Однако, всё выглядело очень дорого. Стены обклеены серыми обоями с черными узорами, напоминающими канделябры. Посередине стена закрывалась деревянной панелью из тёмной древесины. По полу стелился баклажановый бархатный ковралин.

      В: -Весь второй этаж - это жилые комнаты. Твоя - последняя направо, располагайся, а я принесу твои вещи.

      Я прошлась по коридору и открыла черную дверь, последнюю направо. За ней скрывалась небольшая комната. От неё веяло чистотой и свежестью. Белоснежная постель на одноместной кровати у большого окна, прикрытого тяжёлыми чёрными шторами, скрывающими полупрозрачный тюль, строгий платяной шкаф прямо напротив кровати и пушистый молочный ковёр - всё это радовало глаз.

      За моей спиной раздался негромкий, но уверенный стук. Я обернулась.

      В: -Ваш багаж, миледи. - губы Влада расплылись в учтивой улыбке.

      Я: -Спасибо. - я робко улыбнулась.

      В: -Если что - зови, я за стенкой! -Он подмигнул мне и вышел из комнаты.

      *Ого, уже 12, пойду-ка я спать. Завтра будет увлекательный день* - с этой мыслью я уснула.

      На следующий день

      Я проснулась рано. Солнечный зайчик скользнул по моему лицу. Переодевшись в розовый костюм, я спустилась в кухню. Там уже пил чай один из братьев. Кажется, Влад говорил, что его зовут Гера.

      Я: -Доброе утро! - я села напротив него, налив в чашку кофе.

      Он кивнул и посмотрел куда-то в сторону.

      Я: -Послушай-ка, а где я могу умыться?

      Г: -Первая дверь слева от входа.

      Я: -О, спасибо. У тебя всё хорошо? Просто ты достаточно молчалив.

      Г: -Не твоё дело. - он резко встал из-за стола и направился к выходу.

      Я: -Эм, я не хотела тебя обидеть.

      Г: -Глупая девчонка. -сказал он шёпотом и вышел.

      *И что это с ним? Такой угрюмый...*

      Поднявшись в свою комнату, я решила разобрать вещи.

      Я уже почти закончила, когда услышала голоса в коридоре. Кто-то ссорился. Я осторожно выглянула из комнаты. Это были Илья, Кирилл и Гера. Первые два нападали на третьего. Вдруг Илья взял Геру за воротник его рубашки.

      И: -Ещё раз сунешься - я тебе так лицо разукрашу...

      Кирилл шепнул что-то Илье на ухо.

      И: -Скажешь спасибо девчонке.

      Он резко отбросил его и удалился с союзником. Гера с невозмутимым лицом поправил рубашку и взглянул на меня. Я, опомнившись, скрылась в комнате. Почти сразу он вошёл и, прислонившись спиной к двери, посмотрел на меня.

      Г: -Ты всё видела. -его голос был до жути спокойным.

      Я: -Да... -ответила я, хоть это был и не вопрос.

      Г: -Просто держись от них подальше. Мало ли чего придёт им в голову. Поверь, твоё мнение они ни во что не поставят. Особенно Илья.

      Гера ещё раз многозначительно взглянул в мои глаза и вышел.

      *Ничего себе! Вообще-то я достаточно взрослая, чтобы самой решать с кем мне стоит общаться, а с кем нет. Это точно было самое странное утро в моей жизни*

      Я вернулась к распаковке вещей. Когда я закончила, на часах было 10:20. Сейчас можно погулять недалеко от дома или узнать больше о том, что произошло утром.

      Пойти гулять — [А]
      Узнать что случилось — [Б]
