      Я: -Я пойду за грибами с Владом.

      В: -Отлично! Идём. - он взял корзинку и улыбнулся мне.

      Мы провели почти весь день в лесу, собирая грибы. Влад всё время шутил и рассказывал забавные истории.

      Я: -Ха-ха-ха, Влад, остановись, я уже идти не могу, мне больно от смеха.

