  "22":
    title: Глава 22
    text: |-
      Я: -Мне очень понравилось гулять с тобой!

      Я подошла к Арсению и обняла его. Арсений не ожидал такого шага и немного оторопел. Я почувствовала, как участилось его сердцебиение.

      Арс: -Я... Эм... Да, конечно. Мне тоже.

      Я выпустила его из своих объятий и кокетливо попрощалась, махнув рукой.

