    text: |-
      Утром я проснулась и увидела, что Гера уже оделся. Он сидел и думал о чём-то.

      Я: -О чём ты думаешь?

      Г: -Думаю о том, куда тебя спрятать, чтобы ты была только моей.

      Я: -Ха-ха. Надеюсь, что ты шутишь.

