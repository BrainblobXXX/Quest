  "51":
    title: Глава 51
    text: |-
      Когда я открыла глаза, то увидела перед собой Кирилла. Он нежно смотрел на меня и незаметно улыбался.

      Я: -Ты что смотрел, как я сплю?

      К: -Да.

      Я: -И давно?

      К: -Не знаю. С тобой время для меня останавливается.

      Я улыбнулась и уткнулась лицом в его грудь.

      К: -Думаю, что можно начинать собираться.

      Я: -Хорошо.

      Мы собрались и вернулись домой. За эти каникулы я получила множество приятных воспоминаний. Мы ходили с Кириллом на речку, в парк развлечений, в горы. Он научил меня играть на укулеле и помог написать мотивационное эссе для поступления в ВУЗ.

      Когда у моего папы наладились дела на работе, я вернулась к нему.

      Через пару месяцев, когда я шла в университет, на входе я увидела парня с букетом пионов. Я подумала о том, как это мило и подошла чуть ближе. Тогда я поняла: это Кирилл.

      Он накопил достаточное количество денег, чтобы снять нам квартиру. Да, он бывает нервным, да он интроверт. Но я люблю его. Люблю как он с утра неумело готовит омлет, который постоянно подгорает с одной стороны; люблю как он просит отмазать его от учёбы в институте и сделать вид, что он заболел; люблю как он щекочет меня, когда мне грустно; люблю как он смотрит на меня перед сном. Он делает меня счастливее.

      Спасибо за прочтение!
    mood: victory
    image: assets/illustrations/51.jpg
    ending: true
