  "21":
    title: Глава 21
    text: |-
      Я: Итак, сегодня я ночую с Арсением!

      Сказать, что все удивились - ничего не сказать.

      К: -С этим ботаном? Ну, удачи. Смотри не усни, пока он будет рассказывать тебе третью теорию эволюции! - Кирилл усмехнулся.

      А: -Без тебя разберёмся! - огрызнулся Арсений. - Идём, Настя.

      Я высокомерно глянула на Кирилла. Тот фыркнул и ушёл в свою палатку. Я залезла в палатку к Арсению. Он закрыл её и включил ночник.

      А: -Прошу тебя, не обращай внимание на этих придурков. Им лишь бы сказать что-нибудь колкое.

      Я: -Я и не обращаю. Видно, что они тебе завидуют.

      Арсений округлил глаза.

      А: -За..завидуют? Ты..ты так думаешь?

      Я: -Я уверена в этом. Ты сообразительный, красивый и производишь хорошее впечатление. Им далеко до тебя.

      А: -О..ого. Спасибо, Настя.

      Я: -За правду не благодарят.

      Продолжить начатое в лесу — [А]
      Давай-ка спать! — [Б]
