      Я: -Чьё мнение? - подошла я и вновь стала центром сосредоточения мужского внимания.

      В: -Настя, тут небольшая проблемка. Мы не подумали о том, где ты будешь спать, и с собой у нас только 5 палаток. Получается, что тебе придётся ночевать с одним из нас.

      Я задумалась. Ведь нет ничего такого в том, чтобы провести 1 ночь с парнем в тесной палатке? Ведь так?

      Я: -Я должна подумать. Думаю, я скажу вам это вечером.

      После мы принялись разводить костёр. Когда огонь уже ярко горел, нужно было идти за грибами. С кем я пойду?

      С Герой — [А]
      С Владом — [Б]
      С Арсением — [В]
      С Ильёй — [Г]
      С Кириллом — [Д]
