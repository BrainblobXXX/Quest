  "45":
    title: Глава 45
    text: |-
      Я вернулась в комнату и увлеклась чтением. Вскоре, сама этого не заметив, я уснула.

      Следующее утро

      Я: -Ммм... Ты не нальёшь мне чашечку...

      В: -НАСТЯ!!!

      Я: -А?! Что?!

      Я проснулась и увидела перед собой Влада.

      Я: -Эй, что ты тут делаешь? А если бы я была без одежды?

