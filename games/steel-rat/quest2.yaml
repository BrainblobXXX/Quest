  "336":
    title: Глава 336
    text: Слушай меня внимательно, новобранец! Если ты нырнешь в кольчуге, то камнем пойдешь ко дну и, соответственно, уже никогда не станешь настоящим полевым агентом Спецкорпуса! Взвесь еще раз печальные последствия чуть было ни совершенного тобой опрометчивого поступка и двигай.
    mood: tense
    interaction:
      type: continue
      to: "271"
  "337":
    title: Глава 337
    text: Обойдя кресло, ты входишь в тоннель и двигаешься к свету. В полу под твоими ногами распахивается люк, ты падаешь в него, и летишь, летишь.
    mood: calm
    interaction:
      type: continue
      to: "93"
  "338":
    title: Глава 338
    text: ПОЗДРАВЛЯЮ!!! Ты справился с заданием! Преуспел там, где другие спасовали! Доставил живым и невредимым безумного профа в штаб-квартиру Специального Корпуса! Профа уводит вооруженная охрана, и его проклятия в твой адрес для тебя слаще всякой музыки. Итак, сынок, шаг вперед. Я приколю к твоей груди крылышки полноправного полевого агента Специального Корпуса! Вздернув подбородок, ты краснеешь от гордости Еще бы, ведь ты уже не слабый и глупый штатский, поющий с кабанами на два голоса. Ты агент Корпуса! Ты изменил мир! Ты победитель!
    mood: victory
    image: illustrations/victory.webp
    ending: true
  "339":
    title: Глава 339
    text: Ты вновь на перекрестке. Вокруг ни души, дорогу спросить не у кого. Что ж, почеши в затылке и реши, куда направишься. Если на север, то двигай на [А]. Если на восток, то на [Б]. Если на юг, то на [В]. Если на запад, то на [Г].
    mood: calm
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "193"
