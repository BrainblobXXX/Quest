  "123":
    title: Глава 123
    text: Из тоннеля доносится ужасная вонь. Набери в легкие побольше воздуха и ползи. Тоннель понемногу расширяется, потолок становится выше. Ты ползешь уже не на животе, а на четвереньках. Еще несколько метров, и потолок становится еще выше. Ты продолжаешь путь, хотя и наклонив голову, но на ногах. Чтобы хоть как-то ориентироваться в кромешной тьме, пальцами правой руки ты касаешься стены. Кажется, тоннелю нет конца. Отдохни немного, а если хочешь, вздремни. Проснувшись все в том же мраке, ты продвигаешься дальше. Тоннель все не кончается. Ты в отчаянии решаешь повернуть назад, и тут в конце тоннеля появляется свет. Полагаешь, свет — иллюзия, вызванная уставшими от темноты глазами? Нет, это действительно свет! Ты бежишь к нему и, неожиданно выскочив из тоннеля, оказываешься в пустой просторной комнате, из которой ведут два низких, темных тоннеля. Тоннели похожи, как две капли воды, и чтобы выбрать, по которому отправишься дальше, подкинь ДОСП. Если орел, ползи левым. Если решка, правым.
    mood: tense
