  "98":
    title: Глава 98
    text: Ты — в огромном наклонном желобе, по которому струится грязная вонючая вода. Зажав нос, скользишь по нему. Вскоре наклон желоба уменьшается, и ты уже сидишь в нем. Ты всматриваешься вперед и напряженно вслушиваешься. Из темноты доносятся скрежет и шипение. Что значат эти звуки? К сожалению, очень скоро ты выясняешь их природу. Оказывается, чуть впереди в желобе дыра, под ней — огромное озеро лавы. Вода сливается вниз и, едва коснувшись раскаленной лавы, с шумом вскипает. И что самое досадное, тебя медленно, но неотвратимо несет к дыре. Пора прощаться с жизнью? Ты с надеждой вглядываешься в облака пара, и… о, радость! Видишь посреди озера лавы крошечный каменный островок. Он — твой единственный шанс на спасение! Приготовься! Прыгай!
    mood: victory
    interaction:
      type: continue
      to: "181"
  "99":
    title: Глава 99
    text: "Все мы совершаем ошибки. Почему так темно? Да просто девица выпустила тебе в ноздри струю наркогаза. А теперь открой глаза и оглядись. Тебе не по нраву то, что ты увидел? Считаешь наручники на запястьях и цепи на лодыжках излишествами? Представь на минуту, что они из чистого золота. Не помогло? Ну, тогда… Стоп: пленившая тебя девица подала голос. Что ж, послушаем. — А ты, красавчик, здесь, никак, новенький? Ты неохотно киваешь, девица, расплывшись в довольной улыбке, продолжает: — Ну я-то сразу догадалась! Ведь только новички настолько глупы, что подпускают к себе незнакомцев. Мое полное имя — Бетси-На-Все-Руки-Мастерица, но ты, как и все здесь, зови меня просто Бетси. На-Все-Руки-Мастерицей меня прозвали потому, что я была мастером но подделке банковских счетов, кредитных карточек и банкнот. Когда меня заловили легавые, то почему-то назвали воровкой и отправили на эту планету мотать срок. Они ошиблись дважды. Во-первых, я не воровка. Наоборот, практически из ничего — кусков пластика и листов чистой бумаги — я создавала полезные вещи: кредитные карточки и банкноты. Во-вторых, ссылка сюда для меня вовсе не наказание. Здесь я ловлю раззяв вроде тебя и заставляю их работать, а когда они мне надоедают, продаю за приличные бабки. И ты, дорогуша, будешь работать на меня, а иначе… Лучше не спрашивай, что иначе. От одной только мысли, что с тобой произойдет, если ты откажешься работать, у меня мороз по коже. А сейчас вставай, пошли. Она рывком поднимает тебя на ноги и, продолжая говорить, тащит на цепи за собой. — Эта дорога в Гроаннсвилль. Тамошний граф набирает войско и за тебя мне отвалит солидную сумму серебром. Да пошевеливайся же! Она дергает за цепь, а ты спотыкаешься и думаешь, до чего же повезло. Именно повезло! Ведь зная, что всех заключенных отсылают на планету-тюрьму с пустыми руками и карманами, Бетси не обыскала тебя, но ты-то не заключенный, у тебя-то с собой целый арсенал! Незаметно сунь руку в карман. Нащупал гранату? Доставай ее. А теперь рви чеку и швыряй! БУ-У-УМ! Интересно, какая граната тебе попалась. Дымовая или с сонным газом? Для выяснения своей дальнейшей судьбы воспользуйся Двусторонним Определителем Случайных Процессов. Ты никогда не слышал о ДОСПе? Да у тебя в кармане их целый десяток. Возьми один. Да, правильно, ДОСП в просторечии называют монетой. Ты не знаешь, как им пользоваться? Подбрось ДОСП в воздух и, поймав на раскрытую ладонь, посмотри. Если выпадет решка. Если орел."
    mood: danger
    image: illustrations/girl_caprure.webp
    interaction:
      type: roll
      formula: 1d2
