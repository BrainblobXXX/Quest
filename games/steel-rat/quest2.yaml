  "106":
    title: Глава 106
    text: Уж не везет, так не везет. Тебе, как назло, попалась дымовая граната. Дымовая завеса тебе не поможет, ведь руки и ноги — скованы, а конец цепи от оков в руке Бетси. За причиненные неприятности она награждает тебя подзатыльником, и ты вновь на пути в Гроаннсвилль. Но что это там впереди? Ужасный громила! Кулачищи, как молоты, глаза — щелки, на губах — презрительная ухмылка. Размахивая дубиной, он быстро приближается, Бетси поспешно занимает каратистскую стойку. Между ними неминуемо произойдет потасовка. Кажется, они друг друга стоят. Если ты придешь на выручку одному из них, то противник обречен. Ты не стой же столбом, действуй! Если ты поможешь Бетси, то отправляйся на [А]. Если незнакомому громиле, то на [Б].
