    text: Выдайте добровольцу оружие и экипировку! — распоряжается Сейди. Сыны и Дочери Садизма кидаются выполнять приказ. Через пять минут на тебе тяжелая, но надежны кольчуга из нержавеющей стали, на голове медный шлем с красивым красным пером, на поясе меч в ножнах, за спиной колчан со стрелами, в правой руке лук, через плечо сумка, в ней бутылка вина, два сандвича и коробка печенья. Чего еще желать? Ах, тебе бы хотелось побыстрее убраться с этой осточертевшей планеты? Нет ничего проще. Найди безумного профа, и ты — дома. Сейди протягивает тебе свернутый в трубочку пожелтевший лист. — Вот тебе, незнакомец, секретная карта Непроходимых Джунглей. Не медли же, отправляйся в путь. Удачи тебе! Ты с гордым видом покидаешь здание, переходишь мост и углубляешься в джунгли.
