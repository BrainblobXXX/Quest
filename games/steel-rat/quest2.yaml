      to: "72"
  "161":
    title: Глава 161
    text: Ковбой, обыскав тебя, выбрасывает передатчик материи, так и не разобравшись, для чего он служит, и забирает «утреннюю звезду», меч и все содержимое твоих карманов, включая семь золотых монет, затем, неприлично обозвав тебя, запрыгивает на лошадь и уносится прочь. Как только он скрывается из виду, ты встаешь на ноги, отряхиваешься, поднимаешь с земли передатчик материи и обнаруживаешь.
    mood: calm
    entry:
