        - min: 1
          max: 1
          to: "37"
  "122":
    title: Глава 122
    text: Ты допрыгиваешь, но тонкий слой застывшей лавы под твоими ногами трещит, крошится. А ты шустрый парень, когда захочешь! Подскочив, ты карабкаешься на скалу, ругаясь, когда из-под ноги вылетает камень. Рядом с тобой в скале вход в тоннель. Быстрей полезай в него!
