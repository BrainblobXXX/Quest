  "94":
    title: Глава 94
    text: "Бой был жаркий, и твоя помощь пришлась кстати. Как только ты кусаешь громилу за коленку, он с воем бросается в лес. Ну хватит, хватит, ты уже выплюнул изо рта все волосы. Да и к тому же к тебе подходит Бетси. Она говорит: — Спасибо, сосунок! Но что бы новичок ни сделал, все равно он мой раб. Уразумел? Смеясь, она берется за конец цепи и тащит тебя по дороге дальше. Жалеешь, что выступил в схватке на ее стороне? Может, громила не оказался бы такой неблагодарной тварью, как Бетси? Но сделанного не вернешь… Что это за шум в лесу? Кто это там? О, да это тот самый громила! Кажется, он опять готов сразиться с Бетси. Перед тобой новый выбор. Кому поможешь? Если громиле, то отправляйся на [А]. Если опять неблагодарной Бетси, то на [Б]."
    mood: danger
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "65"
          letter: А
        - label: Вариант Б
          to: "7"
          letter: Б
  "95":
    title: Глава 95
    text: Ты выскакиваешь на крошечный балкончик. Оказывается, по винтовой лестнице ты взобрался на самую высокую башню замка. Вокруг порхают, щебечут птички, твое разгоряченное лицо обдувает ласковый бриз. Идиллия. Но взгляни с балкона вниз. Черт возьми, под тобой по крыше главной постройки замка ползет безумный проф. Выбора у тебя нет, так что, преодолевая головокружение, спускайся по вертикальной стене и преследуй его. Цепляясь за трещины между камнями, ты ползешь, ползешь по башне вниз. Если бы твои пальцы не потели, то спуск шел бы гораздо легче. Но что поделаешь, такова полная трудностей жизнь полевого агента. Карабкайся, не опуская глаз.
    mood: tense
    interaction:
      type: continue
      to: "255"
  "96":
    title: Глава 96
    text: |-
      С трудом переставляя ноги, ты входишь в древний лабиринт. Тебя окружают инопланетные чудеса: твердый пол пружинит, точно мох, скользкие на ощупь стены испускают мягкий люминесцентный свет… Почему ты остановился? Хочешь знать, что значит люминесцентный свет? Вернешься домой, загляни в словарь, а пока без лишних вопросов выполняй задание. Льющийся отовсюду люминесцентный свет скрадывает тени, поэтому ты ориентируешься с величайшим трудом. Внимание: в конце коридора что-то появилось… Что-то таинственное и чужое. А, вот оно в чем дело: коридор заканчивается, из тупика четыре пути, и ни один из них не кажется привлекательным. И вот еще что-то… А, надписи, причем я узнаю почерк рехнувшегося профа. Должно быть, надписи он сделал, чтобы не заблудиться. На краю дыры в полу с вертикальным шестом, какие бывают на пожарных вышках, он написал [А]
      На стене, рядом со спускающейся в неизвестность лестницей, ступени которой покрыты чем-то липким, скользким, холодным, цифра [Б]
      Над узким темным тоннелем, в который едва-едва можно пролезть, корявая надпись [В]
      У движущегося эскалатора, похожего на те, что ты не раз видел в космопортах, [Г]. Куда направишься? Решай живее!
