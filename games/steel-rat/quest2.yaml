  "100":
    title: Глава 100
    text: Ты берешь сеть в левую руку, трезубец в правую; дверь перед тобой распахивается, в глаза бьет яркий солнечный свет. Ты распрямляешь спину и, гордо подняв подбородок, выходишь.
