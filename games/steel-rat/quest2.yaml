  "97":
    title: Глава 97
    text: Старик хоть и выглядит настороженным, но, увидев тебя с посохом в руке, останавливается. Остановись и ты, не подходи к нему слишком близко. Так, теперь спроси, куда ведут дороги. — Что-что, молодой человек? Говори громче, похоже, старик глуховат. — Дорога на Гроаннсвилль? Гроаннсвилль — ужасный, ужасный город! Тамошний герцог — ужасный, ужасный тиран. Его любимое развлечение — пытки. Говорят, подвалы его замка — камеры пыток, оборудованные по последнему слову техники. Я бы, молодой человек, на вашем месте туда не ходил. Скажи, что тебе очень надо попасть туда. — Говорите, вас зовет в Гроаннсвилль долг? Похоже, что вы — благородный юноша, но, сказать по правде, я вам не завидую. Ну, если вам так приспичило в Гроаннсвилль, то идите по дороге, что ведет на юг. Спроси, куда ведут остальные дороги. — Громче, молодой человек, я слаб на ухо. Говори громче. — Остальные дороги? Пойдя по северной дороге, вы попадете в непролазные топи. Ужасное, ужасное место, скажу я вам! Дорога на восток ведет к дому тюремного надзирателя. Надзиратель ужасный, ужасный человек. С ним лучше не связываться. Ну а если вы проголодались, я бы советовал вам податься на запад. В конце той дороги найдете бесплатную робокухню. Не благодарите меня. Приятный старичок. Или он только с виду такой? Можно ли ему верить? Можно ли верить хоть кому-нибудь на планете-тюрьме? По какой дороге пойдешь? Решай. Если по северной, то двигай на [А]. Если по восточной, то на [Б]. Если но южной, то на [В]. Если по западной, то на [Г].
    mood: danger
