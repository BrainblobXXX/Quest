  "120":
    title: Глава 120
    text: Удар! Бах-ба-бах! Дверь рассыпается в щепки! Сообразив, что дубина — ключ к решению многих (если не всех) проблем, возникающих перед полевым агентом при выполнении задания, ты с дубиной в руке бросаешься в коридор. Коридор перед тобой разделяется на три. Куда бежать? Не спрашивай меня. Решай сам! Если свернешь налево, то очутишься на [А]. Если направо, то на [Б]. Если побежишь вперед, то на [В]. Не стой же, как истукан! Действуй!
