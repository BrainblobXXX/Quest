  "102":
    title: Глава 102
    text: Ты попадаешь в светлую чистую комнату. Посередине стоит стол, рядом с ним удобное мягкое кресло, на столе большущая ваза с фруктами. Рот твой наполняется слюной. Неудивительно, ведь ты даже не помнишь, когда ел в последний раз. Но будь осмотрителен, вдруг фрукты отравлены! Извини, не понял, что ты говоришь, набив рот. В считанные минуты ты съедаешь все фрукты, пол вокруг тебя покрывается слоем кожуры и огрызков. Не кажется ли тебе, что на этой планете ты приобрел слишком много дурных привычек? Но ш-ш-ш. Открывается дверь! Готовый к очередным неприятностям, ты разворачиваешься на каблуках. В комнату входит… цветущая стройная женщина! И ты ее, вроде бы, видел прежде. Но где? — Привет, незнакомец, — говорит она. — Вижу по твоим округлившимся глазам и отвисшей челюсти, что ты узнал меня. Да, именно я сидела в Королевской ложе. Я — Сейди-Садистик, главарь Сынов Садизма. Правда, в моей банде женщин не меньше, чем мужчин, и я даже одно время подумывала переименовать банду в Дочерей и Сынов Садизма, но новое название слишком длинно и неблагозвучно, и потому отказалась от этой мысли. Да и не в названии дело, главное, что все мы обожаем насилие! Ты дрожишь и делаешь усилие, чтобы не свалиться на пол, а Сейди одобрительно кивает. — Мне понравился твой стиль на арене, поэтому предлагаю тебе вступить в нашу банду. Ты согласен? Воистину царское предложение, но ты почему-то подавленно молчишь. — Давая ответ, помни, что либо ты наш человек, либо покойник! — подбадривает тебя Сейди. Ты неохотно киваешь. — Рада, незнакомец, твоему мудрому решению. Но не волнуйся, ты пробудешь с нами недолго. Мне известно, что ты преследуешь безумного профессора Гейстескранка. Я тебе помогу, но лишь после того, как ты окажешь мне услугу. Интересно, какую? — Ты отправишься через Непроходимые Джунгли к священному храму среди руин и принесешь мне Рубин Джунглей. Непроходимые Джунгли кишат свирепыми хищниками, и двенадцать посланных туда добровольцев погибли, но ты, уверена, справишься, ведь ты тринадцатый, а тринадцать — счастливое число. К тому же я видела, как лихо ты управился с хищником на арене, справишься и с его родственниками в джунглях. Выбора у тебя нет. Так что следуй за Сейди Садистик по коридору.
    mood: mystery
    image: illustrations/Vase.webp
    interaction:
      type: continue
      to: "109"
  "103":
    title: Глава 103
    text: Дракон за твоей спиной, взвыв, изрыгает струю пламени, и ты, почувствовав, что волосы на затылке опалены, хватаешь кусок первого попавшегося (шоколадного) торта, откусываешь от него и переносишься.
    mood: calm
    interaction:
      type: continue
      to: "221"
