  "160":
    title: Глава 160
    text: Отлично сработано! Сеть захлестнула ноги противника, ты резко дергаешь ее на себя, и верзила опрокидывается на землю. Миг, и твоя нога на его груди, а меч у его горла. Как поступишь с врагом? Убьешь ли на месте или даруешь жизнь? Ты смотришь на королевскую ложу, ждешь указаний Сейди-Садистик. Она медленно поднимает правую руку. Ее решение узнаешь.
