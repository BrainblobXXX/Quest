  "150":
    title: Глава 150
    text: "Похоже, надпись в очередной раз обманула тебя — ты прошел через дверь, но мгновенной смерти не последовало. Ты ступаешь по узкому коридору и слышишь, как из-под ног с писком разбегаются невидимые в полумраке крысы. Вскоре ты оказываешься перед очередной дверью, из щели в стене рядом с ней струится свет, и ты, хоть и с трудом, но все же читаешь надпись на двери: ЕСЛИ ДОРОЖИШЬ ЖИЗНЬЮ, ТО ДЕРЖИСЬ ОТ ЭТОЙ ДВЕРИ ПОДАЛЬШЕ! Судя по устрашающей надписи, именно за этой дверью и находится Рубин Джунглей. Открывай же дверь и смело иди."
    mood: danger
    interaction:
      type: continue
      to: "119"
  "151":
    title: Глава 151
    text: Узнав от твоем решении, роботы воют от горя, целуют твои руки, молят не покидать их, но ты непреклонен. Робот-ремонтник, поклявшись, что знает кратчайший путь к владениям Сейди-Садистик, указывает направление. Ты благодаришь его, прощаешься с роботами и отправляешься своей дорогой, а как только роботы скрываются из глаз, стираешь с рук и одежды их слезы и слюни — смазку. Ты идешь через джунгли на запад и перед самым закатом.
    mood: calm
    interaction:
      type: continue
      to: "270"
  "152":
    title: Глава 152
    text: Согласен, щекотать хищника — не слишком эффективная идея. Животное просто отшвырнуло тебя ударом лапищи и теперь, приблизившись, вновь готовится к прыжку. Самое время отпрыгнуть.
    mood: danger
    interaction:
      type: continue
      to: "112"
  "153":
    title: Глава 153
    text: Мог бы перелезть через стены и в другом месте, получше! Спрыгнув со стены во двор замка, ты оказываешься перед дюжиной грозных стражников. На тебя обрушиваются болезненные удары кулаков и дубин слева, справа, спереди, сзади. В сознание ты приходишь уже.
    mood: danger
    interaction:
      type: continue
      to: "28"
  "154":
    title: Глава 154
    text: Верзила хмуро глядит на тебя из-под косматых бровей, ты отвечаешь ему таким же тяжелым взглядом, он выразительно трясет дубиной, ты поднимаешь руку с зажатым в ней посохом, он обзывает тебя неприличными словами, ты не остаешься в долгу. Похоже, ни он, ни ты не расположены к бою, и вы благополучно расходитесь. Опасаясь, что здоровяк передумает и последует за тобой, ты непрерывно оглядываешься, пока не оказываешься у развилки дороги. Решай, направишься ли на восток к [А]. Или на запад к [Б].
    mood: danger
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "176"
          letter: А
        - label: Вариант Б
          to: "190"
          letter: Б
  "155":
    title: Глава 155
    text: Фрукты растут высоко, с земли их не достать. Ты взбираешься на дерево. Оранжевые и зеленые фрукты и размерами, и формой напоминают грейпфруты, различие лишь в цвете. Ты хватаешься за ближайший, тянешь, вначале слабо, потом что есть сил, но длинный прочный стебель, которым фрукт прикреплен к ветке, не поддается. Выхватив меч, ты рассекаешь стебель. Отлично, но плод падает на землю и, разбрызгивая сладкий сок, с хлопком лопается. Собирай урожай аккуратней! Ты обхватываешь шершавый ствол дерева ногами, левой рукой берешься за фрукт, зажатым в правой руке мечом перерубаешь стебель. Вернув меч в ножны, с фруктом в руке сползаешь по стволу на землю. Снова забираешься на дерево и повторяешь операцию. И так вновь и вновь. Часа через три изнурительной работы на земле набирается оранжево-зеленая горка. Ты связываешь длинные стебли узлом и, перекинув фрукты через плечо, шагаешь по тропинке.
    mood: calm
    interaction:
      type: continue
      to: "113"
  "156":
    title: Глава 156
    text: |-
      Ты слышишь глухой удар. Волосатый Гарри, взревев от боли, отпускает тебя. Сзади него с дубинкой в руке оказывается твой старый знакомый — Арбутнот Отверженный. Он говорит: — Рад снова тебя видеть, дорогой друг! Я пришел, чтобы отвести тебя к профессору Гейстескранку и честно заработать три золотых. Идем же! Прежде чем ты трогаешься с места, рядом с Арбутнотом появляется очаровательная Сейди-Садистик. — Послушай же, чужестранец, мой печальный рассказ! — говорит она. — Землетрясение разрушило наш великолепный цирк, неблагодарные Сыны Садизма отвернулись от меня и я несчастная, без гроша в кармане проделала долгий трудный путь. О, если бы у меня были три золотых! Верь мне, ведь именно я освободила тебя! Я отведу тебя к безумному профессору и получу награду! Тут с ближайшего дерева сыплется листва, и на, землю спрыгивает Роббин Гут. — Не слушай ты эту садистку! — восклицает он. — Помнишь, я ведь никогда не лгал тебе. Не лгу и сейчас! Я единственный, кому доподлинно известно, где находится безумный проф! Поднимается жуткий крик, каждому хочется получить твои золотые. Крик заглушает цокот копыт, рядом с тобой появляется элегантно одетый всадник. Он снимает шлем и говорит: — Я герцог Гроанн, и мне ни к чему твое золото, а они все преступники и лжецы. Садись же позади меня в седло, и я отвезу тебя к безумному профу из одного лишь желания избавить нашу планету от его дьявольских козней. Поднимается невообразимый гвалт, ты же размышляешь. Герцог выглядит вполне респектабельным, и вряд ли ему нужно твое золото. Если вспрыгнешь на его лошадь, то галопом помчишься на [А]
      Арбутнот не раз спасал тебе жизнь, ты единственный, кто не отверг его. Не отвергай же и сейчас, а не то он расплачется. Иди с ним на [Б]
      Но и Роббин Гут не обманул тебя. Если примешь его предложение, то отправляйся на [В]
      Сейди-Садистик тоже вела с тобой честную игру. К тому же в разорванной одежде она выглядит весьма сексуально. Может, возьмешь ее за руку и пойдешь на [Г]
      Последний кандидат на награду — Волосатый Гарри. Он, конечно, людоед, но не лжец. Если позволишь ему проводить себя к безумному профу, то ты — на [Д].
    mood: danger
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "330"
          letter: А
        - label: Вариант Б
          to: "149"
          letter: Б
        - label: Вариант В
          to: "59"
          letter: В
        - label: Вариант Г
          to: "159"
          letter: Г
        - label: Вариант Д
          to: "21"
          letter: Д
  "157":
    title: Глава 157
    text: Меч против дубины — у тебя неплохие шансы на победу. Но тут же выясняется, что ты недооценил противника — ловким ударом дубины он выбивает меч из твоей руки. Побежишь ли ты от него на [А] ? Или, может, позовешь с [Б] на помощь роботов?
    mood: danger
