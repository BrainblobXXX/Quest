start: prologue
scenes:
  "1":
    title: Глава 1
    text: Если ты сказал, что сестренка чудища отравилась серной кислотой, то отправляйся сразу на [А]. Если ты сказал что-нибудь другое, то на [Б].
    mood: tense
    image: illustrations/monster_crossroad.webp
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "229"
          letter: А
        - label: Вариант Б
          to: "347"
          letter: Б
  "2":
    title: Глава 2
    text: "Знаю, что ты чертовски устал. Так отдохни немного. Это — приказ! Теперь чувствуешь себя лучше? Тогда ступай по тропинке, что взбирается на холм. Похоже, она ведет к Зловонному замку. Ведь именно туда тебе и надо. Но, прошу, будь на этот раз поосторожней, помни: в волшебном ремне осталось всего два заряда. Тише! Шум веток за холмом. Если побежишь по тропке назад и скроешься в кустах, то ты — на [А]. Если останешься на месте и выяснишь, что произойдет дальше, то на [Б]."
    mood: danger
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "4"
          letter: А
        - label: Вариант Б
          to: "138"
          letter: Б
  "3":
    title: Глава 3
    text: Берег совсем близок. И ты вполне благополучно выбираешься из воды. Возможно, мои опасения были беспочвенны. Ну, посмейся, может, я это заслужил… Но что за треск в кустах? Узнаешь.
    mood: tense
    interaction:
      type: continue
      to: "218"
  "4":
    title: Глава 4
    text: Возможно, слух меня подвел, но мне послышался стон из тех кустов слева. Слышишь, опять кто-то подает голос? Согласен, двигаясь на звуки, ты можешь угодить в хитроумную ловушку. Но не исключено, что в эту минуту кто-то отчаянно нуждается в твоей помощи. Взглянешь, кто там стонет? И ты смеешь именовать себя полевым агентом Спецкорпуса? Приказываю, медленно и осторожно отправляйся и выясни, кто там стонет!
    mood: danger
    interaction:
      type: continue
      to: "134"
  "5":
    title: Глава 5
    text: "Ты попал! Но если Роббин Гут тоже, то ты проиграл. Ты смотришь на его мишень. Ура! Он промахнулся! Счет равный: два-два. Соберись и стреляй!"
    mood: tense
    interaction:
      type: roll
      formula: 1d6
      outcomes:
        - min: 4
          max: 6
          to: "342"
        - min: 1
          max: 3
          to: "343"
  "6":
    title: Глава 6
    text: "— Стой! — хрипло орет стражник. — Кто идет? — Я, — без затей отвечаешь ты. — Пароль! — приказывает стражник. Ты неохотно подходишь ближе и бормочешь: — Пароль — антидисестаблишментарианизм. Подняв над головой дубину, стражник несется на тебя с криком: — Пароль вчерашний! Шпион! Как поступишь? Увернешься от удара дубины? Тогда ты — на [А]. Или, может, выхватишь меч? В этом случае ты — на [Б]."
    mood: danger
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "232"
          letter: А
        - label: Вариант Б
          to: "76"
          letter: Б
  "7":
    title: Глава 7
    text: Жизнь так редко дарит нам второй шанс. Вернись и хорошенько подумай.
    mood: calm
    interaction:
      type: continue
      to: "94"
  "8":
    title: Глава 8
    text: "Бредя по следам в пустыне, ты незаметно для себя оказываешься среди руин города столь древнего, что он был разрушен, еще когда наши с тобой предки вычесывали из меха блох и прыгали с ветки на ветку в джунглях на легендарной планете Грязь. Подумай о бренности всего сущего во Вселенной, но не погружайся в философские мысли слишком глубоко, помни, что ты на службе. Смотри! Следы обрываются у норы в песке! Что же случилось с профом? Ты подходишь ближе и читаешь надпись на камне рядом с норой: ОСТОРОЖНО! ЗЫБУЧИЕ ПЕСКИ! МНОГИЕ, ПРОВАЛИВШИСЬ, ПОПАДАЛИ В ПЕЩЕРЫ, ОТКУДА НЕТ ВОЗВРАТА. ПОМНИ, ТЫ МОЖЕШЬ СТАТЬ СЛЕДУЮЩИМ! Что за странный шорох? Осторожно, ведь ты можешь стать следующим! Ты опускаешь глаза, но поздно! Песок под тобой проседает, и ты падаешь."
    mood: mystery
    interaction:
      type: continue
      to: "253"
  "9":
    title: Глава 9
    text: Опять попал! Победа! И не просто победа, а победа всухую! Со счастливой улыбкой ты переносишься.
    mood: victory
    interaction:
      type: continue
      to: "311"
  "10":
    title: Глава 10
    text: Проф нажимает на спусковой крючок, и ты получаешь в лицо облако газа. У тебя кружится голова, и ты без чувств падаешь.
    mood: danger
    interaction:
      type: continue
      to: "82"
  "11":
    title: Глава 11
    text: У тебя есть еще три золотые монеты! Ура! Ты трясущейся от нетерпения рукой достаешь их из левого сапога. Как ты их используешь? Конечно, купишь интересующую информацию! Повесь на указателе у дороги объявление с предложением награды в три золотые монеты всякому, кто на рассвете придет к виселицам у города и сообщит тебе местонахождение безумного профессора Гейстескранка. Сделано! А теперь хочешь совет мудрой Стальной Крысы? Вокруг полно бандитов. Закопай монеты и, пока не найдешь профа, не говори никому, где они. Как тебе моя идея? Вот и отлично! Так где ты закопаешь золото? Ты не хочешь говорить даже МНЕ?!! Но я ведь все равно увижу это твоими глазами.
    mood: calm
    interaction:
      type: continue
      to: "140"
  "12":
    title: Глава 12
    text: К счастью, тебя услышали. Кто-то ломится сквозь лес, направляясь к тебе. Вытаскивает тебя за шиворот из болота. Ты спасен! Но рад ли ты этому? Узнаешь дикий смех? Я-то ее сразу узнал. Твой спаситель — Бетси На-Все-Руки-Мастерица, и ты снова ее раб. Ты вырываешься и кричишь, но она, сковав твои руки и ноги, тащит тебя через лес. На твое счастье, из кустов выскакивает Арбутнот Отверженный. Теперь-то ты знаешь, на чьей стороне выступить, так что скорее двигай.
    mood: tense
    interaction:
      type: continue
      to: "65"
  "13":
    title: Глава 13
    text: Ты достаешь стрелу, натягиваешь тетиву, внимательно целишься и… Монстр бросается на тебя! Ты стреляешь и переносишься.
    mood: danger
    interaction:
      type: continue
      to: "88"
  "14":
    title: Глава 14
    text: "А ты, оказывается, стреляный волк! Действительно, неизвестно, кто на этой планете-тюрьме заслуживает доверия, а кто нет. Так что иди своей дорогой и… Что это?.. Слышишь?.. Шелест листьев. Кто-то обходит тебя справа. О, да это та самая грациозная девушка. Ну что, побеседуешь с ней? Согласен: девушка симпатичная. И раз не поленилась догнать тебя, то ты ей, без сомнения, понравился. Отправляйся."
    mood: tense
    interaction:
      type: continue
      to: "99"
  "15":
    title: Глава 15
    text: Фрукты растут высоко, с земли их не достать. Ты взбираешься на дерево. Оранжевые фрукты и размерами, и формой напоминают грейпфруты, различие лишь в цвете. Ты хватаешься за ближайший, тянешь, вначале слабо, потом что есть сил, но длинный прочный стебель, которым фрукт прикреплен к ветке, не поддается. Выхватив меч, ты рассекаешь стебель. Отлично, но плод падает на землю и, разбрызгивая сладкий сок, с хлопком лопается. Собирай урожай аккуратней! Ты обхватываешь шершавый ствол дерева ногами, левой рукой берешься за фрукт, зажатым в правой руке мечом перерубаешь стебель. Вернув меч в ножны, с фруктом в руке сползаешь по стволу на землю. Снова забираешься на дерево и повторяешь операцию. И так вновь и вновь. Часа через три изнурительной работы на земле набирается оранжевая горка. Ты связываешь длинные стебли узлом и, перекинув фрукты через плечо, шагаешь по тропинке.
    mood: calm
    interaction:
      type: continue
      to: "113"
  "16":
    title: Глава 16
    text: Ты торчишь у таверны уже битый час, а из нее так никто и не вышел. Тебя мучит жажда, слух раздражают звон пивных кружек и веселое пение. Не мучайся, отправляйся в таверну.
    mood: calm
    interaction:
      type: continue
      to: "139"
  "17":
    title: Глава 17
    text: Ты ползешь по тоннелям уже не первый час. Хорошо, что ты не подвержен приступам клаустрофобии… Не ругайся и извини, что напомнил о твоих болезнях. Представь, что ты на поверхности, а вокруг — тесная облачная ночь. Как нельзя кстати впереди забрезжил свет. Ты бежишь к нему.
    mood: calm
    interaction:
      type: continue
      to: "115"
  "18":
    title: Глава 18
    text: Сознаюсь, попав в подобную переделку, я бы тоже вспотел. А может, поднапряжешься и попытаешься отбиться от четырех громил, которые волокут тебя на кухню? О, новобранец, я краснею. Где ты только нахватался таких слов? Ты уже на кухне. Тебя подтаскивают к огромному закопченному котлу, подвешенному над открытым очагом. Похоже, прежде чем кинуть тебя в кипящее масло, стражники собрались поживиться твоей одежонкой. Тебя швыряют на пол, и два громилы стягивают с тебя ботинки. Так я и думал, что ты наконец вспомнишь! Конечно, воспользуйся ремнем-невидимкой! Жми быстрей кнопку на пряжке.
    mood: calm
    entry:
      - modify:
          stat: belt_charges
          delta: -1
    interaction:
      type: continue
      to: "87"
  "19":
    title: Глава 19
    text: Ты бредешь по широкому светлому тоннелю, и неприятности тебе вроде бы здесь не грозят. Согласен, вырезанные на стенах мерзкие монстры, пожираемые еще более мерзкими монстрами, портят настроение. Но вот тоннель расширяется, упираясь в каменную лестницу. Она ведет как вверх, так и вниз. На стене нарисованы две стрелки. Над той, которая указывает вниз, надпись «ТАМ ЛЕЖБИЩЕ ЗВЕЗДНОГО ЧУДОВИЩА», а над той, которая направлена вверх, «БЕЗОПАСНЫЙ ПУТЬ НАРУЖУ». Правдивы ли надписи? Не знаю. Решай, отправишься ли вверх на [А]. Или пойдешь вниз на [Б].
    mood: mystery
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "124"
          letter: А
        - label: Вариант Б
          to: "49"
          letter: Б
  "20":
    title: Глава 20
    text: Заморил червячка? Вот и отлично. Отправляйся на перекресток дорог, а там уж решишь, в какую сторону шагать дальше.
    mood: calm
    interaction:
      type: continue
      to: "339"
  "21":
    title: Глава 21
    text: Ты получаешь именно то, что заслужил, доверившись Волосатому Гарри. Едва вас скрывают деревья, Гарри швыряет тебя на землю и, навалившись всем телом, вонзает в твое горло острые зубы. Надеясь, что жадность возьмет верх над его голодом, ты шепчешь, где зарыл золотые, и он с довольным урчанием убегает. Ты встаешь, понурив голову и размышляя о будущем. У тебя не осталось ни золота, ни оружия. Один, на Богом проклятой планете… Слушай, сынок, что тебе скажет Стальная Крыса. Когда ты был под гипнозом… Ты не помнишь, что был под гипнозом? Неудивительно, ведь Корпус свято хранит свои секреты! Так вот, когда ты был под гипнозом, Спецы Корпуса вживили в сустав твоего указательного пальца на правой руке машину времени. Щелкни пальцами, и перенесешься во времени.
    mood: calm
    entry:
      - drop:
          item: gold_coin
          count: 1
      - drop:
          item: silver_coin
          count: 1
      - drop:
          item: dosp_coin
          count: 1
      - drop:
          item: sword
          count: 1
      - drop:
          item: knife
          count: 1
      - drop:
          item: bow
          count: 1
      - drop:
          item: arrow
          count: 1
      - drop:
          item: staff
          count: 1
      - drop:
          item: smoke_grenade
          count: 1
      - drop:
          item: sleep_grenade
          count: 1
    interaction:
      type: continue
      to: "80"
  "22":
    title: Глава 22
    text: Твой план принят. Что там принят — подхвачен с восторгом! Все рабы, потерявшие когда-то друзей из-за неумеренного аппетита Волосатого Гарри, горят желанием посчитаться с ним, а заодно и сделаться владельцами Зловонного замка, у тебе же появляется реальный шанс схватить безумного профа. Твой план прост и вполне выполним. Слюя приковывают к общей цепи, он в гневе ревет, но от немилосердных ударов своей бывшей собственности быстро теряет сознание и умолкает. Тебя приковывают к той же цепи, и процессия, возглавляемая теперь Арбутнотом, направляется к Зловонному замку.
    mood: calm
    interaction:
      type: continue
      to: "34"
  "23":
    title: Глава 23
    text: "Откуда я знаю, что тебе нужно? — спрашивает Роббин Гут. Ты тихо бормочешь: «Да, откуда?» — Да каждому в джунглях известно, что Сейди-Садистик послала тебя в тайный храм за Рубином Джунглей. У тебя только один шанс найти его и остаться в живых. Иди по этой тропинке, в конце встретишь того, кто поможет тебе. Большего сказать не могу, опасаясь за собственную жизнь. Прощай! Стараясь не поворачиваться к властелину леса спиной, ты идешь к указанной им тропе и следуешь по ней."
    mood: victory
    interaction:
      type: continue
      to: "340"
  "24":
    title: Глава 24
    text: Над твоей головой — безоблачное голубое небо, под ногами — желтый в красных пятнах песок. Красные пятна — кровь?! Не спрашивай меня, я знаю не больше твоего и советую выкинуть красные пятна из головы. Прислушайся к реву толпы на трибунах. Интересно, почему она так возбуждена? Да, теперь и я вижу. Через небольшую дверцу на арену выходит огромный лев. Он зевает и осматривается. К несчастью, он видит тебя и с ревом приближается. Тебе кажется, что хищник улыбается. Или, может, он демонстрирует свои острые клыки? В твоей руке лишь птичье перо. Согласен, не самое надежное оружие, хотя… Внимание, лев готовится к прыжку. Если ты полагаешь, что, пощекотав льва, вызовешь у него смех и в благодарность он оставит тебя в покое, то отправляйся на [А]. Если, дождавшись прыжка хищника, отскочишь в сторону, то на [Б].
    mood: danger
    image: illustrations/arena_lion.webp
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "332"
          letter: А
        - label: Вариант Б
          to: "302"
          letter: Б
  "25":
    title: Глава 25
    text: |-
      С чего это старушка так шарахнулась от тебя? У тебя угрожающий вид? Или, быть может, ты давно не принимал ванну? Думается, она так испугана оттого, что вы оба — на планете-тюрьме, где царят жестокость и насилие, где все против всех. Что предпримешь? Вывернешь старушке руку и спросишь, цедя сквозь зубы, где найти профа Гейстескранка? Тогда ты окажешься на [А]
      Или предложишь серебряную монету за интересующую тебя информацию? Тогда ты — на [Б].
    mood: calm
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "167"
          letter: А
        - label: Вариант Б
          to: "90"
          letter: Б
          effects:
            - drop:
                item: silver_coin
  "26":
    title: Глава 26
    text: Согласен, золотая монета — многовато за переправу через реку. Но что поделаешь? Вот ты уже на середине реки. Ты переводишь взгляд с противоположного берега на лодочника и, заметив в его глазах алчный блеск, сразу понимаешь его намерения. Но сделать уже ничего не успеваешь. Удар веслом по голове… Боже, какая боль! Бултых! Ты за бортом.
    mood: danger
    image: illustrations/river.jpg
    entry:
      - drop:
          item: gold_coin
          count: 1
    interaction:
      type: continue
      to: "205"
  "27":
    title: Глава 27
    text: Ты промахнулся, а Роббин Гут попал. Не беда! Пока — ничья, один-один. Ты целишься, стреляешь, и стрела со свистом рассекает воздух.
    mood: tense
    interaction:
      type: roll
      formula: 1d6
      outcomes:
        - min: 4
          max: 6
          to: "289"
        - min: 1
          max: 3
          to: "163"
  "28":
    title: Глава 28
    text: Проиграв очередной бой, ты, связанный, лежишь на полу в подвале Зловонного замка. Но тише, сюда кто-то идет. Стражники. Они грубо поднимают тебя на ноги и волокут в зал.
    mood: calm
    interaction:
      type: continue
      to: "121"
  "29":
    title: Глава 29
    text: Понимаю, понимаю, тебе не очень приятно. Поверь, и искренне сочувствую тебе. Все мы совершаем ошибки. Возможно, тебя утешит то, что я бы на твоем месте поступил точно так же. В самом деле, в галактике найдется немного людей, наделенных природным иммунитетом к сонному газу. Если честно, то дылда-охранник, который тебя избил, первый такой человек, встреченный мною. Если, конечно, слово «человек» уместно по отношению к нему. Да не скули хотя бы секунду. Слышишь, дверь снова открывают? На этот раз воспользуйся дымовой гранатой.
    mood: calm
    entry:
      - consume:
          item: smoke_grenade
    interaction:
      type: continue
      to: "64"
  "30":
    title: Глава 30
    text: "Итак, хочешь ты того или нет, но в соответствии с заданием ты отправляешься на планету Скралдеспенд. На место тебя доставит недавно изобретенный и до сих пор толком не опробованный передатчик материи. Задача у тебя несложная: найдешь профессора Гейстескранка… Повторяю по слогам: Гей-стеск-ранка. Значит, найдешь профессора, пожмешь ему руку, одновременно надавишь на кнопку портативного передатчика материи (держи его в правом кармане), и вы оба перенесетесь сюда. ЕСТЬ ВОПРОСЫ? Нет-нет, в Корпусе вовсе не занимаются похищением. Назовем твое маленькое дельце превентивным арестом. Дело в том, что с виду он профессор как профессор — взлохмаченная седая шевелюра, высокий морщинистый лоб, глаза навыкате — но, к сожалению, в голове у него не хватает как минимум половины винтиков. Старый безумец изобрел оружие такой разрушительной силы, что при одной лишь мысли о нем меня бросает в дрожь. Тебе тоже лучше задрожать… ДРОЖИ! ЭТО ПРИКАЗ. Так-то лучше. Знай, что если ты не справишься с заданием, то, весьма вероятно, погибнет Вселенная. Не подкачай, ладно? Я врубаю передатчик материи, а ты немедленно переносишься."
    mood: danger
    entry:
      - grant:
          item: matter_transmitter
          count: 1
        once: true
    interaction:
      type: continue
      to: "42"
  "31":
    title: Глава 31
    text: "Если ты ответил, что слон тут же вскарабкается на ближайшую пальму, то получаешь еще двадцать пять очков. Дракон ревет: — Вопрос был очень простым! Теперь загадка посложней. Если ответишь на нее, то сразу получишь сто очков. Что такое клиренс? Если ты считаешь, что клиренс — многоцелевая деталь в двигателе межзвездного корабля, то отправляйся на [А]. Если одна из характеристик автомобиля, то на [Б]. Если устройство для спуска воды, то на [В]."
    mood: mystery
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "346"
          letter: А
        - label: Вариант Б
          to: "292"
          letter: Б
        - label: Вариант В
          to: "344"
          letter: В
  "32":
    title: Глава 32
    text: Сержант заявляет о своих подозрениях, но Арбутнот, не растерявшись, с ходу предлагает ему крупную взятку, и они уединяются в будке стражи. Ты стоишь рядом и потому слышишь из будки глухой удар. Запомни на будущее, как Арбутнот вручал начальнику стражи взятку и, применяя на практике его прогрессивный метод, сэкономишь кучу денег. Незначительное препятствие на пути устранено, быстрее в замок.
    mood: danger
    interaction:
      type: continue
      to: "118"
  "33":
    title: Глава 33
    text: Говори громче, а то твои губы то и дело скрываются в болотной жиже, и я слышу только бульканье. Все еще тонешь? Так отбрось посох, от него уже нет никакого толку. И кричи громче, призывая на помощь.
    mood: calm
    interaction:
      type: continue
      to: "12"
  "34":
    title: Глава 34
    text: Впереди показывается замок. Рабы стирают с лиц счастливые улыбки и приближаются к воротам. Неожиданно Слюй приходит в себя и начинает во всю глотку вопить, предостерегая стражу, но дубинка в руке Арбутнота описывает короткую дугу, и голос бывшего работорговца умолкает. Садисты-стражники на высоких стенах громко гогочут, и ты выдавливаешь из себя подобие улыбки. Начальник стражи — крутой парень (настолько крутой, что свои сержантские лычки он пришил не к одежде, а прямо к собственным плечам), — чувствуя в поведении рабов подвох, приближается к колонне. Быстрее подкинь ДОСП, или, как ты его называешь, монету. Если выпадет орел, то начальник стражи громка заявит о своих подозрениях. Если ДОСП покажет решку, то начальник стражи откроет перед вами массивные, окованные железом ворота.
    mood: tense
    image: illustrations/castle.jpg
    interaction:
      type: roll
      formula: 1d2
      outcomes:
        - min: 2
          max: 2
          to: "118"
        - min: 1
          max: 1
          to: "32"
  "35":
    title: Глава 35
    text: Проф опять перехитрил тебя. Оказывается, он затаился за дверью, и как только ты выскочил в коридор, огрел тебя чем-то тяжелым по голове. Через некоторое время ты приходишь в себя, нехотя встаешь, мотаешь головой и обнаруживаешь, что тебя занесло.
    mood: calm
    interaction:
      type: continue
      to: "197"
  "36":
    title: Глава 36
    text: Ты, никак, рехнулся?! Пулей лети!
    mood: calm
    interaction:
      type: continue
      to: "120"
  "37":
    title: Глава 37
    text: Ты следуешь за профом из тронного зала, но судьба вновь немилостива к тебе. — Нет! — кричит Волосатый Гарри и плотоядно облизывается. — Сначала желудок, а уж потом наука! На кухню его! Ничего не поделаешь, отправляйся.
    mood: tense
    interaction:
      type: continue
      to: "18"
  "38":
    title: Глава 38
    text: Благородный Сир, — говорит тебе юноша. — Приятно, что хоть кому-то небезразлична моя судьба, но, к сожалению, помочь мне никто уже не в силах. Я был рабом кошмарно жестокого Слюя Работорговца. Когда я, обессилев, уже не поспевал за остальными рабами, он жестоко избил меня, затем хладнокровно сломал мне ногу и оставил умирать. Но уж лучше смерть здесь, под кустом, чем в Зловонном замке, куда вел нас бессердечный Слюй. История несчастного до глубины души трогает тебя. Ты достаешь из кармана походную аптечку и прижимаешь ее к поврежденной ноге юноши. Автоматическое устройство тут же ставит диагноз «закрытый перелом голени и многочисленные ушибы и ссадины», вонзает в мышцы парнишки иголки, впрыскивает антибиотики и обезболивающее. Два высунувшихся из аптечки манипулятора выворачивают ногу так, что кость занимает предписанное ей природой положение, третий накладывает на ногу мгновенно твердеющий на воздухе материал. Через минуту нога срастается, манипуляторы снимают уже ненужный гипс. Парнишка удивленно смотрит на ногу, затем шевелит ею и встает. Из его голубых глаз потоком хлещут слезы радости, и он снова и снова целует твою руку. — Ты мой храбрый спаситель! (Чмок-чмок.) Если бы ты вызволил из рабства и моих товарищей, то слава твоя не померкла бы в веках! (Чмок-чмок.) Его лесть вскружила тебе голову. Ты встаешь и, стирали носовым платком его слюну с руки, шагаешь сквозь заросли к тропинке, а затем по ней.
    mood: danger
    interaction:
      type: continue
      to: "216"
  "39":
    title: Глава 39
    text: Ты бежишь, обливаясь потом, коридору не видно конца, повсюду обглоданные до зеркального блеска кости. Похоже, Волосатый Гарри был настоящим обжорой. Слышал? Да-да! Впереди хлопнула дверь! Жми же! Вот и дверь. Не выясняя, заперто ли, ты вышибаешь ее мощным ударом дубины и бежишь дальше. Перед тобой метрах в десяти — безумный профессор. Прибавь скорости! Проф шмыгает в дверь направо. Ты сворачиваешь за ним, влетаешь по крутой лестнице на чердак и видишь его выползающим через крошечное, размером со вход в крысиную нору, слуховое окошко. Ты стремглав кидаешься к окошку. Поздно! Проф уже на крыше замка. Но, если пролезть через окошко удалось пожилому профессору, удастся и тебе! Ползи за ним.
    mood: danger
    interaction:
      type: continue
      to: "255"
  "40":
    title: Глава 40
    text: Ты промахнулся, не попав даже в дерево. Ты переводишь взгляд на мишень соперника. Он попал в самую середину и снова целится. Ты тоже натягиваешь тетиву, прицеливаешься, вы одновременно стреляете.
    mood: tense
    interaction:
      type: roll
      formula: 1d6
      outcomes:
        - min: 4
          max: 6
          to: "284"
        - min: 1
          max: 3
          to: "254"
  "41":
    title: Глава 41
    text: В ответ на твою просьбу Сейди кивает. — Ты прав, чужак. В Эндсвилле живут такие отпетые негодяи, что мои Сыны и Дочери садизма в сравнении с ними сущие ангелы. Сейди отдает приказ, и крутобедрая широкоплечая дочь садизма вмиг приносит и раскрывает перед тобой большой кованый сундук. В сундуке — оружие. — Выбирай, чужак, что тебе больше по сердцу, — говорит Сейди. Если возьмешь лук и колчан со стрелами, то ты — на [А]. Если «утреннюю звезду», то на [Б]. Если же «дымовые гранаты», то на [В].
    mood: calm
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "315"
          letter: А
          effects:
            - grant:
                item: bow
                count: 1
            - grant:
                item: arrow
                count: 1
        - label: Вариант Б
          to: "54"
          letter: Б
          effects:
            - grant:
                item: morning_star
                count: 1
        - label: Вариант В
          to: "50"
          letter: В
          effects:
            - grant:
                item: smoke_grenade
                count: 1
  "42":
    title: Глава 42
    text: "Вот мы и на солнечной Скралдеспенде. Что значит: «здесь жуткий ветер и снег пополам с дождем»? Заруби на носу, нытиков мы в Корпусе не держим! У тебя ответственное задание по спасению Вселенной — я это проделывал неоднократно. Теперь — некоторая информация, которую я по рассеянности не сообщил тебе прежде. Скралдеспенд — планета-тюрьма, на нее отправляют преступников более тысячи миров… Нет-нет, не жми на кнопку в кармане! Пока ты второй рукой не держишь за руку профессора Гейстескранка, передатчик материи не работает. Нет, пистолет тебе не положен. Из него можно убить кого-нибудь, а скорее всего, пристрелить себя самого. В твоем распоряжении экипировка, которой обычно на заданиях пользуюсь я: дымовые гранаты и «лимонки» с сонным газом, обезвоженный питьевой спирт, перочинный нож, фильтры в нос, чтобы тебя не свалил сонный газ из твоих собственных гранат, пять серебряных и пять золотых монет, миниатюрная аптечка, а если вдруг заскучаешь, (что, конечно, маловероятно) — две книжки комиксов. Итак, удачи тебе и до встречи. Бог даст, увидимся. Да, чуть не забыл. Из доклада нашего нештатного агента на Скралдеспенде следует, что безумного профа последний раз видели в городишке с названием Гроаннсвилль. Двигай туда."
    mood: tense
    image: illustrations/arrival.webp
    interaction:
      type: continue
      to: "62"
  "43":
    title: Глава 43
    text: Ты совершил ошибку. Склон слишком скользкий и крутой, на берег по нему не выкарабкаться. Выбора нет, плыви к дальнему, но пологому и песчаному берегу.
    mood: calm
    interaction:
      type: continue
      to: "63"
  "44":
    title: Глава 44
    text: Роббин Гут с удовольствием наблюдает, как ты, швырнув на землю лук, с остервенением топчешь его. Возможно, активный выход эмоций поможет тебе справиться с моральной травмой. Минут через пять властелину здешнего леса надоедает этот спектакль. — За мной должок, — с улыбкой напоминает он. — Я обещал оказать тебе услугу в качестве утешения за проигрыш и сдержу свое слово. Я даже знаю, что ты ищешь. Откуда он знает, что тебе нужно? Этот вопрос разъяснится.
    mood: calm
    interaction:
      type: continue
      to: "23"
  "45":
    title: Глава 45
    text: Одумайся, новобранец! Разве полевой агент Спецкорпуса лишит жизни безоружного старика? Почти рыдая, ты размышляешь, сколь чудовищную ошибку чуть было ни совершил, дружески похлопываешь стражника по плечу и отбываешь.
    mood: mystery
    interaction:
      type: continue
      to: "215"
  "46":
    title: Глава 46
    text: "А надзиратель-то оказался вполне приличным человеком. Он сообщил: чтобы попасть в Гроаннсвилль, нужно отправиться на [А], и сразу повесил трубку. Правда, не исключено, что он соврал. Если ты не поверил, то ступай на перекресток [Б], а там уж решишь, в какую сторону двигаться."
    mood: calm
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "193"
          letter: А
        - label: Вариант Б
          to: "339"
          letter: Б
  "47":
    title: Глава 47
    text: "Не без основания боясь поскользнуться, ты медленно спускаешься по мокрым ступеням. Вскоре лестница кончается, перед тобой — темный тоннель. Ну, ты знаешь, что делать. Ползи. Ты ползешь по тоннелю, к счастью, вскоре впереди появляется свет. Ты прибавляешь скорость и оказываешься в комнатенке с металлическими стенами. Кроме дыры, через которую ты сюда попал, других выходов вроде бы нет. Ты уже было решаешь возвращаться назад, но внезапно тоннель перед тобой с ужасным грохотом обваливается. Ты в ловушке! Но что это? Там, в темном углу комнатки? Ты направляешься в угол и видишь на стене ярко-красную ручку с искусно вырезанным человеческим черепом на конце. Над ручкой в металле вытравлена инструкция на тридцати четырех языках, по крайней мере половина из которых давным-давно забыта. Ты находишь понятную тебе надпись. Она проста: «Дерни за меня». Хорошенько поразмыслив и сообразив, что выбора все равно нет, ты протягиваешь к ручке дрожащие пальцы, хватаешься за нее, дергаешь, и… Пол под тобой расходится, и ты падаешь, падаешь, падаешь."
    mood: danger
    image: illustrations/cave.jpg
    interaction:
      type: continue
      to: "98"
  "48":
    title: Глава 48
    text: "Мрачно, сумрачно, вокруг темный, дремучий лес… Что-то мне это напоминает. А, вот что: Дремуч вокруг и темен лес, Но верен клятве буду век И прошагаю сотни миль Я, не сомкнув усталых век. Это четверостишие написано тысячелетия назад на легендарной планете Грязь. Или планету называли Землей? Неважно. Лучше вспомни, кто автор этих строк. Если, по-твоему, это Роберт У.Сервис, то отправляйся на [А]. Если Роберт Фрост, то на [Б]."
    mood: calm
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "61"
          letter: А
        - label: Вариант Б
          to: "67"
          letter: Б
  "49":
    title: Глава 49
    text: "По-моему, ты выбрал верный путь. Ведь если вспомнить, почти все указатели на этой чертовой планете обманывали тебя. Весело перепрыгивая через ступеньку, ты сбегаешь по лестнице. Перед тобой — распахнутая дверь. Загляни в нее. Ты видишь вроде бы безопасную ярко освещенную комнату, посередине стоит кресло на колесиках, следы от колесиков ведут в тоннель, конец которого освещен ярким солнечным светом, рядом с креслом на полу надпись. В переводе с эсперанто она гласит: СПАСИБО, ЧТО ЗАГЛЯНУЛИ К НАМ, НО, К СОЖАЛЕНИЮ, ЗВЕЗДНОЕ ЧУДОВИЩЕ ДАВНО МЕРТВО. ПОЖАЛУЙСТА, СЯДЬТЕ В КРЕСЛО, НАЖМИТЕ КНОПКУ НА ПОДЛОКОТНИКЕ — И ОКАЖЕТЕСЬ СНАРУЖИ. ПРИЯТНОГО ВАМ ПУТЕШЕСТВИЯ. Я, как и ты, не знаю, насколько были правдивы какалоки. Решай, сядешь ли в кресло и, нажав кнопку, отправишься на [А]. Или побредешь по тоннелю вдоль следов от колес на [Б]."
    mood: mystery
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "304"
          letter: А
        - label: Вариант Б
          to: "337"
          letter: Б
  "50":
    title: Глава 50
    text: "Ты, беззаботно насвистывая и помахивая сумкой с дымовыми гранатами, идешь по тропе, усеянной черепами. Сейди не соврала — часов через пять ты видишь на ближайшем холме прогнившие крыши, а у дороги указатель: «Эндсвилль. 467 жителей». Тут издалека доносится жуткий вопль, в указателе что-то щелкает и число жителей сокращается до 466. Ничего не скажешь, пренеприятный городишко этот Эндсвилль! Но выбора у тебя нет, шагай дальше! Ты направляешься к городку и вскоре слышишь за поворотом тяжелое дыхание и громкие проклятия. К тяжелому дыханию и проклятиям тебе не привыкать, и, достав из сумки гранату левой рукой, а правой крепче сжав рукоять меча, ты смело поворачиваешь."
    mood: calm
    interaction:
      type: continue
      to: "164"
  "51":
    title: Глава 51
    text: |-
      Ты победил! Стражник на коленях молит тебя о пощаде: — О, могущественный незнакомец! Ты победил! И теперь можешь разрубить меня на части и пошвырять их с моста в реку! Но смилуйся над пожилым человеком! Через полгода я выхожу на пенсию. Сохрани мне жизнь, и я поведаю, как тебе избежать верной гибели у дальнего конца моста. Если пожалеешь старика, то ты — на [А]
      Если будешь до конца непреклонен, устраняя опасность с тыла, разрубишь его на части, ты — на [Б].
    mood: danger
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "215"
          letter: А
        - label: Вариант Б
          to: "45"
          letter: Б
  "52":
    title: Глава 52
    text: "Ты поешь, вкладывая в песню всю душу. Неудивительно, ведь от успеха выступления зависит твоя жизнь! Песня кончается, и ты тяжело переводишь дыхание. Кабан, роя землю копытами, смеется: — Ха-ха-ха! Хо-хо-хо! Хрю-хрю-хрю! До чего же слаб и пуглив человек! Не бойся, я помог бы тебе, какую бы ты песню ни исполнил. Твое приключение на планете-о тюрьме подошло к логическому концу. Отправляйся с триумфом!"
    mood: victory
    interaction:
      type: continue
      to: "307"
  "53":
    title: Глава 53
    text: |-
      Что с того, что деревенька перед тобой напоминает городскую свалку? Ведь на табличке, прибитой к придорожному столбу, ясно написано «Хестелорт». Нет, не разворачивайся и не убегай! Ты же явился сюда не квартиру снимать, а разузнать о профессоре Гейстескранке. Вон и таверна. Как там она называется? А… «Вздернутый легавый». Нет-нет, это вовсе не дурное предзнаменование. Ведь ты же не рассчитываешь, что жители этой планеты любят блюстителей закона? Если зайдешь в таверну и за кружечкой холодного пивка расспросишь местных о профе, то ты окажешься на [А]
      Или, может, опасаешься, что в таверне столкнешься с дурно воспитанными посетителями? Тогда подожди на [Б], а как только из «Вздернутого» кто-нибудь выйдет, подойди к нему и узнай, где проф.
    mood: danger
    image: illustrations/street_tavern.webp
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "139"
          letter: А
        - label: Вариант Б
          to: "16"
          letter: Б
  "54":
    title: Глава 54
    text: Ты, беззаботно насвистывая и вращая над головой «утреннюю звезду», идешь по тропе, усеянной черепами. Сейди не соврала — часов через пять ты увидишь на ближайшем холме прогнившие крыши, а у дороги указатель «Эндсвилль. 467 жителей». Тут издалека доносится жуткий вопль, в указателе что-то щелкает, и число жителей сокращается до 466. Ничего не скажешь, пренеприятный городишко этот Эндсвилль! Но выбора у тебя нет, шаг ай дальше! Ты направляешься к городку и вскоре слышишь за поворотом тяжелое дыхание и громкие проклятия. К тяжелому дыханию и проклятиям тебе не привыкать, и ты, лишь крепче сжав ручку «утренней звезды», смело поворачиваешь.
    mood: calm
    interaction:
      type: continue
      to: "71"
  "55":
    title: Глава 55
    text: Перед тобой крутой подъем. Но ты не слабак, взберешься! Вот ты и на вершине холма. Отдохни минут пять. Теперь спустись с холма и вновь углубись в джунгли. Тропа сворачивает налево, вливается в другую.
    mood: calm
    interaction:
      type: continue
      to: "206"
  "56":
    title: Глава 56
    text: Удивляюсь, новобранец, как с такой дырявой головой можно попасть в Специальный Корпус! Ну, пошевели, пошевели мозгами! Вспомни, Сейди-Садистик наградила тебя десятью золотыми монетами, семь из них ты сунул в карман, остальные спрятал. Куда? Вспомнил наконец? Конечно, в левый сапог! Теперь отправляйся.
    mood: calm
    interaction:
      type: continue
      to: "11"
  "57":
    title: Глава 57
    text: Впереди слышна частая дробь шагов! Ты выбрал верное направление! Быстрей же! А вот и безумный проф. Стоит в дверном проеме, за ним — голубое небо. Он в ловушке! Забавно, но его вдруг не стало. Будто корова языком слизнула. Ты опасливо выглядываешь из дверного проема и видишь, как проф, уцепившись за веревку, карабкается вверх и скрывается на крыше замка. Рядом с тобой болтается веревка. Что предпримешь? Полезешь, презрев опасность, за старым безумцем на крышу? О, да ты храбрец! Преодолев головокружение.
    mood: danger
    interaction:
      type: continue
      to: "255"
  "58":
    title: Глава 58
    text: На трибунах беснуется толпа, вопит, орет и швыряет на арену пустые бутылки из-под пива. Ты не обращаешь на дурно воспитанных зрителей внимания, твой взгляд прикован к противнику — безобразному, давно небритому верзиле, чье мускулистое тело покрыто шрамами от сотен битв. В левой руке верзилы щит, в правой, которую он занес над головой, короткий меч. Верзила, испустив боевой клич, бросается на тебя. Не стой же столбом, защищайся, дерись за свою жизнь! Продемонстрируй, на что способен полевой агент Спецкорпуса! Если попытаешься накинуть сеть на меч, которым размахивает верзила, то ты на [А]. Если швырнешь сеть ему под ноги и рванешь что есть сил, то на [Б].
    mood: danger
    image: illustrations/arena.jpg
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "283"
          letter: А
        - label: Вариант Б
          to: "160"
          letter: Б
  "59":
    title: Глава 59
    text: В твоих жилах, не иначе, течет королевская кровь! — говорит Роббин Гут, ведя тебя от завистливо глядящих вслед преступников. — Все они — отъявленные лгуны, мне же ты можешь верить. Во всяком случае, при нормальных обстоятельствах. К сожалению, в делах, касающихся золота, я, как и все, блюду свою выгоду. Он пребольно бьет тебя кулаком в висок. Очнувшись на земле, ты видишь нацеленную тебе в переносицу стрелу. Объяснения излишни. Тяжело вздохнув, ты говоришь Роббину Гуту, где зарыл золотые. Он, улыбаясь, убегает прочь. Ты встаешь, понурив голову и размышляя о будущем. У тебя не осталось ни золота, ни оружия. Один, на Богом проклятой планете… Слушай, сынок, что тебе скажет Стальная Крыса. Когда ты был под гипнозом… Ты не помнишь, что был под гипнозом? Неудивительно, ведь Корпус свято хранит свои секреты! Так вот, когда ты был под гипнозом, спецы Корпуса вживили в сустав твоего указательного пальца на правой руке машину времени. Щелкни пальцами, и перенесешься во времени..
    mood: tense
    entry:
      - drop:
          item: gold_coin
