  "163":
    title: Глава 163
    text: "Промахнулся. А Роббин Гут? Он попал. Н-да, и счет: один-два не в твою пользу. Но расслабься! Спокойно целься и стреляй."
    mood: tense
    interaction:
      type: roll
      formula: 1d6
      outcomes:
        - min: 4
          max: 6
          to: "342"
        - min: 1
          max: 3
          to: "5"
  "164":
    title: Глава 164
    text: "Навстречу тебе попадается безобразный детина — все тело в шрамах, на кулаках медные кастеты. Детина оценивающе оглядывает тебя и презрительно хмыкает. Ты же, разглядев обвившего шею детины огромного питона, подавленно молчишь. Удав высовывает раздвоенный язык и тоже хмыкает. — А ну-ка гони все, что у тебя есть. А иначе мой Папси переломает все косточки в твоем жалком тельце! — орет детина. Была бы у тебя «утренняя звезда», ты бы вмиг разделался с дерзким грубияном и его змеей. А был бы лук, ты бы их пристрелил на месте. Но у тебя лишь меч и дымовые гранаты. Ты грозно вопишь и швыряешь гранату. Детина, выругавшись, отступает на несколько шагов, опускает удава на землю и приказывает: — Займись им, Папси! Ты швыряешь еще гранату-другую — детину и удава скрывает от тебя облако дыма, но, оказывается, змеи неважно видят, зато великолепно улавливают запахи. Перед тобой из дыма появляется Папси, ты поворачиваешься, но сбежать не успеваешь. В мгновение ока удав обвивает тебя и, коснувшись раздвоенным влажным языком твоего уха, сжимает смертельные объятия. Ты падаешь и лежишь на земле оглушенный и беспомощный. Неужели это конец?! Узнаешь."
    mood: danger
    entry:
      - consume:
          item: smoke_grenade
    interaction:
      type: continue
      to: "329"
  "165":
    title: Глава 165
    text: Едва ты притрагиваешься острием меча к рубину, как слышишь тихое «дзинь» — срабатывает скрытый механизм, и в пол, где ты только что стоял, пытаясь взять рубин голыми руками, вонзается копье. Сунув рубин в карман, ты поспешно покидаешь негостеприимную комнату, проходишь по коридору до места, где из дыры в стене бьет солнечный свет. Ударом ноги ты расширяешь дыру. Путь наружу открыт! Но ты достаточно долго пробыл на этой планете, чтобы вот так запросто соваться с ходу в незнакомое место. Правильно, прежде чем выберешься из башни, выгляни наружу. Ты пытаешься рассмотреть ландшафт за стеной, но видишь джунгли и тропу. Реальной опасности вроде бы нет. Ты выбираешься из пролома в стене и смело идешь по тропе. Тропа широкая и прямая, как стрела; шагая по ней, ты размышляешь. Отдать Рубин Джунглей Сейди-Садистик, узнать у нее, где скрывается безумный проф, затем схватить его — и все, задание выполнено! Очень надеюсь, что все так гладко у тебя и получится. Сказать по правде, мне эта мрачная планета осточертела не меньше. Согласен, согласен, все удары и затрещины доставались твоей, а не моей голове, поэтому мне эта планета осточертела немного меньше, чем тебе. Но все же… Услышав громкий треск веток впереди, ты останавливаешься, как вкопанный. Звуки быстро приближаются. Как поступить? Если встретишь опасность лицом к лицу, то ты — на [А]. Если, устав от бесконечных потасовок, спрячешься в джунглях, то на [Б].
    mood: victory
    entry:
      - grant:
          item: ruby
          count: 1
        once: true
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "325"
          letter: А
        - label: Вариант Б
          to: "308"
          letter: Б
  "166":
    title: Глава 166
    text: Промахнулся. А Роббин Гут? Он попал. Но не страшно, счет — два один в твою пользу. Спокойно целься и стреляй.
    mood: tense
    interaction:
      type: roll
      formula: 1d6
      outcomes:
        - min: 4
          max: 6
          to: "343"
        - min: 1
          max: 3
          to: "133"
  "167":
    title: Глава 167
    text: Постепенно вживаешься в роль? Становишься садистом? Да, понимаю, ты не был таким, пока тебя не занесло на эту планету. Но по крайней мере желаемых результатов ты добился. Действуй, как тебе и было сказано. Выходи из города по южной дороге, добравшись до перекрестка, сворачивай туда, куда показывает указатель с надписью «Хестелорт», и там, если тебе не наврали в очередной раз, околачивается безумный проф. А вот и перекресток. Но на столбе два указателя, на том, что показывает налево, коряво выведено «Свинлорт», а на смотрящем направо — «Хестелорт». Но веришь ли ты указателям? Если веришь и свернешь направо, то попадешь на [А]. Если нет, то на [Б].
    mood: mystery
    image: illustrations/city.jpg
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "92"
          letter: А
        - label: Вариант Б
          to: "53"
          letter: Б
  "168":
    title: Глава 168
    text: Все пятеро обманули тебя? Ты вновь стоишь среди них. К счастью, им неизвестно, что, совершив пять прыжков по оси времени, ты выяснил, чего стоит каждый из них. Извинись, скажи, что сейчас принесешь золото и отправляйся в лес. Ты — в лесу. Теперь беги во весь дух! Позади — возмущенные крики, треск сучьев. Но ты перехитрил хитрецов и убежал! Скрывайся в лесу до сумерек, затем вернись и откопай золотые. Убедившись, что погони отстала, ты засыпаешь под деревом, а проснувшись, видишь, что солнце уже склонилось к горизонту. Опасливо озираясь, ты бредешь через лес к виселицам. Все твои недруги ушли! Откопав золотые, ты вновь идешь в лес. Но что это?! Позади — громкий треск сучьев! Тебя кто-то преследует! Он все ближе и ближе! Тебе не убежать! Ты оборачиваешься и видишь… Что предстало твоим глазам, узнаешь.
    mood: danger
    interaction:
      type: continue
      to: "323"
  "169":
    title: Глава 169
    text: Приятный для прогулки денек — над головой сияет солнце, в ветвях мило чирикают птички. Говоришь, тебя гложет совесть? Неудивительно. Ведь ты бросил на произвол судьбы парнишку, у которого, судя по всему, сломана нога. Настоящий полевой агент так бы не поступил. А кто тебя заставляет следовать всем моим советам? Ладно-ладно, свое мнение обо мне выскажешь позже, сейчас же вернись к парнишке.
    mood: tense
    interaction:
      type: continue
      to: "38"
  "170":
    title: Глава 170
    text: Отлично сработано! Граната с оглушительным грохотом взрывается, все громилы, как один, валятся на пол. Очухавшись, они обнаружат, что связаны своими же собственными ремнями. Обыскав их, ты обзаводишься шестью ножами, двумя дубинками, двумя пистолетами, медным кастетом, распечатанной пачкой жевательного табака, календариком с голыми девицами, «утренней звездой» и шестью медными монетами. Хозяин таверны очнулся, и ты вручаешь ему трофеи. — О, добрый самаритянин, — с пафосом говорит он. — Не думал, не гадал, что встречу на этой мерзкой планете столь благородного юношу. В награду за твой славный подвиг я подарю тебе волшебный ремень, в котором осталось три заряда невидимости. Нажмешь кнопку на пряжке — и ты невидим целые три минуты. Ты благодаришь старика, подпоясываешься ремнем и спрашиваешь, где найти профессора Гейстескранка. — Того сумасшедшего гения, которого знает весь мир? Ты поспешно киваешь. — Он сейчас на службе у Волосатого Гарри Убийцы Каннибалов. Ты спрашиваешь, где разыскать Волосатого Гарри. — Волосатый Гарри — владелец Зловонного замка, названного так после того, как его прежнего владельца — инженера городской санитарной службы — спустили в унитаз, отчего канализации в замке засорилась. Заклинаю тебя, держись от замка подальше! Ты заверяешь владельца таверны, что найти профа — твой долг. — Если так, то, благородный юноша, отправляйся. И удачи тебе!
    mood: danger
    entry:
      - consume:
          item: sleep_grenade
      - grant:
          item: invisible_belt
          count: 1
        once: true
        if:
          not:
            has_item:
              id: invisible_belt
    interaction:
      type: continue
      to: "214"
  "171":
    title: Глава 171
    text: Не дерись с хищником, а используй в борьбе мозги! Не делая резких движений, подберись к двери, через которую ты сюда вошел. Так, остановись, возьмись за ручку, подожди, пока полосатая косматая бестия подойдет ближе… Пора! Двигай.
    mood: danger
    interaction:
      type: continue
      to: "213"
  "172":
    title: Глава 172
    text: Ты бежишь от монстра, и я не виню тебя. Перед твоими глазами мелькают кусты, деревья, ты взбираешься на холм, спускаешься с него, огибаешь другой… Глаза твои заливает пот, каждый вдох дается с великим трудом. Ты боязливо бросаешь взгляд через плечо. Никого! Ты тяжело опускаешься в тени раскидистого дерева, приваливаешься спиной к стволу, обмахиваешь лицо раскрытой ладонью. Несколько отдышавшись, поднимаешь глаза, и… Метрах в пятнадцати от тебя к прыжку готовится смертельно опасный монстр Зеленый Пупок! Встать ты уже не успеешь! И размышлять некогда! Ты выхватываешь стрелу, натягиваешь тетиву и, почти не целясь, стреляешь и переносишься.
    mood: danger
    interaction:
      type: continue
      to: "88"
  "173":
    title: Глава 173
    text: Ты берешь щит в левую руку, меч — в правую; дверь перед тобой распахивается, в глаза бьет яркий солнечный свет. Ты распрямляешь спину и, гордо подняв подбородок, выходишь.
    mood: danger
    interaction:
      type: continue
      to: "144"
  "174":
    title: Глава 174
    text: Смотри-ка, походная кухня, вокруг нее суетятся роботы, а рядом выстроилась очередь из грязных оборванцев. Ты уже проголодался? Тогда становись в конец очереди. Пока ждешь, почему бы тебе не спросить приятного мужчину впереди себя, где находится Гроаннсвилль? Если задаешь вопрос, то отправляешься на [А]. Если нет, то стой в очереди, пока не попадешь на [Б].
    mood: danger
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "101"
          letter: А
        - label: Вариант Б
          to: "20"
          letter: Б
  "175":
    title: Глава 175
    text: Ты так ничему и не научился! Впредь держись подальше от жителей этой Богом проклятой планеты. Конечно же, стражники схватили тебя и, малость попинав ногами, швырнули в тюремную камеру. Если срочно что-нибудь не предпринять, то останешься до конца своих дней рабом. Верно, покопайся в карманах, там у тебя полная экипировка полевого агента. Нет, для комиксов сейчас не самое подходящее время. Слышишь шаги. К двери твоей камеры подошел стражник и уже вставляет в замочную скважину ключ. Действуй быстрей! Доставай гранату с сонным газом и отправляйся.
    mood: calm
    image: illustrations/prison.jpg
    interaction:
      type: continue
      to: "29"
  "176":
    title: Глава 176
    text: Ты чертовски устал, а дороге не видно конца. Ноги у тебя буквально отваливаются; зевая, ты идешь.
    mood: calm
    image: illustrations/road.jpeg
    interaction:
      type: continue
      to: "190"
  "177":
    title: Глава 177
    text: Удар лапищи хищника, и ты отлетаешь в один угол комнаты, твой меч — в другой. А ты хоть и кретин, но в храбрости тебе не откажешь! Ты хватаешь меч, вновь занимаешь боевую стойку, а крысолев, хлеща себя по бокам длиннющим хвостом, вновь приближается. Может, все же выслушаешь мой совет и поживешь еще малость? Выбираешь жизнь? Отлично, тогда быстрее.
    mood: danger
    interaction:
      type: continue
      to: "171"
  "178":
    title: Глава 178
    text: Доски под твоими ногами скрипят, грозя рухнуть в любую секунду. Иди медленней, держись за поручни. Далеко под тобой — стремительная река. Но лучше не смотри вниз! Преодолеть осталось всего метров пять… Осторожней! Да, сразу три доски под тобой сломались. По-моему, агенту Спецкорпуса не пристало орать так громко, даже падая в реку Гремучих Змей! Ты падаешь, падаешь, падаешь, пока… Бултых!
    mood: tense
    interaction:
      type: continue
      to: "205"
  "179":
    title: Глава 179
    text: "Просыпаешься ты от сильнейшего удара в скулу. Прокатившись по земле, ты встряхиваешь головой и поднимаешь глаза. Перед тобой — Волосатый Гарри Убийца Каннибалов! Ты поспешно вскакиваешь на ноги, бежишь, но он хватает тебя и рычит: — Тебе конец! Давай сюда золото, или я сожру тебя живьем! Не дожидаясь ответной реплики, он впивается в твое предплечье острыми, как иглы, зубами, ты дергаешься, но убежать не в силах. Тебе в самом деле конец? Узнаешь."
    mood: danger
    interaction:
      type: continue
      to: "156"
  "180":
    title: Глава 180
    text: |-
      Все так же жарко и пыльно, но у тебя, видимо, открылось второе дыхание, и ты шагаешь довольно ходко. Впереди показалось здание из блестящей стали. Приблизившись, ты обходишь его: ни дверей, ни окон у здания нет, зато на гладкой стене висит телефон, а над ним табличка: НАДЗИРАТЕЛЯ НИ В КОЕМ СЛУЧАЕ НЕ БЕСПОКОИТЬ. ПОДОБРУ-ПОЗДОРОВУ СТУПАЙ СВОЕЙ ДОРОГОЙ. Что ж, перед тобой небогатый выбор. Можешь развернуться и отправиться на перекресток к [А]
      Или можешь снять телефонную трубку и поговорить с надзирателем, и тогда сразу очутишься на [Б].
    mood: calm
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "339"
          letter: А
        - label: Вариант Б
          to: "46"
          letter: Б
  "181":
    title: Глава 181
    text: Ты приземляешься посреди крошечного островка и, хотя скользишь, но, взмахнув руками, умудряешься удержаться на ногах. Ты жив, но припекает изрядно. Скорее протри слезящиеся глаза и оглядись. Метрах в пяти справа и слева от островка — отвесные скалы, у их подножий тонкими каемками застыла лава. Не теряй времени, а то изжаришься. Прыгай либо к подножию левой скалы на [А]. Или к подножию правой на [Б].
    mood: danger
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "204"
          letter: А
        - label: Вариант Б
          to: "122"
          letter: Б
  "182":
    title: Глава 182
    text: Ты бежишь, но парни не отстают, вот-вот догонят. Ты, подобно загнанному в угол зверю, разворачиваешься, и между вами разгорается жаркая схватка.
    mood: tense
    interaction:
      type: continue
      to: "194"
  "183":
    title: Глава 183
    text: Твоя уловка сработала, волк прыгнул, но ты вовремя отступил в сторону, и он промахнулся. Но он вновь приближается! Самое время отпрыгнуть.
    mood: calm
    interaction:
      type: continue
      to: "112"
  "184":
    title: Глава 184
    text: Ты попал, а соперник промахнулся! Правда, счет пока — два-один не в твою пользу. Расслабься! Спокойно целься и стреляй.
    mood: tense
    interaction:
      type: roll
      formula: 1d6
      outcomes:
        - min: 4
          max: 6
          to: "342"
        - min: 1
          max: 3
          to: "5"
  "185":
    title: Глава 185
    text: Рыцарь, обыскав тебя, отбрасывает на дорогу передатчик материи, так и не разобравшись, для чего он служит, и забирает лук, оставшиеся стрелы, меч и все содержимое твоих карманов, включая семь золотых монет, затем, неприлично обозвав тебя, грубо забрасывает на ближайший утес и тяжелой поступью уходит. Как только он скрывается из виду, ты грозишь ему вслед кулаком, хватаясь за свисающие корни, спускаешься с утеса на дорогу, отряхиваешься, поднимаешь с земли передатчик материи и обнаруживаешь.
    mood: tense
    entry:
      - drop:
          item: bow
          count: 1
      - drop:
          item: arrow
          count: 1
      - drop:
          item: sword
          count: 1
      - drop:
          item: gold_coin
          count: 1
    interaction:
      type: continue
      to: "328"
  "186":
    title: Глава 186
    text: Становится темно — похоже, приближается гроза. Холодно, ветрено и сыро. Говоришь, промочил ноги? И дорога исчезла, а ты стоишь по колено в грязи? И не можешь сдвинуться с места? И болотная жижа медленно засасывает тебя? Сдается мне, что ты угодил в непролазные топи. Спрашиваешь у меня совета? Ну, ты можешь закричать во все горло, зовя на помощь, и тогда сразу окажешься на [А]. Или можешь, опираясь на посох, попытаться выбраться сам, и окажешься на [Б].
    mood: calm
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "12"
          letter: А
        - label: Вариант Б
          to: "33"
          letter: Б
          if:
            has_item:
              id: staff
  "187":
    title: Глава 187
    text: "Знаешь, похоже, твое истинное призвание — подмостки. Нет, я серьезно. С таким голосом тебя ожидает блестящая карьера в шоу-бизнесе. В будущем, конечно. А пока разберись с кабаном. Услышав песню, кабан, обдав тебя грязью, резко тормозит и устремляет на тебя изумленный взгляд, ты же одну за другой исполняешь все шестнадцать вариаций «Полковника Кабансона», а когда заканчиваешь, вы дуэтом исполняете лиричную «Кози обожает Свинку», трогательную «Когда же мама возвратится из Свинляндии?» и бодрую к «Я — кабан, и выгляжу на все 100». Кабан усаживается на корточки и говорит: — Для человека у тебя вполне приличные вокальные данные. Тебе, конечно, не передать всей глубины чувств кабана, но все мы не без греха. Но слышишь? Слыша ужасный треск ветвей, ты киваешь. — Это ломится среди джунглей тиранозаврус рекс, — сообщает кабан. — А я как раз голоден. Так что мне пора. Но на прощанье я тебе помогу. Если мне не изменяет память, ты охотишься за Рубином Джунглей? Ты удивленно соглашаешься. — Мост через Большой Каньон разрушен, добраться к тайному храму можно только по воздуху, — продолжает кабан. — Следуй по той тропе и в конце ее найдешь самую большую и самую древнюю на свете птицу Рок. Если ты накормишь ее, то она отнесет тебя к храму. Ты спрашиваешь, чем питается птица Рок? — Сорви, сколько унесешь, фруктов, что растут на деревьях вдоль тропинки. Прощай, человек. Удачи тебе. С этими словами кабан устремляется через джунгли к источнику шума, а ты отправляешься по тропинке."
    mood: danger
    interaction:
      type: continue
      to: "104"
  "188":
    title: Глава 188
    text: "Ты попал в длиннющий пыльный коридор, из щелей в его стенах и потолке льется призрачный свет, на полу мусор, камни, в углах скребутся здоровенные крысы. Обнажив меч, ты осторожно идешь по коридору. Поворот, еще один, и ты в тупике у лестницы. Выбора у тебя нет, спускайся. Через пять пролетов лестница кончается, ты оказываешься в каморке с двумя дверями. На левой — радующая сердце надпись: ПУТЬ К БЕСЦЕННОМУ РУБИНУ ДЖУНГЛЕЙ. На правой — леденящая душу: ВОЙДИ СЮДА И МГНОВЕННО УМРЕШЬ! Итак, за одной дверью тебя ожидает смерть, за другой — цель твоего многотрудного путешествия, драгоценный камень. Но не исключено, что надписи врут. В какую дверь пойдешь? Не знаешь? Тогда подкинь ДОСП. Если выпадет орел, то войдешь в левую дверь. Если решка, то в правую."
    mood: victory
    interaction:
      type: roll
      formula: 1d2
      outcomes:
        - min: 2
          max: 2
          to: "150"
        - min: 1
          max: 1
          to: "267"
  "189":
    title: Глава 189
    text: Уж не везет, так не везет. Тебе попалась граната с сонным газом, но Бетси — шустрая девушка — хватает тебя за руку, выворачивает запястье и, поймав на лету гранату, швыряет ее далеко прочь. Но ты тоже не лыком шит, вмиг выхватываешь и приводишь в действие дымовую гранату. Но, к несчастью, дымовая завеса не помогает. Твои руки и ноги скованы, а конец цепи от оков в руке Бетси. За причиненные неприятности она награждает тебя подзатыльником, и ты вновь на пути в Гроаннсвилль. Но что это там впереди? Безобразный громила! Кулачищи, как молоты, глаза — щелки, на губах — презрительная ухмылка. Размахивая дубиной, он быстро приближается, Бетси поспешно занимает каратистскую стойку. Между ними неминуемо произойдет потасовка. Как видно, они стоят друг друга. Если ты придешь на выручку одному из них, то его противник обречен. Так не стой же столбом, действуй! Если ты поможешь в схватке Бетси, то отправляйся на [А]. Если незнакомому громиле, то на [Б].
    mood: calm
    entry:
      - consume:
          item: sleep_grenade
      - consume:
          item: smoke_grenade
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "94"
          letter: А
        - label: Вариант Б
          to: "65"
          letter: Б
  "190":
    title: Глава 190
    text: Ты слышишь позади себя быстрые шаги по булыжнику. Опасность! Может, прибавишь шагу? Ты так и поступаешь, почти бежишь, но вскоре слышишь дробный топот не только позади, но и впереди. Прежде чем ты прячешься в придорожных кустах, на дороге появляются парни, одетые в черные кожаные куртки. Выбор у тебя небогатый. Либо прячься в лесу на [А]. Либо останься на [Б] и прими бой.
    mood: tense
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "182"
          letter: А
        - label: Вариант Б
          to: "194"
          letter: Б
  "191":
    title: Глава 191
    text: "Ты ползешь по тоннелю, но вскоре впереди появляется свет. Ты прибавляешь скорость и оказываешься в комнатенке с металлическими стенами. Кроме дыры, через которую ты сюда попал, других выходов вроде бы нет. Ты уже было решаешь ползти назад, но тоннель перед тобой с ужасным грохотом обваливается. Ты — в ловушке! Но что это? Там, в темном углу комнатки? Ты направляешься в угол и видишь на стене ярко-красную ручку с искусно вырезанным человеческим черепом на конце. Над ручкой в металле вытравлена инструкция на тридцати четырех языках, по крайней мере половина из которых давным-давно забыта. Ты находишь понятную тебе надпись. Она проста: «Дерни за меня». Хорошенько поразмыслив и поняв, что выбора у тебя нет, ты протягиваешь к ручке дрожащие пальцы, хватаешься за нее, дергаешь и… Пол под тобой расходится, и ты падаешь, падаешь, падаешь."
    mood: danger
    interaction:
      type: continue
      to: "98"
  "192":
    title: Глава 192
    text: Затаив дыхание, ты крадешься вокруг шара. Эх, если бы в твоей руке была окованная железом дубинка! Но, ухватившись за свисающую с воздушного шара веревку, ты расстался с верным оружием. Не отчаивайся, у тебя же есть сила, храбрость и полная экипировка полевого агента. Услышав подозрительный звук, ты замираешь. Не бойся, это всего лишь ветер теребит ткань полуспущенного баллона. Ты продолжаешь движение и тут видишь на песке свежие отпечатки подошв. Следы, без сомнений, оставил профессор! Следуй за ним.
    mood: tense
    interaction:
      type: continue
      to: "225"
  "193":
    title: Глава 193
    text: Что это там впереди? Если меня не подводят твои глаза, то перед тобой городская стена. Остановись, прислушайся. Слышишь гул людской толпы? Судя по всему, ты рядом с Гроаннсвиллем. А вон и городские ворота. Но их охраняют вооруженные стражники. Спрашиваешь меня, как поступить? Можешь отправиться к воротам на [А]. Или попытаешься перелезть через городскую стену [Б].
    mood: tense
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "175"
          letter: А
        - label: Вариант Б
          to: "86"
          letter: Б
  "194":
    title: Глава 194
    text: Ты силен и храбр, но ты устал. Кожаные парни окружают тебя и сбивают с ног. Как только перед твоими глазами рассеивается багровая пелена, ты обнаруживаешь, что руки твои заломлены за спину и крепко связаны, а кожаные волокут тебя.
    mood: calm
    interaction:
      type: continue
      to: "334"
  "195":
    title: Глава 195
    text: Ты хватаешь стрелу, натягиваешь тетиву, целишься и… Монстр бросается на тебя! Ты стреляешь и переносишься.
    mood: danger
    interaction:
      type: continue
      to: "88"
  "196":
    title: Глава 196
    text: Да ты, оказывается, не только отличный пловец, но и превосходный боец. Любо-дорого было смотреть, как ты уложил верзилу всего двумя мощными ударами в челюсть и пах! А теперь беги помедленней. Что там за холмом? Обшарпанные серые стены с бойницами, над ними — башенки… Да это Зловонный Замок! И главные ворота нараспашку. Мотаешь головой? Не желаешь идти в ворота? Да, уроки этой планеты не прошли для тебя даром. Правильно, дождавшись темноты, перелезь через стену.
    mood: calm
    interaction:
      type: continue
      to: "153"
  "197":
    title: Глава 197
    text: Ты слышишь топот убегающих шагов в тоннеле. Позабыл о задании? Беги же быстрей за профом!
    mood: calm
    interaction:
      type: continue
      to: "242"
  "198":
    title: Глава 198
    text: Тебе пришлось нелегко, но ты справился. Знай же, я горжусь тобой! И не бубни под нос, что одним достается вся работа, другие только языком трепать горазды. Учти, я слышу твои проклятия, и они, может статься, весьма пагубно отразятся на твоем личном деле. Так-то лучше. А теперь малость пробегись вдоль берега — быстро обсохнешь и согреешься. Но кто это? Очередной громила! Да, согласен, у него устрашающий вид, но и у тебя видок тоже, будь здоров! По-моему, самое время подбросить Двусторонний Определитель Случайных Процессов и выяснить свою дальнейшую судьбу. Если выпадет орел, то ты на [А]. Если решка, то на [Б].
    mood: calm
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "28"
          letter: А
        - label: Вариант Б
          to: "196"
          letter: Б
  "199":
    title: Глава 199
    text: "Этот полет ты не забудешь до конца своих дней! Гигантские крылья хлопают, в лицо бьет ураганный ветер, внизу крошечные, словно игрушечные, деревья. Птица поминутно требует фруктов. Ты послушно подкидываешь их в воздух, она ловко ловит плоды на лету. Впереди показывается черное, как смоль, облако. Птица Рок каркает: — Приближается шторм! Но мы смеемся над всеми штормами! Держись крепче, летим через тучу! И она ныряет в самое сердце шторма. В мгновение поднимается такой ветер, что не вздохнуть. Ты мертвой хваткой вцепляешься в перья и молишь Бога, чтобы древняя птица линяла в любое другое время года, но не сейчас. Сверкающие молнии слепят тебя, гром оглушает. Одна из молний бьет в правое крыло, и… птица с криком боли камнем устремляется вниз. К счастью, дождь тушит пылающие перья, и птица Рок, заложив крутой вираж, покидает штормовую тучу. — Что-то меня в сон клонит, — заявляет птица. — Так куда, говоришь, мы летим? Ты открываешь рот, но птица горланит: — Подожди! Сама вспомнила! Тебе нужен Рубин Джунглей, который в храме, а тот храм… Ты с ужасом видишь, что глаза птицы затягивает поволока, ее крылья складываются, и вы падаете к земле. — Эй!!! — в отчаянии вопишь ты. У самых вершин деревьев птица приходит в себя, расправляет крылья и, как ни в чем ни бывало, продолжает полет. — Смотри же, млекопитающий, — минуты через две говорит птица. — Под нами — те самые руины. Ты смотришь вниз, но видишь лишь верхушки деревьев. — Не туда смотришь! — восклицает птица. — Справа! Видишь, две башни над джунглями? Ты поворачиваешь голову и действительно видишь башни, сложенные из потемневшего от времени камня. — Если опустимся на крышу нужной башни, ты отыщешь Рубин Джунглей, а если приземлимся на другую, умрешь страшной мучительной смертью. Нужная нам башня… Птица умолкает, глаза ее вновь закрываются. Неожиданно она вздрагивает и в гневе кричит: — Глупое млекопитающее! Ты скормил мне фрукты не того цвета — это же сильнейшее снотворное! Боже, до чего хочется спа-а-а… Птица умолкает на полуслове, ее огромные крылья замирают, из загнутого клюва несется громкий мерный храп. К счастью, на этот раз она не складывает крылья, и вы планируете в сторону храма. Ты полагаешь, что угодил в безвыходную ситуацию? Не паникуй раньше времени! Проползи по спине птицы к ее шее и слегка поверни ее голову. Отлично, птица летит туда, куда нацелен ее клюв. Ты способен управлять полетом! Теперь посади ее на крышу нужной башни, отыщи Рубин Джунглей и… Ты не знаешь, какая башня тебе нужна? К несчастью, я тоже. Ну, пусть выбор определит случай. Подбрось ДОСП. Если выпадет орел, направь спящую птицу к левой башне. Если решка, к правой."
    mood: mystery
    interaction:
      type: roll
      formula: 1d2
      outcomes:
        - min: 2
          max: 2
          to: "327"
        - min: 1
          max: 1
          to: "117"
  "200":
    title: Глава 200
    text: Не теряй напрасно времени, ведь и дураку ясно, что что указатели на перекрестке были перевернуты и ты попал вовсе не туда, куда надо. Сейчас же беги.
    mood: calm
    interaction:
      type: continue
      to: "53"
  "201":
    title: Глава 201
    text: Начало, и неплохое, положено, — говорит звездное чудище. — За верный ответ — десять очков. Посмотрим, как ты справишься с остальными вопросами. Кто черный, смертельно опасный сидит на сосне? Знаешь ли ты ответ или нет, отправляйся.
    mood: danger
    interaction:
      type: continue
      to: "85"
  "202":
    title: Глава 202
    text: Ты на дне глубоченной ямы, высоко над тобой крошечный квадратик светлого неба. Стены ямы гладкие и скользкие, как стекло, тебе по ним не взобраться. Да и стоит ли? Ведь долг по-прежнему призывает тебя преследовать безумного профа. Над тобой бешено кружатся стаи похожих на орлов птиц. Самая злобная пикирует прямо на тебя — крылья сложены, заостренный хищный клюв разинут, и ты уже чувствуешь на лице ее зловонное дыхание. Быстрее решай, куда побежишь. К двери на восток [А] ? Или к другой на юг [Б] ?
    mood: tense
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "226"
          letter: А
        - label: Вариант Б
          to: "210"
          letter: Б
  "203":
    title: Глава 203
    text: |-
      Неужели ты столкнулся с очередной иллюзией, вызванной механизмами древних чужаков? Или действительно в конце ведущего на север тоннеля [А]
      виден солнечный свет? А, может, не станешь рисковать и отправишься обратно на юг к [Б] ? Решай же!
    mood: mystery
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "208"
          letter: А
        - label: Вариант Б
          to: "264"
          letter: Б
  "204":
    title: Глава 204
    text: Ты допрыгиваешь, но тонкий слой застывшей лавы под твоими ногами трещит, крошится. А ты шустрый парень, когда захочешь! Подскочив, карабкаешься на скалу, ругаешься, когда из-под ног летят камни. Рядом с тобой в скале вход в тоннель. Быстрей полезай в него!
    mood: danger
    interaction:
      type: continue
      to: "333"
  "205":
    title: Глава 205
    text: Хорошо, что ты отличный пловец. Но смотри! Прямо перед тобой гремучая змея! Не паникуй. А вон справа еще одна. Все равно не паникуй! Разве ты забыл, как называется река? А еще скромничал! Да ты не просто отличный, ты великолепный пловец. Ох и быстро же ты плывешь! Или развиваешь такую поразительную скорость, только когда соревнуешься со змеями? Направляешься прямо к берегу? Согласен, выбраться из воды здесь несложно, но, смотри, берег зарос густыми кустами, и неизвестно, кто в них прячется. Может, лучше проплывешь немного по течению и, оказавшись на [А], выберешься на крутой, каменистый, но зато голый, как колено, берег? Или поспешишь к грозящему неизвестными опасностями берегу [Б] ?
    mood: calm
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "198"
          letter: А
        - label: Вариант Б
          to: "3"
          letter: Б
  "206":
    title: Глава 206
    text: Тропа все поднимается и поднимается; следуя по ней, ты вскоре забираешься на гребень крутого холма, и… Споткнувшись, ты летишь вниз.
    mood: tense
    interaction:
      type: continue
      to: "107"
  "207":
    title: Глава 207
    text: |-
      Кончай ковырять пальцем в ухе и трясти головой! Да, я тоже слышу, что кабан поет приятным баском, и даже узнаю мелодию. Послушаем, о чем же он поет. — Грязь, грязь, любимая грязь, мне душу согреет милая грязь… Да, своеобразные вкусы… Что делать? Можно, обнажив меч, выйти из-за деревьев на [А]
      и сразиться с чудовищем. А может (только не иронизируй), подойдешь к кабану и споешь с ним дуэтом на [Б] ?
    mood: mystery
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "224"
          letter: А
        - label: Вариант Б
          to: "266"
          letter: Б
  "208":
    title: Глава 208
    text: Наконец-то! Ты перелезаешь через полуобвалившуюся стену и выбираешься из древних руин. Позади со страшным грохотом рушится потолок тоннеля, из которого ты только что выполз. Ты шагаешь вдоль цепочки хорошо знакомых следов за безумным профом. Следы приводят тебя.
    mood: mystery
    interaction:
      type: continue
      to: "261"
  "209":
    title: Глава 209
    text: Ты счастливчик! Сейди-Садистик выставляет правую руку, ее большой палец направлен вверх. Всхлипывая, ты отправляешься.
    mood: calm
    interaction:
      type: continue
      to: "348"
  "210":
    title: Глава 210
    text: Люди порой ошибаются. Даже я. Ты попал не в соседнюю комнату, а всего лишь в небольшую нишу в стене. Рядом с тобой, грозя смертью, носятся хищные птицы. Но другого выхода нет. Набери в грудь побольше воздуха и мчись.
    mood: danger
    interaction:
      type: continue
      to: "202"
  "211":
    title: Глава 211
    text: Господи, до чего удивительные звери нарисованы на стенах в этой комнате! Ты идешь, а звери крадутся, играют, едят, спят. Воистину, древние творили чудеса! Но не отвлекайся, ищи выход. Нашел? Целых три? Куда же пойдешь? На север к [А] ? На запад к [Б] ? Или на восток к [В] ? Решай быстрей!
    mood: mystery
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "297"
          letter: А
        - label: Вариант Б
          to: "241"
          letter: Б
        - label: Вариант В
          to: "281"
          letter: В
  "212":
    title: Глава 212
    text: Ты ударяешься головой о низкий потолок и, придя в себя, потерянно озираешься. Света здесь нет, силы тяжести тоже. Хватаясь руками за многочисленные скобы и выступы, торчащие из потолка, ты обследуешь комнату. Оказывается, отсюда два выхода. На север к [А]. Или на юг к [Б]. Поспеши выбраться через любой!
    mood: tense
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "240"
          letter: А
        - label: Вариант Б
          to: "296"
          letter: Б
  "213":
    title: Глава 213
    text: Ты рывком распахиваешь дверь и отступаешь в сторону. На крысольва с грохотом обрушиваются тонны камней и пыли. Пыль вскоре оседает, и ты видишь торчащий из-под камней кончик облезлого розового хвоста. Хвост судорожно дергается и замирает. Ты победил! Убил хищную тварь! Вложи меч в ножны, пересеки комнату, открой дверь в дальней стене и смело шагай через нее.
    mood: calm
    interaction:
      type: continue
      to: "188"
  "214":
    title: Глава 214
    text: Хорошенько закусив и выпив в таверне, ты снова бредешь по дороге. Вот ты подходишь к длиннющему подвесному мосту. По словам хозяина таверны, этот мост — единственный путь через Ущелье Смерти. Ты смотришь вниз и видишь бегущую по дну ущелья отравленную реку Гремучих Змей. Ты с содроганием переводишь глаза на шаткий мостик. Большинство досок от времени и непогод прогнило и сломалось, путь на ту сторону ущелья смертельно опасен. Ты видишь внизу тропу вдоль реки, у ее конца — покачивающуюся на воде лодку, в ней — человека. Если свернешь на тропу и попытаешься пересечь реку в лодке, то иди на [А]. Если на свой страх и риск воспользуешься хлипким мостом, то на [Б].
    mood: danger
    image: illustrations/mountains.jpg
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "26"
          letter: А
        - label: Вариант Б
          to: "178"
          letter: Б
  "215":
    title: Глава 215
    text: Благодарю, о, могучий и благородный чужестранец! — хрипло говорит стражник. — В награду за доброту и помогу тебе! Когда перейдешь мост, увидишь, что дорога разделяется надвое. Если свернешь налево, то в считанные секунды умрешь мучительной смертью от укусов ядовитых змей, которых там превеликое множество. Правая же дорога безопасна. Иди же, и вечная тебе благодарность от старика! Пожелав стражнику крепкого здоровья и долголетия, ты идешь к противоположному концу моста.
    mood: danger
    interaction:
      type: continue
      to: "128"
  "216":
    title: Глава 216
    text: "Ты догоняешь колонну рабов, скованных массивной цепью. Рядом безобразный громила избивает дубинкой паренька, корчащегося в пыли. Я узнаю громилу, он не кто иной, как Слюй Работорговец. Его сослали на планету-тюрьму за преступления, рассказывать о которых у меня не поворачивается язык. Что? Как же я его сразу не узнал? Действительно, избиваемый парень — твой верный друг Арбутнот Отверженный. Искренняя дружба требует от тебя немедленных действий, и ты, приблизившись, оскорбляешь Слюя, что при его безобразной внешности сделать несложно. Он, размахивая окровавленной дубиной, с ревом несется на тебя. Ты спокойно суешь в ноздри крошечные фильтры. Он ревет совсем близко, и ты даже сквозь фильтры чувствуешь его зловонное дыхание. Ну и воняет же от него! В последний миг ты суешь газовую гранату ему под нос и поспешно отступаешь от падающего тела. Мертвая тишина длится секунду, другую, третью, затем ее разрывает радостный крик рабов, приветствующих тебя. От смущения ты слегка краснеешь. С земли поднимается Арбутнот и обращается к тебе: — Избавитель! Как мне тебя благодарить? Я сделаю для тебя все что угодно! Все мы навеки твои преданные слуги. Приказывай же, и мы с радостью подчинимся твоим самым безумным прихотям! Ты на секунду задумываешься над его дельным предложением и, приняв решение."
    mood: danger
    entry:
      - consume:
          item: sleep_grenade
      - consume:
          item: nose_filter
    interaction:
      type: continue
      to: "22"
  "217":
    title: Глава 217
    text: Да, мне тоже не по душе наполненная едким, сизым дымом и пропитанная серной вонью комнатенка с раскаленными докрасна стенами, в углах которой то вспыхивают, то угасают багровые языки пламени. Опасливо осмотрев ее, ты выясняешь, что здесь только одна-единственная дверь. Та, через которую ты попал сюда. Ничего не поделаешь, возвращайся на запад.
    mood: calm
    interaction:
      type: continue
      to: "300"
  "218":
    title: Глава 218
    text: Громилы! Да как много! Они с легкостью подавляют твое сопротивление, сбивают с ног, ударом дубины по голове прерывают на полуслове проклятие в мой адрес. В сознание ты приходишь уже.
    mood: danger
    interaction:
      type: continue
      to: "28"
  "219":
    title: Глава 219
    text: Рекрут, клянусь, ты мне нравишься! Ты не слышишь меня? Нет?.. Так освободи уши от грязи! Теперь слышишь? Если считаешь, что битва — единственный шанс на спасение, дерись с кабаном, а я, чтобы не видеть героической гибели своего любимца под копытами разъяренного зверя, отвернусь. А может, ты все-таки споешь? Споешь с кабаном дуэтом несколько тактов и проследуешь?
    mood: victory
    interaction:
      type: continue
      to: "266"
  "220":
    title: Глава 220
    text: |-
      Удивительно, каких высот достигла наука древней расы! Отлично зная, что находишься глубоко под землей, ты неожиданно попадаешь в окруженную скалами долину, по голубому небу над тобой плывут белые барашки облаков, под ногами шелестит мягкая фиолетовая трава. С улыбкой на устах ты бродишь по долине и выясняешь, что отсюда три выхода. На запад через огромные, украшенные резьбой деревянные ворота [А]. На север через такие же ворота [Б]. И на юг через короткий тоннель в скале [В]
      Как ни гостеприимна чудесная долина, пора и честь знать. С тоскою в сердце ты отправляешься выполнять задание.
    mood: mystery
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "240"
          letter: А
        - label: Вариант Б
          to: "235"
          letter: Б
        - label: Вариант В
          to: "234"
          letter: В
  "221":
    title: Глава 221
    text: На вкус — очень даже недурственно. Видимо, проф солгал тебе. Ты с аппетитом доедаешь шоколадный торт, а затем принимаешься за песочный и, одолев его поворачиваешься к дракону
    mood: calm
    interaction:
      type: continue
      to: "299"
  "222":
    title: Глава 222
    text: "В кромешной тьме ты сваливаешься в воду. Вода какая-то странная, плыть в ней не удается, и ты бредешь по скользкому дну, а над поверхностью виднеется только твоя голова. Согласен, надо быстрей выбираться отсюда: хотелось бы попасть в помещение посуше. Ступай либо на звук падающей воды на восток к [А]. Либо на юг к [Б]."
    mood: mystery
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "228"
          letter: А
        - label: Вариант Б
          to: "235"
          letter: Б
  "223":
    title: Глава 223
    text: Набрался сил? Ну, судьба не ждет, отправляйся за профом в лабиринт.
    mood: mystery
    interaction:
      type: continue
      to: "96"
  "224":
    title: Глава 224
    text: Громадный толстый кабан, не пропустив ни единой ноты, опрокинул тебя в грязь ударом копыта. Вот он приближаемся вновь, неотвратимый, словно локомотив, но уже не поет, а утробно рычит. Подними же свой меч, сразись с чудовищем! Полагаешь, что твоим коротеньким мечом не пробить толстую шкуру борова? Тогда увернись от него.
    mood: danger
    interaction:
      type: continue
      to: "219"
  "225":
    title: Глава 225
    text: |-
      Следы уходят за горизонт. Ты устал, но упорно бредешь и бредешь по ним. Наконец следы приводят тебя к высоченным воротам в стене громадного просевшего от времени здания. Стена, насколько хватает глаз, покрыта причудливой резьбой, изображающей полчища омерзительных зубастых, клыкастых, ушастых, рогатых и хвостатых, мохнатых и облезлых монстров. В мрачное же местечко тебя занесло, не находишь? К сожалению, ты прав — следы профа заканчиваются на каменном полу у распахнутых ворот. Но почему ты медлишь? А-а, теперь и я вижу выбитые над воротами буквы. Очень интересно… Что значит, ты не можешь прочесть надпись?! Она же на эсперанто, языке, который знают в Галактике все. Слушай, как красиво звучит: «Ви алвенас йе ла пордо де ла теруро де…» Нет, сынок, я вовсе не выпендриваюсь. А тебе приказ: как только покончишь с этим заданием, сразу же выучи эсперанто. Так-то лучше. А надпись над воротами означает примерно, следующее: ЧУЖЕСТРАНЕЦ, ТЫ У ВРАТ В ЛАБИРИНТ, ГДЕ ЗАКЛЮЧЕН УЖАСНЫЙ ЗВЕЗДНЫЙ ЗВЕРЬ. БУДЬ НАЧЕКУ! ПОМНИ, ВОЙТИ В ЛАБИРИНТ ДЛЯ ТЕБЯ — ВЕРНАЯ СМЕРТЬ. МЫ, КАКАЛОКИ, ДРЕВНЕЙШАЯ РАСА ВО ВСЕЛЕННОЙ, ПОСТРОИЛИ СЕЙ ЛАБИРИНТ, СПАСАЯ ГАЛАКТИКУ ОТ УЖАСНОГО ЧУДОВИЩА,НО РАЗУМНЫЕ СУЩЕСТВА ЭТОЙ ГАЛАКТИКИ — НЕБЛАГОДАРНЫЕ ТВАРИ. ДОКАЗАТЕЛЬСТВО — ТОТ ФАКТ, ЧТО, ЗАКОНЧИВ СТРОИТЕЛЬСТВО, МЫ ИСЧЕРПАЛИ ВСЕ ФИЗИЧЕСКИЕ И ДУШЕВНЫЕ СИЛЫ И ПОГИБЛИ, НО ТАК И НЕ ДОЖДАЛИСЬ НИ ЕДИНОГО СЛОВА БЛАГОДАРНОСТИ. ЗНАЙ ЖЕ, ЧУЖЕСТРАНЕЦ, ЧТО И НАМ ТЕПЕРЬ ВСЕ РАВНО, ВОЙДЕШЬ ЛИ ТЫ В ЛАБИРИНТ ИЛИ НЕТ, ОСТАНЕШЬСЯ ЖИВ ИЛИ УМРЕШЬ. Согласен, звучит не слишком обнадеживающе. Но ты, наверное, забыл, что последовать за безумным профессором в ужасный лабиринт на [А]
      тебе придется независимо от твоих желаний? Но если настаиваешь, что ж, отдохни на [Б].
    mood: mystery
    image: illustrations/desert.jpg
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "96"
          letter: А
        - label: Вариант Б
          to: "223"
          letter: Б
  "226":
    title: Глава 226
    text: Темная комнатенка. Скорее даже не комнатенка, а чулан. Ты быстро нащупываешь три двери с ручками. Одна на север к [А]. Другая на запад к [Б]. Третья на восток к [В]. Ты поворачиваешь ручку, распахиваешь ближайшую дверь и выходишь.
    mood: calm
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "294"
          letter: А
        - label: Вариант Б
          to: "202"
          letter: Б
        - label: Вариант В
          to: "296"
          letter: В
  "227":
    title: Глава 227
    text: Огромный зал с величественными колоннами, подпирающими высокий резной потолок. Испещренные трещинами и выбоинами колонны по виду — ровесники планеты, от звуков твоих шагов они понемногу осыпаются. Следуя на цыпочках по залу, ты находишь три двери. На север [А]. На запад [Б]. На юг [В]. Боясь, что обвалится потолок, ты спешишь.
    mood: tense
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "253"
          letter: А
        - label: Вариант Б
          to: "341"
          letter: Б
        - label: Вариант В
          to: "297"
          letter: В
  "228":
    title: Глава 228
    text: Надо же, вода выливается из небольшого отверстия под потолкам, а выход из комнаты только один. Возвращайся на запад.
    mood: calm
    interaction:
      type: continue
      to: "222"
  "229":
    title: Глава 229
    text: Утомленное непривычно долгим разговором звездное чудище повалилось на пол и захрапело. Ты замечаешь, что безумный проф, напротив, вовсе не спал, а усердно открывал клетку и сейчас, преуспев в своей затее, убегает во все лопатки к двери с надписью «ВЫХОД». Если ты сломя голову кинешься за ним, то окажешься на [А]. А если будешь стоять, разинув рот, то на [Б].
    mood: mystery
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "35"
          letter: А
        - label: Вариант Б
          to: "197"
          letter: Б
  "230":
    title: Глава 230
    text: Ты бежишь от монстра, и я не виню тебя. Перед твоими глазами мелькают кусты, деревья, ты взбираешься на холм, спускаешься с него, огибаешь другой… Глаза твои заливает пот, каждый вдох дается с великим трудом. Ты боязливо бросаешь взгляд через плечо. Никого! Ты тяжело опускаешься в тени раскидистого дерева, приваливаешься спиной к стволу, обмахиваешь лицо раскрытой ладонью. Несколько отдышавшись, поднимаешь глаза и… Метрах в пятнадцати от тебя к прыжку готовится смертельно опасный монстр Зеленый Пупок! Встать ты уже не успеешь! И размышлять некогда! Ты выхватываешь стрелу, натягиваешь тетиву и, почти не целясь, стреляешь и переносишься.
    mood: danger
    interaction:
      type: continue
      to: "88"
  "231":
    title: Глава 231
    text: Атакуешь! Прыгаешь прямо на пистолет! Да ты, оказывается, смельчак! Или безумец! Но ты слегка опаздываешь — проф нажимает на курок, и ты получаешь в лицо облако газа. У тебя кружится голова, и ты без чувств падаешь.
    mood: danger
    interaction:
      type: continue
      to: "82"
  "232":
    title: Глава 232
    text: Отлично сработано! Стражник по инерции проносится мимо, и, воспользовавшись этим, ты бьешь его рукоятью меча по затылку. Он падает, но с удивительным проворством вскакивает на ноги и вновь атакует тебя. Примерившись, ты наносишь ему удар мечом в грудь. Что дальше, узнаешь.
    mood: danger
    interaction:
      type: continue
      to: "81"
  "233":
    title: Глава 233
    text: Ты счастливчик! Сейди-Садистик выставляет правую руку, ее большой палец направлен вверх. Всхлипывая, ты отправляешься.
    mood: calm
    interaction:
      type: continue
      to: "348"
  "234":
    title: Глава 234
    text: Ты попал в здоровенное, наполненное огромными ржавыми механизмами гулкое помещение — скорее всего электростанцию древних чужаков. Зная, что остановка — верная смерть, ты несколько часов бродишь среди давно бездействующих механизмов. В конце концов выясняешь, что отсюда есть два выхода. На север к [А]. И на восток к [Б].
    mood: mystery
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "220"
          letter: А
        - label: Вариант Б
          to: "241"
          letter: Б
  "235":
    title: Глава 235
    text: Ужасное место! В лицо летят подхваченные порывами ураганного ветра колючие песчинки. Жара, духота, пыль! Прикрой ладонью глаза и беги! На ощупь ты находишь два пути. На север к [А]. И на юг к [Б]. Быстрее выбирайся!
    mood: calm
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "222"
          letter: А
        - label: Вариант Б
          to: "220"
          letter: Б
  "236":
    title: Глава 236
    text: ОХ! АХ! КАКОЙ КОШМАР! Быстрее туда, откуда попал сюда.
    mood: grief
    ending: true
  "237":
    title: Глава 237
    text: Не слишком удачный прием! Стражник, размахивая кинжалом, отливающим в лучах заходящего солнца багровым светом, уклоняется от твоего меча и через миг оказывается рядом с тобой. Ты уворачиваешься, но недостаточно проворно. Удар кинжалом приходится по твоему шлему, и ты, оглушенный, падаешь.
    mood: danger
    interaction:
      type: continue
      to: "79"
  "238":
    title: Глава 238
    text: Ты попал в крошечную, увешанную паутиной и пропыленную каморку всего с одним выходом. Именно тем, через который ты сюда и вошел. Ну хоть погрейся немного. А потом ступай в комнату-холодильник.
    mood: calm
    interaction:
      type: continue
      to: "241"
  "239":
    title: Глава 239
    text: "Ты в комнате с двумя дверями, из-за них доносятся приглушенные крики толпы, перед тобой стоит дрожащий старик. Прислушайся, что он говорит сдавленным голосом. — Салют тебе, осужденный на скорую смерть! Выйдя на арену, помни, что умираешь во славу великолепной Сейди-Садистик! Ты спрашиваешь, почему он сам не торопится умереть во славу великолепной Сейди-Садистик, и старик поспешно отвечает: — Я бы с превеликим удовольствием, но посмертные почести… Боюсь, пока я к ним не готов. — Он плавно переводит разговор в другое, более безопасное русло: — Обрати внимание, над одной дверью надпись «ЛЬВЫ», над другой — «ВОЛКИ». Ты сам кузнец своей судьбы, так что отправляйся через любую. Ты надменно интересуешься, какое оружие тебе полагается. Смотритель отвечает: — У меня лишь одно оружие, и оно твое. Покопавшись в складках грязной тоги, он достает большущее птичье перо и с гордым видом протягивает его тебе. Ты изумлен до такой степени, что молча принимаешь перо из старческих рук. По-моему, нет смысла откладывать решение своей судьбы. Выбирай, пойдешь ли ты на арену через дверь с надписью «ЛЬВЫ» на [А]. Или с надписью «ВОЛКИ», тогда — на [Б]."
    mood: tense
    entry:
      - grant:
          item: feather
          count: 1
        once: true
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "24"
          letter: А
        - label: Вариант Б
          to: "318"
          letter: Б
  "240":
    title: Глава 240
    text: Ты абсолютно прав! Металлический пол в этой комнате красный именно от жара. Не жди, пока прогорят подошвы твоих ботинок, беги дальше. Или на восток к [А]. Или на юг к [Б].
    mood: calm
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "220"
          letter: А
        - label: Вариант Б
          to: "212"
          letter: Б
  "241":
    title: Глава 241
    text: В этой комнате темно и чертовски холодно, вокруг покрытые льдом и занесенные снегом туши животных. Наверное, ты попал в огромный холодильник. Ты недостаточно голоден, чтобы разбираться, справедлива ли твоя догадка. К тому же, судя по размерам, под снегом погребены туши тиранозавров, а вкусовые достоинства мяса древних ящеров весьма сомнительны. На негнущихся от жуткого мороза ногах ты обходишь обширную комнату и обнаруживаешь три выхода. На запад к [А]. На восток к [Б]. И на юг к [В]. Ты спешишь выбраться из царства холода через один из них.
    mood: mystery
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "234"
          letter: А
        - label: Вариант Б
          to: "211"
          letter: Б
        - label: Вариант В
          to: "238"
          letter: В
  "242":
    title: Глава 242
    text: Оставив наконец за спиной мрачное лежбище звездного чудища, ты выскакиваешь из тоннеля в ослепительно яркий день. Перед тобой на песке цепочка следов. Их, конечно же, оставил безумный проф! Не забывая об опасности, следуй за ним.
    mood: mystery
    interaction:
      type: continue
      to: "8"
  "243":
    title: Глава 243
    text: Ты счастливчик! Сейди-Садистик выставляет правую руку, ее большой палец направлен вверх. Всхлипывая, ты отправляешься.
    mood: calm
    interaction:
      type: continue
      to: "348"
  "244":
    title: Глава 244
    text: Пол в комнате мягкий, как перина. Так и хочется улечься на него. К тому же ты чертовски устал, и тебя ни с того ни с сего одолела зевота. Но спать нет времени. Поспеши на север к [А]. Или на восток к [Б].
    mood: calm
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "259"
          letter: А
        - label: Вариант Б
          to: "295"
          letter: Б
  "245":
    title: Глава 245
    text: Солнце уже коснулось горизонта, а тропинке все нет конца. Может, приляжешь отдохнуть? Да, я тоже слышу журчание воды. Пройдя еще немного, ты раздвигаешь кусты и осторожно выглядываешь. Тропа кончается у обрыва, внизу течет стремительная река. К счастью, пересечь реку несложно — неподалеку ты видишь каменный мост. Отлично! Опасения внушает лишь вооруженный стражник на мосту. Незамеченным тебе мимо него не пройти. Может, расположиться в кустах на [А], допить вино, выспаться, а к утру, глядишь, стражник и уйдет? Или прямо сейчас бесстрашно ринуться через мост к [Б] ? Решай сам!
    mood: danger
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "127"
          letter: А
        - label: Вариант Б
          to: "6"
          letter: Б
  "246":
    title: Глава 246
    text: Отлично сработано! Ты перерубаешь дубину в руке робота напополам. Он отступает, бормоча скрипучие механические проклятия, затем вдруг достает из-за крышки на груди молот и вновь бросается на тебя. Если, отступив на шаг, ударишь его мечом по ногам, ты — на [А]. Если по голове, то на [Б].
    mood: danger
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "258"
          letter: А
          if:
            has_item:
              id: sword
        - label: Вариант Б
          to: "262"
          letter: Б
  "247":
    title: Глава 247
    text: Уф! До чего здесь приятно дышится после комнаты с воздухом-киселем. Ты находишься в длиннющем коридоре со множеством изгибов. Ты несешься по нему, лихо вписываясь в повороты. Пол под ногами заметно идет под уклон, и ты еще больше прибавляешь прыти. Ты беззаботен и счастлив, как вдруг… Поверь, я рыдаю вместе с тобой. Дальше пути нет. Ты уперся в стену. Внимательно осмотрись, может, отыщешь потайные двери. Дверей нет? Ничего не поделаешь. Иди по коридору назад до самой ненавистной комнаты с густым воздухом.
    mood: calm
    interaction:
      type: continue
      to: "296"
  "248":
    title: Глава 248
    text: Ты вновь протягиваешь к рубину руку и вновь замираешь. Да, я тоже вижу тонюсенькие провода, которые тянутся от рубина к дырке в столе. Если ты поднимешь рубин, провода оборвутся, и тогда… Будь осторожен и останешься цел! Отступи на шаг, вытащи из ножен меч и поддень рубин.
    mood: victory
    interaction:
      type: continue
      to: "165"
  "249":
    title: Глава 249
    text: "Ты забираешься под куст и убеждаешься, что с тропы тебя не видно. Шаги приближаются и вдруг а замирают. Раздается шелест листвы, затем хриплый голос: — Я — властелин этих джунглей, от меня здесь не скроется никто! Выходи, чужак! Я знаю, где ты! Выбора у тебя нет, и, дрожа, ты вылезаешь из кустов."
    mood: tense
    interaction:
      type: continue
      to: "131"
  "250":
    title: Глава 250
    text: Полагая, что с тобой кончено, робот с победным воплем бросается на тебя, но ты бьешь его обеими ногами в грудь. Он падает на край моста, ты приставляешь острие своего меча к его горлу, и вы оба переноситесь.
    mood: danger
    interaction:
      type: continue
      to: "316"
  "251":
    title: Глава 251
    text: "Ты в комнате, освещенной лишь тусклой вонючей свечкой. Здесь жарко, душно, тесно, низкий потолок почти физически давит на тебя… Да не бейся же, как сумасшедший, плечом в дверь! Ведь слышал, как в замке за твоей спиной повернулся ключ. Есть ли отсюда другой выход? И это спрашивает полевой агент Спецкорпуса! Немедленно обойди комнату и выясни. Так, окон нет, дверей нет, кроме той, через которую ты вошел. Мне понятны твои чувства, новобранец. Заперт без пищи, без воды, без будущего… Остается лишь сесть на каменный пол и впасть в депрессию. Именно так ты и поступаешь. Ты тоже заметил? Не отвечай, мне ясен ответ по тому, с какой скоростью ты вскакиваешь на ноги и кидаешься к стене. В едва видимой нише — ручка! Дерни за нее, и в стене откроется потайной ход, который выведет тебя на свободу! Прямо как в телесериалах для домохозяек! Извини, я не заметил надпись под ручкой. Что там? Понятно: ЗА РУЧКУ НЕ ДЕРГАТЬ!!! Хорошенькое дело! На стене ручка, но дергать за нее нельзя! Что ж, посиди, раскинь мозгами. Кстати, как ты думаешь, сколько времени ты уже провел в этой комнате? Не знаешь?! Так взгляни на свечу. Я тоже считаю, что не меньше трех часов. Согласен, пробил час, пора действовать. Да, ты можешь сделать только одно: дернуть злополучную ручку. Ты встаешь, медленно подходишь к стене, сжимаешь ручку и, набравшись храбрости, дергаешь ее на себя. Под твоими ногами открывается потайной люк, и ты падаешь."
    mood: mystery
    interaction:
      type: continue
      to: "239"
  "252":
    title: Глава 252
    text: "— Стой! — хрипло орет робот. — Кто идет? — Я, — без затей отвечаешь ты. — Пароль! — приказывает робот. Ты неохотно подходишь ближе и бормочешь: — Пароль — антидисестаблишментарианизм. Подняв над головой дубину, робот несется на тебя с криком: — Пароль вчерашний! Шпион! Как поступишь? Увернешься от удара дубины? Тогда ты — на [А]. Или, может, выхватишь меч? В этом случае ты — на [Б]."
    mood: danger
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "74"
          letter: А
        - label: Вариант Б
          to: "246"
          letter: Б
  "253":
    title: Глава 253
    text: Ты падаешь на кучу песка посреди обширного, вырубленного в монолитной скале зала. Поднимаешь глаза. Песок насыпался сюда через дыру в потолке, но дыра высоко, до нее не добраться, даже и не пытайся. Ты в ловушке! Растерянно осматриваешься. Голые стены зала украшены как бы светящимися изнутри, явно инопланетными, абстрактными росписями, которым по виду не меньше сотни тысяч лет. На присыпанном песком полу — цепочка хорошо знакомых тебе следов. Проф опять сбежал! Не сиди же сиднем! Выполняй задание! Да, песок покрывает пол только рядом с кучей, в которую угодили и ты, и проф, а дальше — лишь гладкий камень, следы обрываются. Из зала ведут две двери, одна — на восток, другая — на юг. Да, чуть не забыл. Вот тебе совет, который, возможно, спасет тебе жизнь! Достань из кармана компас, карандаш и клочок бумаги. Достал? Отлично. Пойдешь по лабиринту, рисуй план. С его помощью ты не попадешь дважды в одно и то же место и отыщешь выход, если он, конечно, существует. Теперь иди. Или через восточную дверь на [А]. Или через южную на [Б].
    mood: danger
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "269"
          letter: А
        - label: Вариант Б
          to: "227"
          letter: Б
  "254":
    title: Глава 254
    text: Классный выстрел! Ты поразил свою мишень в самую середину, а твой соперник на этот раз не попал даже в дерево.. Пока ничья, один-один, посмотрим, как поединок пойдет дальше. Победно улыбаясь ты вновь натягиваешь лук целишься, Роббин Гут делает то же самое, и вы одновременно выпускаете стрелы.
    mood: tense
    interaction:
      type: roll
      formula: 1d6
      outcomes:
        - min: 4
          max: 6
          to: "289"
        - min: 1
          max: 3
          to: "163"
  "255":
    title: Глава 255
    text: "Ты жив и ты на крыше. Размахивая над головой дубинкой, ты преследуешь безумного профа. Он в страхе бежит от тебя. Спотыкается и падает! Он твой! Сейчас ты схватишь его за руку, нажмешь кнопку в кармане, и дело сделано! Вселенная спасена, ты со стаканчиком виски в руке нежишься в теплой ванне, вокруг вьются стройные полуобнаженные девочки с пышными формами, и… Проф, приподнявшись, нацеливает на тебя огромный черный пистолет и цедит сквозь зубы: — Еще шаг, думкопф, я нажимаю дер крючок, и ты — покойник! Кхе-кхе-хе! Что ж, диспозиция понятна. Если, презрев опасность, бросишься на профессора, то ты — на [А]. Если остановишься в нерешительности, то на [Б]."
    mood: tense
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "231"
          letter: А
        - label: Вариант Б
          to: "10"
          letter: Б
  "256":
    title: Глава 256
    text: Затаив дыхание, ты крадешься вокруг шара. Эх, если бы в твоей руке была окованная железом дубинка! Но, ухватившись за свисающую с воздушного шара веревку, ты расстался с верным оружием. Не отчаивайся, у тебя есть сила, храбрость и полная экипировка полевого агента. Услышав подозрительный звук, ты замираешь. Не бойся, это всего лишь ветер теребит ткань полуспущенного баллона. Ты продолжаешь движение и тут видишь на песке свежие отпечатки подошв. Следы, без сомнения, оставил профессор! Следуй за ним.
    mood: tense
    interaction:
      type: continue
      to: "225"
  "257":
    title: Глава 257
    text: Прекрасный выстрел! Ты поразил свою мишень в самую середину, а твой соперник не попал даже в дерево. Победно улыбаясь, ты вновь натягиваешь лук, целишься, Роббин Гут делает то же самое, и вы одновременно стреляете.
    mood: danger
    interaction:
      type: roll
      formula: 1d6
      outcomes:
        - min: 4
          max: 6
          to: "27"
        - min: 1
          max: 3
          to: "84"
  "258":
    title: Глава 258
    text: Не слишком удачный прием! Робот, бешено вращая молотом, перепрыгивает через твой меч и вмиг оказывается рядом с тобой. Ты уворачиваешься, но недостаточно проворно. Скользящий удар молотом приходится по твоему шлему, и ты, оглушенный, падаешь.
    mood: danger
    interaction:
      type: continue
      to: "250"
  "259":
    title: Глава 259
    text: Попался, как мышь в мышеловку! Прекрати истерику и еще раз внимательно осмотрись! Что я говорил? Незапертая дверь! Та самая, через которую ты сюда и попал. Отправляйся назад на юг.
    mood: calm
    interaction:
      type: continue
      to: "244"
  "260":
    title: Глава 260
    text: |-
      На тебе все еще невидимый пояс. Нажми кнопку на пряжке и перенесешься на [А]. Или беги от чудовища наутек к [Б]
      Ты уже приобрел опыт укрощения диких зверей. Воспользуйся им. Расправь плечи, расставь ноги и укроти кабана взглядом на [В]. Или спой с двенадцатитонной громадиной на [Г]
      Кабан приближается. Решай быстрей!
    mood: calm
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "312"
          letter: А
          if:
            stat:
              id: belt_charges
              op: ">"
              value: 0
        - label: Вариант Б
          to: "287"
          letter: Б
        - label: Вариант В
          to: "141"
          letter: В
        - label: Вариант Г
          to: "187"
          letter: Г
  "261":
    title: Глава 261
    text: Пройдя по следам профа между холмами, ты неожиданно оказываешься на мощенной крупными булыжниками дороге. Здесь следы обрываются. В какую же сторону направился старый безумец? Спросить не у кого. По-моему, самый подходящий случай воспользоваться ДОСПом, или, как ты его по-прежнему называешь, монетой. Достань его из кармана, подбрось, поймай на раскрытую ладонь. Теперь смотри, что выпало. ДОСП стоит на ребре? Невероятно! Что ж, попробуй еще раз. Подкинь, поймай. Что выпало? Если орел, то отправляйся по дороге на север. Если решка, то на юг.
    mood: tense
    interaction:
      type: roll
      formula: 1d2
      outcomes:
        - min: 2
          max: 2
          to: "277"
        - min: 1
          max: 1
          to: "190"
  "262":
    title: Глава 262
    text: Не слишком удачный прием! Робот, бешено вращая молотом, уклоняется от твоего меча и через миг оказывается рядом с тобой. Ты уворачиваешься, но недостаточно быстро. Скользящий удар молотом приходится по твоему шлему, и ты, оглушенный, падаешь.
    mood: danger
    interaction:
      type: continue
      to: "250"
  "263":
    title: Глава 263
    text: "Из последних сил ты доплываешь до берега, хватаясь за ветки кустов, вылезаешь из воды и пластом ложишься на мягкую траву. Неожиданно о себе дает знать выпитая бутылка дешевого вина. Голова твоя кружится, на тело тяжелой волной наваливается усталость. Но ты молод, полон сил и твое здоровье пока не подорвано алкоголем. Вскоре ты приходишь в себя, встаешь на ноги и… На тебя в упор смотрит безобразное чудище: глаза крупней суповых тарелок, пять острых, как кинжалы, зубов, толстенные, как канаты, щупальца. Ты не знаешь, с кем столкнула тебя судьба? А вот я, к сожалению, знаю. Перед тобой весьма редкий в Галактике, ядовитый и смертельно опасный монстр Зеленый Пупок. Внимание, монстр готовится к атаке! Если сломя голову побежишь от него, то очутишься на [А]. Если же выстрелишь в него из лука, то на [Б]."
    mood: danger
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "172"
          letter: А
        - label: Вариант Б
          to: "195"
          letter: Б
          if:
            has_item:
              id: bow
  "264":
    title: Глава 264
    text: Согласен, при проливном дожде, ослепительных вспышках молний и оглушающих раскатах грома мысли сами собой путаются в голове. Но напрягись и, осмотревшись, выбирайся отсюда. При очередной вспышке ты замечаешь два темных провала-выхода. На восток к [А]. И на север к [Б]. Выбирай любой.
    mood: calm
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "294"
          letter: А
        - label: Вариант Б
          to: "203"
          letter: Б
  "265":
    title: Глава 265
    text: Бултых! Ты погружаешься все глубже и глубже. Наконец начинаешь медленный подъем к поверхности. Твои легкие от недостатка воздуха горят огнем. Но не открывай рта, не вдыхай! Иначе конец твоей карьере в Спецкорпусе… Но тебе нужен воздух! Подожди! Еще немного, и… Воздуха!!! Ты выплыл! Воздух! Ты судорожно ловишь его широко раскрытым ртом, наслаждаешься каждым вдохом. Жизнь восхитительна! Подхваченный стремительным течением, ты плывешь вниз по реке. Наконец ты чувствуешь, что силы вернулись к тебе, и гребешь к берегу. Но в каком месте выбираться на берег? Можно на песчаном пляже [А], что прямо перед тобой. А можно, проплыв по течению чуть дальше, вылезти у тех кустов под защитой деревьев на [Б].
    mood: calm
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "135"
          letter: А
        - label: Вариант Б
          to: "263"
          letter: Б
  "266":
    title: Глава 266
    text: "После того как вы с кабаном на два голоса исполнили «Ферму старика Макдональда» и «Свинка идет в магазин», то сразу сделались закадычными приятелями. Ну до чего же он чувствительная натура! У него в глазах слезы! Слушай, что он тебе говорит: — Рад приятной встрече, незнакомец! Я не пел с таким удовольствием с тех пор, как был маленьким поросенком. Да, много с той поры пересохло болот… Петь меня и моих обожаемых братьев и сестер научила дорогая матушка. Она не раз рассказывала нам, что прежде была человеком, оперной певицей, обладала божественным меццо-сопрано и даже выступала в Ла Скала, но однажды вместо обычного си пропела си-бемоль, и дирижер, который в свободное время занимался колдовством, превратил ее в кабаниху. Растерзав его на куски, матушка убежала через оркестровую яму… А ты, незнакомец, веришь в чудесную историю? Ты поспешно киваешь. Правильно, не спорить же с этакой громадиной! — Веришь? — удивляется он. — Это удивительно, ведь, сказать по правде, я нашей семейной легенде не доверяю. По-моему, матушка была романтичной натурой и все до последнего слова выдумала. Но кто из нас без греха?.. Приятно было спеть с тобой. Будет свободная минутка, заходи, споем еще. А теперь до свидания. Тебе по этой тропе."
    mood: tense
    interaction:
      type: continue
      to: "73"
  "267":
    title: Глава 267
    text: "Надпись не обманула — ты прошел через дверь, но мгновенной смерти не последовало. Ты идешь по узкому коридору и слышишь, как из-под ног с писком разбегаются невидимые в полумраке крысы. Вскоре ты оказываешься перед очередной дверью, из щели в стене рядом с ней струится свет, и ты хоть, и с трудом, но все же читаешь очередную надпись: ЕСЛИ ДОРОЖИШЬ ЖИЗНЬЮ, ТО ДЕРЖИСЬ ОТ ЭТОЙ ДВЕРИ ПОДАЛЬШЕ! Судя по всему, именно за этой дверью и находится Рубин Джунглей. Открывай же и смело иди."
    mood: danger
    interaction:
      type: continue
      to: "119"
  "268":
    title: Глава 268
    text: Едва ты удаляешься на несколько шагов, как до тебя доносятся глухие удары, жалобный плач и презрительный смех — гигант избивает несчастных роботов. Твое сердце не выдерживает, ты разворачиваешься и с криком гнева бросаешься в бой.
    mood: calm
    interaction:
      type: continue
      to: "157"
  "269":
    title: Глава 269
    text: Ты попал в шестиугольную комнатенку. Ну и росписи на стенах! Не иначе создавшая их раса поголовно состояла из одних извращенцев! Не обращая внимания на безвкусные росписи, огляди комнатенку. Так, три двери. Можешь пойти на запад к [А]. Или на восток к [Б]. Или на юг к [В].
    mood: danger
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "253"
          letter: А
        - label: Вариант Б
          to: "293"
          letter: Б
        - label: Вариант В
          to: "341"
          letter: В
  "270":
    title: Глава 270
    text: Впереди ты слышишь тяжелую поступь, и, прежде чем успеваешь спрятаться в кустах, на тропинку выбегает волосатый гигант с огромной дубиной в руках. Гигант широк в плечах, мускулист и высок, ты что вряд ли ты одержишь над ним победу в бою, но сомнительно, чтобы он был быстр на ногу. Не опасаясь прослыть трусом, беги от него!
    mood: danger
    interaction:
      type: continue
      to: "75"
  "271":
    title: Глава 271
    text: От шлема ты избавляешься без проблем, но вскоре выясняешь, что, держась одной рукой за шаткую деревянную лестницу, снимать с себя тяжелую кольчугу — весьма нелегкое занятие. Не просто нелегкое, а даже и вовсе непосильное. Как выпутаться из этой затруднительной ситуации? Великолепное решение! Повесив лук и колчан на перекладину лестницы, ты, подобно заправскому акробату, переворачиваешься вниз головой — и кольчуга слетает с тебя сама! Сделано! Теперь, вновь приняв вертикальное положение и набрав в легкие побольше воздуха, ты разжимаешь пальцы. Сначала левой руки, потом… Не трусь же, отпускай руку! Поморщившись, как от зубной боли, ты справляешься с непослушной правой рукой, отталкиваешься от лестницы и летишь, летишь…
    mood: calm
    entry:
      - drop:
          item: chainmail
          count: 1
      - drop:
          item: helmet
          count: 1
    interaction:
      type: continue
      to: "265"
  "272":
    title: Глава 272
    text: "Ты в комнате, освещенной лишь тусклой вонючей свечкой. Здесь жарко, душно, тесно, низкий потолок почти физически давит на тебя… Да не бейся же, как сумасшедший, плечом в дверь! Сам же слышал, как в замке за твоей спиной повернулся ключ. Есть ли отсюда другой выход? И это спрашивает у меня полевой агент Спецкорпуса! Немедленно обойди комнату и выясни, что тут есть! Так, окон нет, дверей тоже. Мне понятны твои чувства, новобранец. Заперт без пищи, без воды, без будущего… Остается лишь сесть на каменный пол и впасть в депрессию. Именно так ты и поступаешь. Ты тоже заметил? Не отвечай, мне ясен ответ по тому, с какой скоростью ты вскакиваешь на ноги и кидаешься к стене. В едва видимой нише — ручка! Дерни за нее, и в стене откроется потайной ход, который выведет тебя на свободу! Прямо как в телесериалах для домохозяек! Нет, я не сразу заметил надпись под ручкой, но теперь вижу: ЗА РУЧКУ НЕ ДЕРГАТЬ!!! Хорошенькое дело! На стене ручка, но дергать за нее нельзя! Что ж, посиди, подумай, как поступить. Кстати, как полагаешь, сколько времени ты уже провел в этой комнате? Не знаешь?! Так взгляни на свечу. Я тоже считаю, что не меньше трех часов. Согласен, пробил час, пора действовать. Да, в твоих силах лишь одно: дернуть злополучную ручку. Ты встаешь, медленно подходишь к дальней стене, сжимаешь ручку и, набравшись храбрости, дергаешь ее на себя. Под твоими ногами открывается потайной люк, и ты падаешь с небольшой высоты, поспешно встаешь и оглядываешься."
    mood: danger
    interaction:
      type: continue
      to: "280"
  "273":
    title: Глава 273
    text: "Ты оказываешься в небольшой пыльной комнате с четырьмя дверями в дальней стене, на дверях цифры: 1, 2, 3, 4. За спиной звучит гнусный голос толстяка: — Выбирайте свою судьбу! Выбирайте, какой смертью умрете! Выбирайте дверь, входите и умирайте! Удачи вам! Ха-ха! Но помните, что в дверь под номеров четыре можно войти, только после схватки на двух аренах. Так что выбирайте из первых трех! Не спрашивай меня. Как и ты, я не имею ни малейшего понятия, куда идти. Решай сам. Войдешь ли в дверь под номером один, ведущую к [А] ? Или встретишь свою судьбу на [Б], воспользовавшись второй дверью? А, может, ты предпочтешь третью дверь и, чем черт не шутит, выиграешь на [В] ?"
    mood: danger
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "285"
          letter: А
        - label: Вариант Б
          to: "239"
          letter: Б
        - label: Вариант В
          to: "251"
          letter: В
  "274":
    title: Глава 274
    text: Ты счастливчик! Сейди-Садистик выставляет правую руку, ее большой палец направлен вверх. Всхлипывая, ты отправляешься.
    mood: calm
    interaction:
      type: continue
      to: "348"
  "275":
    title: Глава 275
    text: Ты прав — на помощь нытиков рассчитывать не стоит. Едва между тобой и гигантом завязался бой, как роботы, вопя от ужаса, разбежались кто куда. Не чуя под собой ног, ты удираешь, но гигант оказывается проворнее, чем ты предполагал. Он бежит за тобой, грязно ругаясь, наступает на пятки, вот-вот схватит. Выбора у тебя нет, поворачивайся и принимай бой! Тут тебе на плечо ложится грязная волосатая ручища. Ты извиваешься, силишься вырваться, но в медвежьих объятиях гиганта беспомощен, как дитя. Гигант обыскивает тебя и, найдя Рубин Джунглей, оглашает лес победным ревом. Тычок его кулака в спину, и ты оказываешься на земле. Детина грубо хватает тебя за ноги, подтаскивает к дереву, привязывает к стволу лианами. Если желаешь знать, что дальше, смотри.
    mood: victory
    interaction:
      type: continue
      to: "70"
  "276":
    title: Глава 276
    text: "Что есть духу ты несешься по коридору, который приводит тебя к винтовой лестнице. Ты колеблешься? Почему? А-а-а, теперь и я слышу. Действительно, похоже, что на верхних ступенях скребутся крысы. Ты полагаешь, что звуки сверху скорее напоминают частую дробь человеческих шагов? Что ж, задание твое: что делать — решай сам. Ты несешься вверх по ступенькам, с каждым шагом бежать все труднее, дыхание становится хриплым и прерывистым. Похоже, сынок, ты не в лучшей спортивной форме? Ясно, ясно. Ты бы предпочел, чтобы по крутым лестницам бегал я, а ты бы, сидя в удобном кресле, комментировал мои действия. Что ж, мне твоя точка зрения понятна, но, нравится тебе или нет, пока не выполнишь задания, каждый из нас останется на своем месте. Осторожно перед тобой дверь! Ты бьешься в нее плечом. Заперто. Но вспомни, что в твоей руке верная дубинка. Высади дверь."
    mood: calm
    interaction:
      type: continue
      to: "95"
  "277":
    title: Глава 277
    text: Уже третий час ты бредешь по дороге, вокруг — ни души. Ветер колышет ветви сухих деревьев, и они скрипят, будто жалуясь. Впереди показался длинный старый мост через бездонное ущелье, середина моста обвалилась. Как же ты переберешься на противоположную сторону? Действительно, и ребенку ясно, что раз перебраться на ту сторону не по силам даже тебе, то старому профу и подавно. Следовательно, ты пошел по дороге в неправильном направлении.. Ничего не поделаешь, поворачивай на сто восемьдесят градусов и отправляйся.
    mood: tense
    interaction:
      type: continue
      to: "190"
  "278":
    title: Глава 278
    text: Дрожащий язычок пламени зажигалки все ближе, смех злодея все громче… Внезапно руку гиганта пригвождает к земле трезубец. Гигант ревет и ругается, но едва успевает высвободиться, как на него падает сеть. Джунгли оглашает садистский смех. Садистский?.. Похоже, тебе на помощь как нельзя вовремя явились Сыны Садизма! А вместе с ними — Сейди-Садистик! Она перерезает лианы. Ты свободен! — Ты украл Рубин? — нетерпеливо спрашивает она. — Говори же! Ты указываешь туда, где валяется на земле Рубин Джунглей, Сейди хватает его и со смехом кружится вокруг тебя в безумной пляске. — Ты добыл его! — кричит она. — И Сейди-Садистик сдержит свое слово! Ты получишь награду! Интересно, чем она наградит тебя. Об этом узнаешь.
    mood: danger
    entry:
      - drop:
          item: ruby
          count: 1
    interaction:
      type: continue
      to: "147"
  "279":
    title: Глава 279
    text: Удар лапищи хищника, и ты отлетаешь в один угол комнаты, твой меч — в другой. А ты хоть и кретин, но в храбрости тебе не откажешь! Ты хватаешь меч, вновь занимаешь боевую стойку, а саблезубый тигр, хлеща себя по бокам длиннющим хвостом, вновь приближается. Может, все же выслушаешь мой совет и поживешь еще малость? Отлично, тогда быстрее.
    mood: danger
    interaction:
      type: continue
      to: "326"
  "280":
    title: Глава 280
    text: "Ты оказался в комнате без дверей и окон. Не бубни под нос проклятия в мой адрес. Лучше выпрями спину, подними подбородок и встреть судьбу, как и подобает полевому агенту Спецкорпуса, бесстрашно и гордо! Слышишь? Да, приближаются шаги. Из темного прохода, которого ты прежде не заметил, появляется детина, по виду типичный орангутанг. В левой руке детина держит круглый шит и короткий меч, в правой — сеть и трезубец. Он говорит тебе: — Эй, червяк, тебе выпала честь умереть на арене во славу несравненной Сейди-Садистик! Гордись, своей смертью ты укрепишь ее и без того безграничное могущество и, быть может, увеличишь ее банковский счет а теперь выбирай оружие. Если возьмешь трезубец и сеть, то отправляйся на [А]. Если щит и короткий меч, то на [Б]. Решай живее!"
    mood: danger
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "100"
          letter: А
        - label: Вариант Б
          to: "173"
          letter: Б
  "281":
    title: Глава 281
    text: Пользуясь удивительными возможностями своей давно забытой науки, древние строители изобразили на потолке тучу, из тучи моросит настоящий дождь, комнату продувает пронизывающий ветер. Бр-р-р! Согласен, я тоже сыт здешними чудесами по горло! Быстро обойдя негостеприимную комнату, ты обнаруживаешь две двери. На север к [А]. И на запад к [Б]. Решай быстрее, куда направишься.
    mood: mystery
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "300"
          letter: А
        - label: Вариант Б
          to: "211"
          letter: Б
  "282":
    title: Глава 282
    text: "Не слишком удачный ход! Сеть оказалась прочной, и противник ударом ноги в пах опрокидывает тебя на землю. Его нога на твоей груди, трезубец — у горла; он обращается королевской ложе: — Скажи, о несравненная Сейди-Садистик, прикончить ли мне этого слабака на месте или подарить ему его никчемную жизнь? Как поступит Сейди-Садистик? Хороший вопрос. Подбрось ДОСП и узнаешь. Если выпадет орел. Если решка."
    mood: danger
    interaction:
      type: roll
      formula: 1d2
      outcomes:
        - min: 2
          max: 2
          to: "233"
        - min: 1
          max: 1
          to: "209"
  "283":
    title: Глава 283
    text: "Не слишком удачный ход! Верзила разрубает сеть острым, как бритва, мечом и ударом щита по голове опрокидывает тебя на землю. Его нога на твоей груди, меч — у горла; он обращается к Королевской ложе: — Скажи, о несравненная Сейди-Садистик, прикончить ли мне этого слабака на месте или подарить ему его никчемную жизнь? Как поступит Сейди-Садистик? Хороший вопрос. Подбрось ДОСП и узнаешь. Если выпадет орел. Если решка."
    mood: danger
    interaction:
      type: roll
      formula: 1d2
      outcomes:
        - min: 2
          max: 2
          to: "243"
        - min: 1
          max: 1
          to: "274"
  "284":
    title: Глава 284
    text: Ты опять промахнулся, а Роббин Гут опять попал. Но не отчаивайся! Собери волю в кулак и стреляй. Ты целишься, отпускаешь тетиву, и твоя стрела со свистом рассекает воздух.
    mood: tense
    interaction:
      type: roll
      formula: 1d6
      outcomes:
        - min: 4
          max: 6
          to: "286"
        - min: 1
          max: 3
          to: "184"
  "285":
    title: Глава 285
    text: "С убийственным звуком дверь за тобой захлопывается. Не царапай ее ногтями, путь к отступлению отрезан. И не бубни под нос проклятия в мой адрес. Лучше выпрями спину, подними подбородок и встреть судьбу, как подобает полевому агенту Спецкорпуса, бесстрашно и гордо! Слышишь? Приближаются чьи-то шаги. Из темного прохода, которого ты прежде не заметил, выходит детина, по виду — вылитый орангутанг. В левой руке он держит круглый щит и короткий меч, в правой — сеть и трезубец. Он заявляет: — Эй, червяк, тебе выпала честь умереть на арене во славу несравненной Сейди-Садистик! Гордись, своей смертью ты укрепишь ее и без того безграничное могущество и, быть может, увеличишь ее банковский счет. А теперь выбирай оружие. Если возьмешь трезубец и сеть, то отправляйся на [А]. Если щит и короткий меч, то на [Б]. Решай живей!"
    mood: danger
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "100"
          letter: А
        - label: Вариант Б
          to: "173"
          letter: Б
  "286":
    title: Глава 286
    text: Опять промахнулся, а Роббин Гут опять попал! Ты проиграл поединок, и не просто проиграл, что само по себе обидно, а проиграл всухую! С перекошенным от злости лицом ты переносишься.
    mood: tense
    interaction:
      type: continue
      to: "44"
  "287":
    title: Глава 287
    text: Спастись бегством — не такое уж разумное решение, каким казалось поначалу. Кабан не только пыхтит, как локомотив, но и несется с той же скоростью. Ты уже ощущаешь на затылке его зловонное дыхание. Ударом пятачка он отбрасывает тебя. Оказавшись там, прими другое, более мудрое решение!
    mood: calm
    interaction:
      type: continue
      to: "260"
  "288":
    title: Глава 288
    text: Тебя, не иначе, занесло в преисподнюю! Быстрее возвращайся туда, откуда начал путь!
    mood: grief
    ending: true
  "289":
    title: Глава 289
    text: Ты попал, а соперник промахнулся! Счет стал два-один в твою пользу. Спокойно целься и стреляй.
    mood: tense
    interaction:
      type: roll
      formula: 1d6
      outcomes:
        - min: 4
          max: 6
          to: "343"
        - min: 1
          max: 3
          to: "133"
  "290":
    title: Глава 290
    text: Ты вовремя замечаешь, что навстречу тебе идет верзила и лихо помахивает окованной медью дубиной. А ты шустрый парень, когда захочешь! И неглупый к тому же! Ты подскакиваешь к ближайшему придорожному кусту, вытаскиваешь из кармана нож, проворно срезаешь довольно толстый посох и прячешь нож. Верзила меж тем подходит ближе. Решай, спросишь ли его на [А], не видел ли он взлохмаченного седовласого старика. Или, сделав вид, что не замечаешь его, пройдешь мимо к [Б].
    mood: danger
    entry:
      - grant:
          item: staff
          count: 1
        once: true
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "132"
          letter: А
        - label: Вариант Б
          to: "154"
          letter: Б
  "291":
    title: Глава 291
    text: Похоже, невзгоды, перенесенные тобой на этой планете, действительно превратили тебя в идиота! Быстрее вернись и хорошенько раскинь мозгами!
    mood: calm
    interaction:
      type: continue
      to: "350"
  "292":
    title: Глава 292
    text: Ты совершенно прав, действительно, клиренс — расстояние между низшей точкой корпуса автомобиля и дорогой. Получай в актив еще сто очков и двигай сразу.
    mood: calm
    interaction:
      type: continue
      to: "229"
  "293":
    title: Глава 293
    text: Заполненный ржавыми пыльными механизмами склад. Обойдя его, ты обнаруживаешь две двери. На север к [А]. И на запад к [Б]. Решай быстрей, куда направишься.
    mood: mystery
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "295"
          letter: А
        - label: Вариант Б
          to: "269"
          letter: Б
  "294":
    title: Глава 294
    text: Действительно ли твое лицо обдувает свежий ветерок, или ты принимаешь желаемое за действительное? Я не знаю, а ты и подавно. Время покажет, а пока продолжай поиски безумного профа. Или на юг к [А]. Или на запад к [Б].
    mood: calm
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "226"
          letter: А
        - label: Вариант Б
          to: "264"
          letter: Б
  "295":
    title: Глава 295
    text: Погруженная в багровый полумрак комната действует тебе на нервы. Поспеши же отсюда. На запад к [А]. Или на юг к [Б].
    mood: calm
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "244"
          letter: А
        - label: Вариант Б
          to: "293"
          letter: Б
  "296":
    title: Глава 296
    text: От усталости ты едва не валишься с ног. Неудивительно, ведь умершие тысячелетия назад ученые изменили физические свойства воздуха в этой комнате, и он стал густой, как кисель. На каждый тяжелый вдох у тебя уходит минута, на шаг, как тебе кажется, — час. Но не падай духом, иди, борись, раздвигай грудью неподатливый воздух. Остановка — верная смерть! Знай, что я горжусь тобой! Как ни был труден путь, но ты справился — обошел комнату и отыскал три выхода. На восток к [А]. На запад к [Б]. И на север к [В]. Выбирайся отсюда!
    mood: danger
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "247"
          letter: А
        - label: Вариант Б
          to: "226"
          letter: Б
        - label: Вариант В
          to: "212"
          letter: В
  "297":
    title: Глава 297
    text: Длинная комната, вдоль стен груды неизвестных тебе предметов, пол залит буро-коричневой зловонной водой. Похоже, тебя занесло на свалку. Шлепая но щиколотку в ледяной воде, ты обнаруживаешь две двери. На север [А]. И на юг [Б]. Выбирайся через любую.
    mood: calm
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "227"
          letter: А
        - label: Вариант Б
          to: "211"
          letter: Б
  "298":
    title: Глава 298
    text: Если ты ответил, что в 1492 году от рождества Христова Колумб открыл Америку, отправляйся. Если нет, считай себя уволенным и выбирайся как знаешь.
    mood: calm
    interaction:
      type: continue
      to: "229"
  "299":
    title: Глава 299
    text: "Одобрительно кивнув, дракон заявляет: — А ты, парень, гораздо умней, чем тот идиот, который топал ногами и орал на меня, пока я не швырнул его в клетку. Слушай же внимательно. Я — то самое звездное чудовище, что было заключено сюда миллионы лет назад злодеями какалоками. После того как они сотни тысяч лет назад вымерли, я мог преспокойно уйти отсюда, но, уже привыкнув к этому месту, остался. Действительно, стоит ли от добра добра искать? На воле у меня нет ни приличного логова, ни верных жен, а здесь цветной телевизор, стереоустановка, практически неограниченный запас угля, приличная сервировка… Чего еще желать на старости лет? Знай же, что к прочим моим достоинствам я наделен способностью читать мысли и знаю, что тот профессор в клетке задумал уничтожить Вселенную. Поскольку сам я живу в этой самой Вселенной, то его замыслы мне не очень нравятся; ты же, явившись сюда с намерением доставить его в суд, мне по душе. Обещаю, что ты получишь своего профессора и благополучно выберешься отсюда, если только, ответив на мои вопросы, наберешь сто очков. Если же откажешься от испытания, то я тебя, извини, съем. Ну что, согласен? Ты неохотно киваешь."
    mood: mystery
    interaction:
      type: continue
      to: "350"
  "300":
    title: Глава 300
    text: Ты оказался в комнате, наполненной газом счастья. Ты смеешься, как идиот, плачешь от счастья, бесцельно бродишь по кругу. Сейчас же возьми себя в руки! Так-то лучше. Истерично хихикая, ты отыскиваешь две двери. На восток к [А]. И на юг к [Б]. Быстрее выбирайся отсюда через любую из них.
    mood: calm
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "217"
          letter: А
        - label: Вариант Б
          to: "281"
          letter: Б
  "301":
    title: Глава 301
    text: Ты карабкаешься, карабкаешься, карабкаешься вверх, пальцы твои деревенеют, мышцы не слушаются, ноги соскальзывают с перекладин… Наконец ты понимаешь, что подъем по длинной вертикальной лестнице тебе не по силам и что казавшаяся вначале блестящей идея вовсе не такая уж гениальная. Присев на ступеньки и отдохнув, ты спускаешься до того места, где обрывается лестница. Теперь решай, прыгнешь ли сразу в реку на [А] ? Или предварительно на [Б] снимешь кольчугу?
    mood: calm
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "336"
          letter: А
        - label: Вариант Б
          to: "271"
          letter: Б
  "302":
    title: Глава 302
    text: Твоя уловка сработала, лев прыгнул, ты вовремя отступил в сторону, и он промахнулся. Но он вновь приближается и вновь готовится к прыжку! Тебе самое время отпрыгнуть.
    mood: danger
    interaction:
      type: continue
      to: "331"
  "303":
    title: Глава 303
    text: Глазам не верю! Твоя идея сработала! Царь зверей свернулся калачиком и униженно лижет твои руки. Зрители на трибунах, не видевшие прежде ничего подобного, награждают тебя бурей восторженных аплодисментов. Будь доволен собой — ты оказался на высоте! Поклонись публике и незаметно сотри слюну льва с рукава. Ты нежно хлопаешь своего нового друга по спутанной гриве и, улыбаясь и кланяясь, гордо следуешь.
    mood: tense
    entry:
      - modify:
          stat: arena_wins
          delta: 1
    interaction:
      type: continue
      to: "335"
  "304":
    title: Глава 304
    text: Ты поудобней устраиваешься в кресле, нажимаешь кнопку и… В полу открывается люк, кресло сбрасывает тебя вниз, и ты летишь, летишь.
    mood: calm
    interaction:
      type: continue
      to: "93"
  "305":
    title: Глава 305
    text: Глазам не верю! Твоя идея сработала! Беспощадный зверюга свернулся калачиком и униженно лижет твои руки. Зрители, не видевшие прежде ничего подобного, награждают тебя бурей восторженных аплодисментов. Ну что ж, ты вправе гордиться собой. Поклонись публике и незаметно сотри слюну волка с рукава. Ты нежно хлопаешь своего нового друга по лохматой спине и, улыбаясь, гордо следуешь.
    mood: tense
    entry:
      - modify:
          stat: arena_wins
          delta: 1
    interaction:
      type: continue
      to: "335"
  "306":
    title: Глава 306
    text: Ты съезжаешь в темноте по скользкому каменному скату. Не правда ли, похоже на детскую забаву — спуск с ледяной горки? Считаешь, что положение, в которое ты угодил, вовсе не забавно? И снова костеришь меня на чем свет стоит? Погоди… Слышишь? Похоже на журчание воды. Ты уже не чувствуешь гладкого камня под собой, ты летишь, летишь… Набери в легкие побольше воздуху. Бултых! Быстрее на поверхность. Да не глотай так жадно воздух, дыши спокойнее, размереннее. Вокруг все та же непроницаемая тьма. Ты угодил в подземную реку. Тебя подхватывает стремительное течение и несет куда-то. А что тебе остается? Конечно, плыви по течению и надейся на лучшее. Вижу, вижу. Впереди — свет. Вот ты и выплываешь из подземной реки в обычную реку, на безоблачном небе над тобой светит яркое солнце. Впереди показывается мост. Он, вроде, выглядит знакомо. Как береговая линия. Если ты устал, то плыви прямо к берегу — пологому, но поросшему густым кустарником и, возможно, таящему смертельные опасности. Тогда — на [А]. Или проплыви немного по течению и, оказавшись на [Б], выбирайся на крутой, каменистый, но зато голый, как колено, берег. Или плыви еще дальше, пока течение не вынесет тебя за поворот реки, а там уж выбирайся на песчаную косу [В].
    mood: danger
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "3"
          letter: А
        - label: Вариант Б
          to: "198"
          letter: Б
        - label: Вариант В
          to: "2"
          letter: В
  "307":
    title: Глава 307
    text: "С внезапным проворством двадцатитонный кабан подпрыгивает, разворачивается в воздухе и оказывается к тебе тем местом, из которого готовят так горячо тобой любимый окорок. Прежде чем ты отходишь в сторону, кабан говорит: — Мало кому известно, что у кабанов, как и у домашних свиней, есть очаровательный маленький хвостик. Хватайся же за него, приятель, и мы немедленно отправимся в путь. Ты вцепляешься в хвост двумя руками, и кабан, непринужденно напевая, устремляется через джунгли. Мимо тебя мелькают ветки, кусты, деревья, валуны, холмы… Твои руки вскоре устают, но, к счастью, кабан останавливается, и до тебя доносится крик ужаса. Ты бежишь на крик."
    mood: tense
    interaction:
      type: continue
      to: "309"
  "308":
    title: Глава 308
    text: По тропинке мимо кустов, где ты сидишь, бредет колонна роботов. Их не меньше пятидесяти, они стонут и рыдают. Причина масляных слез понятна — через дыры в их головах продета толстая стальная цепь, конец которой держит в руке грозный надсмотрщик. В другой его руке пистолет, в третьей — хлыст. Не сомневайся, я умею считать до трех. Я сказал, в третьей руке, потому что у огромного робота-надсмотрщика именно три руки, и он… Берегись! Услышав наш с тобой спор, он наводит на тебя пистолет. Беги! Дерись! Делай же что-нибудь! Поздно! Пока ты решал, как поступить, он нажал на курок. Что с тобой случится дальше, узнаешь.
    mood: calm
    interaction:
      type: continue
      to: "324"
  "309":
    title: Глава 309
    text: Великолепно! Перед тобой поверженный в грязь гигантским копытом безумный проф Гейстескранк! Он вооружен и очень опасен, но сейчас, опрокинутый в грязь, беспомощен. — Дело сделано, старый приятель! — говорит кабан. — Пора прощаться. Я знаю, что у тебя в кармане передатчик материи, и как только ты правой рукой коснешься безумного негодяя, а левой нажмешь кнопку передатчика, вы оба перенесетесь на другую планету. Но прежде чем ты покинешь меня, давай споем «Поросячий хор». И ты с восторгом затягиваешь «Поросячий хор», а кабан подхватывает. Песня кончается, кабан снимает копыто с груди профа, проф нацеливает на тебя пистолет, ты хватаешь его за руку, он нажимает на спусковой крючок, и… Чем кончится дело, узнаешь.
    mood: danger
    interaction:
      type: continue
      to: "338"
  "310":
    title: Глава 310
    text: Не слишком удачный прием! Стражник с поблескивающим в лучах заходящего солнца кинжалом перепрыгивает через твой меч и вмиг оказывается рядом с тобой. Ты уворачиваешься, но недостаточно проворно. Удар кинжалом приходится по твоему шлему, и ты, оглушенный, падаешь.
    mood: danger
    interaction:
      type: continue
      to: "79"
  "311":
    title: Глава 311
    text: Ты с удовольствием наблюдаешь, как Роббин Гут, швырнув на землю лук, с остервенением топчет его. Видимо, активный выход эмоций помогает ему справиться с моральной травмой. Минут через пять разыгрываемый им спектакль надоедает тебе, и ты с улыбкой напоминаешь, что за ним должок. — Да, да, — говорит он. — Я обещал тебе в качестве приза за выигрыш услугу и не обману. Я даже знаю, какая услуга тебе требуется. Откуда он знает, что тебе нужно? Этот вопрос разъяснится.
    mood: calm
    interaction:
      type: continue
      to: "23"
  "312":
    title: Глава 312
    text: Откуда я знал, что так выйдет?! В конце концов ты сам решил использовать второй заряд невидимого пояса! И, как оказалось, напрасно! Теперь остался всего один. Ведь общеизвестно, что у свиней слабое зрение, зато прекрасный нюх! Кабанище, даже не заметив, что ты невидим, направляется прямиком к тебе. Быстрее возвращайся и там принимай другое, более мудрое решение!
    mood: danger
    entry:
      - modify:
          stat: belt_charges
          delta: -1
    interaction:
      type: continue
      to: "260"
  "313":
    title: Глава 313
    text: Склон холма оказывается весьма крутым. Ты, цепляясь за пучки травы, настойчиво ползешь вверх, соленый пот заливает тебе глаза, дыхание с хрипом вырывается из горла. Не отчаивайся, осталось всего несколько метров. Что я говорил? Ты уже на вершине.
    mood: calm
    interaction:
      type: continue
      to: "245"
  "314":
    title: Глава 314
    text: Фрукты растут высоко, с земли их не достать. Ты взбираешься на дерево. Зеленые фрукты и размерами, и формой напоминают грейпфруты, различие лишь в цвете. Ты хватаешься за ближайший, тянешь, вначале слабо, потом что есть сил, но длинный прочный стебель, которым фрукт прикреплен к ветке, не поддается. Выхватив меч, ты рассекаешь стебель. Отлично, но плод падает на землю и, разбрызгав сладкий сок, с хлопком лопается. Собирай урожай аккуратней! Ты обхватываешь шершавый ствол дерева ногами, левой рукой берешься за фрукт, зажатым в правой руке мечом перерубаешь стебель. Вернув меч в ножны, с фруктом в руке сползаешь по стволу на землю. Снова забираешься на дерево и повторяешь операцию. И так вновь и вновь. Часа через три изнурительной работы на земле набирается зеленая горка. Ты связываешь длинные стебли узлом и, перекинув фрукты через плечо, шагаешь по тропинке.
    mood: calm
    interaction:
      type: continue
      to: "113"
  "315":
    title: Глава 315
    text: Беззаботно насвистывая и помахивая луком, ты идешь по тропе, усеянной черепами. Сейди не соврала — часов через пять ты видишь на ближайшем холме прогнившие крыши, а у дороги указатель «Эндсвилль. 467 жителей». Тут издалека доносится жуткий вопль, в указателе что-то щелкает, и число жителей сокращается до 466. Ничего не скажешь, пренеприятный городишко этот Эндсвилль! Но выбора у тебя нет, шагай дальше! Ты направляешься к городку и вскоре слышишь за поворотом тяжелое дыхание и громкие проклятия. К тяжелому дыханию и проклятиям тебе не привыкать, и ты, достав стрелу, смело поворачиваешь.
    mood: calm
    interaction:
      type: continue
      to: "116"
  "316":
    title: Глава 316
    text: |-
      Ты победил! Ржавый робот на коленях молит тебя о пощаде: — О, могущественный незнакомец! Ты победил! И теперь можешь разрубить меня на части и отправить их на переплавку! Но смилуйся над пожилым роботом. Через полгода я выхожу на пенсию. Сохрани мне жизнь, и я поведаю, как избежать тебе верной погибели у дальнего конца моста. Если пожалеешь старика-робота, то ты — на [А]
      Если будешь до конца непреклонен и, устраняя опасность с тыла, разрубишь его на части, ты — на [Б].
    mood: danger
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "78"
          letter: А
        - label: Вариант Б
          to: "77"
          letter: Б
  "317":
    title: Глава 317
    text: "Роботы, восторгаясь твоим мудрым решением, подпрыгивают от восторга. Лишь минут через десять ты ценой неимоверных усилий наводишь относительный порядок и строишь роботов в колонну. Робот-ремонтник уверяет, что ему известен кратчайший путь к владениям Сейди-Садистик, ты ставишь его во главе колонны, и вы трогаетесь в путь. Ваш марш продолжается уже полдня, твои ноги устали, Рубин Джунглей натер кожу у пояса под ремнем, куда ты его спрятал. Робот-ремонтник клянется, что вы достигли владений Сейди-Садистик, и ты надеешься, что он не ошибается. Внезапно передние роботы кричат в панике, и ты видишь впереди на тропе волосатого гиганта с огромной дубиной. Гигант хрипит: — А-а-а-хр-р! Убирайся, чужак, пока цел! Я реквизирую твоих роботов! Будут вкалывать на моей фабрике собачьих консервов! Решай, сразишься ли ты с гигантом, отстаивая права роботов, на [А]. Или, предоставив нытиков их собственной судьбе, отправишься на [Б]."
    mood: danger
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "157"
          letter: А
        - label: Вариант Б
          to: "268"
          letter: Б
  "318":
    title: Глава 318
    text: Над твоей головой безоблачное голубое небо, под ногами желтый в красных пятнах песок. Красные пятна — неужели это кровь?! Не спрашивай меня, я знаю не больше твоего. Прислушайся к реву толпы на трибунах. Интересно, чем это люди так возбуждены? Да, теперь и я вижу. Через небольшую дверцу на арену выходит огромный волк. Он зевает, осматривается, замечает тебя и приближается с грозным воем. Тебе кажется, что хищник улыбается. Или, может, он демонстрирует тебе свои острые клыки? В твоей руке лишь птичье перо. Согласен, не самое надежное оружие, хотя… Внимание, волк готовится к прыжку. Если ты полагаешь, что, пощекотав волка, ты вызовешь у него смех и в благодарность он оставит тебя в покое, то отправляйся на [А]. Если, дождавшись прыжка хищника, ты отскочишь в сторону, то на [Б].
    mood: danger
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "152"
          letter: А
        - label: Вариант Б
          to: "183"
          letter: Б
  "319":
    title: Глава 319
    text: Раскинь еще раз мозгами, новобранец! У тебя против всех преступников Эндсвилля всего лишь короткий меч. Не глупи, попроси у Сейди какого-нибудь оружия.
    mood: tense
    interaction:
      type: continue
      to: "41"
  "320":
    title: Глава 320
    text: Ничего хорошего не получилось! Ты промахнулся, а робот молниеносно наносит дубиной скользящий удар по твоему шлему. Оглушенный, ты падаешь; взревев от гнева, робот обрушивается на тебя, но ты пинаешь его сразу двумя ногами в грудь.
    mood: danger
    interaction:
      type: continue
      to: "316"
  "321":
    title: Глава 321
    text: |-
      Ты захлопываешь дверь. Как раз вовремя! Башня с оглушительным грохотом рушится, дверь с той стороны заваливает камнями. Услышав неприятный скрежет, ты поворачиваешь голову и видишь… гигантского саблезубого тигра. Учуяв тебя, тигр прекращает точить о каменный пол и без того острые когти, поворачивается и, издав яростный рык, бросается в атаку. Ты поднимаешь на него меч — игрушку против гиганта, клыки которого длинней меча в твоей руке. Знаешь, у меня возникла неплохая идея… Говоришь, тебе нет дела до моих бредовых идей? Что ж, тогда и мне на тебя плевать. Пожалуйста, дерись на [А]
      Если все же передумаешь и решишь выслушать добрый совет, то быстрей лети к [Б].
    mood: danger
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "279"
          letter: А
        - label: Вариант Б
          to: "326"
          letter: Б
  "322":
    title: Глава 322
    text: Ты рывком распахиваешь дверь и отступаешь в сторону. На саблезубого тигра с грохотом обрушиваются тонны камней. Пыль вскоре оседает, и ты видишь торчащий из-под камней кончик полосатого хвоста. Хвост судорожно дергается и замирает. Ты победил! Вложи меч в ножны, пересеки комнату, открой дверь в дальней стене и смело шагай.
    mood: calm
    interaction:
      type: continue
      to: "188"
  "323":
    title: Глава 323
    text: "Тобой безраздельно овладевает страх! Ты стоишь, не в силах пошевелиться. А рядом падают многовековые деревья, к земле пригибаются густые кусты. К тебе выходит… Гигантский кабан! Он грозно склоняет голову и оценивающе наставив на тебя налитый кровью левый глаз, говорит: — Ты, парень, непревзойденный гений по части неприятностей. Я уже давненько наблюдаю за твоими приключениями, так что знаю, что тебя предали все спутники. По сравнению с ними так называемый низший зверь — воплощение добродетели! Я скажу тебе нечто важное, но прежде спой! Если споешь нужную песню, то конец всем твоим передрягам, если же нет — извини, я тебя съем. Итак, что ты исполнишь? «Вальс родного свинарника» или «Свинг очаровашки-кабанихи»? Решай же! Если споешь вальс, то ты — на [А]. Если же свинг, то на [Б]."
    mood: tense
    image: illustrations/swamp_pig.webp
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "68"
          letter: А
        - label: Вариант Б
          to: "52"
          letter: Б
  "324":
    title: Глава 324
    text: "Ты вскрикиваешь! Но не от боли, а от неожиданности. Ты с головы до пят облит водой. Пистолет надсмотрщика предназначен для устрашения роботов и оттого стреляет не пулями, а водой! Сообразив, что допустил промашку, надсмотрщик с проклятием отбрасывает пистолет и тянется к сабле на поясе. Но он опаздывает! Ты бросаешься на него, валишь с ног, проделываешь мечом в его жестяном корпусе дыру. Он вскакивает и, не разбирая дороги, бросается в джунгли. Ты выдергиваешь цепь из голов ликующих роботов. Роботы окружают тебя, дружески похлопывают по плечам и спине, говорят восторженные комплименты. Самый большущий робот падает перед тобой на колени и, целуя тебе руки, упоенно скрипит: — О, благородный воин! Ты освободил нас, когда мы уже простились с надеждой! Из вежливости ты интересуешься, что с ними приключилось. — Мы были собственностью бессердечного герцога Гроанна, — рассказывает робот. — Хозяин относился к нам как к неодушевленным предметам, постоянно бил, смазывал только самым дешевым маслом, не заряжал вовремя наши аккумуляторы и снабжал только бывшими уже в употреблении запчастями, а за малейшую провинность в работе обзывал нас неприличными словами. Взгляни на царапины и вмятины на наших телах! Не в лучшем виде и наши электронные мозги! О, герцог был настолько к нам бессердечен, что… — Герцог был свирепым монстром! — перебивает железную громадину крошечный робот с шестью ручками-манипуляторами, которыми он размахивает столь проворно, что становится похож на ветряную мельницу. — Он не только бил и бранил нас, но и, слыша наши жалобы, смеялся над нами! И мы, устав от унизительных насмешек и побоев, сбежали, но нас поймали, сковали и, как ты сам видел, повели к озеру. Если бы не ты, наш доблестный спаситель, то нас бы живьем кинули в воду, где бы мы за месяц проржавели до винтика. Услышав об озере, роботы в ужасе завопили и зарыдали. Удивительно, как герцог многие годы терпел электронных нытиков и почему не утопил раньше. Решай, пойдешь ли, попрощавшись со спасенными, дальше один на [А] или с роботами на [Б]. Они, конечно, плаксы, но все же железные, может, и помогут в бою."
    mood: danger
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "151"
          letter: А
        - label: Вариант Б
          to: "317"
          letter: Б
  "325":
    title: Глава 325
    text: Звуки с каждой секундой приближаются, становятся громче, твои же коленки начинают дрожать. Нет-нет, я вовсе не утверждаю, что они дрожат от страха. Скорее от усталости. Почему бы тебе не отдохнуть в джунглях? Ты соглашаешься с разумным предложением и бесшумно прячешься в кустах.
    mood: tense
    interaction:
      type: continue
      to: "308"
  "326":
    title: Глава 326
    text: Не дерись с хищником, используй с борьбе с ним мозги! Не делая резких движений, подберись к двери, через которую ты сюда вошел. Так, остановись, возьмись за ручку, подожди, пока саблезубая бестия подойдет ближе… Пора! Двигай.
    mood: danger
    interaction:
      type: continue
      to: "322"
  "327":
    title: Глава 327
    text: "Ты с трудом поворачиваешь голову птицы Рок вправо, так, чтобы клюв был обращен к башне. Птица на секунду заваливается на правое крыло, и вы летите прямо к цели. Но слишком низко! Сейчас птица врежется в каменную громадину, и… Должно быть, у птицы Рок, как и у летучей мыши, есть ультразвуковой сонар, и она, даже не просыпаясь, взмахивает крыльями и мягко опускается на крышу. Едва она складывает крылья, как ты соскакиваешь с ее спины, выхватываешь меч и бежишь к слуховому окну. Позади раздается: — Стой, отравитель! Сейчас тебя настигнет заслуженная кара! Это проснулась птица Рок и в гневе семенит к тебе — клюв разинут, острые кривые когти оставляют в каменной крыше глубокие борозды. Ты распахиваешь слуховое окно и, не раздумывая, ныряешь в таинственный полумрак. Прокатившись по полу, вскакиваешь и, перепрыгивая через две ступеньки разом, несешься по лестнице вниз. Позади слышен грохот, сотрясающий стены башни. Птица будет здесь через считанные секунды! Ты бежишь вниз, а рядом, обгоняя, катятся камни. Ты достигаешь нижнего этажа башни. Перед тобой обшарпанная дверь. Из-за нее доносится громкий угрожающий рык. Времени на колебания нет, башня вот-вот опрокинется. Резонно решив, что лучше неизвестная опасность, чем верная смерть, ты с мечом наготове распахиваешь дверь."
    mood: danger
    image: illustrations/eagle_on_the_roof.webp
    interaction:
      type: continue
      to: "321"
  "328":
    title: Глава 328
    text: |-
      Не огорчайся, новобранец, в конце концов не можешь же ты одержать верх над всеми бандитами этой планеты. Тебе вовсе не нужна победа над всеми? Тебе бы хотелось побеждать хоть изредка? Ну, ладно, ладно, подведем итог твоему очередному приключению. У тебя остался передатчик материи, но пока ты не встретишься с безумным профессором, тебе им пользоваться нельзя. Оружия у тебя нет, костюм порван, левый сапог натер ногу… Может быть, ты знаешь, из-за чего? Если знаешь, то отправляйся на [А]
      Если же нет, то напряги мозги. Так и не вспомнил? Тогда загляни на [Б].
    mood: victory
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "11"
          letter: А
        - label: Вариант Б
          to: "56"
          letter: Б
  "329":
    title: Глава 329
    text: Хозяин удава, обыскав тебя, выбрасывает передатчик, так и не разобравшись, для чего он служит, забирает оставшиеся дымовые гранаты, меч и все содержимое твоих карманов, включая семь золотых монет, затем, неприлично обозвав тебя, свистит, и удав вновь обвивает его толстую шею. Как только детина с удавом скрывается из вида, ты встаешь на ноги, грозишь ему вслед кулаком, отряхиваешься, поднимаешь с земли передатчик материи и обнаруживаешь.
    mood: tense
    entry:
      - drop:
          item: smoke_grenade
          count: 1
      - drop:
          item: sword
          count: 1
      - drop:
          item: gold_coin
          count: 1
    interaction:
      type: continue
      to: "328"
  "330":
    title: Глава 330
    text: "Мудрое решение, — одобряет твой выбор герцог, сажает позади себя в седло и пускает лошадь в галоп. Вскоре вы оказываетесь на берегу реки. Герцог спрыгивает на землю, помогает слезть тебе и говорит: — А теперь узнай правду, доверчивый глупец! Тебе вовсе не по душе дьявольский огонек в его глазах. Собираясь бежать, ты поворачиваешься, но он, выхватив кинжал, сбивает тебя на землю и приставляет острие клинка к горлу. — Знай же, что я банкрот! Замок пошел в уплату за долги, мои доспехи проржавели, лошадь я украл. Но твои золотые монеты положат начало моему новому богатству. Где ты их спрятал? Говори, а не то я наколю тебя на кинжал, как свинью! Выбора нет, и ты говоришь ему, где зарыл золотые. Он с победным криком вскакивает в седло и уносится прочь. Ты встаешь, понурив голову и размышляя о будущем. У тебя не осталось ни золота, ни оружия. Один, на Богом проклятой планете… Слушай, сынок, что тебе скажет Стальная Крыса. Когда ты был под гипнозом… Ты не помнишь, что был под гипнозом? Неудивительно, ведь Корпус свято хранит свои секреты! Так вот, когда ты был под гипнозом, спецы Корпуса вживили в сустав твоего указательного пальца на правой руке машину времени. Щелкни пальцами и перенесешься во времени."
    mood: danger
