    text: |-
      Ты поворачиваешь ручку, плечом надавливаешь на дверь, она с щелчком распахивается, одновременно с ней под тобой открывается люк в полу. Классный прыжок! Вместо того, чтобы свалиться в люк, ты перепрыгиваешь его и оказываешься в комнате. На столе перед тобой — оправленный в золото рубин размером с куриное яйцо. Без сомнения, это Рубин Джунглей! Он идеально гармонирует с цветом глаз Сейди-Садистик, не удивительно, что она так жаждет его заполучить. Ты подходишь к столу, протягиваешь к рубину руку и вдруг, наморщив лоб, замираешь. Правильно, прежде чем взять рубин, подумай, что произойдет потом. Но если ты, пренебрегая опасностью, все же схватишь рубин, то окажешься на [А]
