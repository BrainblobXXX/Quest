  "121":
    title: Глава 121
    text: "Перед тобой на троне из человеческих костей восседает Волосатый Гарри Убийца Каннибалов. Должно быть, он погубил немало невинных душ! Он обнажен, но кудрявые рыжие волосы до колен служат ему неплохой одеждой. Он говорит, и голос его — будто звон крышки мусорного бака: — Хо-хо, кого я вижу! Аппетитный смертный! В кухню его! Но прежде чем стражники выполняют приказ господина, в зал вбегает седовласый старик с моноклем в глазу. Да это же профессор Гейстескранк собственной персоной! — Голубчик Гарри, — говорит проф, — ты, как всегда, думаешь только о собственном желудке. Отдай этого смертного мне. Он будет добровольцем в смертельно опасном опыте. Видишь, как порой бывает сурова с нами судьба! Быстрее подкинь ДОСП! Если выпадет орел, ты отправляешься. Если решка, в печь."
    mood: danger
