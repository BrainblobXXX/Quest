  "93":
    title: Глава 93
    text: |-
      Ты падаешь на мягкий пыльный матрас. Клубы пыли постепенно рассеиваются, и ты, прочихавшись и утерев слезы, оглядываешься и обнаруживаешь, что попал в огромную комнату, где прямо перед тобой клетка, а в ней — возмущенный и растрепанный проф Гейстескранк. Лучшей расстановки сил не придумаешь! Ты открываешь было рот, собираясь поздравить себя с успешным выполнением задания, как позади раздается свирепый рык, а спину тебе обдает волна нестерпимо горячего воздуха. Ты резво поворачиваешься. В десятке футов от тебя огромный, безобразный, покрытый склизкой чешуей крылатый дракон! Ты проворно откатываешься на несколько футов. Вовремя! Дракон с шумом выдыхает, и над тем местом, где ты только что сидел, проносится огненный смерч. Дракон, мотнув головой, замирает, челюсти его, выпустив клуб зловонного дыма, распахиваются, и он говорит: — Посмотрим, кто к нам пожаловал на сей раз. — В тебя впиваются его крошечные горящие красным светом глазки. — А-а-а, еще один сладенький, вкусненький млекопитающий! Слушай, будь пай-мальчиком: пока огонь не угас, подбрось мне в топку угольку. Дракон шире прежнего распахивает пасть, ты с готовностью вскакиваешь, хватаешь из стоящего рядом угольного бункера лопату и, как сумасшедший, принимаешься за работу. Вскоре ты с ног до головы покрыт угольной пылью, но не отвлекаешься даже на то, чтобы отереть пот со лба. Наконец дракон, пыхнув для пробы огнем, показывает взмахом похожего на ятаган когтя, что ему вполне достаточно, и ты удовлетворенно переводишь дух. — А ты компанейский парень, — говорит меж тем дракон. — Если проголодался, то подкрепись. Харч там, на столе. Поскольку к дискуссиям с драконами ты пока не привык, то послушно поворачиваешься к столу и видишь на нем два блюдца, на каждом лежит кусок торта, шоколадного и песочного. — Законченный думкопф! — кричит тебе из клетки безумный проф. — Не ешь! Чудище собирается отравить тебя. Откусишь от шоколадного торта — тут же отбросишь коньки, от песочного — станешь до конца своих дней идиотом. Если прислушаешься к совету безумца, то ты на [А]. Если, не поверив ему, откусишь от шоколадного торта, то на [Б]
      Если же считаешь, что напасти, обрушившиеся в последние часы на твою голову, и так превратили тебя в идиота, и попробуешь песочный торт, то ты на [В].
    mood: danger
