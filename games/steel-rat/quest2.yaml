  "112":
    title: Глава 112
    text: Хищник вновь промахнулся. Но, согласен, хотя он и слегка неуклюж, рано или поздно его могучие челюсти достанут тебя, и тогда… Не будем говорить, что будет тогда. Что ты делаешь? Пытаешься доказать, что человек — царь природы? Полагаешь, твой пристальный взгляд остановит волка? Бредовая… я имею в виду, великолепная идея! Волк ревет, роет песок лапами, приближается, его острые зубы сияют в лучах солнца. Удачи тебе в твой безнадежной затее! Ты стоишь, широко расставив ноги, и пристально смотришь в желтые зрачки хищника.
    mood: danger
    interaction:
      type: continue
      to: "305"
  "113":
    title: Глава 113
    text: "Тропинка петляет по джунглям, твоя спина все больше сгибается под тяжестью фруктов. Но ты идешь! Не останавливаешься, даже когда тропинка приводит тебя к огромным ступеням, вырубленным в стволе дерева-гиганта. По ступеням ты взбираешься на ветвь, шириной с шестиполосную автостраду. На ее конце гнездо, в нем сидит птица размером с самолет. Не спуская с нее настороженных глаз, ты пятишься, но поздно! Заметив тебя, она поднимается в воздух, затмевая солнце. Крылья хлопают, будто громовые раскаты в грозу. Птица садится рядом с тобой, ветвь под ее тяжестью сгибается. На тебя смотрит круглый желтый глаз величиной с карточный столик. Открывается гигантский желтый клюв, и птица вопрошает: — Кто это к нам пожаловал? Ты молчишь, будто язык проглотил. — А-а, крошка-млекопитающий, увешанный, будто рождественская елка! Скажи, а зачем тебе столько вкусных фруктов? Не стесняйся, предложи ей фрукты и назови свою цену. Услышав твои слова, птица Рок еще ближе придвигается к тебе и зло кричит: — Взятка?! Пытаешься всучить мне, древней птице Рок, взятку?! Тебя бросает в жар, ты молча дрожишь. — А, впрочем, почему бы и нет? — задумчиво говорит древняя птица. — Швырни один фрукт в воздух, я его поймаю на лету, остальные съем по дороге. Ты подкидываешь фрукт, птица, щелкнув клювом, проглатывает его, затем берет тебя за шиворот, сажает на спину, взлетает и устремляется."
    mood: tense
    interaction:
      type: continue
      to: "199"
  "114":
    title: Глава 114
    text: Понимаю, тебе досталось, и ты рассержен на жестоких охранников. Но ходить по бесчувственным телам? Не слишком ли ты очерствел? Что значит, «заткнись»? Вспомни, что разговариваешь со старшим по званию! Живо отвечай, что намерен предпринять! Да, действительно, открытое окно. Правильно, осторожно выгляни из него. Никого не видно? Тогда быстро прыгай вниз. Так, теперь, беспечно насвистывая, шагай по улице до ближайшего угла. Сворачивай направо, к центру города. Похоже, ты на базарной площади. Вокруг только грязные оборванцы, по виду — закоренелые преступники. Хотя нет. Вон те двое — босоногий мальчуган и одетая в черное надменная старушка — кажутся вполне приличными людьми. Поговори с одним из них. Если ты обратишься к мальчику, то направляйся на [А]. Если к старушке, то на [Б].
    mood: tense
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "137"
          letter: А
        - label: Вариант Б
          to: "25"
          letter: Б
  "115":
    title: Глава 115
    text: Ты попадаешь в вырубленную в скале комнату, но прежде чем успеваешь оглядеться, пол под тобой исчезает, и ты падаешь, падаешь… Бух! Удачно, что ты приземлился на кучу песка, а то бы костей не собрал… Но что это?! Ты вновь перед воротами и лабиринте, построенном давно вымершей расой. Ничего не поделаешь, придется тебе еще раз войти в него.
