  "158":
    title: Глава 158
    text: На вкус — очень даже недурственно. Видимо, проф солгал тебе. Ты с аппетитом доедаешь песочный торт, а затем принимаешься за шоколадный и, одолев его, поворачиваешься к дракону.
    mood: calm
    interaction:
      type: continue
      to: "299"
  "159":
    title: Глава 159
    text: "Сейди, лучезарно улыбаясь, ведет тебя в лес. Но почему она остановилась, едва деревья скрыли вас от любопытных взоров остальных? Куда подевалась ее многообещающая улыбка? И что у нее в руке? Заподозрив недоброе, ты бьешь ее в челюсть, но она — мастер карате — с легкостью уворачивается от удара, и через миг ты на земле, ее нож — у твоего горла, ее губы шепчут тебе в ухо: — Говори, сосунок, где спрятал золото! Выбора нет, и ты говоришь. Шелест шелка, и она уже скрылась. Ты сидишь на земле, понурив голову и размышляя о будущем. У тебя не осталось ни золота, ни оружия. Один, на Богом проклятой планете… Слушай, сынок, что тебе скажет Стальная Крыса. Когда ты был под гипнозом… Ты не помнишь, что был под гипнозом? Неудивительно, ведь Корпус свято хранит свои секреты! Так вот, когда ты был под гипнозом, спецы Корпуса вживили в сустав твоего указательного пальца правой руки машину времени. Щелкни пальцами, и перенесешься во времени."
    mood: calm
