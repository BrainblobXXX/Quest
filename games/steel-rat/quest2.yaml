          to: "41"
          letter: А
        - label: Вариант Б
          to: "319"
          letter: Б
  "148":
    title: Глава 148
    text: Преследуя профа по длиннющим коридорам и широченным залам замка, ты неожиданно выскакиваешь во двор, в глаза бьет ослепительный солнечный свет. Ты зажмуриваешь веки, а когда открываешь глаза, то… Оказывается, профа во дворе ожидал воздушный шар. Он забирается в корзину и перерезает веревку, которая удерживала шар у земли. Шар поднимается в воздух. Беги же! Хватайся за свисающий конец веревки! Ты успел! Ты вместе с шаром взмываешь в небо. Из корзины высовывается голова профа. Ты сдерживаешь дыхание, но, к счастью, проф смотрит по сторонам, а не вниз, и оттого, не замечая тебя, бодро и фальшиво насвистывает старинную немецкую мелодию. Умолкает. Вроде бы что-то жует. На тебя сыплются обглоданные куриные кости. От пронзительного, холодного ветра твои руки деревенеют. Когда же наконец шар сядет? Похоже, твоим мучениям придет конец.
    mood: tense
    interaction:
      type: continue
      to: "143"
  "149":
    title: Глава 149
    text: "Со слезами на глазах, Арбутнот обнимает тебя за плечо и уводит от завистливо глядящих вслед бандитов. — Дорогой друг, я безгранично благодарен тебе! — говорит он. — Сюда, сюда, по тропинке в лес. Не хотелось бы, чтобы остальные слышали то, что я скажу. Потому что я сейчас скажу такое, отчего, видишь, уже краснею. Мне неприятно быть жестоким с тобой — единственным человеком, который не отверг меня в этом ужасном мире. Прежде чем ты понимаешь, о чем он ведет речь, он швыряет тебя на землю и заносит над твоей головой дубину: — У тебя только две секунды, чтобы сказать мне, где золото! Выбора нет, и ты говоришь ему, где зарыл золотые. Он убегает прочь. Ты встаешь, понурив голову и размышляя о будущем. У тебя не осталось ни золота, ни оружия. Один, на Богом проклятой планете… Слушай, сынок, что тебе скажет Стальная Крыса. Когда ты был под гипнозом… Ты не помнишь, что был под гипнозом? Неудивительно, ведь Корпус свято хранит свои секреты! Так вот, когда ты был под гипнозом, спецы Корпуса вживили в сустав твоего указательного пальца правой руки машину времени. Щелкни пальцами, и перенесешься во времени."
    mood: danger
