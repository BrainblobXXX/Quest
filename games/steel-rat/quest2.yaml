  "107":
    title: Глава 107
    text: Уже в самом низу ты кое-как сумел замедлить падение. Вокруг — вязкое болото. Ты поднимаешься. Смотри, куда ставишь ноги. Попадешь в болото, вовек не выберешься! Какие звуки? Я ничего не слышу. Да, действительно, утробный рык и довольное ворчание. И источник этих таинственных звуков прямо перед тобой на тропе, в огромной грязной луже. Я не совсем уверен, но, кажется, звуки эти издает огромный кабан. Как поступишь? Обойдешь ли опасного зверя, взобравшись на холм [А] справа? Или свернешь в болото [Б] слева от тропы? А может, спрятавшись за деревьями на [В], понаблюдаешь за резвящимся в грязи красавцем?
