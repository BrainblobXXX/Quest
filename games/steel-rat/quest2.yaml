  "147":
    title: Глава 147
    text: Сейди сует в твою ладонь десять золотых монет и показывает на горизонт. — Иди по тропе, отмеченной человеческими черепами и костями, и через день окажешься в Эндсвилле. Именно там, по слухам, обитает сейчас профессор Гейстескранк. Сделай милость, избавь нашу планету благородных преступников от этого ублюдка. А пока подкрепись. По указанию Сейди один из Сынов Садизма приносит корзинку с жареными цыплятами. Ты усаживаешься под раскидистым деревом, ешь и думаешь. У тебя теперь есть золотые монеты, но вокруг закоренелые преступники. Не доверяя им, ты незаметно суешь три монеты в сапог. Вскоре от цыплят остаются лишь обглоданные косточки. Тебе пора в путь. Но прежде реши, попросишь ли ты на [А] у Сейди дополнительной помощи в твоей нелегкой миссии, или, быть может, удалишься на [Б], просто поблагодарив ее за доброту.
    mood: tense
    entry:
      - grant:
          item: gold_coin
          count: 10
        once: true
