  "117":
    title: Глава 117
    text: "Ты с трудом поворачиваешь голову птицы Рок так, чтобы клюв был направлен к левой башне. Птица на секунду заваливается на левое крыло, и вы летите прямо к цели. Но слишком низко! Сейчас птица врежется в каменную громадину, и… Должно быть, птица Рок, как летучая мышь, имеет ультразвуковой сонар и, даже не просыпаясь, взмахивает крыльями и мягко опускается на крышу. Едва она складывает крылья, как ты соскакиваешь с ее спины, выхватываешь меч и бежишь к слуховому окну. Позади раздается: — Стой, отравитель! Сейчас тебя настигнет заслуженная кара! Это проснулась птица Рок и в гневе семенит к тебе — клюв разинут, острые кривые когти оставляют в каменной крыше глубокие борозды. Ты распахиваешь слуховое окно и, не раздумывая, ныряешь в таинственный полумрак. Прокатившись по полу, вскакиваешь и, перепрыгивая через две ступеньки разом, несешься по лестнице вниз. Позади слышен грохот, стены башни сотрясаются. Птица настигнет тебя в считанные секунды! Ты прыгаешь уже не через две, а через три ступеньки; за тобой катятся камни. Ты достигаешь нижнего этажа башни. Перед тобой обшарпанная дверь. Из-за нее доносится громкий угрожающий рык. Времени на колебания нет, башня вот-вот обрушится. Резонно решив, что лучше неизвестная опасность, чем верная смерть, ты с мечом наготове распахиваешь дверь."
    mood: danger
    interaction:
      type: continue
      to: "142"
  "118":
    title: Глава 118
    text: |-
      Пройдя с рабами по длинным коридорам Зловонного замка, ты вновь попадаешь в мрачный тронный зал. Волосатый Гарри возмущается худобой товара, но, получив дубинкой Арбутнота по голове, оседает на троне. Рабы, скинув цепи, дубасят изумленных стражников, ты же, не теряя ни секунды, бросаешься на поиски профа Гейстескранка. Его ты находишь в примыкающей к тронному залу лаборатории, но, завидев тебя, старый безумец грязно ругается и бросается наутек. Быстрее за ним! Через набитую непонятными приборами лабораторию к двери! Но профессор, черт его дери, захлопывает дверь перед самым твоим носом! Ты дергаешь ручку, но тщетно. Заперто! Если попытаешься найти среди груд хлама в лаборатории ключ, то живее на [А]
      Если надумал высадить дверь обшитой железными пластинами дубиной, которую кто-то позабыл в углу, то на [Б].
    mood: danger
    image: illustrations/palace.jpg
    interaction:
      type: choices
      options:
