      to: "80"
  "60":
    title: Глава 60
    text: Отлично сработано! Ты уворачиваешься от сети, ударом щита по голове опрокидываешь верзилу на землю. Миг, и твоя нога на его груди, меч — у горла. Как поступишь с врагом? Убьешь ли на месте или даруешь жизнь? Ты смотришь на Королевскую ложу, ждешь указаний Сейди-Садистик. Она медленно поднимает правую руку. Ее решение узнаешь.
    mood: danger
    entry:
      - modify:
          stat: arena_wins
          delta: 1
    interaction:
      type: continue
      to: "91"
  "61":
    title: Глава 61
    text: Видимо, поэзия — не твой конек. Четверостишие принадлежит перу Фроста. Ну да ладно, полевой агент Корпуса не обязан быть докой в древней литературе (хотя образование — дело не лишнее). Словом, отправляйся.
    mood: mystery
    interaction:
      type: continue
      to: "67"
  "62":
    title: Глава 62
    text: Ну, что я говорил, неопытный и слегка напуганный новобранец? Вот мы и свиделись. Что? Ты меня не видишь? Неудивительно. Ведь я сижу в главном здании специального Корпуса, в руке у меня стакан с джусом, на голове металлический шлем, провода от которого тянутся к машине, именуемой Межмозговой Подкорковый Интерпретатор, модель четыре, сокращенно МПИ-4; Что? Сейчас обьясню, как работает эта хитрая машина. С помощью электроники наши мозги соединены накоротко, и теперь я, глядя твоими глазами, вижу то, что видишь ты, слушаю твоими ушами то, что слышишь ты, и даю мудрые советы. Нет, никакой помощи, только советы, а решение всех проблем — за тобой. Ну что ж, начнем, в детали вникнешь по ходу дела. Сейчас ты бредешь по тропинке в лесу. Тропинка извивается среди деревьев, дождь кончился, но ветер усилился, так что берегись падающих веток. Говоришь, они тебя не беспокоят? Правильно, новобранец, все мы — славные ребята из Специального Корпуса — смеемся над опасностями. Прекрати хихикать! Впереди что-то движется. Кто-то идет навстречу. Остановись и подожди. Так, хорошо. Появилась человеческая фигура. Да еще какая! Фигурка-то принадлежит юной грациозной девушке. У тебя есть шанс показать, из какого теста ты слеплен. Можешь отойти в глубь леса или приблизиться к ней и заговорить. Выбирай! Если уходишь, то отправляйся к [А]. Если остаешься, то — к [Б].
    mood: danger
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "14"
          letter: А
        - label: Вариант Б
          to: "99"
          letter: Б
  "63":
    title: Глава 63
    text: Благополучно выбравшись на берег, ты отряхиваешь с себя вонючие зеленые водоросли и оглядываешься. В полумиле от тебя приземлился воздушный шар. Беги к нему, согреешься по дороге.
    mood: danger
    interaction:
      type: continue
      to: "130"
  "64":
    title: Глава 64
    text: Ты отлично сработал. Не затворив дверь, стражник с криками мечется по камере, ты же, встав на четвереньки, выползаешь в коридор. Дым рассеивается, так что поднимайся на ноги и беги! Длинный коридор еще не кончился, а ты почему-то встаешь, как вкопанный. Теперь и я слышу голоса. И вижу надвигающихся на тебя шестерых тяжеловооруженных охранников. Быстрее швырни гранату с сонным газом и беги на [А] ! Или дымовую гранату и ползи на [Б].
    mood: calm
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "114"
          letter: А
        - label: Вариант Б
          to: "345"
          letter: Б
  "65":
    title: Глава 65
    text: "Бой был жаркий, и твоя помощь пришлась кстати. Как только ты кусаешь Бетси за коленку, она с воем бросается в лес. Громила поворачивается к тебе, кошмарно рычит, заносит над головой дубинку… Бежать? Но ты сидишь на земле, даже вскочить не успеешь… Слушай, это он: — Благодарю тебя, отважный незнакомец. Я пришел, чтобы подарить тебе свободу, и ты вовремя подоспел на помощь. Он отшвыривает дубинку и, точно гнилые нитки, разрывает цепи на твоих руках и ногах, после чего торжественно продолжает: — Я Арбутнот Отверженный. Я вел жизнь преступника, и мир отверг меня в наказание за преступления, говорить о которых мне не дозволено. Я был сослан на планету-тюрьму. Ты поступил со мной как истинный друг, пришел на помощь, и я этого не забуду до гробовой доски. Ступай же, друг, с миром и помни, что всегда можешь рассчитывать на меня. На прощание ты машешь благородному Арбутноту рукой и отправляешься."
    mood: danger
    interaction:
      type: continue
      to: "48"
  "66":
    title: Глава 66
    text: "Ты с комфортом спускаешься, стоя на движущейся ступеньке. Проходит пять минут, десять, пятнадцать. Согласен, присесть — неплохая идея. Ты садишься на ступеньку: усталые мышцы ноют. Но что это? Почему вдруг твои глаза заливает обильный пот? Встань, посмотри вперед. Боюсь, что я тоже вижу озеро расплавленной лавы, куда сползает движущаяся лестница. Что ж, ступай назад. Ведь эскалатор опускается совсем не быстро. Спасибо, что поправил меня. Действительно, эскалатор ОПУСКАЛСЯ не быстро, а сейчас несется, как угорелый, и с каждой секундой наращивает скорость. Воздух становится все жарче, озеро лавы — все ближе… Но ты видишь свой единственный шанс на спасение — крошечный каменный островок в озере лавы. Приготовься! Прыгай!"
    mood: victory
    interaction:
      type: continue
      to: "181"
  "67":
    title: Глава 67
    text: |-
      С поэзией мы разобрались, ты оказался прав, но лес по-прежнему мрачен и неприветлив. Не торопись, внимательно смотри по сторонам; неизвестно, какие создания скрываются в чаще. Вот так сюрприз! Дорога перед тобой разбегается в четырех направлениях. Надеюсь, ты не забыл свою задачу? Ты направляешься в Гроаннсвилль, чтобы выяснить, где находится безумный профессор Гейстескранк. Но по какой дороге двигаться? Вопрос, как говорится, не в бровь, а в глаз. Не спрашивай меня. Я, как и ты, впервые на этой негостеприимной планете. Чу… Слышишь? По-моему, приближаются чьи-то шаги? Так и есть, сюда кто-то идет. Спрячься в придорожных кустах и выясни, кто это. Ну, это всего лишь опирающийся на посох старик. А не срезать ли и тебе посох? Вокруг полно подходящих веток. Достань нож, нажми на кнопку. Прекрасная сталь, правда? Если ты, срезав посох и убрав нож в карман, выйдешь навстречу старику, то двигайся на [А]
      Если, демонстрируя, что ты вооружен, выйдешь с раскрытым ножом в руке, то отправляйся на [Б].
    mood: tense
    entry:
      - grant:
          item: staff
          count: 1
        once: true
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "97"
          letter: А
        - label: Вариант Б
          to: "146"
          letter: Б
  "68":
    title: Глава 68
    text: "Ты поешь, вкладывая в песню всю душу. Неудивительно, ведь от успеха зависит твоя жизнь! Песня кончается, и ты тяжело переводишь дыхание. Кабан, роя землю копытами, смеется: — Ха-ха-ха! Хо-хо-хо! Хрю-х хрю-хрю! До чего же слаб и пуглив человек! Не бойся, я помог бы тебе, какую бы песню ты ни исполнил. Твое приключение на планете-тюрьме подошло к логическому концу. Отправляйся с триумфом!"
    mood: victory
    interaction:
      type: continue
      to: "307"
  "69":
    title: Глава 69
    text: Ты громко взываешь о помощи, но роботы — жалкие трусы! — вопя от ужаса, разбегаются кто куда. Ты тоже разворачиваешься и, не чуя под собой ног, удираешь, но гигант оказывается гораздо проворнее, чем ты предполагал. Он бежит за тобой, грязно ругаясь, наступает на пятки, вот-вот схватит! Выбора нет, поворачивайся и принимай бой! Тут тебе на плечо ложится грязная волосатая ручища. Ты извиваешься, силишься вырваться, но в, медвежьих объятиях гиганта беспомощен, как дитя. Гигант обыскивает тебя и, найдя Рубин Джунглей, оглашает лес победным ревом. Тычок его кулака в спину, и ты оказываешься на земле. Детина грубо хватает тебя за ноги, подтаскивает к дереву, привязывает к стволу лианами. Если желаешь знать, что дальше, немедленно отправляйся.
    mood: victory
    interaction:
      type: continue
      to: "70"
  "70":
    title: Глава 70
    text: Плохи твои дела! Ты напрягаешься, пытаешься освободиться, но лианы держат крепко. Неужели тебе конец? — Тебе конец! — рычит гигант, полируя Рубин Джунглей о набедренную повязку. — Я ведь не случайно такой волосатый! Волосатый Гарри Убийца Каннибалов приходится мне двоюродным братом, и и полностью разделяю его гастрономические пристрастия. С братом во мнениях мы не сошлись только относительно метода приготовления пищи. Он предпочитает мясо, сваренное в котле, я же поклонник жаренного на открытом огне. Довольно урча себе под нос, гигант собирает сухие сучья, заваливает тебя ими по самую шею, затем достает из складок в набедренной повязке газовую зажигалку и, щелкнув кремнем, подносит к веткам. Ничего не поделаешь, новобранец, видимо, быть заживо изжаренным за сотни световых лет от дома тебе написано на роду. Все еще сопротивляешься? Перекусываешь лианы зубами? Что ж, посмотрим, что у тебя получится.
    mood: danger
    interaction:
      type: continue
      to: "278"
  "71":
    title: Глава 71
    text: Навстречу тебе выезжает ковбой на шестиногой лошади. — Отдай мне, чужак, все, что у тебя есть! — орет ковбой, размахивая над головой веревкой. Видя, что он безоружен, ты презрительно хмыкаешь и бросаешься на ковбоя в атаку, но шестиногий скакун увозит его на безопасное расстояние. Был бы у тебя лук, ты пристрелил бы наглеца, но «утренней звездой» и мечом тебе его не достать. Ковбой взмахивает рукой, летит лассо, ты пытаешься увернуться, но не успеваешь. Петля обвивает тебя, ковбой дергает за конец веревки, ты, полуоглушенный, падаешь. Ковбой спрыгивает, на землю и разоружает тебя. Неужели тебе конец?! Узнаешь.
    mood: danger
    interaction:
      type: continue
      to: "161"
  "72":
    title: Глава 72
    text: А Сейди-Садистик не такая уж садистка, как о ней говорят. Ты видишь ее кулак, большой палец направлен вверх. Толпа громко восхваляет милостивую правительницу и тебя — победителя. Ты раскланиваешься и, пнув напоследок поверженного врага, удаляешься.
    mood: tense
    interaction:
      type: continue
      to: "348"
  "73":
    title: Глава 73
    text: Тропа вьется среди холмов, вокруг мрачные джунгли, из чащи доносятся таинственные звонки. Но ты ничего не боишься, идешь себе, помахивая мечом и весело насвистывая. Почему ты остановился? Вижу, вижу. Тропу перед тобой пересекает образованный землетрясением разлом. Трещина в земле слишком широка, чтобы перепрыгнуть, и слишком глубока, чтобы спуститься вниз. Как поступишь? Учти, что возвращение назад — пустая трата времени. Да, теперь и я вижу узенькую тропку, которая взбирается на холм справа от тебя. Что ж, следуй по тропке.
    mood: mystery
    interaction:
      type: continue
      to: "313"
  "74":
    title: Глава 74
    text: Отлично сработано! Робот по инерции проносится мимо, а ты, воспользовавшись этим, бьешь его рукоятью меча по затылку. Он падает, но с удивительным проворством вскакивает на ноги и вновь атакует тебя. Примерившись, ты наносишь ему удар мечом в грудь. Что дальше, узнаешь.
    mood: danger
    interaction:
      type: continue
      to: "320"
  "75":
    title: Глава 75
    text: Гигант оказался гораздо проворнее, чем ты предполагал. Грязно ругаясь, он бежит за тобой, наступает на пятки, вот-вот схватит. Выбора у тебя нет, принимай бой! Ты поворачиваешься. Меч против дубины — у тебя приличные шансы на победу. Но тут же выясняется, что ты вновь недооценил гиганта — он ловким ударом дубины выбивает меч из твоей руки. Все потеряно? Ты разворачиваешься и вновь удираешь от него, но через секунду тебя останавливает грязная волосатая ручища на плече. Ты извиваешься, пытаешься вырваться, но в медвежьих объятиях гиганта ты беспомощен, как дитя. Гигант обыскивает тебя, находит Рубин Джунглей и оглашает лес победным ревом. Тычок его кулака в спину, и ты — на земле. Детина грубо хватает тебя за ноги, подтаскивает к дереву, привязывает к стволу лианами. Если желаешь знать, что дальше, смотри.
    mood: victory
    interaction:
      type: continue
      to: "70"
  "76":
    title: Глава 76
    text: Отлично сработано! Ты перерубаешь дубину в руке стражника пополам. Бормоча проклятия, он отступает, затем вдруг выхватывает из-за пояса кинжал и вновь бросается на тебя. Если, отступив на шаг, ударишь его мечом по ногам, ты — на [А]. Если по голове, то на [Б].
    mood: danger
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "310"
          letter: А
          if:
            has_item:
              id: sword
        - label: Вариант Б
          to: "237"
          letter: Б
  "77":
    title: Глава 77
    text: Одумайся, новобранец! Разве полевой агент Спецкорпуса лишит жизни беспомощного ржавого робота? Почти рыдая, ты размышляешь, сколь чудовищную ошибку чуть было ни совершил, дружески похлопываешь робота по плечу и отбываешь.
    mood: mystery
    interaction:
      type: continue
      to: "78"
  "78":
    title: Глава 78
    text: Благодарю, о, могучий и благородный чужестранец! — скрипит робот. — В награду за доброту я помогу тебе! Когда перейдешь мост, увидишь, что дорога разделяется надвое. Если свернешь налево, то в считанные секунды умрешь мучительной смертью от укусов ядовитых змей, которых там превеликое множество. Правая же дорога безопасна. Иди же, и вечная тебе благодарность от старика! Пожелав старику сто лет без капитального ремонта, ты идешь к противоположному концу моста.
    mood: danger
    interaction:
      type: continue
      to: "128"
  "79":
    title: Глава 79
    text: Полагая, что с тобой кончено, стражник с победным воплем кидается на тебя, но ты бьешь его обеими ногами в грудь. Он падает на край моста, ты приставляешь острие меча к его горлу, и вы оба переноситесь.
    mood: victory
    interaction:
      type: continue
      to: "51"
  "80":
    title: Глава 80
    text: |-
      Ты вновь под виселицами среди преступников, алчущих твоего золота. Они не знают главного: тебе уже известно, что по крайней мере один из них обманщик. Говоришь, ты с самого начала это знал? Просто, разыскивая безумного профа, ты был вынужден им верить? Так продолжай свои попытки, несмотря ни на что! Но не доверяй одному и тому же проходимцу дважды! Итак, напоминаю тебе варианты выбора. Герцог выглядит респектабельным, ему не нужно твое золото. Если вспрыгнешь на его лошадь, то галопом помчишься на [А]
      Арбутнот не раз спасал тебе жизнь. Ты — единственный, кто не отверг его. Не отвергай же и сейчас, а не то он расплачется. Иди с ним на [Б]
      Но и Роббин Гут не обманул тебя. Если примешь его предложение, то отправляйся на [В]
      Сейди-Садистик тоже вела с тобой честную игру. К тому же в разорванной одежде она выглядит весьма сексуально. Может, отправишься с ней на [Г]
      И, наконец, Волосатый Гарри. Он, конечно, людоед, но не лгун. Если позволишь ему проводить себя к безумному профу, то ступай на [Д]. И последний совет… Сожалею, но ты получишь его на [Е], а туда ты попадешь только после того, как выяснишь, что известно о профе каждому преступнику, и не раньше.
    mood: tense
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "330"
          letter: А
        - label: Вариант Б
          to: "149"
          letter: Б
        - label: Вариант В
          to: "59"
          letter: В
        - label: Вариант Г
          to: "159"
          letter: Г
        - label: Вариант Д
          to: "21"
          letter: Д
        - label: Вариант Е
          to: "168"
          letter: Е
  "81":
    title: Глава 81
    text: "Ничего хорошего не получилось! Ты промахнулся, а стражник молниеносно нанес дубиной скользящий удар по твоему шлему. Оглушенный, ты падаешь: взревев от гнева, он обрушивается на тебя, но ты пинаешь его сразу двумя ногами в грудь."
    mood: danger
    interaction:
      type: continue
      to: "51"
  "82":
    title: Глава 82
    text: Сознание возвращается к тебе, и ты с горечью обнаруживаешь, что на крыше, кроме тебя, никого нет. Безумный профессор исчез. Что же ты медлишь — скорее в погоню! Ты с трудом поднимаешься и, еле передвигая ноги, проходишь через чердачную дверь.
    mood: danger
    interaction:
      type: continue
      to: "148"
  "83":
    title: Глава 83
    text: И ты называешь себя новобранцем Специального Корпуса? Разве не слышишь жалобных стонов старика? Ну-ка возвращайся в таверну и швыряй в громил гранату!
    mood: calm
    interaction:
      type: continue
      to: "170"
  "84":
    title: Глава 84
    text: Ты опять попал, а твой соперник промахнулся! Счет — два ноль в твою пользу! А он не такой уж хороший стрелок, как хвастал! Вы вновь стреляете.
    mood: calm
    interaction:
      type: roll
      formula: 1d6
      outcomes:
        - min: 4
          max: 6
          to: "9"
        - min: 1
          max: 3
          to: "166"
  "85":
    title: Глава 85
    text: "Если ты сказал, что на сосне сидит ворона с автоматом, то получаешь еще тридцать очков, если нет, то ноль. Ты с тоской глядишь на цель своих мучений — безумного профа. Он, похоже, утомившись от вашей игры в вопросы-ответы, улегся на полу клетки и сразу же сладко засопел. Но не отвлекайся, ибо снова, непроизвольно изрыгая пламя, вступает дракон: — Как поступит слон; увидев, что перед ним перебегает дорогу маленькая серая мышка? Хорошенько подумав, отправляйся."
    mood: danger
    interaction:
      type: continue
      to: "31"
  "86":
    title: Глава 86
    text: Ты взобрался на стену. Оглядись. Никого? Тогда быстро прыгай вниз. А теперь, беспечно насвистывая, шагай по улице до ближайшего угла. Теперь сворачивай направо, к центру города. Похоже, ты на базарной площади. Вокруг только грязные оборванцы, по виду — закоренелые преступники. Хотя нет. Вон те двое — босоногий мальчуган и одетая в черное, надменная старушка — кажутся вполне приличными людьми. Поговори с одним из них. Если ты обратишься к мальчику, то направляйся на [А]. Если к старушке, то на [Б].
    mood: tense
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "137"
          letter: А
        - label: Вариант Б
          to: "25"
          letter: Б
  "87":
    title: Глава 87
    text: До чего же мастерски ты пнул двух громил ногами, с которых они стаскивали ботинки! Взгляни, как потешно отвисли челюсти у этих кретинов. Правильно, отползи от того места, где они видели тебя в последний раз. Быстро на цыпочках беги к двери и дальше по коридору к выходу из замка. Шевелись же! Через несколько секунд заряд кончится, и тебя вновь можно будет увидеть. Опять ты ругаешься… Да, вижу, вижу. Коридор перед тобой заполнен охранниками, позади них — начальник стражи. Быстро оглядись. Посмотри направо, налево, вверх, вниз. Заметил в полу рядом с собой ручку? Дерни ее на себя! Под люком — непроглядный мрак. Но у тебя нет выбора, так смелей же прыгай вниз.
    mood: tense
    interaction:
      type: continue
      to: "306"
  "88":
    title: Глава 88
    text: |-
      Великолепный выстрел! Прямо в Зеленый Пупок! Бездыханный монстр падает у твоих ног. Полюбовавшись поверженным врагом, ты оглядываешься и видишь рядом едва заметную тропу. Достаешь компас и карту и, сверившись с ними, убеждаешься, что тропинка ведет в нужном направлении, к руинам. Ты продолжаешь путь. Почему ты остановился? А, теперь и я слышу приближающиеся шаги за твоей спиной. Быстро решай! Спрячешься ли в кустах на [А]
      Или, может, тебе надоело скрываться, и ты встретишь опасность лицом к лицу на [Б] ?
    mood: danger
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "249"
          letter: А
        - label: Вариант Б
          to: "131"
          letter: Б
  "89":
    title: Глава 89
    text: "Звездному чудищу забава пока не наскучила, и оно задает тебе очередной вопрос: — В технике ты не силен. Посмотрим, каковы твои познания в химии. Моя сестренка в детстве отравилась, выпив из склянки с надписью H 2 SO 4. Что было в склянке? Думай быстрей, отвечай и двигай."
    mood: mystery
    interaction:
      type: continue
      to: "1"
  "90":
    title: Глава 90
    text: "Взятка вроде сделала свое дело. Указания достаточно ясны: дойти до первого переулка, свернуть направо, на следующем углу налево, затем… Ты оказываешься прямо перед вооруженными стражниками. Твой вид почему-то вызывает у них приступ ярости. Они хватают тебя и волокут."
    mood: tense
    interaction:
      type: continue
      to: "175"
  "91":
    title: Глава 91
    text: А Сейди-Садистик не такая уж садистка, как о ней говорят. Ты видишь ее кулак, большой палец направлен вверх. Толпа громко восхваляет милостивую правительницу и тебя — победителя. Ты раскланиваешься и, пнув напоследок поверженного врага ногой под ребра, удаляешься.
    mood: tense
    interaction:
      type: continue
      to: "348"
  "92":
    title: Глава 92
    text: Впереди показалась деревенька. Похоже, ты на верном пути, и перед тобой — Хестелорт. Хотя нет. Вон побледневшая от дождей и солнца табличка на придорожном столбе, на ней написано «Свинлорт». Что предпримешь? Войдешь в деревеньку и осмотришься? Тогда отправляйся на [А]. Или вернешься к перекрестку и направишься по другой дороге? Тогда ты — на [Б].
    mood: calm
    interaction:
