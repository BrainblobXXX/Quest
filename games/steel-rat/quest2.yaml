  "124":
    title: Глава 124
    text: "Действительно, зачем древним врать? Ты медленно и осторожно поднимаешься. Перед тобой — распахнутая дверь. Загляни в нее. Ты видишь вроде бы безопасную ярко освещенную комнату, посередине стоит кресло на колесиках, следы от колесиков ведут в тоннель. В дальнем конце его видно пятно света. Рядом с креслом надпись на полу. В переводе с эсперанто она гласит: СПАСИБО, ЧТО ЗАГЛЯНУЛИ К НАМ, ОДНАКО ЗВЕЗДНОЕ ЧУДОВИЩЕ ДАВНО МЕРТВО. ПОЖАЛУЙСТА, СЯДЬТЕ В КРЕСЛО, НАЖМИТЕ КНОПКУ НА ПОДЛОКОТНИКЕ — И ВЫ ОКАЖЕТЕСЬ СНАРУЖИ. ПРИЯТНОГО ПУТЕШЕСТВИЯ. Я, как и ты, не знаю, насколько какалоки — правдивая раса. Решай, сядешь ли в кресло и, нажав кнопку, отправишься на [А]. Или побредешь по тоннелю вдоль следов от колес на [Б]."
    mood: mystery
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "304"
          letter: А
        - label: Вариант Б
          to: "337"
          letter: Б
  "125":
    title: Глава 125
    text: Несмотря на солнечный день, здесь царит мрачный полумрак. Но это тебя не страшит. Действительно, тебе с твоей амуницией, оружием и боевым духом сам черт не брат! Да и выпитые тобою полбутылки крепленого вина придают дополнительный заряд храбрости. По сторонам тропы шелестит листва, трещат сучья. Должно быть, дикие звери при твоем приближении пускаются наутек, прячутся, зарываются в норы. В гуще ветвей над головой галдят птицы. Почему ты вдруг остановился? А, теперь вижу. Ты попал на перекресток, тропа перед тобой разделяется на три. Ты разворачиваешь секретную карту, пытаясь разобраться, что к чему. Карта не помогает, на ней даже нет этого перекрестка. Решай сам, куда отправишься. Все три тропы, кажется, ведут в нужном направлении, к руинам. Если выберешь левую, то попадешь на [А]. Если среднюю, то на [Б]. Если правую, то на [В].
    mood: danger
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "107"
          letter: А
        - label: Вариант Б
          to: "206"
          letter: Б
        - label: Вариант В
          to: "55"
          letter: В
  "126":
    title: Глава 126
    text: Бывает, что не ладится все, что бы ни предпринял. Вот и сейчас прежде чем ты добираешься до низа корзины, проф перерезает веревку, и ты, отчаянно вопя, падаешь.
    mood: calm
    interaction:
      type: continue
      to: "136"
  "127":
    title: Глава 127
    text: Найдя в кустах надежное убежище, ты сооружаешь из травы и цветов мягкую подстилку, ложишься на нее, с удовольствием допиваешь вино, съедаешь сандвичи и полпачки печенья и погружаешься в глубокий сон без сновидений. Посреди ночи тебя будят громкие звуки — похоже, поблизости бродит крупный хищник. Ты беспокойно озираешься, но, не увидев горящих во тьме глаз, вновь засыпаешь и просыпаешься лишь на рассвете с головной болью и сухостью во рту — закономерными последствиями выпитого накануне дешевого вина. Облизнув пересохшие губы, ты лезешь в сумку, но печенье за ночь доели муравьи, и твое и без того неважное настроение окончательно портится. Ты подползаешь к краю обрыва и, глянув вниз, тихо ругаешься. Страж на мосту, как ты и предполагал, за ночь удалился, но его место занял огромный ржавый робот, вооруженный устрашающих размеров дубиной. Ничего не поделаешь, и, набравшись храбрости, ты спускаешься с холма и идешь к мосту.
    mood: danger
    interaction:
      type: continue
      to: "252"
  "128":
    title: Глава 128
    text: Перейдя через мост, ты обнаруживаешь, что тебя в очередной раз надули — тропинка вовсе не разделяется, а заканчивается у обрыва; вниз ведет деревянная лестница. Решив было вернуться и убить наглого лжеца, ты отказываешься от этого намерения и начинаешь спуск по лестнице. Вскоре ты попадаешь в густое облако. Спустившись еще на два десятка метров, ты явственно слышишь плеск воды внизу, а выбравшись из облака, видишь под собой реку. Очень интересно. Особенно то, что лестница внезапно обрывается, а до воды еще добрых полсотни метров. Повесь лук, меч и колчан со стрелами на деревянную перекладину, а сам присядь рядом и подумай, как поступить. Согласен, можно забраться по лестнице на утес, с которого ты только что спустился, но учти, что ты устал и вряд ли одолеешь подъем. Можно, конечно, спрыгнуть в реку, но тяжелая железная кольчуга потянет ко дну, а сняв ее, ты станешь беззащитным против острых мечей и стрел многочисленных врагов. Решай же! Если полезешь вверх, то окажешься на [А]. Если нырнешь в реку — как есть, в кольчуге, то на [Б]. А если, прежде чем прыгнешь вниз, снимешь кольчугу, то на [В].
    mood: danger
    image: illustrations/sword_and_bow.webp
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "301"
          letter: А
        - label: Вариант Б
          to: "336"
          letter: Б
        - label: Вариант В
          to: "271"
          letter: В
  "129":
    title: Глава 129
    text: "Дороге не видно конца. Пыльно, жарко, но ты настойчив и бесстрашен, так что продолжай путь. Выбора у тебя нет: шагай."
    mood: calm
    interaction:
      type: continue
      to: "180"
  "130":
    title: Глава 130
    text: Чем ближе ты к воздушному шару, тем медленнее твой бег. Немудрено, ведь тебе известно, что безумный проф вооружен большущим черным пистолетом. Ты уже совсем рядом с осевшим на землю баллоном. Если осторожно обходишь его справа, то отправляйся на [А]. Если слева, то на [Б].
    mood: danger
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "256"
          letter: А
        - label: Вариант Б
          to: "192"
          letter: Б
  "131":
    title: Глава 131
    text: "Перед тобой одетый во все зеленое высокий незнакомец. Он трясет рукой с зажатым в ней длинным луком и говорит: — Как посмел ты вторгнутся во владения Роббин Гута?! (К слову, Роббин Гут — это я.) Я краду у богатых и бедных и коплю награбленное. Немедленно отдавай все, что у тебя есть, путник, а иначе будешь иметь дело со мной, храбрым и непобедимым! Но ты уже не тот зеленый юнец, который совсем недавно прибыл на планету-тюрьму. Решив, что двум смертям не бывать, а одной не миновать, ты соглашаешься иметь дело с храбрым и непобедимым и смело заявляешь об этом. Он торопливо вставляет стрелу в свой лук, ты — в свой, он натягивает тетиву, ты — тоже, он целится тебе прямо в глаз и видит нацеленную в его глаз твою стрелу… Без видимых причин он слегка опускает свой лук, ты — свой, но напряжение не спадает, вы стоите с нацеленными друг в друга луками, пока он наконец со вздохом не опускает свой. Ты как истинный джентльмен следуешь его примеру. — А знаешь, — говорит Роббин Гут, — мне вовсе не хочется умирать. Тебе, как я вижу, тоже. Ты соглашаешься. — Прежде я имел дело с пожилыми леди или стрелял из-за кустов, — неожиданно признается повелитель джунглей. — Но мне бы не хотелось прослыть слабаком. — Задумчиво потерев покрытую синеватой щетиной нижнюю челюсть, он вдруг восклицает: — У меня появилась отличная идея! Устроим состязание в стрельбе из лука! Я лучший в лесу стрелок, и если ты все же выиграешь (во что я, конечно, не верю), то с меня услуга, а если проиграешь (что гораздо вероятней), то за твою храбрость я все же окажу услугу тебе. Ну как, согласен? Ты мычишь нечто вроде «да». Роббин Гут рисует углем на двух соседних деревьях по глазу, отсчитывает от них двадцать шагов, носком сапога рисует на земле черту и объясняет: — Условия поединка самые простые. Стрелять будем одновременно. Кто первым трижды поразит свою мишень, тот и победил. Начали! Вы одновременно натягиваете луки, целитесь каждый в свою мишень и спускаете тетиву."
    mood: tense
    image: illustrations/archer_contest.webp
    interaction:
      type: roll
      formula: 1d6
      outcomes:
        - min: 4
          max: 6
          to: "40"
        - min: 1
          max: 3
          to: "257"
  "132":
    title: Глава 132
    text: "Хочешь получить информацию задарма? — ревет верзила. — За такую наглость я бы пришил тебя на месте, да, убив сегодня уже двоих, порядком утомился. Воспользуйся моей добротой, купи интересующие тебя сведения, а заодно и собственную жизнь! Цена смехотворная — всего-то серебряная монета! Блуждая по древним руинам, ты тоже утомился, и оттого, улыбаясь, протягиваешь ему монету. Верзила, с подозрением взвесив монету на руке, прячет ее в карман и говорит: — Я видел ободранного старикана там, на дороге. — Он тычет пальцем куда-то себе за спину. — Парни Сейди-Садистик волокли его на арену. Прежде чем ты успеваешь выяснить, кто такая Сейди-Садистик, верзила вскрикивает и бросается наутек. Выругавшись, ты идешь по дороге дальше."
    mood: mystery
    interaction:
      type: continue
      to: "190"
  "133":
    title: Глава 133
    text: Ты промахнулся, а твой соперник, к сожалению, попал. Счет равный, два-два. Не вешай голову, соберись и стреляй!
    mood: tense
    interaction:
      type: roll
      formula: 1d6
      outcomes:
        - min: 4
          max: 6
          to: "342"
        - min: 1
          max: 3
          to: "343"
  "134":
    title: Глава 134
    text: Юноша привалился спиной к стволу дерева, его левая нога вывернута под неестественным углом. Его нога — это его проблема, твоя же задача, если ты вдруг запамятовал, спасти всю галактику. Забудь о бедняге и двигайся по тропе к [А]. Если же ты все-таки решишь сунуть нос не в свое дело, то иди к юноше на [Б].
    mood: calm
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "169"
          letter: А
        - label: Вариант Б
          to: "38"
          letter: Б
  "135":
    title: Глава 135
    text: "Из последних сил ты доплываешь до берега, вылезаешь из воды и пластом ложишься на теплый мягкий песок. Неожиданно дает о себе знать выпитая бутылка дешевого вина. Голова кружится, на тело тяжелой волной наваливается усталость. Но ты молод, полон сил, и твое здоровье пока не подорвано алкоголем. Вскоре ты приходишь в себя, встаешь на ноги и… На тебя в упор смотрит безобразное чудище: глаза крупней суповых тарелок, пять рядов острых, как кинжалы, зубов, толстенные, словно канаты, щупальца. Ты не знаешь, с кем столкнула тебя судьба? А вот я, к сожалению, знаю. Это весьма редкий в Галактике, ядовитый и смертельно опасный монстр Зеленый Пупок. Внимание, он готовится к атаке! Если сломя голову побежишь от него, то очутишься на [А]. Если же выстрелишь в него из лука, то на [Б]."
    mood: danger
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "230"
          letter: А
        - label: Вариант Б
          to: "13"
          letter: Б
          if:
            has_item:
              id: bow
  "136":
    title: Глава 136
    text: Ты падаешь, падаешь… Нет-нет, и не надейся. Под тобой вовсе не озеро. Скорее, маленький пруд. Бултых! О, счастье! Ты угодил именно в него! Решай! Поплывешь ли к близкому, но глинистому и заросшему камышами левому берегу [А]. Или к дальнему, но пологому песчаному правому [Б].
    mood: calm
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "43"
          letter: А
        - label: Вариант Б
          to: "63"
          letter: Б
  "137":
    title: Глава 137
    text: |-
      С чего это парнишка так шарахнулся от тебя? У тебя угрожающий вид? Или, может быть, ты давно не принимал ванну? Думаю, он так испуган оттого, что оба вы — на планете-тюрьме, а здесь царят жестокость и насилие, и все боятся всех. Как поведешь себя? Вывернешь пареньку руку и спросишь, цедя сквозь зубы, где найти профа Гейстескранка? Тогда ты окажешься на [А]
      Или предложишь пареньку серебряную монету за интересующую тебя информацию? Тогда ты — на [Б].
    mood: calm
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "167"
          letter: А
        - label: Вариант Б
          to: "90"
          letter: Б
          effects:
            - drop:
                item: silver_coin
  "138":
    title: Глава 138
    text: Беги как можно быстрей! Оставаться на месте — смертельная ошибка.
    mood: danger
    interaction:
      type: continue
      to: "4"
  "139":
    title: Глава 139
    text: Настороженно озираясь, ты входишь в таверну. Видишь, как у стойки четверо громил избивают хозяина таверны. Громилы поднимают глаза и, гнусно ухмыляясь и помахивая дубинками, наступают на тебя. Решай быстрее! Если с максимальной скоростью покинешь таверну, то будешь на [А]. Если швырнешь в громил гранату с сонным газом, то на [Б].
    mood: tense
    image: illustrations/tavern.jpg
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "83"
          letter: А
        - label: Вариант Б
          to: "170"
          letter: Б
  "140":
    title: Глава 140
    text: "Поздний вечер, ты сидишь под виселицами, сова на ближайшем надгробном камне ухает: — Ву! Ву-у! Ты закопал монеты под самой высокой виселицей, присыпал ямку землей, сверху забросал опавшими листьями, а на них для реализма кинул дохлого жука. Отлично сделано! Теперь жди рассвета. Ты, закрыв глаза, привалился спиной к виселице. У тебя, новобранец, не нервы, а стальные канаты! Говоришь, что не в нервах дело, а просто ты чертовски устал… Ты засыпаешь."
    mood: calm
    interaction:
      type: continue
      to: "179"
  "141":
    title: Глава 141
    text: Прием отлично сработал на арене, сработает и здесь. Ты пристально смотришь в налитые кровью глазки, а кабан, будто не замечая железной воли во взгляде, по-прежнему неотвратимо приближается. Ты взмахом руки приказываешь ему остановиться. О, как больно! Пятачком кабан подбрасывает тебя. Оказавшись там, прими другое, более мудрое решение!
    mood: danger
    interaction:
      type: continue
      to: "260"
  "142":
    title: Глава 142
    text: |-
      Ты захлопываешь за спиной дверь. Как раз вовремя! Башня с оглушительным грохотом рушится, дверь с той стороны заваливает камнями. Услышав неприятный скрежет, ты поворачиваешь голову и видишь… гигантского крысольва. Учуяв тебя, крысолев прекращает точить о каменный пол и без того острые, как бритвы, когти, поворачивается и, издав яростный рык, бросается в атаку. Ты поднимаешь меч — игрушку против гиганта, каждый зуб которого длинней оружия в твоей руке. Знаешь, а у меня возникла неплохая идея… Говоришь, тебе нет дела до моих бредовых идей? Что ж, тогда и мне на тебя плевать. Оставайся на [А]
      Если все же передумаешь и решишь выслушать добрый совет, то быстрей беги к [Б].
    mood: danger
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "177"
          letter: А
        - label: Вариант Б
          to: "171"
          letter: Б
  "143":
    title: Глава 143
    text: У тебя сильные мускулистые руки, но мышцы устали, пальцы скользят по веревке. Ты с надеждой смотришь вверх. Приближается грозовое облако, вот-вот начнется дождь. Солнца не видно, ледяные капли дождя охлаждают баллон, и воздушный шар идет на снижение. Отлично! Твое невольное путешествие подходит к концу. Проф Гейстескранк перегибается через край корзины и видит тебя. — Доннерветтер! Кишки выпущу! — кричит он и длинным тупым ножом пилит веревку, на которой висишь ты. Как поступить? Если будешь, разинув рот, ждать, пока он перережет веревку, то ты — на [А]. Если судорожно поползешь по веревке вверх, к корзине, то на [Б].
    mood: calm
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "136"
          letter: А
        - label: Вариант Б
          to: "126"
          letter: Б
  "144":
    title: Глава 144
    text: На трибунах беснуется толпа, вопит, орет, швыряет на арену пустые бутылки из-под пива. Ты не обращаешь внимания на дурно воспитанных зрителей, твой взгляд прикован к противнику — безобразному, давно небритому верзиле, чье мускулистое тело покрыто шрамами от сотен боев. В левой руке верзилы сеть, в правой, которую он занес над головой, трезубец. Верзила, испустив боевой клич, бросается на тебя. Не стой же столбом, защищайся, дерись за свою жизнь! Продемонстрируй, на что способен полевой агент Спецкорпуса! Если попытаешься разрубить сеть, которую на тебя накидывает верзила, то ты — на [А]. Если увернешься и обрушишь на противника меч и щит, то на [Б].
    mood: danger
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "282"
          letter: А
        - label: Вариант Б
          to: "60"
          letter: Б
  "145":
    title: Глава 145
    text: Согласен, в тяжелой кольчуге с вооружением под обжигающими лучами солнца тебе не взобраться на этот крутой холм. Почему ты орешь, точно резаный? Понимаю, твоя нога соскользнула с камня, и ты кубарем катишься вниз.
    mood: calm
    interaction:
      type: continue
      to: "108"
  "146":
    title: Глава 146
    text: Ты до сих пор так и не понял, что насилием ничего не добьешься? Конечно, старик, увидев в твоей руке нож, насмерть перепугался, огрел тебя посохом по голове и, пока ты поднимался с земли и тряс головой, убежал. Запомни на будущее, что эту планету населяют преступники, и их неписаные законы гласят, что приближающийся с оружием в руке — враг. Ну, не глупи, спрячь нож. Нет, подожди, срежь сначала посох. Он хоть и не выглядит оружием, но им, как только что тебе убедительно продемонстрировал старик, можно с успехом пользоваться. Срезал? Отлично. А теперь решай, по какой дороге отправишься. Если по северной, то двигай на [А]. Если по восточной, то на [Б]. Если по южной, то на [В]. Если по западной, то на [Г].
    mood: danger
