      type: continue
      to: "58"
  "101":
    title: Глава 101
    text: Ну и что с того, что он пнул тебя ногой в коленную чашечку, едва ты с ним заговорил? Ведь ты же в долгу не остался и уложил его отработанным на тренировках в Корпусе апперкотом. Теперь не дергайся, стой в очереди.
    mood: calm
