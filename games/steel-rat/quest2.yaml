        - label: Вариант Г
          to: "129"
          letter: Г
  "340":
    title: Глава 340
    text: "Ты идешь по тропе, которая петляет среди деревьев. Ты уже было подумываешь, а не соврал ли тебе Роббин Гут. Тропка узкая, часто теряется среди травы, но на деревьях и камнях вдоль нее — красные метки, и ты ни разу не сбиваешься с пути. Спрашиваешь, чем же нанесены метки? Уж не кровью ли? Не знаю, но ты лучше не думай на эту тему. Ты продолжаешь путь. Тебе попадаются уже не только бесформенные красные пятна, но надписи типа: ВСЕ ЕЩЕ ИДЕШЬ? А Я-ТО ДУМАЛ, ЧТО ТЫ ДАВНО МЕРТВ. Или: БЕРЕГИСЬ! ВПЕРЕДИ ПАУК-ЛЮДОЕД! И даже: НАДЕЮСЬ, ТЫ НАПИСАЛ ЗАВЕЩАНИЕ! Ничего не скажешь, пикантно. Но ты ведь не трус, страх и усталость полевому агенту Спецкорпуса неведомы!.. Устал, говоришь? Что ж, присядь, вреда от непродолжительного отдыха не будет. Вот это да! В жизни не видел, чтобы кто-нибудь так высоко подпрыгивал! Говоришь, камень, на который ты сел, впился в тебя острыми зубами и откусил от правой ягодицы приличный кусок? Извини: говоря, что вреда не будет, если ты присядешь и немного отдохнешь, я не предполагал, что ты усядешься на кусачий камень. Пришел в себя? Тогда иди дальше. Ты шагаешь дальше. К тропе вплотную придвигаются непроходимые джунгли, густые кроны деревьев и лианы смыкаются над твоей головой так, что уже не виден солнечный свет, со всех сторон доносится рев неизвестных, наверное, смертельно опасных животных, с ветвей капает густая, видимо, ядовитая жидкость. Впереди раздается отчаянный вопль боли, затем трещат кости, и звук обрывается на высокой ноте. Нет-нет, не убегай! Что бы ни подстерегало тебя впереди, ты с ним встретишься. А иначе остаток своей, без сомнения, короткой жизни проведешь на этой планете. Не скрипи зубами и не ругайся! Лучше смело ступай вперед. Решился-таки? Вот и славно. Ты медленно идешь к источнику страшных звуков, раздвигаешь перед собой листву и видишь небольшую поляну, на ней кабанище — как минимум вдвое больших размеров, чем встреченный тобой прежде, — с утробным рыком пожирает убитого им только что бронтозавра. Ну и аппетит у чудовища! Меньше всего на свете тебе улыбается знакомство с огромными клыками. Ты медленно отступаешь… Но поздно! Кабан, втянув носом воздух, фыркает, отшвыривает полуобглоданный скелет ящера и рысью направляется к тебе. Он тебя учуял! Как поступишь? Не спрашивай меня, ведь это твоя работа. Ну, хорошо-хорошо, помогу, перечислю все возможные варианты твоего поведения в данной ситуации. Тихо, чтобы не зашуршал ни единый листок, отправляйся за списком."
    mood: danger
    image: illustrations/forest.jpeg
    interaction:
      type: continue
      to: "260"
  "341":
    title: Глава 341
    text: "Я так и знал: ничего не видно. Что, ты потерял дверь?! Идиот, зачем было ее закрывать? Ищи дверь на ощупь. Еще-еще… Нашел? Твое счастье. Теперь ступай."
    mood: tense
    interaction:
      type: continue
      to: "269"
  "342":
    title: Глава 342
    text: Промахнулся! А Роббин Гут? Роббин Гут попал! Ты проиграл поединок. Хотя и не всухую, но все равно обидно! С перекошенным от досады лицом ты переносишься.
    mood: tense
    interaction:
      type: continue
      to: "44"
  "343":
    title: Глава 343
    text: Ты попал, а Роббин Гут промахнулся! Победа! Правда, не всухую, но все же победа! Со счастливой улыбкой ты переносишься.
    mood: victory
    interaction:
      type: continue
      to: "311"
  "344":
    title: Глава 344
    text: Ты опять ошибся. Двигай быстрей.
    mood: tense
    interaction:
      type: continue
      to: "89"
  "345":
    title: Глава 345
    text: Коридор был слишком узок. Охранники поймали тебя, выволокли из тюрьмы, а у городских ворот отключили ударом древка копья по голове. Что с тобой произошло дальше, ты не знаешь. Поскольку твой мозг был на время вырублен, то я тоже ничего не видел. Открывай быстрее глаза и выясняй, куда ты угодил.
    mood: calm
    entry:
      - consume:
          item: smoke_grenade
    interaction:
      type: continue
      to: "339"
  "346":
    title: Глава 346
    text: Ты опять ошибся. Двигай быстрей.
    mood: tense
    interaction:
      type: continue
      to: "89"
  "347":
    title: Глава 347
    text: "Чудище в негодовании рычит: — Даю тебе последний шанс, немощный смертный! Какое великое событие произошло на планете Земля в 1492 году от рождества Христова? Понял вопрос? Тогда отвечай и смотри."
    mood: danger
    interaction:
      type: continue
      to: "298"
  "348":
    title: Глава 348
    text: Ты вновь в комнате с четырьмя дверями, вооруженные стражники внимательно следят, чтобы ты не воспользовался одной дверью дважды. В первой комнате ты уже побывал, так что выбирай между оставшимися. Напоминаю, что дверь с цифрой два приведет тебя на [А]. Дверь три — на [Б]. Дверь четыре — на [В], но в нее можно войти, только если ты дважды одержишь победу. Решай же быстрей, куда направишься!
    mood: tense
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "239"
          letter: А
        - label: Вариант Б
          to: "251"
          letter: Б
        - label: Вариант В
          to: "102"
          letter: В
          if:
            stat:
              id: arena_wins
              op: ">="
              value: 2
  "349":
    title: Глава 349
    text: Ну и дела! Одумайся, новобранец! Быстрее возвращайся туда, откуда явился!
    mood: grief
    ending: true
  "350":
    title: Глава 350
    text: "Дракон задает первый вопрос: — Отвечай быстро или станешь завтраком. Чей прах покоится в гробнице Гранта? Если ты полагаешь, что там похоронен генерал Грант, то ты на [А]. Если не знаешь ответа, то на [Б]."
    mood: danger
    interaction:
      type: choices
      options:
        - label: Вариант А
          to: "201"
          letter: А
        - label: Вариант Б
          to: "291"
          letter: Б
  prologue:
    title: Пролог
    text: Добро пожаловать! Эй, ты. Да, да, ты! Шаг вперед. Не робей, парень. Мы вроде прежде не встречались? Неудивительно, ведь Корпус с каждым годом разрастается. Мое имя — Джим ди Гриз. Иногда меня называют Скользким Джимом, часто — Стальной Крысой, а бывает — Илом Титано ди Аккано или Рашиноксом. Если ты впервые слышишь обо мне, то как тогда попал в Корпус?! Ну, ладно, ладно, не дергайся, просто я иногда горячусь, когда приходится возиться с новобранцами. Как тебя-то зовут? Н-да, ну и имечко. А что у тебя во фляжке? Что?! Что ты в таком случае делаешь в Корпусе?!! Ну, ладно, вы, новобранцы, год от года становитесь все моложе… Или, может, это я старею? НЕ ОТВЕЧАТЬ! Если у тебя нечем промочить горло, то давай ради знакомства просто пожмем друг другу руки. Ты, где-то у меня тут бумажка. А-а, вот она. Ну, внимай. Добро пожаловать в Специальный Корпус, о, новобранец. Ты держишь сейчас в руках свое первое задание. Да-да, эта вот книжица, чьи страницы изготовлены из супертвердого импервиума… Не дергай страницу, порежешься! Все-таки вырвал? Что ж, первый тест ты провалил. С этой минуты выполняй мои приказы не мешкая. Рефлекторно! Помни, что ты — агент Корпуса. Слушай приказ!
    mood: calm
    image: illustrations/prologue.webp
    interaction:
      type: continue
      to: "30"
