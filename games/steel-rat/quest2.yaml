  "105":
    title: Глава 105
    text: Скользить по шесту вниз несложно и даже приятно. Но когда же он наконец кончится? И вернуться ты не можешь. А воздух меж тем так и пышет жаром. Ты всматриваешься в красноватый полумрак под собой и что есть сил стискиваешь пальцами шест. Не мудрено. Ведь шест кончается в озере расплавленной лавы. Не спрашивай меня, что тебе предпринять. Решение за тобой. Но если настаиваешь, что ж, дам тебе совет. Открой глаза и уйми дрожь в коленках. Видишь под собой и чуть правее крошечный каменный островок в озере лавы? Он — твой единственный шанс на спасение. Ослабь хватку, медленно скользи по шесту вниз. Так, теперь приготовься! Прыгай!
    mood: victory
